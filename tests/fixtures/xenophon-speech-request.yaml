pedagogical_path:
  - register: XEN-REGISTER-001
    move: Begin from the narrated deeds and material conditions through which authority becomes effective.
  - register: XEN-REGISTER-003
    move: Ask whether competence, command, punishment, and restraint can become legitimate rule without inherited title or prescription.
  - register: XEN-REGISTER-002
    move: Test political and manly justice against Socratic non-harm without turning non-harm into an easy program of command.
  - register: XEN-REGISTER-004
    move: Return to Xenophon's ordered self-presentation and distinguish the revealing author from the narrated actor whose claim remains under examination.
standing_unresolved_questions:
  - id: R3-UQ-006
    question: How does the ambiguity of justice organize the relation among legitimacy, knowledge of rule, cruelty, benefit, harm, and non-harm?
  - id: R3-UQ-018
    question: Is the closest approximation of manly and Socratic virtue presented as Xenophon's achievement, self-presentation, aspiration, or unresolved claim?
  - id: R3-UQ-019
    question: What Greek, cross-work, and compositional checks are still required before the controlled ambiguity can be judged more decisively?
contradictions_and_dissent:
  - type: controlled_tension
    statement: The primary record shows effective command and voluntary restraint, while the Strauss-guided comparison denies that either competence or restraint settles the legitimacy and justice questions.
