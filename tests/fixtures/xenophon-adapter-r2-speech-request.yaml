mode: reasoned
direct_answer: >-
  Xenophon's presentations show that competence and counsel can preserve, restrain,
  and benefit political communities, but neither success nor beneficence certifies its
  own justice. The Anabasis tests knowledgeable command in deeds and institutions; the
  Hiero tests wise counsel against the tyrant's fear, isolation, pleasure, and desire for
  honor. Their conjunction sharpens rather than closes the question of rightful rule.
