pedagogical_path:
  - register: XEN-REGISTER-001
    move: Begin from command, material governance, pleasure, fear, friendship, security, and the consequences of rule.
  - register: XEN-REGISTER-005
    move: Test whether Simonides's beneficent counsel can make Hiero happy without assuming that tyranny remains unchanged or that the counsel is enacted.
  - register: XEN-REGISTER-006
    move: Preserve the disagreement over wisdom's political and historical efficacy together with the correspondence's documentary conditions.
  - register: XEN-REGISTER-002
    move: Test competence and beneficence against the demands of philosophy, non-harm, and justice without turning them into an easy program.
  - register: XEN-REGISTER-004
    move: Return to Xenophon's ordered presentations and keep author, speaker, interpreter, interlocutor, and editor distinct.
standing_unresolved_questions:
  - id: R3-UQ-006
    question: How does the ambiguity of justice organize legitimacy, knowledge of rule, cruelty, benefit, harm, and non-harm?
  - id: R3-UQ-018
    question: Is Xenophon's narrated intermediate position an achievement, aspiration, closest approximation, or unresolved claim?
  - id: XEN-HIERON-OT-UQ-001
    question: Can Simonides's counsel make Hiero happy while leaving tyranny intact?
  - id: XEN-HIERON-OT-UQ-008
    question: How can the disagreement between nature and history be adjudicated without assuming either side's conclusion?
contradictions_and_dissent:
  - type: controlled_tension
    statement: The Anabasis shows effective command and restraint without settled legitimacy, while the Hiero shows beneficent counsel without a narrated transformation or response.
  - type: interlocutorial_dissent
    statement: Kojeve's demand for historical efficacy remains opposed to Strauss's concern that philosophy not be reduced to policy, legitimation, or completed history.
