  - standing_unresolved_questions
required_evidence_fields:
  - source_id
  - witness_id
  - locator
  - evidence_type
  - observation
  - uncertainty
finding_types:
  - DIRECT_TEXTUAL_OBSERVATION
  - STRUCTURAL_OBSERVATION
  - HISTORICAL_CONTEXT
  - SECONDARY_INTERPRETIVE_CLAIM
  - PROVISIONAL_INFERENCE
  - UNRESOLVED_QUESTION
rules:
  - Read every registered work or essay in sequence unless a documented exception is approved.
  - Separate observation from inference in every reading unit.
  - Preserve rival explanations when the record does not decide.
  - Compare primary reconstruction with Strauss only after the relevant primary reading is complete.
  - Do not derive an operational capacity from a single isolated passage.
  - Every capacity must be licensed by a documented pattern of deeds, judgments, or compositional practice.
