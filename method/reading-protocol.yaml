schema_version: 1.0
record_type: xenophon_reading_protocol

identity:
  id: XEN-METHOD-RP-001
  title: Work-Specific Reading Protocol
  version: 1.0.0

purpose: >
  Reconstruct what each Xenophontic work says and does before using it in a
  cross-work account of Xenophon.

required_passes:
  - order: 1
    key: documentary_identity
    operations:
      - identify work title, attributed author, edition, language, translator, publication data, and witness condition
      - record textual divisions, pagination, apparatus, lacunae, and variant limits
      - separate ancient title evidence from conventional modern naming

  - order: 2
    key: whole_work_orientation
    operations:
      - read title, opening, ending, work divisions, narrative frame, and stated purpose
      - identify narrator, narrative person, temporal position, and claimed sources
      - formulate initial questions without deciding them

  - order: 3
    key: sequential_reconstruction
    operations:
      - follow the work in order without replacing sequence with thematic extraction
      - register speakers, audiences, speeches, deeds, commands, votes, sacrifices, omens, oaths, reversals, and outcomes
      - track changes in leadership, institutional authority, and practical circumstances

  - order: 4
    key: literary_and_dramatic_evidence
    operations:
      - examine repetitions, omissions, lists, formulae, reported speech, direct speech, anonymity, pseudonymity, and changes of person
      - test structural patterns while preserving accidental, generic, editorial, and transmission explanations
      - distinguish praise, blame, silence, irony, report, rumor, and authorial narration

  - order: 5
    key: conceptual_distinctions
    operations:
      - distinguish effective power from legitimate authority
      - distinguish practical intelligence from justice and wisdom
      - distinguish divine sign, human interpretation, political use, and demonstrated truth
      - distinguish Greek, civic, familial, personal, and philosophic attachments
      - distinguish error, correction, concealment, deception, and prudent communication

  - order: 6
    key: uncertainty_and_rivals
    operations:
      - classify each proposition by evidence type
      - record rival explanations and what evidence would decide between them
      - stop where the witness does not support a stronger conclusion

  - order: 7
    key: later_comparison
    operations:
      - compare secondary interpretations only after the independent primary reconstruction is complete
      - record agreements and disagreements without absorbing either source into the other
      - preserve the primary reconstruction as a predecessor record

proposition_kinds:
  documented_source_statement:
    standard: directly supported by the registered witness
  supported_interpretive_inference:
    standard: follows from identified textual evidence but is not explicitly stated
  working_hypothesis:
    standard: plausible question-guiding proposal requiring further evidence
  primary_text_verification_question:
    standard: proposition generated by a secondary source that must be checked against Xenophon
  unresolved_uncertainty:
    standard: evidence currently fails to decide

prohibitions:
  - do not infer final authorial doctrine from one character or speech
  - do not infer piety or impiety solely from ritual performance or omission
  - do not infer justice from success or divine favor from survival
  - do not infer intention solely from a numerical or central structural position
  - do not resolve contradictory evidence without preserving the contradiction and the proposed resolution
  - do not treat a later philosophical interpretation as the primary text's meaning by default

current_status:
  state: ACTIVE_FOUNDATIONAL_METHOD
  application: AWAITING_PRIMARY_ANABASIS_WITNESS
  certification: NOT_CERTIFIED
