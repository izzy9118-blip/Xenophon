anguage-certification.yaml","greek_dependent_claims_prohibited":true},"resolved_items":[{"id":"RES-001","description":"The eight-unit reconstruction of Strauss's essay received owner adoption within secondary-source jurisdiction.","record":"governance/owner-reviews/2026-07-30-strauss-witness-review.yaml"},{"id":"RES-002","description":"An owner-supplied Dakyns Project Gutenberg translation of Xenophon's Anabasis was admitted as the first primary translation witness.","record":"governance/owner-reviews/2026-07-30-primary-anabasis-witness-admission.yaml"},{"id":"RES-003","description":"Anabasis Book I received complete sequential draft coverage in XEN-PRI-RU-001 through XEN-PRI-RU-010.","record":"studies/xenophon-anabasis-dakyns/reading-plan.yaml"},{"id":"RES-004","description":"Anabasis Book II received complete sequential draft coverage in XEN-PRI-RU-011 through XEN-PRI-RU-016.","record":"studies/xenophon-anabasis-dakyns/reading-plan.yaml"},{"id":"RES-005","description":"Anabasis Book III received complete sequential draft coverage in XEN-PRI-RU-017 through XEN-PRI-RU-021.","record":"studies/xenophon-anabasis-dakyns/reading-plan.yaml"},{"id":"RES-006","description":"Anabasis Book IV received complete sequential draft coverage in XEN-PRI-RU-022 through XEN-PRI-RU-029.","record":"studies/xenophon-anabasis-dakyns/reading-plan.yaml"},{"id":"RES-007","description":"Anabasis Book V received complete sequential draft coverage in XEN-PRI-RU-030 through XEN-PRI-RU-037.","record":"studies/xenophon-anabasis-dakyns/reading-plan.yaml"},{"id":"RES-008","description":"Anabasis Book VI received complete sequential draft coverage in XEN-PRI-RU-038 through XEN-PRI-RU-043.","record":"history/2026-07-31-anabasis-book-vi-draft-completion.md"},{"id":"RES-009","description":"Anabasis Book VII received complete sequential draft coverage in XEN-PRI-RU-044 through XEN-PRI-RU-051.","record":"history/2026-07-31-anabasis-book-vii-draft-completion.md"},{"id":"RES-010","description":"All fifty-one numbered chapters of the admitted Dakyns Anabasis witness received sequential draft reconstruction.","record":"history/2026-07-31-anabasis-primary-sequential-draft-completion.md"},{"id":"RES-011","description":"The owner adopted the complete fifty-one-unit reconstruction within the jurisdiction of the admitted Dakyns English translation witness.","record":"governance/owner-reviews/2026-07-31-primary-anabasis-reconstruction-review.yaml"},{"id":"RES-012","description":"A primary-only cumulative reconstruction was derived across all fifty-one owner-adopted chapter units.","record":"studies/xenophon-anabasis-dakyns/cumulative/XEN-PRIMARY-CUMULATIVE-001.yaml"},{"id":"RES-013","description":"The owner adopted the primary-only cumulative reconstruction within the admitted Dakyns translation jurisdiction and authorized controlled comparison with the separately adopted Strauss reconstruction.","record":"governance/owner-reviews/2026-07-31-primary-cumulative-reconstruction-review.yaml"},{"id":"RES-014","description":"The first controlled-comparison draft was preserved as a historical production record after owner review identified interpretive drift in its classification of justice, material governance, Thibron, and the ending.","record":"studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001.yaml"},{"id":"RES-015","description":"The controlled comparison was corrected under owner direction so that Strauss's Socrates-Cyrus opposition governs the examination, material governance and Thibron are placed on the Cyrus side, and justice and the ending are treated as governing examinations rather than divergences.","record":"governance/corrections/2026-07-31-controlled-comparison-strauss-guiding-architecture.yaml"},{"id":"RES-016","description":"An in-depth owner review examined all thirty-one R1 comparison entries against the fifty-one primary units and eight Strauss units, declined adoption, and returned R1 for substantive R2 revision with nine required reclassifications.","record":"governance/owner-reviews/2026-07-31-controlled-comparison-r1-in-depth-review.yaml"},{"id":"RES-017","description":"An additive R2 controlled comparison reconstructed Strauss's argument through eight sequential movements, applied all nine required reclassifications and eleven substantive revisions, restored Proxenos and the economic art, expanded Book Four, justice, trial, fatherland, monarchy, and the ending, and preserved the independent primary contribution.","record":"studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R2.yaml"},{"id":"RES-018","description":"An exact-source in-depth review retained R2's sequential architecture but declined adoption and required targeted R3 correction to distinguish the younger and older Cyrus functions, elevate Byzantium, and restore Strauss's post-question booty and gods-and-oaths coda.","record":"governance/owner-reviews/2026-07-31-controlled-comparison-r2-in-depth-review.yaml"},{"id":"RES-019","description":"A targeted additive R3 preserved the intended ambiguity between the younger and older Cyrus while distinguishing their roles, elevated Byzantium as the concrete convergence and refusal of foundation and monarchy, and restored Strauss's exact closing order of Socratic question, booty, gods, and oaths.","record":"studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R3.yaml"},{"id":"RES-020","description":"An in-depth owner review adopted R3 as the active controlled primary-secondary comparison while preserving the intended Cyrus ambiguity, mixed motives at Byzantium, the exact final coda, all nineteen unresolved questions, and all source limitations.","record":"governance/owner-reviews/2026-07-31-controlled-comparison-r3-in-depth-review.yaml"},{"id":"RES-021","description":"A Strauss-guided controlled synthesis reconstructed the owner-adopted R3 comparison from Xenophon as revealing author through eight sequential movements, four differentiated figural presentations, six governing examinations, and nineteen preserved unresolved questions.","record":"studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001.yaml"},{"id":"RES-022","description":"An exact-source in-depth owner review retained the synthesis architecture but declined adoption and required targeted R1 correction of cross-work scope, Strauss's interrogative legitimacy structure, and Xenophon as presenter of the problem of justice.","record":"governance/owner-reviews/2026-08-01-strauss-guided-controlled-synthesis-in-depth-review.yaml"},{"id":"RES-023","description":"An additive targeted R1 synthesis preserved the eight-movement architecture while distinguishing the Anabasis from Xenophon's Education of Cyrus presentation of the older Cyrus, preserving Strauss's interrogative legitimacy structure, and restoring Xenophon as presenter of the problem of justice.","record":"studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001-R1.yaml"},{"id":"RES-024","description":"An in-depth owner review adopted the targeted R1 synthesis within controlled English-witness jurisdiction after confirming all three source-direction corrections and preservation of all nineteen unresolved questions.","record":"governance/owner-reviews/2026-08-01-strauss-guided-controlled-synthesis-r1-in-depth-review.yaml"},{"id":"RES-025","description":"The owner deferred Greek-language certification until a later owner-opened phase while preserving Greek-dependent claims as prohibited and removing Greek review as a blocker to current English-witness production.","record":"governance/owner-directives/2026-08-01-defer-greek-language-certification.yaml"},{"id":"RES-026","description":"A draft Xenophon minister adapter was derived from the owner-adopted R1 synthesis with four corpus-grounded registers, three safeguards, constitutional briefing and report controls, a deterministic report renderer, and behavioral proving fixtures.","record":"history/2026-08-01-xenophon-minister-adapter-draft-completion.md"}],"documented_gaps":[{"id":"GAP-004","status":"DEFERRED_BY_OWNER","classification":"DEFERRED_FUTURE_ENRICHMENT","description":"No reviewed original-language Greek witness or critical edition is registered. The owner intends to examine Greek much later while learning the language.","current_blocking_effect":false,"blocks":["Greek philological conclusions","translation adjudication against the Greek","Greek textual certification","claims of final original-language authority"],"does_not_block":["English-witness synthesis adoption","minister adapter construction","appropriately limited Sanctum registration"]},{"id":"GAP-019","description":"XEN-MINISTER-ADAPTER-001 is draft-complete but has not undergone in-depth owner review of its four registers, three guards, constitutional compliance, federation report shape, proving fixture, and behavioral limits.","blocks":["owner-adopted operational minister adapter","Sanctum registration","Assembly dispatch"]}],"next_required_action":"Conduct XEN-MINISTER-ADAPTER-IN_DEPTH-OWNER-REVIEW-001 before Sanctum registration or Assembly dispatch."}