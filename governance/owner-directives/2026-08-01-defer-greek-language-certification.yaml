{"schema_version":"1.0","directive_id":"XEN-OWNER-DIRECTIVE-001","status":"ACTIVE_OWNER_DIRECTIVE","issued_on":"2026-08-01","owner_statement":"Greek certification is deferred by owner because the owner does not yet understand the language sufficiently and intends to examine the Greek much later while learning it.","present_effect":{"greek_certification_required_for_current_phase":false,"greek_certification_required_for_r1_synthesis_adoption":false,"greek_certification_required_for_minister_adapter_construction":false,"greek_certification_required_for_sanctum_registration":false,"current_jurisdiction":"The admitted H. G. Dakyns English Anabasis witness, the owner-adopted English-witness primary reconstruction, the reviewed Strauss witness, and their controlled comparison and synthesis.","current_production_may_continue":true},"deferred_scope":["Greek lexical and grammatical claims","original-language philological conclusions","critical-edition and manuscript adjudication","translation adjudication against the Greek","Greek textual certification"],"continuing_prohibitions":["No claim may be labeled as established by the Greek text.","No English rendering may be certified as finally equivalent to the Greek.","No uncertainty dependent on Greek wording may be silently resolved.","The deferred Greek examination may not be represented as completed, waived permanently, or unnecessary in principle."],"future_reactivation":{"mode":"OWNER_OPENED_FUTURE_PHASE","condition":"The owner explicitly opens a Greek-language examination after acquiring sufficient knowledge of the language.","preservation":"All English-witness work and its limitations remain available as predecessor evidence for that later examination."},"audit_treatment":{"gap_id":"GAP-004","classification":"DEFERRED_FUTURE_ENRICHMENT","current_blocking_effect":"Blocks only Greek-dependent and final original-language claims; does not block current English-witness adoption or downstream repository production."}}