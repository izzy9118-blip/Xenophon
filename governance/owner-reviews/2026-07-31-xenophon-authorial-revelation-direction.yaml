{"schema_version":"1.0","review_id":"XEN-OWNER-REVIEW-008","status":"OWNER_ADOPTED_INTERPRETIVE_DIRECTION_CORRECTION","reviewed_on":"2026-07-31","owner_directive":"Yes","correction_record":"governance/corrections/2026-07-31-xenophon-authorial-revelation-direction.yaml","ruling":{"adoption_status":"OWNER_ADOPTED","jurisdiction":"INTERPRETIVE_DIRECTION_GOVERNING_COMPARISON_AND_SYNTHESIS","effect":"All active and future records must treat Xenophon as the source of revelation through his presentations. No figure may be said to supply Xenophon with an external standard. Strauss recovers the concealed order of Xenophon's presentations rather than importing a doctrine into them.","immutable_record_rule":"R3 and its prior adoption remain immutable historical records. XEN-COR-003 governs their interpretation and all derivatives."},"adopted_controls":["Xenophon reveals through the younger Cyrus, older Cyrus, Socrates, and his own narrated persona.","The older Cyrus is a Xenophontic presentation, not an external source acting upon Xenophon.","The manner of revelation—indirection, concealment, ambiguity, sequence, contrast, and omission—is part of the evidence.","Strauss is the guide to uncovering that concealed architecture.","The controlled synthesis must proceed from Xenophon as revealing author outward to the figures he presents."],"prohibited_formulations":["The older Cyrus supplies Xenophon with a standard.","Socrates supplies Xenophon with an external doctrine.","Strauss imposes the Socrates-Cyrus opposition upon Xenophon from outside the works."],"next_authorized_action":{"id":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001","description":"Produce the controlled synthesis under the Xenophontic authorial-revelation direction established by XEN-COR-003."}}