reviewed_layers:
  primary_Hieron_showing:
    status: PASS_WITH_NORMALIZATION_CORRECTION_APPLIED
    correction: >-
      The first cumulative finding is revised so that Hiero's account of tyrannical
      unhappiness is not grammatically presented as an unmediated authorial declaration
      by Xenophon. The dialogue's dramatic presentation remains the evidentiary frame.
    preserved_limits:
      - no Greek philological authority claimed
      - Hiero, Simonides, and Xenophon remain distinct
      - the ending remains evidentiary and unresolved
      - unresolved questions XEN-HIERON-OT-UQ-001 through XEN-HIERON-OT-UQ-003 remain open
  Strauss_explicit_argument:
    status: PASS_WITH_NORMALIZATION_CORRECTIONS_APPLIED
    correction_summary:
      - Restore the major findings of the completed Strauss close reading rather than compressing the original study into two generic propositions.
      - Preserve Strauss's use of dramatic action, sequence, speaker, silence, and literary form as evidence.
      - Correct the prior overstatement that knowledge or beneficence cannot affect legitimacy; Strauss explicitly distinguishes formal constitutional title from rule that heeds reasonable or wise counsel while preserving the tyrant's defective title, dependence, coercive burden, and practical instability.
      - Preserve the theoretical possibility and practical improbability of excellent or beneficent tyranny without converting the argument into either an endorsement of tyranny or a simple vindication of legality.
      - Restore the hierarchy among wisdom, political office, honor, love, friendship, political recognition, and the city.
      - Restore the piety-and-law endpoint as an unresolved Strauss problem.
    attribution_rule: >-
      Strauss's reconstruction of Xenophon is trusted and preserved as Strauss's
      reconstruction. Direct authorial attribution to Xenophon remains governed by the
      repository's speaker-and-author and compositional-evidence rules.
  Kojeve_explicit_argument:
    status: PASS_WITH_NORMALIZATION_CORRECTIONS_APPLIED
    correction_summary:
      - Restore Kojeve's argument as an independent source layer before Strauss's Restatement is allowed to answer it.
      - Distinguish recognition and political satisfaction from happiness, love, and affection.
      - Restore the distinction between freely recognized authority and coercive force and Kojeve's corresponding definition of tyranny.
      - Preserve the expansive logic from reciprocal recognition toward universal recognition and the universal and homogeneous state.
      - Restore the requirement that political counsel mediate from a ruler's acknowledged end through concrete present circumstances rather than remain abstract or utopian.
      - Preserve the distinction between the finite philosopher and the completed wise man and the structural conflict between philosophic inquiry and direct governing.
      - Restore Kojeve's account of the tragedy of action, philosophic pedagogy, historical verification, Work and Struggle, and the evidentiary role he assigns to sustained historical and social validity.
      - Restore the historical genealogy of universality and homogeneity through Alexander, Christian universalism, St. Paul, and modern secularization.
      - Restore the division of labor among philosophers, intellectual mediators, and political actors and Kojeve's claim that revolutionary political action is required for the historical completion in which Wisdom becomes possible.
      - Remove Strauss-side objections and repository safeguards from Kojeve's own explicit-argument layer; they remain available for the Restatement and controlled synthesis rather than being placed in Kojeve's mouth.
    attribution_rule: >-
      Kojeve's strongest explicit case is preserved within his own evidentiary layer,
      including the philosophical force he assigns to historical verification. The
      repository does not convert that preservation into agreement, final truth, or owner
      adoption; Strauss's criticism is reviewed in the separate Restatement layer.
