permitted_derivations:
  - Use Hiero's speeches, Simonides's speeches, dramatic action, sequence, and ending as primary translated evidence.
  - Use Strauss to guide questions and reconstruction without replacing Xenophon.
  - Use Kojeve as an independently reconstructed testing interlocutor.
  - Use the Restatement as a distinct later response rather than a silent revision of On Tyranny.
  - Use correspondence as inquiry history subject to language, witness, translation, and archival limits.
  - Use editorial apparatus to control document identity and confidence without attributing notes to correspondents.
  - Use controlled synthesis only when every contributing source role remains recoverable.
prohibited_derivations:
  - Treat any later source as Xenophon's explicit statement.
  - Treat the English Hiero translation as unmediated Greek evidence.
  - Collapse Strauss, Kojeve, the Restatement, correspondence, or editorial apparatus into one secondary voice.
  - Infer agreement, rupture, or philosophical meaning from archival silence before documentary alternatives are considered.
  - Invent the body of the editorially attested 5 November 1957 communication.
  - Declare the tyranny and wisdom dispute finally resolved.
