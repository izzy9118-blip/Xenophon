{"schema_version":"1.0","correction_id":"XEN-COR-003","status":"OWNER_DIRECTED_INTERPRETIVE_CORRECTION","corrected_on":"2026-07-31","owner_directive":"The older Cyrus does not supply the standard for Xenophon; Xenophon reveals the older Cyrus.","applies_to":{"comparison_revision":"XEN-CONTROLLED-COMPARISON-001-R3","owner_review":"XEN-OWNER-REVIEW-007","next_stage":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001"},"superseded_direction":"The older Cyrus supplies Strauss's explicit comparative standard of legitimacy, rule, cruelty, manly virtue, and justice for Xenophon.","controlling_direction":"Xenophon reveals the older Cyrus. Xenophon's demonstrated political knowledge without hereditary title separates knowledge of rule from inherited legitimacy; Xenophon's lesser cruelty reveals degrees within manly justice; and Xenophon's relation to Socrates discloses what is absent from the older Cyrus.","interpretive_structure":{"xenophon":"The central revelatory case through whose deeds, rule, restraint, cruelty, justice, and relation to Socrates the older Cyrus becomes intelligible.","older_cyrus":"The political type disclosed by contrast with Xenophon: knowledge joined to inherited legitimacy, manly virtue joined to cruelty, and political justice separated from Socratic non-harm.","directionality":"FROM_XENOPHON_TO_OLDER_CYRUS","non_reversal_rule":"The synthesis may compare Xenophon with the older Cyrus, but it may not present the older Cyrus as the external standard that explains Xenophon.","justice_rule":"Xenophon's position reveals both the power and the limitation of the older Cyrus's justice because Xenophon is neither reducible to Cyrus nor simply measured by him."},"required_synthesis_statement":"Xenophon reveals the older Cyrus as the ruler in whom knowledge, inherited legitimacy, manly virtue, and cruelty are joined, thereby disclosing both the strength and the limitation of Cyrus's political justice.","preserved_ambiguity":"This correction does not eliminate the intended Cyrus ambiguity. It fixes the direction of disclosure within that ambiguity: the younger Cyrus draws Xenophon into political life, Xenophon's ascent becomes the central evidence, and through Xenophon the older Cyrus is revealed as a political type.","limits":["The correction does not declare Xenophon superior in every respect.","The correction does not resolve the relation between manly and Socratic justice.","The correction does not certify Greek wording, authorial intention, or a final teaching.","All nineteen unresolved questions remain open."],"immutable_record_rule":"R3 and its adoption records remain unchanged as historical records. This additive correction governs the controlled synthesis and any later derivative work."}