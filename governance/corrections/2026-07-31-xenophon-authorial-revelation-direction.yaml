{"schema_version":"1.0","correction_id":"XEN-COR-003","status":"OWNER_DIRECTED_INTERPRETIVE_CORRECTION","directed_on":"2026-07-31","owner_directive":"Yes","applies_to":["XEN-CONTROLLED-COMPARISON-001-R3","XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001","all later comparative and derivative records"],"problem":"Formulations saying that the older Cyrus supplies Xenophon with a comparative standard reverse the direction of disclosure. Xenophon is not a passive object receiving standards from figures external to his work. Xenophon is the authorial source whose differentiated presentations reveal his inquiry while concealing its order.","governing_correction":{"prohibited_direction":"The older Cyrus supplies Xenophon with legitimacy, rule, cruelty, manly virtue, justice, or a political standard.","required_direction":"Xenophon supplies the presentation of the older Cyrus to the reader. Through that presentation Xenophon reveals, indirectly and with deliberate concealment, his understanding of inherited legitimacy, knowledge of rule, prescription, cruelty, manly justice, and political viability.","strauss_role":"Strauss does not import an external standard into Xenophon. Strauss uncovers the concealed order and relation of Xenophon's own presentations.","xenophon_role":"Xenophon is the revealing author, actor, and narrator under examination. His manner of revealing through differentiated figures is itself documentary evidence."},"controlled_formulation":"Xenophon's presentation of the older Cyrus reveals one form of political wisdom: knowledge of rule made politically effective through inheritance, prescription, established authority, and the capacity for cruelty. Strauss reads this Xenophontic revelation in relation to Xenophon's self-presentation in the Anabasis.","figure_relations":{"YOUNGER_CYRUS":"Through the younger Cyrus, Xenophon reveals the attraction, promise, concealment, ambition, friendship, wealth, and fatherland problem of political action.","OLDER_CYRUS":"Through the older Cyrus, Xenophon reveals the conditions, powers, and dangers of successful rule, including legitimacy, prescription, knowledge, cruelty, and manly justice.","SOCRATES":"Through Socrates, Xenophon reveals the philosophic and non-harming standard that places political justice under examination.","XENOPHON_SELF_PRESENTATION":"Through the Xenophon who acts and narrates in the Anabasis, Xenophon reveals the difficult and incomplete conjunction of political capacity, restraint, piety, justice, and Socratic judgment."},"preservation_rules":["Do not erase the distinction between the younger and older Cyrus.","Do not convert the figures into external authorities acting upon Xenophon.","Do not treat Strauss as supplying Xenophon with a doctrine.","Preserve concealment, indirection, ambiguity, compositional order, and self-presentation as modes of Xenophontic revelation.","Preserve R3 and its adoption records as immutable historical records; this correction governs their interpretation and all derivatives."],"next_effect":"The controlled synthesis must be written from Xenophon outward: Xenophon reveals through his figures and narrative; Strauss guides recovery of that hidden revelation."}