{"schema_version":"1.0","correction_id":"XEN-COR-002","status":"OWNER_DIRECTED_INTERPRETIVE_CLARIFICATION","corrected_on":"2026-07-31","owner_directive":"The two Cyruses must be distinguished. As Strauss notes this ambiguity is intended and must be understood. Good continue.","applies_to":{"review_id":"XEN-CMP-R2-REVIEW-001","owner_review_id":"XEN-OWNER-REVIEW-006","required_revision":"XEN-CONTROLLED-COMPARISON-001-R3"},"correction":{"superseded_overstatement":"The R2 review requirement could be read as demanding a rigid separation of the younger Cyrus, the older Cyrus, and the Cyrus-side abstraction.","controlling_clarification":"R3 must distinguish the two Cyrus-functions analytically while preserving their intended ambiguity and interpretive passage. The younger Cyrus supplies the lived political attraction, expeditionary horizon, friendship network, ambition, and fatherland problem. The older Cyrus supplies Strauss's explicit comparative standard of rule, inherited legitimacy, cruelty, and manly justice. The Cyrus-side abstraction names the deliberate movement between these figures by which Xenophon's political excellence is examined against Socrates.","non_separation_rule":"Distinction must not become compartmentalization. Where Strauss's argument moves from the younger Cyrus to the older Cyrus, R3 must preserve the movement and explain its function rather than treating it as equivocation to be eliminated.","ambiguity_rule":"The ambiguity is interpretively productive: it permits the younger Cyrus's attraction to open the practical-political problem that the older Cyrus later sharpens at the level of justice. R3 must state both the identity difference and the intended continuity.","justice_rule":"The word justice is itself explicitly ambiguous in Strauss's examination. The controlled Cyrus ambiguity belongs within that larger inquiry into manly justice, Socratic justice, legitimacy, cruelty, and Xenophon's intermediate position."},"source_anchors":[{"scope":"Strauss printed pp. 105-106","function":"The authentic title refers to the ascent of the younger Cyrus."},{"scope":"Strauss printed pp. 124-125","function":"Proxenos's invitation and the fatherland problem concern the younger Cyrus."},{"scope":"Strauss printed pp. 127-128","function":"Strauss explicitly compares Xenophon with the older Cyrus, calls justice ambiguous, and places Xenophon between the older Cyrus and Socrates."}],"r3_effect":{"retain_controlled_terms":true,"terms":["YOUNGER_CYRUS_ROLE","OLDER_CYRUS_ROLE","CYRUS_SIDE_AMBIGUITY"],"replace_term":"CYRUS_SIDE_ABSTRACTION","with_term":"CYRUS_SIDE_AMBIGUITY","required_statement":"The Cyrus side is not a third independent figure or a flattening abstraction; it is the controlled ambiguity through which Strauss moves from Xenophon's attraction to the younger Cyrus toward the older Cyrus as a standard of manly political justice."},"immutable_record_rule":"The R2 review and owner-review records remain unchanged as historical records. This additive correction controls R3 production.","limits":["The clarification does not identify the younger and older Cyrus without remainder.","The clarification does not erase the textual distinction between the two men.","The clarification does not certify a final teaching.","Greek and cross-work conclusions remain pending their proper witnesses."]}