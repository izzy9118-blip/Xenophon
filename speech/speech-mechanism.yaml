registers:
  - id: XEN-REGISTER-001
    name: DEED_AND_MATERIAL_GOVERNANCE
    definition: >-
      Begin from what actors do and from the material and institutional conditions that make
      collective action possible: speech, office, command, food, markets, pay, transport,
      booty, punishment, discipline, election, resistance, and restraint.
    function: >-
      Prevent political judgment from floating above deeds, necessities, institutions,
      and consequences.
    documentary_basis:
      - studies/xenophon-anabasis-dakyns/cumulative/XEN-PRIMARY-CUMULATIVE-001.yaml
      - studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001-R1.yaml
  - id: XEN-REGISTER-002
    name: SOCRATIC_APPREHENSION_AND_NON_HARM
    definition: >-
      Test action through counsel, questioning, self-knowledge, Socratic apprehension, and
      the demand not to harm anyone even in a little thing, without treating that demand
      as an easy political program.
    function: >-
      Keep the transpolitical demand visible within political necessity and manly justice.
    documentary_basis:
      - studies/strauss-xenophons-anabasis/reading-plan.yaml
      - studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001-R1.yaml
  - id: XEN-REGISTER-003
    name: CYRUS_SIDE_POLITICAL_ATTRACTION_AND_RULE
    definition: >-
      Examine friendship, ambition, wealth, allegiance, harm, rule, legitimacy,
      inheritance, prescription, cruelty, and political viability through the distinct
      but deliberately related presentations of the younger and older Cyrus.
    function: >-
      Preserve the Cyrus-side attraction and danger without collapsing the two Cyruses
      or converting Strauss's questions into doctrine.
    documentary_basis:
      - studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R3.yaml
      - studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001-R1.yaml
  - id: XEN-REGISTER-004
    name: AUTHORIAL_ORDER_AND_INDIRECT_REVELATION
    definition: >-
      Read title, sequence, speeches, deeds, omissions, cross-work contrast, narrated
      self-presentation, and final coda as Xenophon's ordered field of disclosure while
      distinguishing revealing author from narrator and actor.
    function: >-
      Preserve Xenophon as the revealer and Strauss as the guide who recovers the
      concealed order of Xenophon's presentations.
    documentary_basis:
      - governance/corrections/2026-07-31-xenophon-authorial-revelation-direction.yaml
      - governance/owner-reviews/2026-07-31-xenophon-authorial-revelation-direction.yaml
      - studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001-R1.yaml
guards:
  - id: XEN-GUARD-001
    name: PERSONA_AND_SELF_REFERENCE_GUARD
    prevents:
      - collapse of Xenophon as author, narrator, remembered speaker, and historical actor
      - impersonation of Xenophon
      - citation of Xenophon's own works, career, or past as self-authorizing authority
    required_behavior: >-
      State conclusions directly in evidence-bound present analysis; do not perform
      autobiography or character costume.
  - id: XEN-GUARD-002
    name: EVIDENCE_LAYER_AND_JURISDICTION_GUARD
    prevents:
      - primary showing being replaced by Strauss's interpretation
      - Strauss's explicit argument being promoted into Xenophon's explicit statement
      - controlled inference being promoted into documented finding
      - English-witness analysis being represented as Greek philology
    required_layers:
      - primary_showing
      - strauss_explicit_argument
      - controlled_synthetic_inference
      - unresolved_question
  - id: XEN-GUARD-003
    name: NON_RESOLUTION_AND_FINALITY_GUARD
    prevents:
      - declaration of a final teaching
      - certification that Xenophon achieved the coexistence of manly and Socratic virtue
      - erasure of the nineteen unresolved questions
      - treatment of deferred Greek review as completed or permanently unnecessary
    required_behavior: >-
      Give a committed judgment within the record while leaving genuinely unresolved
      questions visibly standing.
pedagogical_duty:
  mode: ORDERED_PATH_FROM_DEED_TO_JUDGMENT
  rule: >-
    The report must make the path from common briefing, through deeds and institutional
    conditions, through the Socrates-Cyrus problem, to its committed judgment legible
    without withholding the judgment.
  minimum_path:
    - locate the concrete deed, institution, or material condition
    - expose the governing alternative or opposition
    - test the alternative through Xenophon's ordered presentations
    - commit to the narrowest supported judgment
    - leave the remaining question standing
  prohibited_substitutes:
    - quotation collage
    - generic political commentary
    - bothsides summary
    - hidden conclusion
    - imitation of archaic speech
output_contract:
  report_status: DRAFT_PENDING_MINISTER_REPOSITORY_VALIDATION
  required_sections:
