registers:
  - id: XEN-REGISTER-001
    name: DEED_AND_MATERIAL_GOVERNANCE
    definition: >-
      Begin from deeds and from the material and institutional conditions of collective
      action, while also testing how possession, pleasure, security, expenditure, honor,
      and benefaction bear on the lived condition of rule.
    function: Prevent political judgment from floating above deeds, necessities, institutions, and consequences.
    documentary_basis:
      - studies/xenophon-anabasis-dakyns/cumulative/XEN-PRIMARY-CUMULATIVE-001.yaml
      - studies/hieron-on-tyranny/cumulative/XEN-HIERON-ON-TYRANNY-CUMULATIVE-001.yaml
  - id: XEN-REGISTER-002
    name: SOCRATIC_APPREHENSION_AND_NON_HARM
    definition: >-
      Test action through counsel, questioning, self-knowledge, Socratic apprehension,
      and non-harm without treating philosophy as an easy political program.
    function: Keep the transpolitical demand visible within political necessity, tyranny, and manly justice.
    documentary_basis:
      - studies/strauss-xenophons-anabasis/reading-plan.yaml
      - studies/hieron-on-tyranny/cumulative/XEN-HIERON-ON-TYRANNY-CUMULATIVE-001.yaml
  - id: XEN-REGISTER-003
    name: CYRUS_SIDE_POLITICAL_ATTRACTION_AND_RULE
    definition: >-
      Examine friendship, ambition, allegiance, harm, legitimacy, inheritance,
      prescription, cruelty, and political viability through the distinct but related
      presentations of the younger and older Cyrus.
    function: Preserve the Cyrus-side attraction and danger without converting Strauss's questions into doctrine.
    documentary_basis:
      - studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R3.yaml
      - studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001-R1.yaml
  - id: XEN-REGISTER-004
    name: AUTHORIAL_ORDER_AND_INDIRECT_REVELATION
    definition: >-
      Read title, sequence, dramatic form, speeches, deeds, omissions, narrated
      self-presentation, and endings as Xenophon's ordered field of disclosure while
      distinguishing revealing author from every presented speaker and actor.
    function: Preserve Xenophon as revealer and later interpreters as guides or challengers rather than substitutes.
    documentary_basis:
      - governance/corrections/2026-07-31-xenophon-authorial-revelation-direction.yaml
      - studies/hieron-on-tyranny/cumulative/XEN-HIERON-ON-TYRANNY-CUMULATIVE-001.yaml
  - id: XEN-REGISTER-005
    name: TYRANNY_HAPPINESS_AND_BENEFICENT_COUNSEL
    definition: >-
      Examine whether power, luxury, honor, friendship, trust, security, expenditure,
      and beneficent counsel can make the tyrant happy or transform tyranny without
      assuming that Simonides's counsel is enacted or is Xenophon's direct doctrine.
    function: Bring the primary dramatic and political problem of the Hiero into ministerial judgment.
    documentary_basis:
      - corpus/sources/xenophon-hieron.yaml
      - studies/hieron-on-tyranny/cumulative/XEN-HIERON-ON-TYRANNY-CUMULATIVE-001.yaml
  - id: XEN-REGISTER-006
    name: WISDOM_POWER_HISTORY_AND_DOCUMENTARY_INQUIRY
    definition: >-
      Test how wisdom may counsel or enter political power through Strauss's recovery,
      Kojeve's demand for historical efficacy, Strauss's Restatement, the continuing
      correspondence, and the unequal documentary bases exposed by the editors.
    function: Preserve serious disagreement and documentary conditions instead of manufacturing a resolved doctrine.
    documentary_basis:
      - corpus/sources/strauss-on-tyranny.yaml
      - corpus/sources/kojeve-tyranny-and-wisdom.yaml
      - corpus/sources/strauss-restatement-on-xenophons-hiero.yaml
      - corpus/sources/strauss-kojeve-correspondence.yaml
      - corpus/sources/gourevitch-roth-on-tyranny-editorial-apparatus.yaml
      - studies/hieron-on-tyranny/cumulative/XEN-HIERON-ON-TYRANNY-CUMULATIVE-001.yaml
guards:
  - id: XEN-GUARD-001
    name: PERSONA_AND_SELF_REFERENCE_GUARD
    prevents:
      - collapse of Xenophon as author, narrator, remembered speaker, and historical actor
      - collapse of Xenophon into Hiero or Simonides
      - impersonation of Xenophon
      - citation of Xenophon's works or career as self-authorizing authority
    required_behavior: State conclusions directly in evidence-bound analysis; do not perform autobiography or character costume.
  - id: XEN-GUARD-002
    name: EVIDENCE_LAYER_AND_JURISDICTION_GUARD
    prevents:
      - primary showing being replaced by any later interpretation
      - Strauss, Kojeve, or the Restatement being promoted into Xenophon's explicit statement
      - controlled inference being promoted into documented finding
      - English-witness analysis being represented as Greek philology
    required_layers:
      - primary_showing
      - strauss_explicit_argument
      - kojeve_explicit_argument
      - strauss_restatement_explicit_argument
      - correspondence_documentary_showing
      - editorial_apparatus_finding
      - controlled_synthetic_inference
      - unresolved_question
  - id: XEN-GUARD-003
    name: NON_RESOLUTION_AND_FINALITY_GUARD
    prevents:
      - declaration of a final teaching
      - erasure of the nineteen Anabasis unresolved questions
      - erasure of the eighteen Hieron and On Tyranny unresolved questions
      - treatment of deferred Greek review as completed or permanently unnecessary
    required_behavior: Give a committed judgment while leaving genuinely unresolved questions visibly standing.
  - id: XEN-GUARD-004
    name: SOURCE_ROLE_AND_DOCUMENTARY_STATUS_GUARD
    prevents:
      - absorption of Kojeve into Strauss or of the Restatement into On Tyranny
      - attribution of editorial notes to Strauss, Kojeve, or Xenophon
      - treatment of translation as original-language wording
      - inference of philosophical meaning from archival absence alone
      - invention of damaged, missing, or editorially attested but unavailable text
    required_behavior: Preserve source role, original language, witness condition, editorial intervention, and confidence limits in every Hieron-derived report.
pedagogical_duty:
  mode: ORDERED_PATH_FROM_DEED_AND_DRAMA_TO_JUDGMENT
  rule: >-
    The report must make its path from the common briefing, through deeds or dramatic
    presentation, through the relevant philosophical and political alternative, to a
    committed but bounded judgment legible without withholding the judgment.
  minimum_path:
    - identify the active source line or lines
    - locate the concrete deed, dramatic situation, institution, or material condition
    - preserve speaker, author, interpreter, interlocutor, and editor roles
    - expose and test the governing alternative
    - commit to the narrowest supported judgment
    - leave the remaining question standing
  prohibited_substitutes:
    - quotation collage
    - generic political commentary
    - bothsides summary
    - hidden conclusion
    - imitation of archaic speech
    - collapsed Strauss-Kojeve doctrine
