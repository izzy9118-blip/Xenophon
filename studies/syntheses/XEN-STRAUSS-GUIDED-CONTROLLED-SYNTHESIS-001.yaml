{"schema_version":"1.0","synthesis_id":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","title":"Xenophon's ascent between Socrates and Cyrus","governing_inputs":{"primary_reconstruction":"studies/xenophon-anabasis-dakyns/cumulative/XEN-PRIMARY-CUMULATIVE-001.yaml","controlled_comparison":"studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R3.yaml","r3_adoption":"governance/owner-reviews/2026-07-31-controlled-comparison-r3-in-depth-review.yaml","directionality_correction":"governance/corrections/2026-07-31-xenophon-reveals-older-cyrus-directionality.yaml"},"jurisdiction":"A controlled interpretive synthesis of the owner-adopted primary reconstruction and Strauss-guided comparison. It preserves the admitted English-witness limits, Strauss's guiding architecture, all nineteen unresolved questions, and the prohibition on declaring a final teaching.","governing_thesis":"The Anabasis presents Xenophon's ascent as the central political evidence through which the Cyrus side and the Socratic alternative become intelligible. The younger Cyrus awakens Xenophon's attraction to political action; Xenophon's own speeches, commands, corrections, punishments, economic competence, piety, restraint, and continuing acquisition reveal the possibilities and limits of political virtue; through Xenophon, the older Cyrus is disclosed as the ruler in whom knowledge, inherited legitimacy, manly virtue, and cruelty are joined. Socrates reveals the contrary demand of justice that does not harm. Xenophon stands neither as a passive midpoint nor as a final reconciliation, but as the active and unresolved attempt to join what political and Socratic virtue separately require.","argument_movements":[{"id":"SYN-MOV-001","title":"From Cyrus's ascent to Xenophon's ascent","finding":"The authentic title names the younger Cyrus, but his failed ascent gives way to Xenophon's ascent. The work's political center is therefore not Cyrus alone but the emergence of Xenophon through crisis, speech, election, correction, and command."},{"id":"SYN-MOV-002","title":"The younger Cyrus as attraction","finding":"Through Proxenos, the younger Cyrus draws Xenophon toward honor, wealth, friendship, action, and a political attachment that may rival fatherland. This attraction opens the problem; it does not supply a finished standard by which Xenophon is measured."},{"id":"SYN-MOV-003","title":"Xenophon as the revelatory case","finding":"Xenophon demonstrates political knowledge without hereditary title. His rule separates competence from inherited legitimacy and makes visible the political need for law, prescription, recognition, and accepted form without reducing knowledge to those supports."},{"id":"SYN-MOV-004","title":"Xenophon reveals the older Cyrus","finding":"By contrast with Xenophon's unsupported but demonstrated rule, the older Cyrus is revealed as knowledge already clothed in inherited legitimacy. By contrast with Xenophon's lesser cruelty and relation to Socrates, the older Cyrus is revealed as manly virtue joined to cruelty and therefore as both powerful and limited in justice."},{"id":"SYN-MOV-005","title":"Justice as the governing ambiguity","finding":"The deepest ambiguity is not merely the shared name Cyrus but justice itself. Manly justice requires the capacity to benefit friends and harm enemies; Socratic justice refuses harm. Xenophon's deeds reveal the necessity and incompatibility of these demands without finally reconciling them."},{"id":"SYN-MOV-006","title":"Book Four, piety, and wiliness","finding":"Piety, divine signs, wit, toughness, and wiliness are joined rather than purified into separate categories. Xenophon's political virtue is neither secular technique nor simple obedience, and the relation of divine guidance to prudential action remains unresolved."},{"id":"SYN-MOV-007","title":"Byzantium as the deed test","finding":"When city, fleet, money, and army are simultaneously available, Xenophon refuses unauthorized seizure and the plunder of an innocent Greek city. This voluntary restraint in deed is stronger than verbal denial, but mixed motives, Spartan power, prudence, Greece, fatherland, and incomplete justice remain active."},{"id":"SYN-MOV-008","title":"The ending under the Socratic question","finding":"Thibron ends the army's autonomous institutional existence, while Strauss's textual sequence asks whether Socrates' apprehension is vindicated and then places renewed war for booty and the density of gods and oaths after the question. Acquisition and piety remain joined under an unresolved judgment."}],"principal_findings":[{"id":"SYN-F-001","finding":"Xenophon is the central revelatory case, not a passive object measured by Cyrus."},{"id":"SYN-F-002","finding":"The younger Cyrus initiates the attraction to political life, but Xenophon's own ascent becomes the evidentiary center."},{"id":"SYN-F-003","finding":"Xenophon reveals the older Cyrus by separating demonstrated knowledge of rule from inherited legitimacy."},{"id":"SYN-F-004","finding":"Xenophon's lesser cruelty and relation to Socrates reveal both the strength and limitation of the older Cyrus's manly justice."},{"id":"SYN-F-005","finding":"The intended ambiguity between the two Cyruses is preserved, but its direction of disclosure runs through Xenophon."},{"id":"SYN-F-006","finding":"Justice's ambiguity governs the entire comparison and prevents a simple hierarchy among Cyrus, Xenophon, and Socrates."},{"id":"SYN-F-007","finding":"Material governance, economic art, punishment, pay, gifts, booty, and institutional transfer are constitutive of the political inquiry rather than external circumstances."},{"id":"SYN-F-008","finding":"Byzantium supplies the strongest deed evidence of restraint without certifying pure motive or complete justice."},{"id":"SYN-F-009","finding":"The conclusion preserves acquisition and piety together after the Socratic question and therefore resists doctrinal closure."}],"anti_drift_rules":["Do not say that the older Cyrus supplies the standard that explains Xenophon.","Do not make Xenophon a passive midpoint between two completed poles.","Do not identify the younger and older Cyrus without remainder.","Do not separate the two Cyruses so completely that Strauss's intended ambiguity disappears.","Do not treat political success as proof of justice.","Do not treat Byzantium as proof of pure motive.","Do not end Strauss's essay at the Socratic question.","Do not make Thibron and Strauss's final textual coda equal rival closures.","Do not close any of the nineteen unresolved questions by inference."],"unresolved_question_policy":{"count":19,"rule":"All nineteen R3 unresolved questions are incorporated by reference and remain open. The synthesis may order and relate them but may not silently answer them.","source":"studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R3.yaml"},"limits":["No reviewed Greek witness or critical edition is certified.","No final teaching or authorial intention is declared.","No minister adapter, Sanctum registration, or Assembly dispatch is authorized.","Artificial-intelligence self-certification remains prohibited."],"next_required_action":{"id":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-IN_DEPTH-OWNER-REVIEW-001","description":"Conduct an in-depth owner review of the controlled synthesis, with special attention to the direction Xenophon reveals the older Cyrus, the preservation of intended ambiguity, and the retention of all nineteen unresolved questions."}}