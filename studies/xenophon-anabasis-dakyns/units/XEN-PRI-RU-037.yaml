l review","fines","violence charge","cross-examination","sick-man case","admission of blows","necessity defense","analogies","passivity argument","memory appeal","conciliatory close"],"repetitions":["Winter discipline is tied to survival.","Assembly procedure converts accusation into public judgment.","Private looting remains linked to disintegration."],"omissions":["Accounting evidence for the fines is absent.","Other accusers' cases are absent.","Boiscus is not heard.","No explicit verdict on Xenophon is stated."],"tensions":["Coercion is admitted but wanton outrage denied.","A free man is compelled and compared to subordinate dependents.","Silence is treated as acquiescence though it need not be consent.","Acclamation influences judgment without replacing adjudication."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"CHAPTER_BOUNDARY_OBSERVATION","observation":"V.8 is PDF pp.115-117; VI.1 begins p.118."},{"id":"OBS-002","evidence_type":"GENERAL_JUDICIAL_REVIEW_OBSERVATION","observation":"The generals undergo judicial examination for past conduct."},{"id":"OBS-003","evidence_type":"CARGO_DEFICIENCY_FINE_OBSERVATION","observation":"Philesius and Xanthicles each receive twenty minae fines for merchant-cargo deficiency."},{"id":"OBS-004","evidence_type":"COMMAND_PERFORMANCE_FINE_OBSERVATION","observation":"Sophaenetus receives a ten minae fine for inadequate chief-officer performance."},{"id":"OBS-005","evidence_type":"PERSONAL_OUTRAGE_INDICTMENT_OBSERVATION","observation":"Unnamed men accuse Xenophon of beatings as personal outrage with violence."},{"id":"OBS-006","evidence_type":"LEGAL_PARATEXT_OBSERVATION","observation":"The HYBREOS GRAPHE note remains editorial paratext."},{"id":"OBS-007","evidence_type":"FORENSIC_CROSS_EXAMINATION_OBSERVATION","observation":"Xenophon requires the first accuser to state where and when he was struck."},{"id":"OBS-008","evidence_type":"SNOW_RETREAT_CONTEXT_OBSERVATION","observation":"The beating occurred amid deep snow, exhausted provisions, deaths, and enemy pursuit."},{"id":"OBS-009","evidence_type":"ALTERNATIVE_MOTIVE_EXCLUSION_OBSERVATION","observation":"Debt, property, sexual rivalry, and drunkenness are denied as motives."},{"id":"OBS-010","evidence_type":"FREE_MULE_DRIVER_STATUS_OBSERVATION","observation":"The accuser drove a mule although he was a free man."},{"id":"OBS-011","evidence_type":"COMPELLED_CASUALTY_TRANSPORT_OBSERVATION","observation":"Xenophon compelled him to carry a sick Greek."},{"id":"OBS-012","evidence_type":"BAGGAGE_REDISTRIBUTION_CLAIM_OBSERVATION","observation":"Xenophon says redistributed baggage was later returned."},{"id":"OBS-013","evidence_type":"PREMATURE_BURIAL_ATTEMPT_OBSERVATION","observation":"The carrier dug a grave before the sick man, recognized as alive, had died."},{"id":"OBS-014","evidence_type":"ADMITTED_DISCIPLINARY_BLOW_OBSERVATION","observation":"Xenophon admits striking him after refusal to continue transport."},{"id":"OBS-015","evidence_type":"ASSEMBLY_APPROVAL_SHOUT_OBSERVATION","observation":"The assembly says more blows might have been better; this is not a stated verdict."},{"id":"OBS-016","evidence_type":"ACCUSER_SILENCE_OBSERVATION","observation":"Other accusers refuse to state their cases."},{"id":"OBS-017","evidence_type":"GENERAL_ADMISSION_OF_FORCE_OBSERVATION","observation":"Xenophon confesses to striking men for failure in discipline."},{"id":"OBS-018","evidence_type":"ANTI_LOOTING_DISCIPLINE_OBSERVATION","observation":"He targets men who left rank to loot."},{"id":"OBS-019","evidence_type":"FORCED_MARCHING_OBSERVATION","observation":"He forced exhausted or immobilized men to continue marching."},{"id":"OBS-020","evidence_type":"PERSONAL_COLD_EXPERIENCE_OBSERVATION","observation":"He cites his own experience of freezing inactivity."},{"id":"OBS-021","evidence_type":"BLOW_AS_ENEMY_LANCE_SUBSTITUTE_OBSERVATION","observation":"He says a fist blow saved a straggler from an enemy lance."},{"id":"OBS-022","evidence_type":"