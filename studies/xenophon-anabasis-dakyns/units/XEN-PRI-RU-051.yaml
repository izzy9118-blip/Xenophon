{"schema_version":1.0,"unit_id":"XEN-PRI-RU-051","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VII.8","pdf_pages_one_based":"164-168","opening_anchor":"BOOK VII, VIII: From this place they sailed across to Lampsacus.","closing_anchor":"Meanwhile Thibron arrived and received the troops which he incorporated with the rest of his Hellenic forces, and so proceeded to prosecute a war against Tissaphernes and Pharnabazus."},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170 searchable 168-page PDF","chapter_boundary_control":"Heading VIII begins VII.8 on PDF page 164. This unit covers pages 164-168 through the narrative end of the 168-page witness. No subsequent numbered chapter follows. The manuscript governor list noted after the narrative conclusion is paratextual apparatus, not a further chapter.","source_boundary":"Lampsacus and Xenophon's poverty; Eucleides and sacrifice; Zeus Meilichios; recovered horse; march through the Troad and Mysia; Pergamus hospitality; two Asidates expeditions; retreat and rescue; capture, reward, and final transfer to Thibron."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with attributed dialogue, sacrificial interpretation, route description, hospitality, military planning, assault, retreat, capture, collective reward, and institutional transfer.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms belong to attributed speech. Xenophon remains a third-person character whose poverty, admission, sacrifice, intentions, tactical decisions, dangers, rewards, and final relation to the army are narrated.","uncertainty":"The textual reading concerning Eucleides's father, the causal force of sacrifice, the morality and legal status of the Asidates seizure, the valuation and distribution of booty, the exact troop total at transfer, and the relation between narrative end and appended manuscript list remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Eucleides","audience":"Xenophon","occasion":"Lampsacus meeting","content":"Congratulates safe return, asks his gold, and doubts his poverty."},{"id":"SAO-002","speaker":"Xenophon","audience":"Eucleides","occasion":"wealth inquiry","content":"Says he can barely get home unless he sells horse and effects."},{"id":"SAO-003","speaker":"Eucleides","audience":"Xenophon","occasion":"Apollo sacrifice","content":"Accepts poverty from the victims; names Xenophon and neglected Zeus Meilichios as obstacles."},{"id":"SAO-004","speaker":"Xenophon","audience":"Eucleides","occasion":"cult inquiry","content":"Says he has not sacrificed to Zeus Meilichios since going abroad."},{"id":"SAO-005","speaker":"Hellas","audience":"Xenophon","occasion":"Pergamus hospitality","content":"Says thirty men by night can seize Asidates, household, and wealth."},{"id":"SAO-006","speaker":"Basias","audience":"Xenophon and companions","occasion":"pre-expedition sacrifice","content":"Calls the victims promising and Asidates easy prey."},{"id":"SAO-007","speaker":"officers","audience":"about six hundred volunteers","occasion":"first expedition formation","content":"Exclude late volunteers from the anticipated share."},{"id":"SAO-008","speaker":"narrator","audience":"reader","occasion":"first assault and retreat","content":"Reports failed capture, relief forces, many wounds, and return with captives and sheep."},{"id":"SAO-009","speaker":"narrator","audience":"reader","occasion":"second expedition","content":"Says Asidates’s capture literally fulfills the earlier victims."},{"id":"SAO-010","speaker":"Laconians, officers, generals, soldiers","audience":"Xenophon","occasion":"Pergamus return","content":"Collectively grant him first choice before Thibron receives the army."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","deed":"Army sails to Lampsacus; Eucleides asks about wealth.","outcome":"Xenophon’s poverty is narrated after the expedition."},{"id":"SDO-002","deed":"Xenophon sacrifices to Apollo before Eucleides.","outcome":"Eucleides accepts the poverty claim and invokes Zeus Meilichios."},{"id":"SDO-003","deed":"At Ophrynium Xenophon performs the family swine holocaust.","outcome":"Signs are favorable; Bion and Nausicleides arrive with gifts."},{"id":"SDO-004","deed":"They repurchase his horse for fifty darics and return it freely.","outcome":"A need-driven sale is reversed by friendship."},{"id":"SDO-005","deed":"Army marches through Troad and Mysia to Pergamus.","outcome":"Homeward movement becomes a new booty expedition."},{"id":"SDO-006","deed":"Hellas supplies intelligence and guides; Xenophon sacrifices and selects officers.","outcome":"Private intelligence and ritual initiate the attack."},{"id":"SDO-007","deed":"The party fails against the tower as relief forces assemble.","outcome":"The expected easy prey becomes a dangerous retreat."},{"id":"SDO-008","deed":"Hellenes retreat in hollow square with captured property and rescuers.","outcome":"They return with captives; nearly half are wounded."},{"id":"SDO-009","deed":"Whole army makes a deceptive night movement; Asidates leaves tower.","outcome":"Asidates, household, horses, and property are captured."},{"id":"SDO-010","deed":"Army gives Xenophon first choice; Thibron receives the troops.","outcome":"Xenophon gains property; army enters renewed Spartan war."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Lampsacus","poverty","Apollo sacrifice","Zeus Meilichios","Ophrynium holocaust","gifts and horse","Pergamus","Asidates intelligence","first assault","relief and retreat","second expedition","capture","collective reward","Thibron transfer"],"repetitions":["Sacrifice precedes decisions.","Property shapes material standing.","Trusted circles and whole army alternate.","Booty joins solidarity and exclusion.","Return becomes renewed war."],"omissions":["No audited property account.","No reason for cult lapse.","No Asidates speech.","No full booty distribution.","No narrated homecoming."],"tensions":["Return versus poverty.","Ritual versus human causes.","Easy prey versus failure.","Friends versus volunteers.","Safety versus booty.","Ending versus renewed war."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"BOOK_SEVEN_VII8_FINAL_BOUNDARY_OBSERVATION","observation":"Heading VIII begins VII.8 on PDF page 164; narrative ends on page 168; the following governor list is apparatus."},{"id":"OBS-002","evidence_type":"LAMPSACUS_EUCLEIDES_SAFE_RETURN_OBSERVATION","observation":"At Lampsacus Eucleides the Phliasian congratulates Xenophon on safe return."},{"id":"OBS-003","evidence_type":"XENOPHON_BARELY_ENOUGH_HOME_OBSERVATION","observation":"Xenophon says he barely has enough to get home unless he sells his horse and personal effects."},{"id":"OBS-004","evidence_type":"EUCLEIDES_DISBELIEF_APOLLO_VICTIMS_OBSERVATION","observation":"Eucleides first doubts him, then believes after seeing the victims at an Apollo sacrifice."},{"id":"OBS-005","evidence_type":"XENOPHON_SELF_OBSTACLE_OBSERVATION","observation":"Eucleides says Xenophon himself is an obstacle to wealth."},{"id":"OBS-006","evidence_type":"ZEUS_MEILICHIOS_NEGLECT_OBSERVATION","observation":"Eucleides identifies Zeus Meilichios as an obstacle and asks about customary sacrifice."},{"id":"OBS-007","evidence_type":"NO_SACRIFICE_SINCE_ABROAD_OBSERVATION","observation":"Xenophon says he has not sacrificed to Zeus Meilichios since abroad."},{"id":"OBS-008","evidence_type":"OPHRYNIUM_FAMILY_HOLOCAUST_OBSERVATION","observation":"At Ophrynium he offers a family-custom holocaust of swine and obtains favorable signs."},{"id":"OBS-009","evidence_type":"BION_NAUSICLEIDES_GIFTS_OBSERVATION","observation":"That day Bion and Nausicleides arrive with gifts for the army."},{"id":"OBS-010","evidence_type":"FIFTY_DARIC_HORSE_RESTORATION_OBSERVATION","observation":"They repurchase his horse for fifty darics and restore it without remuneration."},{"id":"OBS-011","evidence_type":"TROAD_IDA_MYSIA_PERGAMUS_ROUTE_OBSERVATION","observation":"The army passes the Troad, Mount Ida, the Mysian coast, Atarneus and Caicus plain to Pergamus."},{"id":"OBS-012","evidence_type":"HELLAS_GONGYLUS_HOSPITALITY_OBSERVATION","observation":"Hellas, wife of Gongylus, hosts Xenophon at Pergamus."},{"id":"OBS-013","evidence_type":"ASIDATES_THIRTY_MAN_NIGHT_PROPOSAL_OBSERVATION","observation":"Hellas says thirty men by night can seize Asidates, his household, money, and property."},{"id":"OBS-014","evidence_type":"COUSIN_DAPHNAGORAS_GUIDES_OBSERVATION","observation":"Hellas sends her cousin and Daphnagoras as guides."},{"id":"OBS-015","evidence_type":"BASIAS_PROMISING_VICTIMS_EASY_PREY_OBSERVATION","observation":"Basias calls the victims promising and Asidates easy prey."},{"id":"OBS-016","evidence_type":"STAUNCHEST_FRIENDS_GOOD_TURN_OBSERVATION","observation":"Xenophon selects his staunchest officer-friends because he wishes to do them a good turn."},{"id":"OBS-017","evidence_type":"SIX_HUNDRED_VOLUNTEERS_EXCLUDED_OBSERVATION","observation":"About six hundred volunteers press to join but are excluded from the anticipated share."},{"id":"OBS-018","evidence_type":"ASIDATES_TOWER_ASSAULT_FAILURE_OBSERVATION","observation":"The night party fails to storm or undermine Asidates’s high, solid, defended tower."},{"id":"OBS-019","evidence_type":"EIGHT_BRICK_WALL_OX_SPIT_OBSERVATION","observation":"At the eight-clay-brick wall, an attacker is pierced through the thigh by a large ox-spit."},{"id":"OBS-020","evidence_type":"BEACONS_RELIEF_FORCES_OBSERVATION","observation":"Shouts and beacons bring Itabelius, Assyrian infantry, eighty Hyrcanian cavalry, about eight hundred light troops, and others."},{"id":"OBS-021","evidence_type":"HOLLOW_SQUARE_RETREAT_PROPERTY_OBSERVATION","observation":"The Hellenes place cattle, sheep, and slaves inside a hollow square to prevent a stampede."},{"id":"OBS-022","evidence_type":"GONGYLUS_PROCLES_RESCUE_OBSERVATION","observation":"Gongylus and Procles arrive with private forces to aid them."},{"id":"OBS-023","evidence_type":"CURVED_SHIELD_RETREAT_CARCASUS_OBSERVATION","observation":"Under missiles they curve the line, face shields toward fire, and barely cross the Carcasus."},{"id":"OBS-024","evidence_type":"HALF_WOUNDED_AGASIAS_OBSERVATION","observation":"Nearly half are wounded; Agasias is wounded after fighting throughout."},{"id":"OBS-025","evidence_type":"TWO_HUNDRED_CAPTIVES_SACRIFICE_SHEEP_OBSERVATION","observation":"They return with about two hundred captives and sheep sufficient for sacrifices."},{"id":"OBS-026","evidence_type":"SECOND_SACRIFICE_WHOLE_ARMY_DECEPTION_OBSERVATION","observation":"Next day Xenophon sacrifices and leads the whole army by night toward Lydia to misdirect the enemy."},{"id":"OBS-027","evidence_type":"ASIDATES_LEAVES_TOWER_PARTHENIUM_OBSERVATION","observation":"Asidates hears of the movement and leaves the tower for villages below Parthenium."},{"id":"OBS-028","evidence_type":"ASIDATES_HOUSEHOLD_PROPERTY_CAPTURE_OBSERVATION","observation":"The Hellenes capture Asidates, wife, children, horses, and all property."},{"id":"OBS-029","evidence_type":"EARLIER_VICTIMS_LITERAL_FULFILLMENT_OBSERVATION","observation":"The narrator says the earlier victims’ promise was literally fulfilled."},{"id":"OBS-030","evidence_type":"COLLECTIVE_REWARD_THIBRON_TRANSFER_OBSERVATION","observation":"All ranks give Xenophon first choice of property; Thibron receives the troops for war against Tissaphernes and Pharnabazus."}],"provisional_findings":[{"id":"PF-001","finding":"Final chapter opens with safe return and poverty, not accumulated private wealth."},{"id":"PF-002","finding":"Eucleides links fortune to neglected cult and Xenophon’s own conduct."},{"id":"PF-003","finding":"Gifts follow sacrifice temporally without proving divine causation."},{"id":"PF-004","finding":"Horse restoration is voluntary generosity, not command over army property."},{"id":"PF-005","finding":"Homeward travel becomes an offensive booty expedition."},{"id":"PF-006","finding":"First attack exposes the gap between favorable prediction and fortified reality."},{"id":"PF-007","finding":"Retreat formation preserves order and booty together."},{"id":"PF-008","finding":"Second attack succeeds through whole-army deception and Asidates’s movement."},{"id":"PF-009","finding":"Collective reward publicly recognizes Xenophon without a full distribution account."},{"id":"PF-010","finding":"Work ends in transfer to renewed Spartan war, not narrated homecoming."}],"standing_unresolved_questions":[{"id":"UQ-001","question":"What is the correct Greek reading concerning Eucleides’s father?"},{"id":"UQ-002","question":"What property supported Xenophon’s poverty claim?"},{"id":"UQ-003","question":"Why had Zeus Meilichios sacrifice ceased?"},{"id":"UQ-004","question":"How is Xenophon himself an obstacle to wealth?"},{"id":"UQ-005","question":"How should sacrifice, signs, and same-day gifts be related?"},{"id":"UQ-006","question":"Who financed and arranged the fifty-daric horse repurchase?"},{"id":"UQ-007","question":"What authorized the first Asidates expedition?"},{"id":"UQ-008","question":"Why were six hundred volunteers excluded?"},{"id":"UQ-009","question":"What was the legal and moral status of seizing Asidates and household?"},{"id":"UQ-010","question":"How many Hellenes joined the first expedition?"},{"id":"UQ-011","question":"Why prioritize Asidates over escaping slaves and goods?"},{"id":"UQ-012","question":"How many were wounded and what became of the ox-spit victim?"},{"id":"UQ-013","question":"How were about two hundred captives treated and divided?"},{"id":"UQ-014","question":"Was the Lydia movement genuine or primarily deception?"},{"id":"UQ-015","question":"What was the value and distribution of the final capture?"},{"id":"UQ-016","question":"What followed for Xenophon, the troops, and remaining obligations?"}],"downstream_textual_checks":[{"id":"DTC-001","check":"Separate VII.8 from the appended manuscript governor list."},{"id":"DTC-002","check":"Register Greek witnesses for Eucleides and Zeus Meilichios wording."},{"id":"DTC-003","check":"Trace Xenophon’s horses and property across Books IV, V, and VII."},{"id":"DTC-004","check":"Compare VII.6–VII.8 sacrifices without assuming causation."},{"id":"DTC-005","check":"Reconstruct Lampsacus–Pergamus route from controlled geography."},{"id":"DTC-006","check":"Compare the two Asidates operations."},{"id":"DTC-007","check":"Trace Agasias’s service and wounds."},{"id":"DTC-008","check":"Audit all final-chapter quantities."},{"id":"DTC-009","check":"Separate sacrificial fulfillment from tactical causes."},{"id":"DTC-010","check":"Compare final reward with prior enrichment accusations."},{"id":"DTC-011","check":"Trace command transfers through Thibron."},{"id":"DTC-012","check":"After owner review, build a primary-only cumulative register before comparison."}],"secondary_comparison_status":"DEFERRED"}