{"schema_version":1.0,"unit_id":"XEN-PRI-RU-041","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VI.4","pdf_pages_one_based":"127-129","opening_anchor":"BOOK VI, IV: During this day they contented themselves with bivouacking there on the beach at the harbour.","closing_anchor":"...all they could do was to strengthen the outposts and keep watch under arms the livelong night."},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Keep narrator, speaker, report, deed, outcome, paratext, and inference distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170, searchable 168-page PDF","chapter_boundary_control":"Heading IV begins VI.4 on PDF page 127; heading V begins VI.5 on page 129. This unit covers pages 127-129 and stops before heading V. Translator and preparer notes remain paratext.","source_boundary":"Calpe Haven geography and settlement capacity; burial and memorialization of the Arcadian dead; restoration of unified command; repeated adverse sacrifices; public inspection and colonization suspicion; Neon provisioning expedition and defeat; Xenophon rescue; Bithynian night attack and armed watch."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with topographical description, attributed direct speech by Xenophon, reported accusations and intelligence, collective resolutions, and narrated military outcomes.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms occur within attributed speeches. The narrator reports Xenophon in the third person and does not explicitly identify narrator and character.","uncertainty":"The truth of the colonization accusation, the meaning and cause of the adverse sacrifices, responsibility for Neon's independent action, exact casualty total beyond the stated minimum, and divine causation remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"VI.4 p.128","speaker":"Agasias, Hieronymus, and other senior Arcadians as conveners; assembly as decision-maker","audience":"the reunited army","occasion":"general meeting after burial of the dead","content":"The army resolves that future proposals to divide it are punishable by death and restores the former generals."},{"id":"SAO-002","locator":"VI.4 p.128","speaker":"Xenophon","audience":"the reunited army","occasion":"after restoration of unified command","content":"States that the journey must continue on foot because no vessels are available, that departure cannot be delayed because provisions are absent, and that the men must prepare to fight."},{"id":"SAO-003","locator":"VI.4 p.128","speaker":"certain unnamed soldiers","audience":"the army","occasion":"after the first adverse sacrifice for departure","content":"Accuse Xenophon of wanting to colonize Calpe and of persuading the seer to report the victims as unfavorable."},{"id":"SAO-004","locator":"VI.4 p.128","speaker":"Xenophon through the herald","audience":"the whole army, especially any seers","occasion":"public response to suspicion","content":"Invites anyone to attend and any seer to inspect the sacrifice."},{"id":"SAO-005","locator":"VI.4 p.128","speaker":"Xenophon","audience":"the army in assembly","occasion":"after repeated adverse sacrifices for departure","content":"Distinguishes the unfavorable question of marching from the urgent need for provisions and proposes narrowing the sacrifice to that particular point."},{"id":"SAO-006","locator":"VI.4 p.128","speaker":"an unnamed soldier","audience":"the army","occasion":"discussion of why departure victims remain adverse","content":"Reports hearing that Cleander, governor at Byzantium, intends to come with ships and warships."},{"id":"SAO-007","locator":"VI.4 p.128","speaker":"soldiers collectively","audience":"the generals and Xenophon","occasion":"proposal to move baggage into the strong place before a battle-ready sortie","content":"Reject moving inside the place and demand that sacrifice proceed rapidly."},{"id":"SAO-008","locator":"VI.4 p.128","speaker":"Neon through a herald","audience":"any soldiers willing to forage","occasion":"continued hunger after adverse sacrifices","content":"Offers to lead volunteers to nearby villages for provisions."},{"id":"SAO-009","locator":"VI.4 p.128","speaker":"an unnamed Heracleot guide","audience":"Neon","occasion":"planning the provisioning expedition","content":"Claims to know nearby villages from which provisions can be obtained."},{"id":"SAO-010","locator":"VI.4 p.129","speaker":"one escaped soldier","audience":"the main camp and its commanders","occasion":"after Pharnabazus's cavalry attacks Neon's dispersed foragers","content":"Reports the catastrophe, prompting Xenophon's sacrificial preparation and rescue march."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","actor":"the reunited army","deed":"Bivouacs on the beach rather than within the naturally strong, city-capable site.","outcome":"The spatial choice expresses aversion to appearing settled at Calpe."},{"id":"SDO-002","actor":"Xenophon and the army","deed":"Sacrifice favorably for an expedition, recover and bury identifiable dead, and erect a great cenotaph for those not found.","outcome":"The defeated Arcadian expedition is incorporated into common burial and memorial practice."},{"id":"SDO-003","actor":"Agasias, Hieronymus, senior Arcadians, and the assembly","deed":"Convene a general meeting, criminalize renewed division, and restore former command.","outcome":"The fraternal reunion of VI.3 becomes a formal constitutional reunification."},{"id":"SDO-004","actor":"Xenophon and the generals","deed":"Propose immediate overland departure and sacrifice for it.","outcome":"The victims are unfavorable, and the army waits despite depleted provisions."},{"id":"SDO-005","actor":"Xenophon","deed":"Answers suspicion by opening sacrifice to public attendance and expert inspection.","outcome":"Repeated sacrifices remain unfavorable, so transparency does not produce favorable authorization."},{"id":"SDO-006","actor":"Xenophon, Cleanor, and the army","deed":"Narrow the sacrificial question to provisioning, repeat sacrifice, use oxen when sheep are exhausted, and place inspection under another Arcadian.","outcome":"The victims remain adverse and Xenophon refuses to lead the sortie."},{"id":"SDO-007","actor":"Neon and about two thousand volunteers","deed":"Follow a Heracleot guide toward villages and scatter to forage.","outcome":"Pharnabazus's cavalry and the Bithynians attack; at least five hundred are killed and the rest flee uphill."},{"id":"SDO-008","actor":"Xenophon and all available men under thirty","deed":"Sacrifice a wagon bullock and march to rescue the defeated foragers.","outcome":"They recover the surviving remnant and return near sunset."},{"id":"SDO-009","actor":"a Bithynian raiding party","deed":"Moves through dense brush, strikes the pickets, kills some, and chases others into camp.","outcome":"The whole camp arms amid screams and shouting."},{"id":"SDO-010","actor":"the Greek commanders and soldiers","deed":"Decline unsafe night pursuit or relocation, strengthen outposts, and maintain an armed watch.","outcome":"The chapter closes in defensive readiness rather than departure, provisioning, or victory."}],"sequence_repetition_omission_and_contradiction":{"sequence":["beach bivouac at Calpe","topographical and economic description of the haven","soldier aversion to a city-capable encampment","favorable sacrifice for burial expedition","burial of recoverable dead and cenotaph for the missing","general assembly and prohibition of future division","restoration of former generals","notice of Cheirisophus's death and Neon's succession","Xenophon's overland-departure speech","unfavorable sacrifice and delay","colonization accusation","public and expert inspection","repeated adverse departure sacrifices","narrowing sacrifice to provisioning","continued adverse results and refusal to lead","Neon's volunteer expedition","forager dispersal and cavalry attack","minimum five hundred killed","Xenophon's sacrificial rescue","survivor recovery","Bithynian night attack","reinforced outposts and all-night armed watch"],"repetitions":["Calpe again joins natural security with fear of permanent settlement.","Division and dispersal again turn a provisioning effort into military disaster.","Sacrifice repeatedly structures action and restraint without transparent causation.","Public assembly again converts danger into constitutional decision.","Xenophon again rescues men after another commander's failure."],"omissions":["No direct speech by the seer Arexion is quoted.","No independent narrator judgment confirms or refutes the colonization accusation.","The exact sacrificial signs are not described.","The Heracleot guide is unnamed and his reliability is not assessed.","The identity and losses of the attacking cavalry are unstated.","No formal inquiry into Neon's responsibility occurs within VI.4."],"tensions":["A site fit for ten thousand inhabitants is treated as politically dangerous because it resembles a city.","Unified command is restored just before a subordinate general undertakes a separate expedition.","Extreme hunger presses for action while adverse sacrifices restrain it.","Transparency of sacrifice answers procedural suspicion but does not settle substantive interpretation.","Xenophon refuses unauthorized action yet acts after a new sacrifice to rescue those endangered by it.","The army's stronghold is both rejected in deliberation and required as defensive refuge by the next day's danger."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis VI.4; PDF pp.127-129","evidence_type":"BOOK_SIX_VI4_BOUNDARY_OBSERVATION","observation":"VI.4 begins beneath heading IV on PDF page 127 and ends immediately before heading V on page 129; VI.5 begins on page 129."},{"id":"OBS-002","locator":"VI.4 p.127","evidence_type":"CALPE_BEACH_BIVOUAC_OBSERVATION","observation":"During the day of reunion the army bivouacs on the beach at Calpe Haven."},{"id":"OBS-003","locator":"VI.4 p.127","evidence_type":"ASIATIC_THRACE_ROUTE_OBSERVATION","observation":"The narrator places Calpe in Asiatic Thrace between the mouth of the Euxine and Heraclea."},{"id":"OBS-004","locator":"VI.4 p.127","evidence_type":"NO_FRIENDLY_CITY_BITHYNIAN_REPUTATION_OBSERVATION","observation":"Between Byzantium and Heraclea the route has no Hellenic or friendly city, and the Bithynian Thracians are reported to treat shipwrecked or captured Hellenes savagely."},{"id":"OBS-005","locator":"VI.4 p.127","evidence_type":"CALPE_MIDPOINT_HAVEN_OBSERVATION","observation":"Calpe Haven lies exactly midway on the voyage between Byzantium and Heraclea."},{"id":"OBS-006","locator":"VI.4 p.127","evidence_type":"PROMONTORY_PRECIPICE_OBSERVATION","observation":"The haven is a long promontory whose seaward face is a rocky precipice nowhere less than twenty fathoms high."},{"id":"OBS-007","locator":"VI.4 p.127","evidence_type":"NARROW_NECK_TEN_THOUSAND_CAPACITY_OBSERVATION","observation":"A landward neck about four hundred feet wide encloses space capable of accommodating ten thousand inhabitants."},{"id":"OBS-008","locator":"VI.4 p.127","evidence_type":"WEST_FACING_BEACH_HARBOUR_OBSERVATION","observation":"A haven lies immediately below the crag with a beach facing west."},{"id":"OBS-009","locator":"VI.4 p.127","evidence_type":"FRESHWATER_SPRING_OBSERVATION","observation":"A copious spring of fresh water flows at the sea margin under command of the stronghold."},{"id":"OBS-010","locator":"VI.4 p.127","evidence_type":"SHIPBUILDING_TIMBER_OBSERVATION","observation":"Wood is plentiful, including fine shipbuilding timber reaching to the edge of the sea."},{"id":"OBS-011","locator":"VI.4 p.127","evidence_type":"FERTILE_UPLAND_OBSERVATION","observation":"The upland extends at least twenty furlongs inland and consists of good loamy soil free from stones, with timber farther along the coast."},{"id":"OBS-012","locator":"VI.4 p.127","evidence_type":"CITY_AVERSION_TENT_PLACEMENT_OBSERVATION","observation":"The tents are pitched on the seaward beach because the soldiers are averse to camping on ground easily convertible into a city."},{"id":"OBS-013","locator":"VI.4 p.127","evidence_type":"SOLDIER_EXPEDITION_MOTIVES_OBSERVATION","observation":"The narrator distinguishes soldiers attracted by Cyrus's reputation, men who spent money or brought followers, fugitives from parents, and fathers hoping to return to children with gains."},{"id":"OBS-014","locator":"VI.4 p.127","evidence_type":"HELLAS_RETURN_LONGING_OBSERVATION","observation":"The described soldiers share a governing desire to reach Hellas safely rather than settle at Calpe."},{"id":"OBS-015","locator":"VI.4 pp.127-128","evidence_type":"FAVOURABLE_BURIAL_EXPEDITION_SACRIFICE_OBSERVATION","observation":"On the next day Xenophon sacrifices for a military expedition to seek provisions and bury the dead; the victims are favorable and the army goes out."},{"id":"OBS-016","locator":"VI.4 p.128","evidence_type":"FIVE_DAY_DEAD_GROUP_BURIAL_OBSERVATION","observation":"Most bodies, already lying five days, are buried in groups where they fell because removal is impossible."},{"id":"OBS-017","locator":"VI.4 p.128","evidence_type":"CENOTAPH_MISSING_DEAD_OBSERVATION","observation":"A few bodies off the roads are gathered and buried, while a great wreath-covered cenotaph is erected for those not found."},{"id":"OBS-018","locator":"VI.4 p.128","evidence_type":"ARMY_REUNIFICATION_RESOLUTION_OBSERVATION","observation":"A general meeting resolves that anyone reviving the proposal to break up the army will be punished by death and that the former generals will resume command."},{"id":"OBS-019","locator":"VI.4 p.128","evidence_type":"CHEIRISOPHUS_DEATH_NEON_SUCCESSION_OBSERVATION","observation":"Cheirisophus has died under medical treatment for fever, and Neon the Asinaean has taken his place."},{"id":"OBS-020","locator":"VI.4 p.128","evidence_type":"NO_VESSELS_NO_PROVISIONS_OVERLAND_SPEECH_OBSERVATION","observation":"Xenophon says the journey must proceed on foot because there are no vessels and must begin at once because there are no provisions if they remain."},{"id":"OBS-021","locator":"VI.4 p.128","evidence_type":"DEPARTURE_SACRIFICE_UNFAVOURABLE_OBSERVATION","observation":"The generals sacrifice for departure in the presence of Arexion; the victims are unfavorable and the army waits."},{"id":"OBS-022","locator":"VI.4 p.128","evidence_type":"SILANUS_ESCAPE_OBSERVATION","observation":"Silanus the Ambraciot has chartered a vessel at Heraclea and escaped before these sacrifices."},{"id":"OBS-023","locator":"VI.4 p.128","evidence_type":"COLONISATION_MANIPULATION_ACCUSATION_OBSERVATION","observation":"Certain soldiers accuse Xenophon of desiring to colonize Calpe and persuading the seer to report the departure victims as unfavorable."},{"id":"OBS-024","locator":"VI.4 p.128","evidence_type":"PUBLIC_SEER_INSPECTION_OBSERVATION","observation":"Xenophon answers suspicion by inviting anyone to attend and every seer to help inspect the victims."},{"id":"OBS-025","locator":"VI.4 p.128","evidence_type":"TRIPLE_ADVERSE_DEPARTURE_SACRIFICE_OBSERVATION","observation":"Sacrifice for departure is repeated three times in public and remains persistently unfavorable while provisions approach exhaustion and no market exists."},{"id":"OBS-026","locator":"VI.4 p.128","evidence_type":"NARROWED_PROVISIONING_SACRIFICE_OBSERVATION","observation":"Xenophon narrows the question from general departure to the particular need for provisions, but repeated provisioning sacrifices also remain adverse."},{"id":"OBS-027","locator":"VI.4 p.128","evidence_type":"CLEANOR_SUPERVISION_CONTINUED_ADVERSITY_OBSERVATION","observation":"When sheep are exhausted, oxen are purchased from under a wagon and Xenophon asks Cleanor the Arcadian to supervise the sacrifice on his behalf; the result still does not improve."},{"id":"OBS-028","locator":"VI.4 pp.128-129","evidence_type":"NEON_TWO_THOUSAND_FORAGING_DISASTER_OBSERVATION","observation":"Neon leads about two thousand volunteers toward villages identified by a Heracleot; after they scatter to forage, Pharnabazus's cavalry and the Bithynians attack, killing no fewer than five hundred."},{"id":"OBS-029","locator":"VI.4 p.129","evidence_type":"WAGON_BULLOCK_UNDER_THIRTY_RESCUE_OBSERVATION","observation":"After a survivor reports the disaster, Xenophon sacrifices a wagon bullock for want of other victims and marches with all available men under thirty, recovering the remnant of Neon's party."},{"id":"OBS-030","locator":"VI.4 p.129","evidence_type":"BITHYNIAN_NIGHT_ATTACK_ARMED_WATCH_OBSERVATION","observation":"Near sunset Bithynians move through brush, kill some pickets, and chase others into camp; because night pursuit or movement is unsafe in the thickets, the Greeks strengthen outposts and keep watch under arms all night."}],"provisional_findings":[{"id":"PF-001","finding":"Calpe's natural capacity for security, water, timber, agriculture, harbor, and population does not itself create consent to settlement.","basis":["OBS-005","OBS-007","OBS-009","OBS-010","OBS-011","OBS-012"],"status":"PROVISIONAL"},{"id":"PF-002","finding":"The soldiers' aversion is tied to their varied prior commitments and common desire to return to Hellas, not simply to ignorance of the site's advantages.","basis":["OBS-012","OBS-013","OBS-014"],"status":"PROVISIONAL"},{"id":"PF-003","finding":"Burial and cenotaph convert the losses of a separated faction into a common commemorative obligation after reunion.","basis":["OBS-015","OBS-016","OBS-017"],"status":"PROVISIONAL"},{"id":"PF-004","finding":"The resolution against renewed division formalizes reunification but does not prevent immediate operational divergence under Neon.","basis":["OBS-018","OBS-028"],"status":"PROVISIONAL"},{"id":"PF-005","finding":"Public attendance and expert inspection answer a procedural suspicion about sacrifice without proving the meaning or cause of the sacrificial result.","basis":["OBS-023","OBS-024","OBS-025"],"status":"PROVISIONAL"},{"id":"PF-006","finding":"Sacrificial restraint is strongest here because it persists under hunger and against the commander's apparent interest in immediate action.","basis":["OBS-020","OBS-021","OBS-025","OBS-026","OBS-027"],"status":"PROVISIONAL"},{"id":"PF-007","finding":"Neon's benevolent intention and a local guide's claim do not supply the tactical discipline needed for safe provisioning.","basis":["OBS-028"],"status":"PROVISIONAL"},{"id":"PF-008","finding":"Dispersal for acquisition again creates vulnerability to mobile enemy forces, repeating the structure of VI.3 on a larger scale.","basis":["OBS-028"],"status":"PROVISIONAL"},{"id":"PF-009","finding":"Xenophon's rescue deed is compatible with his prior refusal to lead an unauthorized sortie because he sacrifices anew after the emergency changes.","basis":["OBS-026","OBS-027","OBS-029"],"status":"PROVISIONAL"},{"id":"PF-010","finding":"The chapter closes with restored vigilance rather than with proof that political unity, piety, or prudence has solved the provisioning crisis.","basis":["OBS-030"],"status":"PROVISIONAL"}],"standing_unresolved_questions":[{"id":"UQ-001","question":"Does the unusually full description of Calpe state only strategic facts, or also invite judgment about founding?"},{"id":"UQ-002","question":"Why does the army bivouac on the exposed beach rather than occupy the stronghold immediately?"},{"id":"UQ-003","question":"How should the site’s natural suitability be weighed against the soldiers’ purposes and lack of consent?"},{"id":"UQ-004","question":"Does the common burial fully repair the political breach created by secession?"},{"id":"UQ-005","question":"Who first proposed the capital penalty for renewed division, and why is authorship not specified?"},{"id":"UQ-006","question":"What exactly caused Cheirisophus's death, given the translator's acknowledged ambiguity around medical treatment and poison?"},{"id":"UQ-007","question":"Did Xenophon still desire a colony at Calpe, or does the text preserve only the soldiers' accusation?"},{"id":"UQ-008","question":"What sacrificial features were judged unfavorable, and by whom?"},{"id":"UQ-009","question":"Does public inspection establish sincerity, competence, both, or neither?"},{"id":"UQ-010","question":"Why do sacrifices favorable for burial remain persistently adverse for departure and provisioning?"},{"id":"UQ-011","question":"What authority did Neon possess to organize a separate expedition after unified command was restored?"},{"id":"UQ-012","question":"Was the Heracleot guide mistaken, deceptive, or merely unable to anticipate enemy action?"},{"id":"UQ-013","question":"Why did Neon's force scatter despite the immediately preceding disaster of dispersed troops in VI.3?"},{"id":"UQ-014","question":"Does Xenophon's new sacrifice authorize rescue, or does the emergency itself alter the practical question being asked?"},{"id":"UQ-015","question":"How many Greeks and Bithynians were actually killed beyond the stated minimum and unnamed picket losses?"},{"id":"UQ-016","question":"Will VI.5 convert the defensive fastness, supplies, and later favorable signs into a stable resolution, or only another temporary recovery?"}],"downstream_textual_checks":[{"id":"DTC-001","target":"Anabasis VI.5","check":"Track whether the army finally occupies and fortifies the stronghold it rejected in VI.4."},{"id":"DTC-002","target":"Anabasis VI.5","check":"Track the arrival of provisions and sacrificial animals and whether material change precedes favorable signs."},{"id":"DTC-003","target":"Anabasis VI.5","check":"Compare the first favorable victim and eagle omen with the sustained adverse sacrifices of VI.4."},{"id":"DTC-004","target":"Anabasis VI.5","check":"Determine Neon's later command position after the provisioning disaster."},{"id":"DTC-005","target":"Anabasis VI.5-VI.6","check":"Track whether the colonization rumor gains political or commercial effects without an actual founding."},{"id":"DTC-006","target":"Anabasis VI.5","check":"Test whether restored unified command produces unified battle order and common property rules."},{"id":"DTC-007","target":"Anabasis VI.5","check":"Track Pharnabazus, the Bithynians, and any account of their objectives or withdrawals."},{"id":"DTC-008","target":"Anabasis VI.5-VI.6","check":"Track whether Calpe's harbor, timber, water, and agricultural advantages are used for departure, settlement, or both."},{"id":"DTC-009","target":"Anabasis VI.5-VII","check":"Track later judgments of Xenophon's piety that may bear on the manipulation accusation."},{"id":"DTC-010","target":"Anabasis VI.5-VII","check":"Track whether Neon is disciplined, defended, marginalized, or retained without inquiry."},{"id":"DTC-011","target":"Greek witness when admitted","check":"Verify terms translated as unfavorable victims, colonize, city, stronghold, and medical treatment."},{"id":"DTC-012","target":"Secondary comparison after primary sequence","check":"Compare later interpretation of Calpe, sacrifice, effective monarchy, and founding only after the primary reconstruction is complete."}],"secondary_comparison_status":"DEFERRED","owner_review_required":true,"artificial_intelligence_self_certification_prohibited":true}