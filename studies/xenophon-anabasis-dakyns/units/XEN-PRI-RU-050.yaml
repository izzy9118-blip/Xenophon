{"schema_version":1.0,"unit_id":"XEN-PRI-RU-050","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VII.7","pdf_pages_one_based":"159-164","opening_anchor":"BOOK VII, VII: After this, Seuthes removed his camp to some considerable distance.","closing_anchor":"But the authorities in the camp came to him and begged him not to go away until he had conducted the army to its destination, and handed it over to Thibron."},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170 searchable 168-page PDF","chapter_boundary_control":"Heading VII begins VII.7 on PDF page 159; heading VIII begins VII.8 on page 164. This unit covers pages 159-164 and stops before heading VIII. VII.8 continues from page 164 through the end of the 168-page witness, so the next unit covers pages 164-168.","source_boundary":"Medosades's expulsion demand; benefaction counterclaim; Odrysian shame; Spartan leverage for payment; Xenophon's appeal to Seuthes on truth, reputation, rule, debt, justice, and generosity; mixed-property settlement; distribution; planned homecoming; final request to conduct the army to Thibron."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with extended attributed speeches, recollection of prior deeds, political-economic argument, oath, promise, quantified settlement, narrated distribution, and narrated future intention.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms belong to Xenophon's attributed speeches. The narrator separately reports Medosades's displeasure, the Odrysian's reaction, Seuthes's settlement, soldier suspicions, vendor blame, Xenophon's homeward preparation, and the camp authorities' request.","uncertainty":"The exact valuation of the mixed settlement, the identity of the person Seuthes curses, the truth of each party's financial claims, the justice of conquest and village consumption, the independence of the Odrysian reaction, and the eventual completeness of distribution remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Medosades","audience":"Xenophon and reliable officers","occasion":"warning outside the Hellenic host","content":"Accuses the Greeks of pillaging villages granted to him, orders them out, and threatens retaliation as enemies."},{"id":"SAO-002","speaker":"Xenophon","audience":"Medosades and the accompanying Odrysian","occasion":"reply to expulsion demand","content":"Contrasts prior Greek freedom of movement and conquest with Medosades's new property claim, recalls benefaction, and denies present command authority."},{"id":"SAO-003","speaker":"powerful Odrysian from King Medocus","audience":"Medosades and assembled horsemen","occasion":"after Xenophon's account","content":"Expresses shame, refuses to drive out benefactors, and withdraws with most of the mounted party."},{"id":"SAO-004","speaker":"Xenophon","audience":"Charminus and Polynicus","occasion":"summons by Medosades","content":"Advises them to use the expulsion demand to exact the army's pay and not leave until the soldiers receive their dues."},{"id":"SAO-005","speaker":"Charminus and Polynicus","audience":"Medosades","occasion":"joint confrontation","content":"Say they will depart after payment and threaten punishment of oathbreakers and wrongdoers, beginning with Medosades if implicated."},{"id":"SAO-006","speaker":"Xenophon","audience":"Medosades and local inhabitants","occasion":"proposal after Spartan warning","content":"Offers to let the people of the country decide by ballot whether Medosades or the Greeks should leave."},{"id":"SAO-007","speaker":"Xenophon","audience":"Seuthes","occasion":"formal appeal for settlement","content":"Argues that payment protects Seuthes's reputation, word, rule, income, security, and future access to allies, while restoring Xenophon's standing with the army."},{"id":"SAO-008","speaker":"Seuthes","audience":"Xenophon","occasion":"response to the appeal","content":"Curses the person blamed for delayed payment, promises repayment, renews the fortified-place offer, and urges Xenophon to remain with one thousand heavy infantry."},{"id":"SAO-009","speaker":"Xenophon","audience":"Seuthes","occasion":"terms of payment and renewed retention offer","content":"Asks that payment pass through him, refuses to remain, and warns that an inadequate settlement will expose him again to stoning threats."},{"id":"SAO-010","speaker":"Xenophon and camp authorities","audience":"Charminus, Polynicus, and Xenophon","occasion":"delivery and onward transfer","content":"Xenophon delivers the recovered fraction for official distribution; camp authorities then ask him to remain until he hands the army over to Thibron."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","deed":"Seuthes moves away; the Greeks quarter in provision-rich villages granted to Medosades.","outcome":"The army's subsistence need collides with Seuthes's redistribution of conquered land."},{"id":"SDO-002","deed":"Medosades approaches with an Odrysian and about thirty horsemen to demand evacuation.","outcome":"Xenophon answers before witnesses with a history of Greek conquest and benefaction."},{"id":"SDO-003","deed":"The Odrysian repudiates the expulsion demand and rides away with most of the horsemen.","outcome":"Medosades loses the authority of the visiting royal representative and most of his visible support."},{"id":"SDO-004","deed":"Xenophon summons the Spartan commanders and links evacuation to payment.","outcome":"Charminus and Polynicus adopt the army's wage claim as a condition of departure."},{"id":"SDO-005","deed":"The Spartans threaten to punish oathbreakers; Xenophon proposes a local ballot on who should leave.","outcome":"Medosades declines adjudication and seeks a mission to Seuthes while asking that villages not be burned."},{"id":"SDO-006","deed":"Xenophon argues before Seuthes that truthful payment sustains reputation, authority, security, and future alliances.","outcome":"The debt is reframed as a problem of kingship and regime preservation rather than a private accounting dispute."},{"id":"SDO-007","deed":"Xenophon swears that he accepted nothing privately and would not take his own dues without the soldiers.","outcome":"His standing is tied to collective payment, though the oath does not independently settle motive or truth."},{"id":"SDO-008","deed":"Seuthes promises repayment and again offers fortified places and service with one thousand hoplites.","outcome":"Xenophon refuses the personal settlement and insists on freedom to depart."},{"id":"SDO-009","deed":"Seuthes delivers one talent, six hundred cattle, four thousand sheep, one hundred twenty slaves, hostages, and an escort.","outcome":"A mixed-property fraction is recovered, but its value relative to the full debt remains unstated."},{"id":"SDO-010","deed":"Xenophon transfers the property to the Spartan commanders; official vendors distribute it and incur blame.","outcome":"Xenophon prepares for home, but camp authorities ask him to conduct the army to Thibron."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Seuthes withdraws","Greeks quarter in Medosades's villages","Medosades demands evacuation","Xenophon recalls conquest and benefaction","Odrysian withdraws in shame","Spartans summoned","pay made condition of departure","oathbreaker warning","ballot proposal rejected","Xenophon sent to Seuthes","truth and reputation argument","regime-security argument","nonreceipt oath repeated","valour-justice-generosity standard","Seuthes promises repayment","renewed retention offer refused","mixed settlement delivered","soldiers welcome Xenophon","official vendors appointed","vendor blame","Xenophon prepares for home","camp authorities request continued leadership"],"repetitions":["Public witnesses are used against private accusation and exclusion.","Payment remains the condition for legitimate separation.","Xenophon subordinates private promises to collective wages.","Seuthes's power is represented as produced by Greek force but endangered by Greek mistrust.","The transfer of property creates new intermediaries and new blame."],"omissions":["No independent valuation of the settlement is supplied.","The person cursed by Seuthes is not named.","No complete accounting of the original debt is given.","The local inhabitants never conduct the proposed ballot.","The official vendors' identities and exact errors are not stated."],"tensions":["Medosades's granted property versus the army's subsistence and unpaid claim.","Conquest as benefaction versus violence against subject communities.","Seuthes's sovereignty versus dependence on those who established it.","Truthful word as political power versus coercive force.","Personal reward versus collective payment.","Recovered fraction versus full contractual satisfaction."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"BOOK_SEVEN_VII7_BOUNDARY_OBSERVATION","observation":"Heading VII begins VII.7 on PDF page 159; heading VIII begins VII.8 on page 164."},{"id":"OBS-002","evidence_type":"SEUTHES_DISTANCE_HELLENIC_VILLAGES_OBSERVATION","observation":"Seuthes removes his camp to a considerable distance while the Hellenes choose villages on the road to the sea where commissariat is easiest."},{"id":"OBS-003","evidence_type":"MEDOSADES_GRANTED_VILLAGES_PROPERTY_OBSERVATION","observation":"The selected villages have been given by Seuthes to Medosades, who sees his property being consumed."},{"id":"OBS-004","evidence_type":"ODRYSIAN_THIRTY_HORSEMEN_CHALLENGE_OBSERVATION","observation":"Medosades brings a powerful Odrysian from the interior and about thirty mounted troopers and challenges Xenophon to come out."},{"id":"OBS-005","evidence_type":"RELIABLE_OFFICERS_WITNESSES_OBSERVATION","observation":"Xenophon comes forward with officers and others whose character can be relied upon."},{"id":"OBS-006","evidence_type":"PILLAGE_EVACUATION_ENEMY_THREAT_OBSERVATION","observation":"Medosades accuses the Greeks of pillaging the villages, orders them out, and threatens retaliation as foes."},{"id":"OBS-007","evidence_type":"PREALLIANCE_FREE_RUN_PILLAGE_BURN_OBSERVATION","observation":"Xenophon says that before friendship the Greeks moved freely through the country, pillaging and burning as they chose."},{"id":"OBS-008","evidence_type":"MEDOSADES_EMBASSY_SAFE_CAMP_OBSERVATION","observation":"He recalls that Medosades camped safely with the Greeks whenever he came on embassy."},{"id":"OBS-009","evidence_type":"GREEK_CONQUEST_DIVINE_HELP_GIFT_OBSERVATION","observation":"Xenophon says the Greeks, by God's help, won the country by their strength and gave it to Seuthes and his associates."},{"id":"OBS-010","evidence_type":"EXPECTED_GIFT_BACKS_TURNED_EXPULSION_OBSERVATION","observation":"He contrasts the gift expected for benefaction with an attempt to hurry the army away even while its back is turned to depart."},{"id":"OBS-011","evidence_type":"XENOPHON_NO_LONGER_COMMAND_SPARTANS_OBSERVATION","observation":"Xenophon says he is no longer in command and identifies the Lacedaemonians as the generals to whom Seuthes delivered the army."},{"id":"OBS-012","evidence_type":"ODRYSIAN_SHAME_BENEFACTOR_WITHDRAWAL_OBSERVATION","observation":"The Odrysian says he sinks under the earth for shame and will not drive forth King Medocus's benefactors."},{"id":"OBS-013","evidence_type":"HORSEMEN_DEPART_FOUR_FIVE_REMAIN_OBSERVATION","observation":"The Odrysian rides away with the mounted party, leaving only four or five horsemen with Medosades."},{"id":"OBS-014","evidence_type":"SPARTAN_SUMMONS_PAY_RECOVERY_OBSERVATION","observation":"Xenophon tells Charminus and Polynicus that Medosades's summons gives them an opportunity to recover the army's pay."},{"id":"OBS-015","evidence_type":"NO_DEPARTURE_UNTIL_DUES_OBSERVATION","observation":"The Spartans accept the argument that they promised not to leave until the soldiers received their dues."},{"id":"OBS-016","evidence_type":"MEDOSADES_FRIENDS_INJURY_CLAIM_OBSERVATION","observation":"Medosades says people who have become Seuthes's friends should not be harmed because injury to them is injury to Seuthes."},{"id":"OBS-017","evidence_type":"OATHBREAKER_PUNISHMENT_WARNING_OBSERVATION","observation":"Charminus and Polynicus answer that they will leave after payment and otherwise punish those who broke oaths and did wrong."},{"id":"OBS-018","evidence_type":"LOCAL_BALLOT_WHO_LEAVES_OBSERVATION","observation":"Xenophon proposes that the people of the country decide by ballot whether Medosades or the Greeks should leave."},{"id":"OBS-019","evidence_type":"MEDOSADES_REJECTS_BALLOT_NO_BURNING_OBSERVATION","observation":"Medosades rejects the ballot, seeks an embassy to Seuthes about pay, and begs that the villages not be burned."},{"id":"OBS-020","evidence_type":"SERVICEABLE_STAFF_SEUTHES_EMBASSY_OBSERVATION","observation":"The Spartans send Xenophon to Seuthes with a serviceable staff."},{"id":"OBS-021","evidence_type":"PAYMENT_SEUTHES_INTEREST_BENEFACTOR_OBSERVATION","observation":"Xenophon argues that delivering the promised pay serves Seuthes's interest and prevents ungrateful separation from benefactors."},{"id":"OBS-022","evidence_type":"SIX_THOUSAND_REPUTATION_WORD_POWER_OBSERVATION","observation":"He says good report from six thousand men matters and that a trustworthy word can achieve what another man achieves by force."},{"id":"OBS-023","evidence_type":"THIRTY_TALENTS_CREDIT_KINGDOM_OBSERVATION","observation":"Xenophon says confidence in Seuthes's word acquired an empire worth many times the thirty talents now claimed."},{"id":"OBS-024","evidence_type":"FORCED_SUBJECTS_LIBERTY_PROTECTORS_OBSERVATION","observation":"He says the new subjects yielded by force, desire liberty, and may seek Greek or Lacedaemonian protectors if the soldiers remain wronged."},{"id":"OBS-025","evidence_type":"PAY_DEBT_VERSUS_NEW_ARMY_COST_OBSERVATION","observation":"Xenophon contrasts paying the existing debt with the greater cost of recruiting a new and better army to expel unpaid troops."},{"id":"OBS-026","evidence_type":"YEARLY_INCOME_CAPACITY_OBSERVATION","observation":"He argues that Seuthes's yearly income now exceeds all the property he possessed before the campaign."},{"id":"OBS-027","evidence_type":"NO_PRIVATE_GAIN_COLLECTIVE_PAYMENT_OATH_OBSERVATION","observation":"Xenophon calls Seuthes and the gods to witness that he took nothing privately and would not accept his own dues unless the soldiers also received theirs."},{"id":"OBS-028","evidence_type":"VALOUR_JUSTICE_GENEROSITY_PRINCE_OBSERVATION","observation":"He names valour, justice, and generosity as the fairest threefold grace for a prince and the source of friends in prosperity and adversity."},{"id":"OBS-029","evidence_type":"SEUTHES_REPAYMENT_RETENTION_MIXED_SETTLEMENT_OBSERVATION","observation":"Seuthes promises repayment, renews the offer of fortified places and service, then offers one talent, six hundred cattle, four thousand sheep, one hundred twenty slaves, and hostages."},{"id":"OBS-030","evidence_type":"FRACTION_DISTRIBUTION_VENDOR_BLAME_THIBRON_OBSERVATION","observation":"The settlement is delivered as a fraction through Xenophon to Charminus and Polynicus; official vendors incur blame, Xenophon prepares for home, and camp authorities ask him to conduct the army to Thibron."}],"provisional_findings":[{"id":"PF-001","finding":"Seuthes's grant of villages to Medosades does not extinguish the army's prior wage claim or immediate subsistence problem."},{"id":"PF-002","finding":"Xenophon's reply converts a property dispute into a public history of conquest, benefaction, and attempted ingratitude."},{"id":"PF-003","finding":"The Odrysian's withdrawal deprives Medosades of external royal endorsement but does not independently prove every Greek claim."},{"id":"PF-004","finding":"The Spartan transfer of command becomes leverage for debt enforcement because departure is made conditional on payment."},{"id":"PF-005","finding":"Xenophon presents truthful speech as a form of political power capable of substituting for force and preserving future alliances."},{"id":"PF-006","finding":"The unpaid debt threatens Seuthes's regime because coerced subjects may align with wronged Greek or Spartan protectors."},{"id":"PF-007","finding":"Xenophon's repeated refusal of private settlement ties his reputation to collective payment without certifying complete purity of motive."},{"id":"PF-008","finding":"Seuthes acknowledges an obligation and supplies mixed assets, but the chapter calls the recovery only a fraction and supplies no audited valuation."},{"id":"PF-009","finding":"Official distribution transfers accountability from Xenophon to appointed vendors, who then become objects of blame."},{"id":"PF-010","finding":"Xenophon prepares to leave but remains institutionally necessary for the army's orderly transfer to Thibron."}],"standing_unresolved_questions":[{"id":"UQ-001","question":"What was the exact legal or customary status of Seuthes's grant of the villages to Medosades?"},{"id":"UQ-002","question":"How much property did the Greeks consume while quartered there?"},{"id":"UQ-003","question":"Was Medosades authorized to threaten war independently of Seuthes?"},{"id":"UQ-004","question":"How independent was the powerful Odrysian's reaction from Xenophon's rhetoric?"},{"id":"UQ-005","question":"Would the local inhabitants have preferred the Greeks or Medosades to leave?"},{"id":"UQ-006","question":"What exact oath or oaths had Seuthes and his agents broken?"},{"id":"UQ-007","question":"What was the total wage debt when Xenophon addressed Seuthes?"},{"id":"UQ-008","question":"Why does Xenophon describe thirty talents as the amount claimed here?"},{"id":"UQ-009","question":"Who is the person Seuthes curses for delaying payment?"},{"id":"UQ-010","question":"Did Seuthes possess one talent in silver before the appeal or obtain it afterward?"},{"id":"UQ-011","question":"What market values should be assigned to the cattle, sheep, slaves, and hostages?"},{"id":"UQ-012","question":"Did the mixed settlement equal the full contractual debt or only a fraction?"},{"id":"UQ-013","question":"What became of the hostages who had wronged the Greeks?"},{"id":"UQ-014","question":"Why did the official vendors incur considerable blame?"},{"id":"UQ-015","question":"How much did individual soldiers ultimately receive from the distribution?"},{"id":"UQ-016","question":"Why did the camp authorities still require Xenophon rather than the Spartan commanders alone to complete the transfer?"}],"downstream_textual_checks":[{"id":"TC-001","check":"Compare the settlement's value with all earlier statements of promised pay and arrears."},{"id":"TC-002","check":"Track Medosades's earlier promises and later property claims across Book VII."},{"id":"TC-003","check":"Compare Xenophon's truth-and-force argument with other speeches on trust and command."},{"id":"TC-004","check":"Track all uses of benefaction, gratitude, and ingratitude in the Anabasis."},{"id":"TC-005","check":"Compare forced subjection and desire for liberty with earlier conquered communities."},{"id":"TC-006","check":"Check whether later evidence clarifies who delayed payment and whether Heracleides was responsible."},{"id":"TC-007","check":"Trace Xenophon's refusals of private gifts against later evidence about his wealth."},{"id":"TC-008","check":"Compare valour, justice, and generosity with other enumerations of princely or commanderly virtues."},{"id":"TC-009","check":"Track official vendors, treasurers, and distribution failures elsewhere in the work."},{"id":"TC-010","check":"Compare the soldiers' welcome of Xenophon with the preceding stoning threat."},{"id":"TC-011","check":"Check VII.8 for evidence bearing on Xenophon's poverty, homeward intention, and motives."},{"id":"TC-012","check":"Revisit all translated political and financial terms against a reviewed Greek witness when one is admitted."}],"secondary_comparison_status":"DEFERRED"}