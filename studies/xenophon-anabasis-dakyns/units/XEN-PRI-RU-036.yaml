{"schema_version":1.0,"unit_id":"XEN-PRI-RU-036","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis V.7","pdf_pages_one_based":"111-115","opening_anchor":"Presently the soldiers came to learn what was in course of agitation...","closing_anchor":"...it was resolved to purify the army, and this purification was made."},"jurisdiction":"Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no deed corpus, speech register, guard, adapter, ministerial capacity, Sanctum registration, final certification, or AI certification is authorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170, searchable 168-page PDF","locator_rule":"Anabasis V.7 plus one-based PDF page","chapter_boundary_control":"V.7 begins beneath heading VII on PDF page 111 and continues through the opening lines of page 115, ending before heading VIII. The earlier projected range 111-114 is corrected to 111-115 after visual inspection. V.8 begins beneath heading VIII on page 115 and ends before BOOK VI on page 117. Notes on the Boreas saying and dicasts are witness paratext.","source_boundary":"Separate accusation, defensive speech, retrospective reports, crowd violence, constitutional diagnosis, resolutions, ritual purification, and editorial notes."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration framing an extended first-person speech attributed to Xenophon.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"extended_first_person_speech_present":true,"observation":"First-person forms, including 'we generals' and the account of the Cerasus disturbances, occur inside Xenophon's attributed assembly speech rather than as unframed narrator identification.","uncertainty":"The evidentiary basis for Xenophon's detailed retrospective account and narrator-author identity remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"V.7 p.111","speaker":"Neon","audience":"soldiers","occasion":"circulation of the Phasis accusation","content":"Claims Xenophon persuaded the generals and intends to deceive the army back to Phasis."},{"id":"SAO-002","locator":"V.7 pp.111-112","speaker":"Xenophon","audience":"urgent assembly","occasion":"defense against the accusation","content":"Submits himself and accusers to judgment and argues that geography, winds, separate ships, and the army's weapons make secret abduction impossible."},{"id":"SAO-003","locator":"V.7 p.112","speaker":"Xenophon","audience":"assembly","occasion":"leadership challenge","content":"Attributes the accusation to jealousy and offers to yield command to anyone who proves concern for the army."},{"id":"SAO-004","locator":"V.7 pp.112-114","speaker":"Xenophon","audience":"assembly","occasion":"lawlessness indictment","content":"Recounts Clearetus's unauthorized raid, the stoning of three elderly ambassadors, the market-clerk riot, drowning, and the consequences of private violence."},{"id":"SAO-005","locator":"V.7 p.113","speaker":"three elderly inhabitants, as reported through Cerasuntines","audience":"Cerasuntines and intended Greek assembly","occasion":"embassy after the unauthorized raid","content":"Protest the attack and offer recovery and burial of Greek dead after being told the raid lacked public authorization."},{"id":"SAO-006","locator":"V.7 pp.114-115","speaker":"assembly through resolution","audience":"army and generals","occasion":"institutional response","content":"Orders punishment, capital prosecution of ringleaders, broader judicial review, an officer court, and ritual purification."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","locator":"V.7 p.111","actor":"Neon and soldiers","deed":"Neon circulates the accusation; soldiers gather indignantly in ominous groups.","outcome":"Xenophon anticipates spontaneous violence with a heralded assembly."},{"id":"SDO-002","locator":"V.7 pp.111-112","actor":"Xenophon","deed":"Defends himself by appeal to judgment, direction, winds, fleet dispersion, and numerical force.","outcome":"The assembly listens and asks him to explain the greater danger he sees."},{"id":"SDO-003","locator":"V.7 p.113","actor":"Clearetus and recruited followers","deed":"Undertake an unauthorized night raid on a small friendly settlement with plans to plunder and leave by ship.","outcome":"Dawn exposes them; Clearetus and many followers are killed."},{"id":"SDO-004","locator":"V.7 p.113","actor":"three elderly ambassadors and escaped Greeks at Cerasus","deed":"The ambassadors seek the assembly and offer burial; escaped Greeks instigate stoning.","outcome":"All three ambassadors are killed."},{"id":"SDO-005","locator":"V.7 pp.113-114","actor":"stone-carrying crowd, Zelarchus, Cerasuntines, and some Greeks","deed":"A cry against market clerks produces a rush toward Zelarchus and the sea.","outcome":"Zelarchus escapes; terrified people jump into the sea and nonswimmers drown."},{"id":"SDO-006","locator":"V.7 p.114","actor":"Xenophon","deed":"Argues that private expeditions, envoy killing, self-appointed commanders, and punishment without trial destroy collective authority.","outcome":"The army's peace, war, market, diplomacy, sacrifice, and reputation are presented as endangered."},{"id":"SDO-007","locator":"V.7 pp.114-115","actor":"assembly","deed":"Resolves to punish ringleaders, forbid future lawlessness, and prosecute offenses since Cyrus's death.","outcome":"The generals receive prosecutorial duty and officers become dicasts."},{"id":"SDO-008","locator":"V.7 p.115","actor":"Xenophon, soothsayers, and army","deed":"Propose, concur in, and perform ritual purification.","outcome":"Judicial reconstruction is joined to religious cleansing."},{"id":"SDO-009","locator":"V.7 pp.111-115","actor":"narrative and speech structure","deed":"A personal accusation is redirected into a public inquiry into lawlessness.","outcome":"The threatened crowd is reconstituted as an assembly adopting judicial institutions."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Phasis accusation","ominous informal gatherings","officially summoned assembly","Xenophon's personal defense","geographic and nautical refutation","leadership challenge","warning of broader danger","Clearetus raid account","ambassadors stoned","market riot and drownings","constitutional diagnosis","punitive resolutions","officer court","ritual purification"],"repetitions":["Private plunder again threatens collective safety.","Heralds, ambassadors, markets, and friendly cities remain necessary for survival.","Speech and assembly are used to convert fear into common decision.","Religious signs and ritual continue to accompany political judgment."],"omissions":["Neon's exact evidence and wording beyond the reported accusation are not supplied.","The attacked settlement and its dead remain unnamed.","The three ambassadors do not speak directly in the witness.","Zelarchus's alleged misconduct is never established.","No names or outcomes of the capital prosecutions are supplied within V.7."],"tensions":["Xenophon seeks judgment for himself while recounting others' offenses through a speech he controls.","The army condemns private violence after having enforced collective unity through threats against Silanus in V.6.","The new court is composed of officers whose authority the crowd had endangered.","Judicial prosecution and ritual purification address the same crisis through distinct forms of authority."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis V.7; PDF p.111","evidence_type":"CORRECTED_CHAPTER_BOUNDARY_OBSERVATION","observation":"V.7 begins under heading VII on page 111 and continues onto page 115 before heading VIII; the earlier 111-114 range is corrected to 111-115."},{"id":"OBS-002","locator":"Anabasis V.7; PDF p.111","evidence_type":"RUMOR_ATTRIBUTION_OBSERVATION","observation":"Neon says Xenophon persuaded the other generals and plans to cheat the soldiers back to Phasis."},{"id":"OBS-003","locator":"Anabasis V.7; PDF p.111","evidence_type":"OMINOUS_GROUP_FORMATION_OBSERVATION","observation":"Highly indignant soldiers form meetings and small ominous groups outside an officially summoned assembly."},{"id":"OBS-004","locator":"Anabasis V.7; PDF p.111","evidence_type":"PRIOR_MOB_VIOLENCE_REFERENCE_OBSERVATION","observation":"The narrative anticipates repetition of violence against Colchian heralds and market clerks, including stoning of those who did not escape into the sea."},{"id":"OBS-005","locator":"Anabasis V.7; PDF p.111","evidence_type":"PREEMPTIVE_ASSEMBLY_OBSERVATION","observation":"Xenophon uses the herald to summon an immediate assembly and prevent autonomous crowd collection."},{"id":"OBS-006","locator":"Anabasis V.7; PDF pp.111-112","evidence_type":"RECIPROCAL_JUDGMENT_OFFER_OBSERVATION","observation":"Xenophon submits himself to punishment if guilty and asks equivalent treatment of false accusers."},{"id":"OBS-007","locator":"Anabasis V.7; PDF p.112","evidence_type":"GEOGRAPHIC_REFUTATION_OBSERVATION","observation":"He contrasts sunsetward Hellas with dawnward Phasis to argue that destination deception would be observable."},{"id":"OBS-008","locator":"Anabasis V.7; PDF p.112","evidence_type":"WIND_AND_NAVIGATION_REFUTATION_OBSERVATION","observation":"He contrasts Boreas carrying ships toward Hellas with a south wind carrying them toward Phasis."},{"id":"OBS-009","locator":"Anabasis V.7; PDF p.112","evidence_type":"POETIC_SAYING_PARATEXT_OBSERVATION","observation":"A north-wind saying is quoted in the speech; the note questions whether it is a local saying or proverb and remains paratext."},{"id":"OBS-010","locator":"Anabasis V.7; PDF p.112","evidence_type":"DISTRIBUTED_FLEET_ARGUMENT_OBSERVATION","observation":"Xenophon contrasts his single ship with at least one hundred others to deny capacity for secret coercion."},{"id":"OBS-011","locator":"Anabasis V.7; PDF p.112","evidence_type":"ARMED_NUMERICAL_DETERRENCE_OBSERVATION","observation":"He invokes roughly ten thousand armed soldiers as a deterrent against one deceiver after disembarkation."},{"id":"OBS-012","locator":"Anabasis V.7; PDF p.112","evidence_type":"JEALOUSY_AND_COMMAND_CHALLENGE_OBSERVATION","observation":"Xenophon attributes the accusation to jealousy and offers command to a rival who proves concern for the army."},{"id":"OBS-013","locator":"Anabasis V.7; PDF p.113","evidence_type":"UNAUTHORIZED_FRIENDLY_SETTLEMENT_RAID_OBSERVATION","observation":"Clearetus secretly organizes a night assault on a small unguarded settlement described as friendly to the Cerasuntines."},{"id":"OBS-014","locator":"Anabasis V.7; PDF p.113","evidence_type":"PLUNDER_AND_PRIVATE_DEPARTURE_PLAN_OBSERVATION","observation":"The reported plan is to sack the place, load seized goods aboard a waiting vessel, abandon the army, and sail beyond the Euxine."},{"id":"OBS-015","locator":"Anabasis V.7; PDF p.113","evidence_type":"RAID_FAILURE_AND_DEATH_OBSERVATION","observation":"Dawn overtakes the raiders; defenders kill Clearetus and many others, while only a few return to Cerasus."},{"id":"OBS-016","locator":"Anabasis V.7; PDF p.113","evidence_type":"ELDERLY_AMBASSADOR_OBSERVATION","observation":"Three elderly inhabitants of the attacked settlement seek the Greek assembly after Cerasuntines say the raid lacked public consent."},{"id":"OBS-017","locator":"Anabasis V.7; PDF p.113","evidence_type":"BURIAL_OFFER_OBSERVATION","observation":"The ambassadors reportedly offer those concerned permission or assistance to recover and bury the slain Greeks."},{"id":"OBS-018","locator":"Anabasis V.7; PDF p.113","evidence_type":"AMBASSADOR_STONING_OBSERVATION","observation":"Escaped participants and their neighbors stone the three ambassadors to death."},{"id":"OBS-019","locator":"Anabasis V.7; PDF p.113","evidence_type":"MOB_INFORMATION_FAILURE_OBSERVATION","observation":"During a later rush with stones, some participants do not know the cause and merely follow others."},{"id":"OBS-020","locator":"Anabasis V.7; PDF pp.113-114","evidence_type":"MARKET_CLERK_PURSUIT_OBSERVATION","observation":"A cry against the market clerks focuses the crowd on Zelarchus, who escapes toward the sea; his guilt remains unresolved."},{"id":"OBS-021","locator":"Anabasis V.7; PDF p.114","evidence_type":"PANIC_DROWNING_OBSERVATION","observation":"Cerasuntines and some Greeks leap into the sea from fear; those unable to swim drown."},{"id":"OBS-022","locator":"Anabasis V.7; PDF p.114","evidence_type":"COLLECTIVE_AUTHORITY_DIAGNOSIS_OBSERVATION","observation":"Xenophon argues that private expeditions and self-appointed commanders deprive the army as a body of control over war, peace, and command."},{"id":"OBS-023","locator":"Anabasis V.7; PDF p.114","evidence_type":"NO_TRIAL_ALTERNATIVES_OBSERVATION","observation":"Zelarchus may be guilty or innocent, but flight leaves either guilt unpunished or innocence terrorized without trial."},{"id":"OBS-024","locator":"Anabasis V.7; PDF p.114","evidence_type":"DIPLOMATIC_ACCESS_LOSS_OBSERVATION","observation":"The ambassador killings make Cerasus unsafe, obstruct corpse recovery even under truce, and contaminate heraldic protection."},{"id":"OBS-025","locator":"Anabasis V.7; PDF p.114","evidence_type":"RELIGIOUS_MARKET_REPUTATION_ARGUMENT_OBSERVATION","observation":"Lawlessness is said to imperil willing sacrifice, battlefield unity, reception by friendly cities, market access, and public praise."},{"id":"OBS-026","locator":"Anabasis V.7; PDF pp.114-115","evidence_type":"CAPITAL_PROSECUTION_RESOLUTION_OBSERVATION","observation":"The assembly resolves that ringleaders be punished and prosecuted on a capital charge and that generals bring offenders to justice."},{"id":"OBS-027","locator":"Anabasis V.7; PDF p.115","evidence_type":"RETROSPECTIVE_MISDEMEANOR_REVIEW_OBSERVATION","observation":"The resolution extends prosecution to other alleged misdemeanors committed since Cyrus's death."},{"id":"OBS-028","locator":"Anabasis V.7; PDF p.115","evidence_type":"OFFICER_DICAST_BOARD_OBSERVATION","observation":"The officers are constituted as a board of dicasts; the explanatory note equating dicasts with judges or jurors is paratext."},{"id":"OBS-029","locator":"Anabasis V.7; PDF p.115","evidence_type":"RITUAL_PURIFICATION_OBSERVATION","observation":"On Xenophon's strong representation and with soothsayer concurrence, the army resolves upon and performs purification."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"The chapter converts a crisis of trust in one leader into an inquiry about the army's capacity for collective rule."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"Official assembly and heraldic procedure function as an alternative to rumor-driven group formation."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"Xenophon's geographic defense relies less on personal credibility than on the soldiers' independent ability to verify direction and resist coercion."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"Clearetus's raid presents private plunder and private exit as a single threat to the common army."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"The killing of ambassadors destroys not only lives but the communicative institutions required for burial, truce, markets, and peace."},{"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"The speech defines lawlessness as the substitution of acclamation and followership for trial and elected command."},{"id":"FIND-007","evidence_type":"PROVISIONAL_INFERENCE","finding":"The resolutions attempt to reconstitute the army through prosecution, a court, and retrospective accountability."},{"id":"FIND-008","evidence_type":"PROVISIONAL_INFERENCE","finding":"Ritual purification supplements rather than replaces judicial measures."},{"id":"FIND-009","evidence_type":"PROVISIONAL_INFERENCE","finding":"Because the account of prior disorders is embedded in Xenophon's defense, its factual and rhetorical functions must remain analytically distinct."}],"standing_unresolved_questions":[{"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"What evidence did Neon possess or claim for the Phasis accusation?"},{"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"Was the Boreas line a proverb, local saying, verse quotation, or translator-mediated formulation?"},{"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"What Greek terms structure Xenophon's distinction between official assembly and informal gatherings?"},{"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"How did Xenophon obtain the detailed account of Clearetus's private agreement and intended desertion?"},{"id":"Q-005","evidence_type":"UNRESOLVED_QUESTION","question":"What settlement did Clearetus attack, and what were its relations with Cerasus and the Greeks?"},{"id":"Q-006","evidence_type":"UNRESOLVED_QUESTION","question":"How many Greeks and local inhabitants died in the unauthorized raid?"},{"id":"Q-007","evidence_type":"UNRESOLVED_QUESTION","question":"What exactly did the three elderly ambassadors propose regarding burial?"},{"id":"Q-008","evidence_type":"UNRESOLVED_QUESTION","question":"Who initiated and participated in the ambassadors' stoning?"},{"id":"Q-009","evidence_type":"UNRESOLVED_QUESTION","question":"What conduct was attributed to Zelarchus and the other market clerks?"},{"id":"Q-010","evidence_type":"UNRESOLVED_QUESTION","question":"How many people drowned during the panic flight into the sea?"},{"id":"Q-011","evidence_type":"UNRESOLVED_QUESTION","question":"Were any ringleaders identified, prosecuted, convicted, or executed?"},{"id":"Q-012","evidence_type":"UNRESOLVED_QUESTION","question":"What offenses were included in the retrospective review since Cyrus's death?"},{"id":"Q-013","evidence_type":"UNRESOLVED_QUESTION","question":"What was the composition, jurisdiction, procedure, and voting rule of the officer dicast board?"},{"id":"Q-014","evidence_type":"UNRESOLVED_QUESTION","question":"What deity, victims, rites, and pollution theory governed the purification?"},{"id":"Q-015","evidence_type":"UNRESOLVED_QUESTION","question":"How freely did the assembly assent under the emotional force of Xenophon's speech?"},{"id":"Q-016","evidence_type":"UNRESOLVED_QUESTION","question":"How should the chapter's condemnation of unauthorized coercion be related to the army's prior threat against Silanus?"}],"downstream_textual_checks":[{"id":"CHK-001","check":"Verify the V.7 boundary through the opening lines of PDF page 115 and V.8 start beneath heading VIII."},{"id":"CHK-002","check":"Check Greek vocabulary for rumor, assembly, informal gathering, deception, and jealousy."},{"id":"CHK-003","check":"Check direction, Boreas, south-wind, ship-number, and ten-thousand wording against a Greek witness."},{"id":"CHK-004","check":"Verify Clearetus's plan, the Euxine departure phrase, and the source marker translated as 'as I now discover.'"},{"id":"CHK-005","check":"Check whether the three elderly men are explicitly ambassadors or characterized so by Xenophon's rhetoric."},{"id":"CHK-006","check":"Verify public-consent, burial-offer, herald, and truce terminology."},{"id":"CHK-007","check":"Check market-clerk title, Zelarchus's name, and the crowd's hunting-simile wording."},{"id":"CHK-008","check":"Verify the alternatives concerning Zelarchus's guilt or innocence and the absence of trial."},{"id":"CHK-009","check":"Check elected-general, self-appointed-general, and collective war-and-peace formulations."},{"id":"CHK-010","check":"Verify capital-charge, misdemeanor, prosecutorial-duty, and dicast-board terminology."},{"id":"CHK-011","check":"Identify the purification rite and the role of soothsayers from an original-language witness."},{"id":"CHK-012","check":"Keep the Boreas and dicast explanatory notes separate as later editorial paratext."}],"secondary_comparison_status":"DEFERRED"}