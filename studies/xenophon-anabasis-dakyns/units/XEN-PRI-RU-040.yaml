{"schema_version":1.0,"unit_id":"XEN-PRI-RU-040","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VI.3","pdf_pages_one_based":"124-127","opening_anchor":"BOOK VI, III: The Arcadians, disembarking under cover of night at Calpe Haven...","closing_anchor":"...We resolved not to be left behind by you; and that is how we also came to march hither.\""},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Keep narrator, speaker, report, deed, outcome, paratext, and inference distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170, searchable 168-page PDF","chapter_boundary_control":"Heading III begins VI.3 on PDF page 124; heading IV begins VI.4 on page 127; heading V begins on page 129. Next unit covers pages 127-129. The Sir C. Wilson comparison is translator/editor paratext.","source_boundary":"Arcadian raid and dispersal; Thracian regrouping, losses, siege, and parley; Cheirisophus arrival; Xenophon intelligence, speech, orders, fire display, prayer, advance, and reunion."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with attributed direct speech by Xenophon, reported negotiation, reported intelligence, reported interpretation by the Arcadians, and explicit uncertainty in the actors' explanations.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms occur only in attributed speeches. The narrator reports Xenophon in the third person and does not identify narrator and character.","uncertainty":"Motives, truce terms, cause of enemy withdrawal, Arcadian interpretation, narrator-author identity, and divine causation remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"VI.3 p.125","speaker":"Arcadian and Thracian negotiators, unnamed","audience":"each opposing force","occasion":"parley during the siege of the knoll","content":"Reach concessions and terms, but fail to complete the arrangement because the Thracians refuse the requested hostages."},{"id":"SAO-002","locator":"VI.3 p.125","speaker":"captured or detained old men","audience":"Xenophon through questioning","occasion":"cavalry intelligence encounter","content":"Report the Arcadian losses and the continuing encirclement of the survivors on a knoll."},{"id":"SAO-003","locator":"VI.3 pp.125-126","speaker":"Xenophon","audience":"his assembled soldiers","occasion":"decision whether to rescue the separated Arcadians and Achaeans","content":"Argues that their destruction would endanger his own division and that united battle is safer than isolated danger."},{"id":"SAO-004","locator":"VI.3 p.126","speaker":"Xenophon","audience":"Timasion and the cavalry","occasion":"advance reconnaissance order","content":"Orders the cavalry forward without losing sight of the main body and requires close observation of the route ahead."},{"id":"SAO-005","locator":"VI.3 p.126","speaker":"Xenophon","audience":"selected light-armed scouts","occasion":"flank and high-ground screening","content":"Orders signals upon sighting anything and directs the burning of combustible material along the route."},{"id":"SAO-006","locator":"VI.3 p.126","speaker":"Xenophon","audience":"his assembled soldiers","occasion":"continuation of the rescue speech","content":"Reviews the distances to Heraclea and Chrysopolis, the absence of ships and provisions, and the need to seek common deliverance."},{"id":"SAO-007","locator":"VI.3 p.126","speaker":"Xenophon","audience":"his assembled soldiers","occasion":"culmination of the rescue speech","content":"Frames the alternatives as glorious death or noble rescue and offers a possible divine interpretation of humiliation and honour."},{"id":"SAO-008","locator":"VI.3 p.126","speaker":"Xenophon","audience":"his assembled soldiers","occasion":"final command in the speech","content":"Calls for prompt execution of orders."},{"id":"SAO-009","locator":"VI.3 p.127","speaker":"people left at the abandoned knoll","audience":"Timasion's cavalry and then Xenophon's main body by report","occasion":"inquiry after finding no army","content":"Report that the Thracians departed after sundown and the Arcadians departed at dawn, without knowing their direction."},{"id":"SAO-010","locator":"VI.3 p.127","speaker":"Arcadian officers","audience":"Xenophon's officers","occasion":"reunion at Calpe Haven","content":"Explain how the extinguished watchfires first suggested a night attack and later suggested that Xenophon's force had fled."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","actor":"ten Arcadian-Achaean generals and their companies","deed":"Land by night, divide against nearby villages, and designate a knoll for reunion.","outcome":"The surprise raid captures people and small cattle but disperses the heavy infantry."},{"id":"SDO-002","actor":"Thracian light-armed troops","deed":"Escape the initial raid, regroup, and attack returning companies.","outcome":"Smicres and his company are destroyed; Hegesander escapes with only seven others."},{"id":"SDO-003","actor":"remaining Arcadian-Achaean companies","deed":"Assemble on the designated knoll, some with booty and some empty-handed.","outcome":"They are encircled by increasing cavalry and light-armed forces."},{"id":"SDO-004","actor":"Thracian cavalry and light infantry","deed":"Attack at missile range, evade retaliation, and cut the heavy infantry off from water.","outcome":"Greek wounds accumulate while the attackers remain untouched in the narrated account."},{"id":"SDO-005","actor":"besieged Greeks and Thracians","deed":"Negotiate concessions and terms but disagree over hostages.","outcome":"The chapter reports no completed truce before shifting to Cheirisophus and Xenophon."},{"id":"SDO-006","actor":"Xenophon's cavalry and Xenophon","deed":"Obtain intelligence from old men, keep them guarded as possible guides, post outposts, and summon an assembly.","outcome":"The separated force gains a reported picture of the Arcadian danger and prepares a rescue."},{"id":"SDO-007","actor":"Xenophon","deed":"Argues for rescue on grounds of common danger, route, provisions, honour, and possible divine ordering.","outcome":"He leads the force toward the besieged division with specified reconnaissance and signaling measures."},{"id":"SDO-008","actor":"Xenophon's cavalry, peltasts, and main body","deed":"Burn combustible country, multiply watchfires, then extinguish them after dinner.","outcome":"The landscape suggests a larger force, while the later effect of extinguishing the fires is interpreted differently by different parties."},{"id":"SDO-009","actor":"Xenophon's force","deed":"Pray at daybreak, form for battle, and advance rapidly.","outcome":"Timasion reaches an abandoned knoll and learns that both enemy and besieged force have already departed."},{"id":"SDO-010","actor":"Xenophon's and the Arcadian-Achaean divisions","deed":"Follow the Arcadian track and converge at Calpe Haven.","outcome":"They rejoice, embrace like brothers, and exchange explanations without yet recording a formal constitutional settlement."}],"sequence_repetition_omission_and_contradiction":{"sequence":["night landing at Calpe Haven","division among villages","initial capture of people and cattle","Thracian escape and regrouping","destruction of Smicres's company","near destruction of Hegesander's company","rendezvous on the knoll","encirclement and missile attacks","loss of access to water","incomplete truce negotiation","Cheirisophus reaches Calpe","cavalry intelligence reaches Xenophon","guarding of guides and assembly","rescue argument and orders","country burned and watchfires multiplied","watchfires extinguished","prayer and rapid advance","abandoned knoll discovered","track followed to Calpe","fraternal reunion","Arcadian retrospective explanation"],"repetitions":["Booty dispersal again weakens collective security.","Mobile troops again expose unsupported heavy infantry.","Cavalry intelligence again changes command judgment.","Fire again acts materially and communicatively.","Prayer and tactics recur without settling causation."],"omissions":["No Thracian commanders or negotiators are named.","Truce concessions and terms are unspecified.","Wounded and surviving totals are unstated.","No Thracian account explains withdrawal.","No proof identifies the fires’ effect.","No formal restored command precedes heading IV."],"tensions":["Booty success accompanies loss of cohesion.","Heavy infantry strength becomes helplessness at range.","Secessionists become objects of rescue for common survival.","Deliberate fire display is followed by ambiguous extinction.","Divine possibility accompanies exact human measures.","Fraternal reunion precedes constitutional restoration."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis VI.3; PDF pp.124-127","evidence_type":"BOOK_SIX_VI3_BOUNDARY_OBSERVATION","observation":"VI.3 begins beneath heading III on PDF page 124 and ends immediately before heading IV on page 127; VI.4 begins on page 127."},{"id":"OBS-002","locator":"VI.3 p.124","evidence_type":"CALPE_NIGHT_LANDING_OBSERVATION","observation":"The Arcadians disembark under cover of night at Calpe Haven and march about thirty furlongs inland toward the nearest villages."},{"id":"OBS-003","locator":"VI.3 p.124","evidence_type":"TEN_GENERAL_VILLAGE_DIVISION_OBSERVATION","observation":"Each of the ten generals leads one company against a village, with two companies assigned when a village is large."},{"id":"OBS-004","locator":"VI.3 p.124","evidence_type":"KNOLL_RENDEZVOUS_OBSERVATION","observation":"The dispersed companies agree upon a particular knoll as their eventual place of assembly."},{"id":"OBS-005","locator":"VI.3 p.124","evidence_type":"INITIAL_BOOTY_SUCCESS_OBSERVATION","observation":"The sudden attack secures captives and a multitude of small cattle before the Thracians regroup."},{"id":"OBS-006","locator":"VI.3 pp.124-125","evidence_type":"LIGHT_ARMED_ESCAPE_REGROUP_OBSERVATION","observation":"Thracian light-armed troops escape through the hands of the heavy infantry in large numbers and subsequently collect again."},{"id":"OBS-007","locator":"VI.3 p.125","evidence_type":"SMICRES_COMPANY_DESTRUCTION_OBSERVATION","observation":"The Thracians attack Smicres while he retires with captives and cattle, rout the company at a gorge, and kill Smicres and those with him to a man."},{"id":"OBS-008","locator":"VI.3 p.125","evidence_type":"HEGESANDER_EIGHT_SURVIVORS_OBSERVATION","observation":"Hegesander's company suffers nearly the same fate; only eight men escape, including Hegesander."},{"id":"OBS-009","locator":"VI.3 p.125","evidence_type":"UNEQUAL_RENDEZVOUS_RESULTS_OBSERVATION","observation":"The remaining captains reach the knoll with unequal results, some carrying gains and others empty-handed."},{"id":"OBS-010","locator":"VI.3 p.125","evidence_type":"THRACIAN_NIGHT_COMMUNICATION_OBSERVATION","observation":"After the success, the Thracians maintain shouting and clattering communication with one another during the night."},{"id":"OBS-011","locator":"VI.3 p.125","evidence_type":"CAVALRY_LIGHT_INFANTRY_ENCIRCLEMENT_OBSERVATION","observation":"At dawn an increasing force of Thracian cavalry and light-armed troops forms a circle around the knoll."},{"id":"OBS-012","locator":"VI.3 p.125","evidence_type":"ARCADIAN_COMBINED_ARMS_DEFICIENCY_OBSERVATION","observation":"The besieged heavy infantry has not a single bowman, javelin-man, or mounted trooper."},{"id":"OBS-013","locator":"VI.3 p.125","evidence_type":"ASYMMETRIC_MISSILE_WOUNDING_OBSERVATION","observation":"The attackers advance, discharge javelins, and withdraw too lightly for retaliation; Greeks are wounded while the attackers are narrated as untouched."},{"id":"OBS-014","locator":"VI.3 p.125","evidence_type":"WATER_CUTOFF_OBSERVATION","observation":"The encircled Greeks cannot move from their position and are eventually cut off even from water."},{"id":"OBS-015","locator":"VI.3 p.125","evidence_type":"TRUCE_HOSTAGE_IMPASSE_OBSERVATION","observation":"Concessions and terms emerge in a parley, but the Thracians refuse the Greek demand for hostages and the matter rests there."},{"id":"OBS-016","locator":"VI.3 p.125","evidence_type":"CHEIRISOPHUS_SAFE_COASTAL_ARRIVAL_OBSERVATION","observation":"Cheirisophus follows the seaboard and reaches Calpe Haven without check."},{"id":"OBS-017","locator":"VI.3 p.125","evidence_type":"CAVALRY_INTELLIGENCE_OLD_MEN_OBSERVATION","observation":"Xenophon's cavalry encounters old men whose answers report the losses and current siege of the Arcadians."},{"id":"OBS-018","locator":"VI.3 p.125","evidence_type":"STRICT_GUARD_GUIDE_OBSERVATION","observation":"Xenophon keeps the old men under strict guard so they can serve as guides if needed."},{"id":"OBS-019","locator":"VI.3 p.125","evidence_type":"OUTPOST_ASSEMBLY_OBSERVATION","observation":"Xenophon appoints outposts before calling the soldiers together."},{"id":"OBS-020","locator":"VI.3 pp.125-126","evidence_type":"COMMON_FATE_RESCUE_ARGUMENT_OBSERVATION","observation":"Xenophon states his belief that the Arcadians' destruction would seal the fate of his own force because the enemy is numerous and emboldened."},{"id":"OBS-021","locator":"VI.3 p.126","evidence_type":"TIMASION_VISIBLE_RECONNAISSANCE_OBSERVATION","observation":"Timasion and the cavalry are ordered forward to reconnoitre without losing sight of the main force."},{"id":"OBS-022","locator":"VI.3 p.126","evidence_type":"FLANK_HIGH_GROUND_SIGNAL_OBSERVATION","observation":"Light-armed men are sent to flanks and high points to signal anything observed."},{"id":"OBS-023","locator":"VI.3 p.126","evidence_type":"ROUTE_PROVISION_CONSTRAINT_OBSERVATION","observation":"Xenophon's speech contrasts the distance to Heraclea and Chrysopolis with Calpe's lack of escape vessels and the force's lack of provisions for a single day."},{"id":"OBS-024","locator":"VI.3 p.126","evidence_type":"NOBLE_RESCUE_DIVINE_HUMBLING_SPEECH_OBSERVATION","observation":"Xenophon presents glorious death or the rescue of many Hellenes as the alternatives and says maybe God humbles the proud boaster while reserving higher honour for those beginning by heaven's grace."},{"id":"OBS-025","locator":"VI.3 p.126","evidence_type":"COUNTRYWIDE_FIRE_MAGNIFICATION_OBSERVATION","observation":"Cavalry, peltasts, and the main body burn combustible material so that the country appears ablaze and the army can pass for a larger one."},{"id":"OBS-026","locator":"VI.3 p.126","evidence_type":"WATCHFIRE_MULTIPLICATION_EXTINCTION_OBSERVATION","observation":"The force kindles as many watchfires as possible and then, after dinner, receives an order to quench all of them."},{"id":"OBS-027","locator":"VI.3 p.126","evidence_type":"DAWN_PRAYER_BATTLE_ORDER_OBSERVATION","observation":"At daybreak the force offers prayers to the gods, draws up in battle order, and advances rapidly."},{"id":"OBS-028","locator":"VI.3 pp.126-127","evidence_type":"ABANDONED_KNOLL_WITHDRAWAL_REPORT_OBSERVATION","observation":"Timasion reaches the former siege knoll without knowing it and learns from those left behind that the Thracians departed after sundown and the Hellenes at dawn."},{"id":"OBS-029","locator":"VI.3 p.127","evidence_type":"FRATERNAL_REUNION_OBSERVATION","observation":"Xenophon's force follows the Arcadian-Achaean track to Calpe; the two divisions rejoice and embrace each other like brothers."},{"id":"OBS-030","locator":"VI.3 p.127","evidence_type":"EXTINGUISHED_FIRE_DOUBLE_INTERPRETATION_OBSERVATION","observation":"The Arcadians report that extinguished fires first suggested a night attack and enemy fear, but after delay suggested that Xenophon's force had fled in terror, prompting their own march."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"Decentralized seizure of booty produces immediate abundance for some companies while dissolving the mutual support needed against a regrouping enemy."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"Heavy infantry superiority is circumstance-bound; unsupported hoplites can be immobilized by mobile cavalry and missile troops without close engagement."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"The knoll provides a rendezvous and temporary refuge but not water, mobility, or an answer to ranged encirclement."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"The hostage impasse preserves the difference between negotiated words and a secured truce."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"Xenophon's rescue argument links aid to former rivals with the survival of his own division, joining solidarity and prudential common interest."},{"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"The rescue operation depends on distributed capacities—cavalry intelligence, guarded local guides, high-ground scouts, coordinated fire, prayer, formation, and speed—rather than speech alone."},{"id":"FIND-007","evidence_type":"PROVISIONAL_INFERENCE","finding":"The deliberate fire display communicates magnified strength, but the later extinction of the fires demonstrates that political signals do not remain under the sender's control."},{"id":"FIND-008","evidence_type":"PROVISIONAL_INFERENCE","finding":"The chapter permits, but does not prove, a causal connection between Xenophon's measures and the Thracian withdrawal; the enemy's own account is absent."},{"id":"FIND-009","evidence_type":"PROVISIONAL_INFERENCE","finding":"Divine interpretation and human calculation are presented together: the speech says 'maybe' God acts, while the deed proceeds through concrete tactical measures."},{"id":"FIND-010","evidence_type":"PROVISIONAL_INFERENCE","finding":"Emotional reunion occurs before constitutional restoration; fraternal embrace does not by itself establish the terms of renewed common command."}],"standing_unresolved_questions":[{"id":"Q-001","question":"Why did the Arcadian-Achaean generals divide among villages rather than preserve a mutually supporting formation?"},{"id":"Q-002","question":"How much did the desire for captives and cattle determine the raid's tactical dispersal?"},{"id":"Q-003","question":"Was the chosen knoll an adequate rendezvous under the information available before the raid?"},{"id":"Q-004","question":"What exact circumstances enabled the Thracians to destroy Smicres's company and nearly destroy Hegesander's?"},{"id":"Q-005","question":"How many Arcadians and Achaeans were killed, wounded, or remained combat-effective after the siege?"},{"id":"Q-006","question":"What concessions and terms were agreed before the hostage demand stopped the truce?"},{"id":"Q-007","question":"Why did the Thracians refuse hostages, and what security did each side otherwise possess?"},{"id":"Q-008","question":"What is the legal and moral status of keeping the old men under strict guard as possible guides?"},{"id":"Q-009","question":"Would Xenophon's force have attempted the rescue without cavalry intelligence?"},{"id":"Q-010","question":"Does Xenophon's common-fate argument fully explain the rescue, or does the speech also seek honour and vindication?"},{"id":"Q-011","question":"Who is the proud boaster whom Xenophon says God may be humbling?"},{"id":"Q-012","question":"Does the phrase 'maybe it is God' mark conviction, caution, exhortation, or some combination?"},{"id":"Q-013","question":"Was the extinction of the watchfires intended to conceal movement, prevent attack, rest the force, or serve another purpose?"},{"id":"Q-014","question":"Did the fire display or its extinction actually cause the Thracian withdrawal?"},{"id":"Q-015","question":"Why did the Arcadians interpret the same absent fires first as impending rescue and later as Xenophontic flight?"},{"id":"Q-016","question":"What institutional settlement follows the fraternal reunion, and does it restore unity without erasing the prior secession?"}],"downstream_textual_checks":[{"id":"CHECK-001","target":"Anabasis VI.4","question":"Whether the reunited army formally prohibits future division or restores common command."},{"id":"CHECK-002","target":"Anabasis VI.4","question":"How the text describes Calpe's suitability for a city and the soldiers' suspicion of founding."},{"id":"CHECK-003","target":"Anabasis VI.4","question":"Whether burial of the Arcadian dead completes the rescue politically, religiously, or militarily."},{"id":"CHECK-004","target":"Anabasis VI.4","question":"Whether Xenophon's sacrifices become favourable or restrain action after reunion."},{"id":"CHECK-005","target":"Anabasis VI.4-VI.5","question":"How renewed provisioning pressure tests the restored unity."},{"id":"CHECK-006","target":"Anabasis VI.4-VI.5","question":"Whether Neon acts independently and what consequences follow."},{"id":"CHECK-007","target":"Anabasis VI.4-VI.5","question":"Whether the army's combined-arms deficiencies are corrected in subsequent combat."},{"id":"CHECK-008","target":"Anabasis VI.4-VI.6","question":"What becomes of Cheirisophus and how his fate affects command."},{"id":"CHECK-009","target":"Anabasis VII","question":"Whether later accusations or speeches recall the rescue of the Arcadians and Achaeans."},{"id":"CHECK-010","target":"Greek witness review","question":"How the Greek marks possibility, divine agency, boasting, honour, and the fraternal comparison."},{"id":"CHECK-011","target":"Translation comparison","question":"How other witnesses render strict guard, glorious death, noblest emprise, and the extinguished-fire explanations."},{"id":"CHECK-012","target":"Secondary comparison gate","question":"After primary completion, compare later interpretation without allowing it to rewrite VI.3's documentary record."}],"secondary_comparison_status":"DEFERRED"}