  - {id: Q-004, question: "What exactly did Lycon threaten?"}
  - {id: Q-005, question: "Why did Cheirisophus and Xenophon refuse?"}
  - {id: Q-006, question: "Did defensive closure prevent or postpone violence?"}
  - {id: Q-007, question: "Was the faction's toil-and-spoils complaint accurate?"}
  - {id: Q-008, question: "Can numerical majority authorize secession?"}
  - {id: Q-009, question: "Do ten generals remedy plural-command defects?"}
  - {id: Q-010, question: "Why did Cheirisophus lose authority?"}
  - {id: Q-011, question: "What grounds the narrator's report of Neon's motive?"}
  - {id: Q-012, question: "Did Xenophon genuinely intend to sail home?"}
