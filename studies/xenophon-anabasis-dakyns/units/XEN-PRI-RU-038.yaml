{"schema_version":1.0,"unit_id":"XEN-PRI-RU-038","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VI.1","pdf_pages_one_based":"118-121","opening_anchor":"BOOK VI, I: During the stay at this place...","closing_anchor":"...make port at Heraclea, and there hold a final council."},"jurisdiction":"Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no deed corpus, speech register, guard, adapter, ministerial capacity, Sanctum registration, final certification, or AI certification is authorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170, searchable 168-page PDF","chapter_boundary_control":"VI.1 begins beneath heading I on PDF page 118 and ends immediately before heading II on page 122. VI.2 begins beneath heading II on page 122 and ends before heading III on page 124; the next unit therefore covers pages 122-124. Notes on Sitalcas, the Carpaea, the warrior's march, the Pyrrhic dance, Harmene, Cyropaedia, and oionos remain paratext.","source_boundary":"Separate reciprocal violence, embassy, feast, dances, treaty, voyage, gifts, command proposal, interior deliberation, sacrifice, speeches, election, and editorial notes."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with reported interior deliberation and attributed first-person speeches.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms belong to attributed speeches. The narrator reports Xenophon's ambition, fear, sacrifice, and recollection without directly identifying himself as Xenophon.","uncertainty":"The basis for private-thought reporting, the objective force of sacrificial signs, and narrator-author identity remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"VI.1 p.118","speaker":"Corylas's ambassadors","audience":"Greek generals and army","occasion":"mutual hostility","content":"Propose reciprocal abstention from injury and are hosted pending consultation."},{"id":"SAO-002","locator":"VI.1 pp.118-119","speaker":"dancers and spectators through performance and questions","audience":"feast participants","occasion":"armed entertainment","content":"Display ethnic and military dances; Paphlagonians ask whether Greek women fight."},{"id":"SAO-003","locator":"VI.1 p.119","speaker":"Greek soldiers","audience":"Paphlagonians","occasion":"response to the dancing girl","content":"Joke that women drove the Great King from camp."},{"id":"SAO-004","locator":"VI.1 pp.119-120","speaker":"officers","audience":"Xenophon","occasion":"single-command proposal","content":"Urge him to accept sole command."},{"id":"SAO-005","locator":"VI.1 pp.120-121","speaker":"Xenophon","audience":"army","occasion":"election debate","content":"Declines command, cites Spartan leadership, divine signs, and danger of faction."},{"id":"SAO-006","locator":"VI.1 p.121","speaker":"Agasias","audience":"army","occasion":"Spartan objection","content":"Uses a dining joke to challenge the claim that every first place belongs to a Spartan."},{"id":"SAO-007","locator":"VI.1 p.121","speaker":"Cheirisophus","audience":"army","occasion":"after election","content":"Promises no faction and reports Dexippus's allegation about Xenophon's preferred co-command."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","actor":"Paphlagonians and Greeks","deed":"Exchange raids and abductions before Corylas sends an embassy.","outcome":"A proposal for mutual restraint replaces active hostility."},{"id":"SDO-002","actor":"Greeks and Paphlagonian guests","deed":"Hold a sacrificial feast and sequence of armed dances.","outcome":"Military identities are displayed and interpreted across cultures."},{"id":"SDO-003","actor":"army and ambassadors","deed":"Approve mutual abstention from injuries.","outcome":"Ambassadors depart under an agreed but sparsely specified accommodation."},{"id":"SDO-004","actor":"army","deed":"Sails from Paphlagonia to Harmene near Sinope.","outcome":"Receives grain and wine and rejoins Cheirisophus."},{"id":"SDO-005","actor":"Cheirisophus","deed":"Returns with congratulations and Anaxibius's promise of future pay.","outcome":"Expected immediate material support does not arrive."},{"id":"SDO-006","actor":"army and officers","deed":"Debate divided command and press Xenophon toward sole leadership.","outcome":"A unanimous single-command vote is prepared."},{"id":"SDO-007","actor":"Xenophon","deed":"Weighs honor against reputational danger and sacrifices twice to Zeus the King.","outcome":"The reported sign directs him neither to seek nor accept command."},{"id":"SDO-008","actor":"Xenophon and assembly","deed":"Xenophon refuses election through political, strategic, and religious arguments.","outcome":"Repeated popular insistence does not overcome his refusal."},{"id":"SDO-009","actor":"Agasias and assembly","deed":"Agasias answers the Spartan objection with a joke.","outcome":"The army applauds but Xenophon discloses the sacrificial prohibition."},{"id":"SDO-010","actor":"army and Cheirisophus","deed":"Elect Cheirisophus sole commander.","outcome":"He promises unity, reports Dexippus's slander, and orders departure for Heraclea."}],"sequence_repetition_omission_and_contradiction":{"sequence":["reciprocal injury","embassy","feast","armed dances","mutual-restraint agreement","voyage","Sinopean gifts","Cheirisophus return","single-command reasoning","Xenophon deliberation","sacrifice","unanimous vote","refusal speeches","Cheirisophus election","departure order"],"repetitions":["Market, raiding, and diplomacy again coexist.","Sacrifice precedes a major command decision.","Assembly acclamation and individual refusal remain distinct.","Spartan authority is invoked and contested through speech."],"omissions":["No oath, duration, or enforcement mechanism for the Paphlagonian agreement is supplied.","No names or words of the ambassadors are given.","No exact ship count or sailing terms are supplied.","The victims and detailed signs of Xenophon's sacrifice are omitted.","Dexippus's alleged words and evidence are not independently supplied."],"tensions":["The feast uses captive animals while negotiating mutual restraint.","Armed entertainment blurs ritual, ethnicity, and military display.","The army seeks unity through one commander immediately after judicially constraining command in Book V.","Xenophon desires honor yet declines the office that would confer it.","Popular unanimity is subordinated to a reported divine prohibition."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"BOOK_SIX_BOUNDARY_OBSERVATION","observation":"VI.1 begins on PDF page 118 and ends before heading II on page 122; VI.2 occupies pages 122-124 before heading III."},{"id":"OBS-002","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"RECIPROCAL_FRONTIER_VIOLENCE_OBSERVATION","observation":"The waiting army raids for provisions while Paphlagonians seize stragglers and attack distant quarters at night."},{"id":"OBS-003","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"CORYLAS_EMBASSY_OBSERVATION","observation":"Corylas, described as chief of Paphlagonia, sends ambassadors with horses and fine apparel proposing mutual abstention from injury."},{"id":"OBS-004","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"CAPTIVE_ANIMAL_FEAST_OBSERVATION","observation":"The Greeks entertain the ambassadors with captive cattle and other sacrificial animals and drink from horn cups."},{"id":"OBS-005","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"THRACIAN_ARMED_DANCE_OBSERVATION","observation":"Thracians perform an armed dance with simulated wounding, stripping of arms, and a song connected with Sitalcas."},{"id":"OBS-006","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"CARPAEA_DRAMATIC_DANCE_OBSERVATION","observation":"Aenianians and Magnesians perform the Carpaea, dramatizing cattle theft, combat, reversal, and binding."},{"id":"OBS-007","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"MULTIPLE_ETHNIC_DANCE_OBSERVATION","observation":"A Mysian, Mantineans, Arcadians, and others perform shield, Persian, processional, and warrior dances in arms."},{"id":"OBS-008","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"DANCING_GIRL_PYRRHIC_OBSERVATION","observation":"A dancing girl receives light equipment and performs the Pyrrhic dance."},{"id":"OBS-009","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"PAPHLAGONIAN_WOMEN_WARFARE_QUESTION_OBSERVATION","observation":"Paphlagonians ask whether Greek women also fight in the army."},{"id":"OBS-010","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"GREAT_KING_JOKE_OBSERVATION","observation":"Greeks answer jokingly that the women routed the Great King and drove him from camp."},{"id":"OBS-011","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"MUTUAL_NON_INJURY_RESOLUTION_OBSERVATION","observation":"The army resolves on reciprocal abstention from injuries with the Paphlagonians, but the witness gives no oath, duration, or sanctions."},{"id":"OBS-012","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"PAPHLAGONIA_DEPARTURE_OBSERVATION","observation":"Once enough ships arrive, the Greeks sail by day and night and leave Paphlagonia."},{"id":"OBS-013","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"HARMENE_SINOPE_GIFT_OBSERVATION","observation":"At Harmene near Sinope, the Sinopeans provide three thousand measures of barley and fifteen hundred jars of wine."},{"id":"OBS-014","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"CHEIRISOPHUS_RETURN_OBSERVATION","observation":"Cheirisophus rejoins on a warship without the expected supplies, bringing congratulations and Anaxibius's promise of pay outside the Euxine."},{"id":"OBS-015","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"FIVE_DAY_HARMENE_HALT_OBSERVATION","observation":"The army remains five days at Harmene before resolving the command question."},{"id":"OBS-016","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"EMPTY_HANDED_RETURN_CONCERN_OBSERVATION","observation":"Proximity to Hellas heightens the soldiers' desire not to return empty-handed."},{"id":"OBS-017","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"SINGLE_COMMAND_ARGUMENT_OBSERVATION","observation":"The army reasons that one commander improves secrecy, speed, night and day action, and immediate execution compared with divided majority rule."},{"id":"OBS-018","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"OFFICER_PRESSURE_ON_XENOPHON_OBSERVATION","observation":"Officers approach Xenophon and urge him to accept sole command."},{"id":"OBS-019","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"XENOPHON_AMBITION_AND_RISK_OBSERVATION","observation":"The narrator reports Xenophon's desire for honor and reputation alongside fear that failure could destroy both."},{"id":"OBS-020","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"ZEUS_KING_SACRIFICE_OBSERVATION","observation":"Xenophon sacrifices two victims to Zeus the King, linking the deity to the Delphic oracle and his earlier dream."},{"id":"OBS-021","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"EPHESUS_EAGLE_RECOLLECTION_OBSERVATION","observation":"He recalls an Ephesus eagle omen interpreted as royal and glorious but burdened with suffering and no monetary gain."},{"id":"OBS-022","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"DIVINE_REFUSAL_SIGN_OBSERVATION","observation":"The god is reported to give a plain sign that Xenophon should neither demand nor accept sole command."},{"id":"OBS-023","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"UNANIMOUS_SINGLE_LEADER_VOTE_OBSERVATION","observation":"The army unanimously approves selecting one commander and proposes Xenophon."},{"id":"OBS-024","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"SPARTAN_HEGEMONY_ARGUMENT_OBSERVATION","observation":"Xenophon argues that preferring him over a Lacedaemonian could damage future Spartan assistance and provoke danger."},{"id":"OBS-025","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"ATHENIAN_SUBMISSION_EXAMPLE_OBSERVATION","observation":"Within Xenophon's speech, the end of Athens's siege is linked to acknowledgment of Lacedaemonian leadership."},{"id":"OBS-026","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"ANTI_FACTION_PLEDGE_OBSERVATION","observation":"Xenophon promises not to form a faction if another is chosen and treats faction as opposition to common safety."},{"id":"OBS-027","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"AGASIAS_DINING_JOKE_OBSERVATION","observation":"Agasias jokes that Spartans cannot demand first place everywhere merely because dining companions do not seat a Spartan at the head."},{"id":"OBS-028","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"SACRIFICIAL_OATHED_DISCLOSURE_OBSERVATION","observation":"Xenophon swears that the gods ordered him to avoid the proposed sovereignty."},{"id":"OBS-029","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"CHEIRISOPHUS_ELECTION_OBSERVATION","observation":"The army elects Cheirisophus, who promises not to factionalize had another been chosen."},{"id":"OBS-030","locator":"Anabasis VI.1; PDF pp.118-121","evidence_type":"DEXIPPUS_SLANDER_REPORT_OBSERVATION","observation":"Cheirisophus reports that Dexippus slandered Xenophon to Anaxibius by alleging a preference for joint command with Timasion over a Laconian."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"Reciprocal violence is converted into a limited diplomatic accommodation without erasing the provisioning conflict."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"The feast makes military identity visible through performance before formal treaty resolution."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"The dancing girl's performance exposes Greek warfare to a foreign interpretive question rather than proving women's ordinary military participation."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"Sinopean gifts and Anaxibius's deferred promise show that hospitality and future pay remain materially unequal forms of support."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"The case for single command arises from operational efficiency rather than a supplied constitutional theory."},{"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"Xenophon's reported ambition is disciplined by both reputational calculation and sacrificial prohibition."},{"id":"FIND-007","evidence_type":"PROVISIONAL_INFERENCE","finding":"His refusal places divine instruction and Spartan political prudence above unanimous acclamation."},{"id":"FIND-008","evidence_type":"PROVISIONAL_INFERENCE","finding":"Agasias's joke punctures the universality of Spartan precedence without deciding the legal question of command."},{"id":"FIND-009","evidence_type":"PROVISIONAL_INFERENCE","finding":"Cheirisophus's election restores unity while preserving distrust through the report of Dexippus's slander."}],"standing_unresolved_questions":[{"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"What injuries were included in the mutual-restraint agreement?"},{"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"Was an oath exchanged, and before which gods?"},{"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"Who supplied the captive animals used at the feast?"},{"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"How accurately do the dance descriptions preserve local practices?"},{"id":"Q-005","evidence_type":"UNRESOLVED_QUESTION","question":"What is the textual status of the named dances and editorial identifications?"},{"id":"Q-006","evidence_type":"UNRESOLVED_QUESTION","question":"Was the dancing girl free, enslaved, hired, or otherwise attached to the army?"},{"id":"Q-007","evidence_type":"UNRESOLVED_QUESTION","question":"How did Paphlagonians understand the Great King joke?"},{"id":"Q-008","evidence_type":"UNRESOLVED_QUESTION","question":"How many ships carried the army from Paphlagonia?"},{"id":"Q-009","evidence_type":"UNRESOLVED_QUESTION","question":"What terms governed the Sinopean gifts?"},{"id":"Q-010","evidence_type":"UNRESOLVED_QUESTION","question":"What exactly had Anaxibius promised Cheirisophus?"},{"id":"Q-011","evidence_type":"UNRESOLVED_QUESTION","question":"Which officers pressed Xenophon and by what procedure?"},{"id":"Q-012","evidence_type":"UNRESOLVED_QUESTION","question":"How could the narrator know Xenophon's private motives?"},{"id":"Q-013","evidence_type":"UNRESOLVED_QUESTION","question":"What sacrificial victims and signs produced the refusal?"},{"id":"Q-014","evidence_type":"UNRESOLVED_QUESTION","question":"What is the Greek wording of the Ephesus omen and its interpretation?"},{"id":"Q-015","evidence_type":"UNRESOLVED_QUESTION","question":"How formal was the unanimous election procedure?"},{"id":"Q-016","evidence_type":"UNRESOLVED_QUESTION","question":"What evidence supported Dexippus's alleged slander?"}],"downstream_textual_checks":[{"id":"CHK-001","check":"Greek terms for mutual injury and agreement"},{"id":"CHK-002","check":"dance names and editorial paratext boundaries"},{"id":"CHK-003","check":"status and equipment of the dancing girl"},{"id":"CHK-004","check":"Great King joke syntax"},{"id":"CHK-005","check":"Sinopean gift quantities"},{"id":"CHK-006","check":"Anaxibius pay-promise wording"},{"id":"CHK-007","check":"single-command and majority-rule vocabulary"},{"id":"CHK-008","check":"interior-deliberation grammar"},{"id":"CHK-009","check":"Zeus the King and sacrifice signs"},{"id":"CHK-010","check":"eagle omen wording and interpretation"},{"id":"CHK-011","check":"Spartan hegemony and faction terminology"},{"id":"CHK-012","check":"Dexippus allegation and Timasion reference"}],"secondary_comparison_status":"DEFERRED"}