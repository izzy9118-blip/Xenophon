{"schema_version":1.0,"unit_id":"XEN-PRI-RU-047","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VII.4","pdf_pages_one_based":"150-153","opening_anchor":"BOOK VII, IV: But the next day Seuthes burnt the villages to the ground; he left not a single house.","closing_anchor":"So to a man they gave in their adhesion in that quarter of the country."},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170 searchable 168-page PDF","chapter_boundary_control":"Heading IV begins VII.4 on PDF page 150; heading V begins VII.5 on page 153. This unit covers pages 150-153 and stops before heading V. Heading VI begins on page 155, so the next unit covers pages 153-155.","source_boundary":"Village burning, sale of booty for future pay, extreme winter, coercive submission, Episthenes's intercession, insecure quarters, Thynian night attack, rescue, hostages, and negotiated adhesion."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with attributed threats, petitions, reported motives, tactical action, environmental description, and narrated outcomes.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms occur in attributed speeches. Xenophon remains a third-person character whose warnings, petitions, and hostage policy are narrated.","uncertainty":"The justice of burning and enslavement, the reliability of Heracleides's sale, motives in the truce parley, sacrificial or divine causation, and the final terms of adhesion remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Seuthes through released prisoners","audience":"Thynians in the hills","occasion":"coercive summons","content":"Return home, live quietly, and obey, or villages and corn will be burned and hunger will follow."},{"id":"SAO-002","speaker":"Xenophon","audience":"Seuthes","occasion":"Episthenes's appeal","content":"Requests that the handsome youth not be killed and explains Episthenes's attachment and courage."},{"id":"SAO-003","speaker":"Seuthes","audience":"Episthenes","occasion":"testing the intercession","content":"Asks whether Episthenes is willing to die for the youth."},{"id":"SAO-004","speaker":"Episthenes","audience":"Seuthes and the youth","occasion":"reply to the substitution question","content":"Offers his neck if the youth requests the exchange and will thank his preserver."},{"id":"SAO-005","speaker":"Seuthes and the youth","audience":"one another","occasion":"proposed substitution","content":"Seuthes asks whether Episthenes should be killed instead; the youth pleads that neither be slain."},{"id":"SAO-006","speaker":"Episthenes","audience":"Seuthes","occasion":"final defense of the youth","content":"Embraces the boy, challenges Seuthes, and refuses to surrender him."},{"id":"SAO-007","speaker":"Xenophon","audience":"Seuthes","occasion":"camp-security warning","content":"Says the quarters are bad and that a strong open position is preferable to cover on the edge of destruction."},{"id":"SAO-008","speaker":"mountaineer parties","audience":"Xenophon","occasion":"request for mediation","content":"Ask him to help arrange truce and hostages with Seuthes."},{"id":"SAO-009","speaker":"Thynian attackers","audience":"Xenophon","occasion":"night assault","content":"Call him by name to come out and die like a man or be roasted alive inside."},{"id":"SAO-010","speaker":"Xenophon and Seuthes","audience":"one another and the submitting Thynians","occasion":"post-attack settlement","content":"Xenophon accepts submission as punishment enough, urges capable troublemakers rather than old men as hostages, and Seuthes receives the district's adhesion."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","deed":"Seuthes burns every house and sends the booty to Heracleides for sale.","outcome":"Terror and future pay are linked, but payment is not yet delivered."},{"id":"SDO-002","deed":"The army endures snow and cold that freeze water and wine.","outcome":"Greek injuries reveal the practical logic of Thracian winter clothing."},{"id":"SDO-003","deed":"Prisoners carry Seuthes's threat to the hills; noncombatants descend while younger men remain near the heights.","outcome":"Coercion produces partial submission rather than complete pacification."},{"id":"SDO-004","deed":"Seuthes and the youngest heavy infantry raid by night and shoot captured inhabitants.","outcome":"The campaign shifts from intimidation to exemplary killing."},{"id":"SDO-005","deed":"Episthenes appeals through Xenophon and offers his own life for a captive youth.","outcome":"Seuthes laughs and spares both."},{"id":"SDO-006","deed":"Seuthes distributes the army among villages to deny subsistence to the mountaineers.","outcome":"Economic pressure is joined to dispersed and vulnerable quarters."},{"id":"SDO-007","deed":"Thynians request truce and hostages while inspecting the camp.","outcome":"Negotiation serves reconnaissance and precedes surprise attack."},{"id":"SDO-008","deed":"Thynians spear, club, and burn the houses; Silanus sounds the trumpet and the Greeks break out.","outcome":"The attackers flee, with some captured or killed, while two Greek captains are wounded."},{"id":"SDO-009","deed":"Seuthes arrives with seven horsemen and a trumpeter after the breakout.","outcome":"His rescue reinforces the Greeks but follows their self-deliverance."},{"id":"SDO-010","deed":"Old hostages are delivered, Seuthes's force triples, and the Thynians seek terms.","outcome":"Xenophon advises selective hostages and the district adheres under loss of freedom."}],"sequence_repetition_omission_and_contradiction":{"sequence":["villages burned","booty sent to Perinthus","winter injuries","coercive summons","partial descent","night raid","captives shot","Episthenes intercedes","youth spared","subsistence-denial bivouac","truce request","security warning","false parley","night assault","Greek breakout","Seuthes arrives","hostages transferred","Thynian submission"],"repetitions":["Material deprivation is used as political pressure.","Xenophon intervenes between Seuthes and vulnerable persons.","Hostages are treated as instruments whose quality matters.","The Greeks repeatedly survive through readiness and rapid formation.","Promises of pay remain dependent on captured property and intermediaries."],"omissions":["The amount realized by Heracleides is not reported.","The number shot by Seuthes is not supplied.","The captive youth is unnamed.","The scale of the Thynian assault is not quantified.","The precise constitutional terms of adhesion are unstated."],"tensions":["Terror as policy versus negotiated obedience.","Old hostages versus capable hostages.","Mediation versus deceptive reconnaissance.","Seuthes's rescue versus Greek self-rescue.","Mercy toward two individuals versus mass coercion and enslavement.","Future pay versus present uncompensated service."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"BOOK_SEVEN_VII4_BOUNDARY_OBSERVATION","observation":"Heading IV begins VII.4 on PDF page 150; heading V begins VII.5 on page 153."},{"id":"OBS-002","evidence_type":"SEUTHES_TOTAL_VILLAGE_BURNING_OBSERVATION","observation":"Seuthes burns the villages to the ground and leaves not a single house."},{"id":"OBS-003","evidence_type":"TERROR_REFUSAL_OBEDIENCE_OBSERVATION","observation":"The stated purpose is to inspire terror and show enemies what refusal of obedience will bring."},{"id":"OBS-004","evidence_type":"HERACLEIDES_PERINTHUS_BOOTY_SALE_OBSERVATION","observation":"Seuthes sends Heracleides to Perinthus to sell the booty with a view to future pay for the soldiers."},{"id":"OBS-005","evidence_type":"THYNIAN_LOWLAND_ENCAMPMENT_UPLAND_FLIGHT_OBSERVATION","observation":"Seuthes and the Hellenes camp in the Thynian lowlands while the inhabitants flee to the uplands."},{"id":"OBS-006","evidence_type":"FROZEN_WATER_WINE_FROSTBITE_OBSERVATION","observation":"Snow and cold freeze dinner water and wine in jars, and many Greeks suffer frostbitten noses and ears."},{"id":"OBS-007","evidence_type":"THRACIAN_WINTER_CLOTHING_OBSERVATION","observation":"The Greeks now understand fox-skin caps, long frocks, and horsemen's shawls reaching to the feet."},{"id":"OBS-008","evidence_type":"PRISONER_HUNGER_THREAT_MESSAGE_OBSERVATION","observation":"Prisoners carry a threat that villages and corn will be burned and the inhabitants left to perish with hunger unless they return and obey."},{"id":"OBS-009","evidence_type":"NONCOMBATANT_DESCENT_YOUNG_MEN_REMAIN_OBSERVATION","observation":"Women, children, and older men descend, while younger men remain in villages on the skirts of the hills."},{"id":"OBS-010","evidence_type":"YOUNGEST_HEAVY_INFANTRY_NIGHT_EXPEDITION_OBSERVATION","observation":"Seuthes orders Xenophon to take the youngest heavy infantry on a night expedition."},{"id":"OBS-011","evidence_type":"DAYBREAK_ESCAPE_CLOSE_HILLS_OBSERVATION","observation":"The force reaches the villages by daybreak, but most inhabitants escape because the hills are close."},{"id":"OBS-012","evidence_type":"SEUTHES_UNSPARING_SHOOTING_OBSERVATION","observation":"Seuthes unsparingly shoots down those he catches."},{"id":"OBS-013","evidence_type":"EPISTHENES_HANDSOME_YOUTH_INTERCESSION_OBSERVATION","observation":"Episthenes the Olynthian asks Xenophon to rescue a handsome youth carrying a light shield."},{"id":"OBS-014","evidence_type":"BEAUTY_COMPANY_COURAGE_REPORT_OBSERVATION","observation":"Xenophon says Episthenes once enrolled a company selected for personal beauty and fought bravely with it."},{"id":"OBS-015","evidence_type":"EPISTHENES_LIFE_SUBSTITUTION_OBSERVATION","observation":"Episthenes stretches out his neck and offers to die if the boy requests it and will thank his preserver."},{"id":"OBS-016","evidence_type":"YOUTH_REFUSES_BOTH_DEATHS_OBSERVATION","observation":"The youth shakes his head and implores Seuthes to kill neither him nor Episthenes."},{"id":"OBS-017","evidence_type":"EPISTHENES_EMBRACE_CHALLENGE_OBSERVATION","observation":"Episthenes embraces the boy, challenges Seuthes to fight for him, and refuses to yield him."},{"id":"OBS-018","evidence_type":"SEUTHES_LAUGHTER_MERCY_OBSERVATION","observation":"Seuthes laughs and consents to spare both."},{"id":"OBS-019","evidence_type":"SUBSISTENCE_DENIAL_BIVOUAC_OBSERVATION","observation":"Seuthes keeps the army in the villages to deprive the mountaineers further of subsistence."},{"id":"OBS-020","evidence_type":"DISPERSED_QUARTERS_OBSERVATION","observation":"Seuthes secretly descends to the plain, Xenophon holds the highest village with picked troops, and the remaining Greeks lodge nearby."},{"id":"OBS-021","evidence_type":"MOUNTAINEER_TRUCE_HOSTAGE_REQUEST_OBSERVATION","observation":"Mountaineers come down seeking truce and hostages after several days."},{"id":"OBS-022","evidence_type":"XENOPHON_BAD_QUARTERS_WARNING_OBSERVATION","observation":"Xenophon tells Seuthes that the quarters are bad, with the enemy next door, and an open strong position would be safer."},{"id":"OBS-023","evidence_type":"SEUTHES_HOSTAGE_REASSURANCE_OBSERVATION","observation":"Seuthes bids Xenophon take heart and points to the existing hostages."},{"id":"OBS-024","evidence_type":"XENOPHON_MEDIATION_ASSURANCE_OBSERVATION","observation":"Xenophon agrees to mediate and assures the mountaineers of safety if they obey Seuthes."},{"id":"OBS-025","evidence_type":"FALSE_PARLEY_RECONNAISSANCE_OBSERVATION","observation":"The narrator states that the parley was merely intended to obtain a closer inspection of the quarters."},{"id":"OBS-026","evidence_type":"HOUSEHOLDER_GUIDED_NIGHT_ATTACK_OBSERVATION","observation":"At night house owners guide the Thynians to palisaded dwellings that would otherwise be difficult to find."},{"id":"OBS-027","evidence_type":"SPEAR_CLUB_FIRE_XENOPHON_CALL_OBSERVATION","observation":"Attackers use spears, clubs, and fire while calling Xenophon to come out and die or be roasted alive."},{"id":"OBS-028","evidence_type":"SILANUS_TRUMPET_BREAKOUT_OBSERVATION","observation":"Silanus, about eighteen years old, sounds the trumpet and the armed Greeks leap out with drawn swords."},{"id":"OBS-029","evidence_type":"DARKNESS_GLARE_WOUNDED_CAPTAINS_OBSERVATION","observation":"Thynians throw javelins from darkness at men outlined by a burning house, wounding Hieronymus and Theogenes; no Greek is killed, though clothing and baggage burn."},{"id":"OBS-030","evidence_type":"SEVEN_TROOPERS_HOSTAGES_SUBMISSION_OBSERVATION","observation":"Seuthes arrives with seven troopers and a trumpeter; next day he transfers old hostages, returns with a tripled force, receives Thynian supplication, and accepts adhesion after Xenophon advises taking capable troublemakers as hostages and leaving old men at home."}],"provisional_findings":[{"id":"PF-001","finding":"The burning of every house is narrated as an explicit technology of terror rather than incidental destruction."},{"id":"PF-002","finding":"Booty sale is designated as the means of future pay, but the chapter supplies no actual payment or accounting."},{"id":"PF-003","finding":"Environmental knowledge embodied in Thracian clothing becomes intelligible to the Greeks through injury."},{"id":"PF-004","finding":"Seuthes seeks obedience through threatened hunger as well as direct force."},{"id":"PF-005","finding":"Xenophon's intercession saves a captive only because Seuthes retains and exercises the power to spare."},{"id":"PF-006","finding":"Episthenes's erotic attachment and courage are joined in the episode without establishing a general doctrine of beauty or virtue."},{"id":"PF-007","finding":"Existing hostages do not secure the dispersed camp; the truce request becomes reconnaissance."},{"id":"PF-008","finding":"Silanus's signal and Greek readiness avert destruction before Seuthes arrives."},{"id":"PF-009","finding":"Seuthes's rescue is real but late and initially consists of only seven troopers and a trumpeter."},{"id":"PF-010","finding":"Xenophon's hostage advice substitutes capable potential offenders for old symbolic captives while accepting the Thynians' loss of freedom as punishment."}],"standing_unresolved_questions":[{"id":"UQ-001","question":"What standard, if any, governs the justice of burning every house?"},{"id":"UQ-002","question":"How much booty does Heracleides receive and what price does it later bring?"},{"id":"UQ-003","question":"Does the promised future pay reach the soldiers in full?"},{"id":"UQ-004","question":"How many Greeks suffer permanent injury from the cold?"},{"id":"UQ-005","question":"Why do the younger Thynian men remain near the hills after the noncombatants descend?"},{"id":"UQ-006","question":"How many captives does Seuthes shoot?"},{"id":"UQ-007","question":"Who is the unnamed youth and what later becomes of him?"},{"id":"UQ-008","question":"What evidence supports the report about Episthenes's beauty-selected company?"},{"id":"UQ-009","question":"Does Seuthes spare the pair from persuasion, amusement, admiration, or another motive?"},{"id":"UQ-010","question":"Why does Seuthes choose dispersed village quarters despite the security risk?"},{"id":"UQ-011","question":"Who selected the elderly hostages and why were they considered sufficient?"},{"id":"UQ-012","question":"Who planned the false truce parley as reconnaissance?"},{"id":"UQ-013","question":"How large was the attacking Thynian force?"},{"id":"UQ-014","question":"How many attackers were captured or killed during the breakout?"},{"id":"UQ-015","question":"Why is Seuthes initially able to reach the Greeks with only seven troopers?"},{"id":"UQ-016","question":"What obligations and losses of status are contained in the district's adhesion?"}],"downstream_textual_checks":[{"id":"TC-001","check":"Track Heracleides's disposal of booty and the pay actually produced in VII.5."},{"id":"TC-002","check":"Compare future-pay language with later claims of arrears."},{"id":"TC-003","check":"Track whether Seuthes renews or withdraws promises of towns to Xenophon."},{"id":"TC-004","check":"Compare Thracian winter clothing with later environmental judgments."},{"id":"TC-005","check":"Track Episthenes or the rescued youth if either reappears."},{"id":"TC-006","check":"Compare elderly hostages with Xenophon's proposed capable hostages."},{"id":"TC-007","check":"Track whether Thynian adhesion remains stable."},{"id":"TC-008","check":"Track the wounds of Hieronymus and Theogenes."},{"id":"TC-009","check":"Distinguish political enslavement from any later sale of persons."},{"id":"TC-010","check":"Compare Seuthes's tripled force with the later balance between Thracian and Hellenic troops."},{"id":"TC-011","check":"Verify VII.5 at PDF pages 153-155 and heading VI on page 155."},{"id":"TC-012","check":"Compare Xenophon's restraint toward captives with his later defense before the soldiers."}],"secondary_comparison_status":"DEFERRED"}