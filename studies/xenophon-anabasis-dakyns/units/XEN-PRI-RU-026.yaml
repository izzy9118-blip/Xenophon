scope: {"work_locator":"Anabasis IV.5","pdf_pages_one_based":"81-84","opening_anchor":"The next day it was resolved that they should set off with all possible speed, before the enemy had time to collect and occupy the defile.","closing_anchor":"It was here too that their friend the headman explained to them, how they should wrap small bags or sacks around the feet of the horses and other cattle when marching through the snow, for without such precautions the creatures sank up to their bellies."}
jurisdiction: "Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no isolated observation licenses a deed corpus, speech register, guard, adapter, or ministerial capacity."
bibliographic_and_witness_control: {"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg ebook 1170 captured as a 168-page searchable PDF","locator_rule":"Anabasis IV.5 plus one-based PDF page","chapter_boundary_control":"IV.5 begins beneath heading V on PDF page 81 and ends on PDF page 84 immediately before heading VI. IV.6 begins on page 84 and continues through page 87.","source_boundary":"March decisions, distance reports, textual variants, sacrificial action, weather effects, mortality reports, barter, medical explanation, orders, coercive rescue, enemy pursuit, deception, billeting, seizure of villagers and animals, dwelling description, hospitality, interrogation, gifts, sacrifice, and snow-travel advice remain distinct. Notes on parasang numerals, boulimia, manuscript omission, and alternative wording remain witness paratext."}
narrative_person_and_authorial_attribution: {"narrative_mode":"Third-person historical narration presenting Xenophon as rearguard commander, distributor of food, rescuer of exhausted soldiers, guest of the village headman, and participant in interrogation and exchange.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"observation":"Xenophon acts repeatedly in the rear, personally distributes food, pleads with exhausted men, uses a tactical feint to protect them, and later hosts and questions the Armenian headman. No unframed first-person narrator identifies himself with Xenophon.","uncertainty":"The witness does not settle the Greek force of boulimia, compulsion, guest, headman, priest of the sun, tribute, sacrifice, friend, or the relation between narrator and historical author."}
speakers_audiences_and_occasions:
- {"id":"SAO-001","locator":"Anabasis IV.5; PDF p. 81","speech_form":"collective_march_resolution","speaker":"Greek command","audience":"army","occasion":"departure after Tiribazus operation","content":"Set off at maximum speed before the enemy can collect and occupy the defile.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SAO-002","locator":"Anabasis IV.5; PDF p. 81","speech_form":"sacrificial_advice","speaker":"unnamed seer","audience":"Greek command and army","occasion":"north wind and deep snow","content":"Sacrifice to Boreas.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SAO-003","locator":"Anabasis IV.5; PDF p. 81","speech_form":"exchange_terms","speaker":"early-arriving soldiers with fires","audience":"late-arriving soldiers","occasion":"night halt without enough wood","content":"Access to fires is exchanged for shares of corn or other provisions.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SAO-004","locator":"Anabasis IV.5; PDF pp. 81-82","speech_form":"medical_diagnosis_and_advice","speaker":"unnamed experienced person","audience":"Xenophon","occasion":"men collapsing during the snow march","content":"The men have boulimia and will revive if given food.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SAO-005","locator":"Anabasis IV.5; PDF p. 82","speech_form":"identity_cover_story","speaker":"Persian-speaking interpreters","audience":"Armenian women and girls","occasion":"approach to a fortified village","content":"The Greeks are traveling from the king to the satrap.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SAO-006","locator":"Anabasis IV.5; PDF p. 82","speech_form":"local_information_report","speaker":"Armenian women and girls","audience":"Cheirisophus and interpreters","occasion":"response to the cover story","content":"The satrap is away about one parasang farther on.","uncertainty":"Greek wording and scope remain open."}
speeches_deeds_and_outcomes:
- {"id":"SDO-001","locator":"Anabasis IV.5; PDF p. 81","actor":"Greek army","deed":"Marches rapidly through deep snow with several guides, crosses the pass intended for Tiribazus's attack, then reaches the Euphrates and crosses waist-deep.","outcome":"The threatened defile is passed before enemy occupation.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SDO-002","locator":"Anabasis IV.5; PDF p. 81","actor":"seer and army","deed":"Sacrifice to Boreas is performed during a brutal north wind.","outcome":"The narrator reports an obvious reduction in the wind's fierceness.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SDO-003","locator":"Anabasis IV.5; PDF p. 81","actor":"army, baggage animals, enslaved persons","deed":"Continues through roughly six feet of snow.","outcome":"Many animals and slaves and about thirty soldiers are lost.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SDO-004","locator":"Anabasis IV.5; PDF p. 81","actor":"early and late arrivals","deed":"Creates a night market in fire access, food, and other goods.","outcome":"Private exchange partially allocates scarce warmth and provisions.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SDO-005","locator":"Anabasis IV.5; PDF pp. 81-82","actor":"Xenophon and sufferers","deed":"Learns the diagnosis of boulimia, requisitions visible food from the baggage train, and distributes it personally or through able-bodied agents.","outcome":"Collapsed men revive and resume the march.","uncertainty":"Greek wording and scope remain open."}
- {"id":"SDO-006","locator":"Anabasis IV.5; PDF p. 82","actor":"Cheirisophus and forward troops","deed":"Uses a Persian cover story, enters a fortified village with water carriers, and secures cantonments.","outcome":"Those unable to reach the village remain outside without food or fire, and some die.","uncertainty":"Greek wording and scope remain open."}
sequence_repetition_omission_and_contradiction: {"sequence":["Rapid passage of the threatened defile","Euphrates crossing and deep-snow march","Sacrifice to Boreas and reported diminished wind","Losses among animals, slaves, and soldiers","Night barter around fires","Boulimia diagnosis and emergency food distribution","Fortified village reached by the van while others die outside","Snow blindness, frostbite, pursuit, and abandonment","Rearguard deception protects invalids","Village allotment and Polycrates seizure","Underground dwellings and barley wine","Headman hosted under guard and used for route intelligence","Feasting, gifts, tribute horses, sacrifice, and snow-footwear advice"],"repetitions":["Weather repeatedly converts movement, food, shelter, and command into immediate survival problems.","Rear and van repeatedly experience unequal access to shelter and information.","Xenophon repeatedly turns personal intervention into collective recovery."],"omissions":["Names of the seer, medical adviser, women, girls, most dead, and invalids are absent.","No authority is stated for requisitioning food or forcing the sick onward.","The fate and status of captured villagers beyond the chapter are not fully given."],"tensions":["Sacrifice and practical adaptation are narrated together.","Men who refuse movement are both protected and compelled.","The Greeks claim royal affiliation through a false cover story while moving independently.","The headman is guest, prisoner, guide, and exchange partner at once."]}
documentary_observations:
- {"id":"OBS-001","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"MARCH_SPEED_DECISION_OBSERVATION","observation":"The command resolves to depart at maximum speed before enemy concentration at the defile.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-005","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"TEXTUAL_VARIANT_OBSERVATION","observation":"A note preserves competing numeral readings ten and five for the latter distance.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-007","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"SACRIFICIAL_DECISION_OBSERVATION","observation":"An unnamed seer advises sacrifice to Boreas and the army performs it.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-008","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"DIVINE_CAUSATION_REPORT_OBSERVATION","observation":"The narrator reports an obvious reduction in the wind after sacrifice without independently adjudicating causation.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-010","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"MORTALITY_REPORT_OBSERVATION","observation":"Many baggage animals and slaves and about thirty soldiers are lost in the snow.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-012","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"BARTER_INSTITUTION_OBSERVATION","observation":"Fire access is exchanged for shares of food, producing a general exchange of goods.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-013","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"MEDICAL_CONDITION_OBSERVATION","observation":"Many soldiers collapse with boulimia or hunger-faintness.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-015","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"REQUISITION_OBSERVATION","observation":"Xenophon places an embargo on visible food in the baggage train.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-018","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"COVER_STORY_OBSERVATION","observation":"Interpreters tell Armenian women that the army comes from the king to the satrap.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-020","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"EXPOSURE_DEATH_OBSERVATION","observation":"Some soldiers outside the village die during the night.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-022","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"SNOW_BLINDNESS_OBSERVATION","observation":"Soldiers are disabled by snow blindness; black material before the eyes is reported as relief.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-023","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"FROSTBITE_OBSERVATION","observation":"Toes mortify from cold; continual movement and loosening sandals at night are reported remedies.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-027","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"TACTICAL_DECEPTION_OBSERVATION","observation":"Healthy rearguards and invalids simulate strength with a charge, shouting, and shield-clashing.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-031","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"VILLAGE_SEIZURE_OBSERVATION","observation":"Polycrates captures villagers, the headman, a newly married daughter, and seventeen young tribute horses.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-032","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"SUBTERRANEAN_DWELLING_OBSERVATION","observation":"Armenian houses are underground, entered by a well-like opening and ladder, with separate animal access.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-033","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"BARLEY_WINE_OBSERVATION","observation":"Strong barley wine is drunk through reeds from large bowls and is described as delicious to acquired taste.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-034","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"COERCIVE_HOSPITALITY_OBSERVATION","observation":"Xenophon treats the captive headman as a supper guest while keeping him and his children under watch.","uncertainty":"Greek wording and scope remain open."}
- {"id":"OBS-036","locator":"Anabasis IV.5; PDF pp. 81-84","evidence_type":"SNOW_TRAVEL_TECHNIQUE_OBSERVATION","observation":"The headman advises wrapping bags around animal feet so they do not sink to their bellies in snow.","uncertainty":"Greek wording and scope remain open."}
provisional_findings:
- {"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"IV.5 presents climate as an adversary capable of causing losses comparable to armed enemies.","basis":"Weather, snow depth, exposure deaths, medical collapse.","uncertainty":"The inference remains limited to IV.5 and requires comparison with the Greek and later chapters."}
- {"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"Leadership repeatedly depends on recognizing and redistributing scarce food, warmth, labor, shelter, and information.","basis":"Fire barter, food requisition, billets, guides.","uncertainty":"The inference remains limited to IV.5 and requires comparison with the Greek and later chapters."}
- {"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"Xenophon is portrayed as a rearguard commander whose authority combines personal service, anger, coercion, and tactical deception.","basis":"Food distribution, pleas, forced march, feint.","uncertainty":"The inference remains limited to IV.5 and requires comparison with the Greek and later chapters."}
- {"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"Sacrifice is integrated with operational response rather than replacing it.","basis":"Boreas sacrifice alongside speed, fire, food, and equipment adaptations.","uncertainty":"The inference remains limited to IV.5 and requires comparison with the Greek and later chapters."}
- {"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"The rear suffers a systematically different war from the van.","basis":"Village access, stragglers, pursuers, invalids.","uncertainty":"The inference remains limited to IV.5 and requires comparison with the Greek and later chapters."}
- {"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"Private exchange emerges under scarcity even inside a military emergency.","basis":"Fire-for-food barter.","uncertainty":"The inference remains limited to IV.5 and requires comparison with the Greek and later chapters."}
standing_unresolved_questions:
- {"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"What Greek term and medical conception underlie Dakyns's boulimia or hunger-faintness?"}
- {"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"How should the Boreas sacrifice and diminished wind be related textually without asserting causation?"}
- {"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"Which numeral reading governs the disputed parasang total?"}
- {"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"What legal or customary authority supported Xenophon's requisition of food?"}
- {"id":"Q-005","evidence_type":"UNRESOLVED_QUESTION","question":"Were the slaves lost enslaved persons accompanying Greeks, locally captured persons, or both?"}
- {"id":"Q-006","evidence_type":"UNRESOLVED_QUESTION","question":"How many soldiers died from exposure outside the village?"}
- {"id":"Q-007","evidence_type":"UNRESOLVED_QUESTION","question":"What is the status of those abandoned with snow blindness or frostbite?"}
- {"id":"Q-008","evidence_type":"UNRESOLVED_QUESTION","question":"Does the text imply that the pursuers died in the dell or merely disappeared from hearing?"}
- {"id":"Q-009","evidence_type":"UNRESOLVED_QUESTION","question":"What force lies behind Xenophon's orders to make or force sick men proceed?"}
- {"id":"Q-010","evidence_type":"UNRESOLVED_QUESTION","question":"How should the Persian cover story be classified relative to earlier claims about truthfulness?"}
