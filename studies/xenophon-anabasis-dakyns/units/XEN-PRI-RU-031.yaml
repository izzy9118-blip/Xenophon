{"schema_version":1.0,"unit_id":"XEN-PRI-RU-031","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis V.2","pdf_pages_one_based":"96-98","opening_anchor":"The time came when it was no longer possible to capture provisions, going and returning to the camp in one day.","closing_anchor":"In this way they all reached the camp in safety."},"jurisdiction":"Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no isolated observation licenses a deed corpus, speech register, guard, adapter, or ministerial capacity.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg ebook 1170 captured as a 168-page searchable PDF","locator_rule":"Anabasis V.2 plus one-based PDF page","chapter_boundary_control":"V.2 begins beneath heading II on PDF page 96 and ends on PDF page 98 immediately before heading III. V.3 begins beneath heading III on PDF page 99 and ends on page 100; heading IV begins on page 101.","source_boundary":"Provision exhaustion, guide interests, defensive burning, premature assault, sacrificial prediction, coordinated attack, looting, inner-citadel reversal, retreat, divine and fortune language, city burning, false ambush, rescue, and the Mysus name note remain distinct. The Mysus note remains witness paratext."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration presenting Xenophon as commander, tactical decision-maker, interpreter of sacrifice and fortune, and organizer of retreat and deception.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"observation":"Xenophon selects guides, divides the force, weighs withdrawal against assault, commits the heavy infantry, directs the attack, restrains hoplites, orders renewed entry and burning, and arranges the false ambush.","uncertainty":"The witness does not settle the Greek force of capture provisions, metropolis, manly virtue, warrior-god, victims, some god, fortune, useless, capture aught, or false ambuscade."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"Anabasis V.2; PDF p. 96","speech_form":"guide_selection_context","speaker":"narrator reporting Trapezuntine disposition","audience":"reader","occasion":"one-day provisioning fails","content":"Trapezuntines avoid guiding Greeks against friendly inhabitants but willingly lead them against Drilae who harmed them.","uncertainty":"Narratorial attribution, not quotation."},{"id":"SAO-002","locator":"Anabasis V.2; PDF p. 96","speech_form":"trapped_force_message","speaker":"unnamed messenger","audience":"Xenophon","occasion":"storming force trapped beyond ravine","content":"The stronghold is full of stores but too strong to take, and enemy sallies make withdrawal difficult.","uncertainty":"Crisis testimony."},{"id":"SAO-003","locator":"Anabasis V.2; PDF pp. 96-97","speech_form":"sacrificial_prediction_report","speaker":"seers as reported","audience":"command","occasion":"withdraw-or-reinforce decision","content":"There will be a battle, but the expedition will have a good result.","uncertainty":"Victims, deity, and formula absent."},{"id":"SAO-004","locator":"Anabasis V.2; PDF p. 97","speech_form":"missile_readiness_order","speaker":"Xenophon","audience":"light troops, archers, slingers","occasion":"assault preparation","content":"Ready javelins, strung arrows, and stocked slingstone wallets for discharge on command.","uncertainty":"Technical Greek requires review."},{"id":"SAO-005","locator":"Anabasis V.2; PDF p. 97","speech_form":"battle_signal_sequence","speaker":"Greek command and army","audience":"assault force","occasion":"attack begins","content":"Battle hymn, clarion, and cry to the warrior-god signal the charge.","uncertainty":"Deity and words absent."},{"id":"SAO-006","locator":"Anabasis V.2; PDF p. 97","speech_form":"inner_citadel_report","speaker":"fugitives from inside","audience":"Greeks at gates","occasion":"inner counterattack","content":"A citadel remains, and numerous defenders are beating those inside.","uncertainty":"Reported amid flight and wounds."},{"id":"SAO-007","locator":"Anabasis V.2; PDF p. 97","speech_form":"general_entry_proclamation","speaker":"Tolmides on Xenophon's order","audience":"army","occasion":"reverse inner counterattack","content":"All who wish to capture anything are ordered to enter.","uncertainty":"Reinforcement and looting are combined."},{"id":"SAO-008","locator":"Anabasis V.2; PDF p. 98","speech_form":"fire_barrier_order","speaker":"Xenophon and command","audience":"Greek troops","occasion":"dangerous retreat","content":"Pile and ignite logs and burn houses along the trench works.","uncertainty":"Civilian presence unstated."},{"id":"SAO-009","locator":"Anabasis V.2; PDF p. 98","speech_form":"false_ambush_signal","speaker":"Greek command","audience":"Mysus and ten Cretans","occasion":"cover descent","content":"Suggest an ambush from brush, then flee after the army descends.","uncertainty":"No direct quotation."},{"id":"SAO-010","locator":"Anabasis V.2; PDF p. 98","speech_form":"escape_judgment","speaker":"ten Cretans","audience":"one another","occasion":"decoy withdrawal","content":"They say road racing will get them caught and escape through woods instead.","uncertainty":"Exact words unknown."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","locator":"Anabasis V.2; PDF p. 96","actor":"Xenophon, guides, army","deed":"Xenophon takes half the army against the Drilae and leaves half to guard camp.","outcome":"Provisioning, defense, and local enmity divide the force.","uncertainty":"Totals absent."},{"id":"SDO-002","locator":"Anabasis V.2; PDF p. 96","actor":"Drilae and Greek vanguard","deed":"Drilae burn easy positions; Greek light troops and foragers rush across the ravine.","outcome":"More than two thousand become trapped.","uncertainty":"Authorization unreported."},{"id":"SDO-003","locator":"Anabasis V.2; PDF pp. 96-97","actor":"Xenophon, officers, seers","deed":"Command weighs withdrawal against reinforcement and commits heavy infantry on casualty calculation, confidence, and sacrificial prediction.","outcome":"A full assault is prepared.","uncertainty":"Decision procedure incomplete."},{"id":"SDO-004","locator":"Anabasis V.2; PDF p. 97","actor":"Greek assault force","deed":"Captains configure companies; missiles, crescent formation, hymn, clarion, cry, charge, and firebrands combine.","outcome":"Defenders abandon outer works.","uncertainty":"Geometry and casualties absent."},{"id":"SDO-005","locator":"Anabasis V.2; PDF p. 97","actor":"Agasias, Philoxenus, light troops","deed":"The two strip heavy armor, climb, and help others while light troops seize goods.","outcome":"Outer capture proves incomplete.","uncertainty":"Sequence mediated by translation."},{"id":"SDO-006","locator":"Anabasis V.2; PDF p. 97","actor":"Xenophon, Tolmides, crowd","deed":"After holding hoplites at the gates, Xenophon summons all seeking plunder to enter.","outcome":"The incoming crowd drives defenders into the citadel.","uncertainty":"Tactical and private motives coexist."},{"id":"SDO-007","locator":"Anabasis V.2; PDF pp. 97-98","actor":"Greek command","deed":"Command judges the citadel impregnable, dismantles palisading, sends burdened men away, and leaves trusted rear detachments.","outcome":"A staged retreat begins.","uncertainty":"Dakyns's useless requires review."},{"id":"SDO-008","locator":"Anabasis V.2; PDF p. 98","actor":"Drilaean defenders","deed":"Defenders sally, scale houses, and hurl beams as night approaches.","outcome":"Stopping and fleeing are both dangerous.","uncertainty":"Equipment labels mediated."},{"id":"SDO-009","locator":"Anabasis V.2; PDF p. 98","actor":"unknown fire-setter, Xenophon, Greeks","deed":"An unexplained fire causes flight; Xenophon treats it as fortune's lesson and expands the burning.","outcome":"Fire permits escape and the city burns except the citadel.","uncertainty":"Divine claim and ignition source unresolved."},{"id":"SDO-010","locator":"Anabasis V.2; PDF p. 98","actor":"Mysus and ten Cretans","deed":"They stage a false ambush with glinting shields while the army descends.","outcome":"The enemy hesitates.","uncertainty":"Enemy belief inferred."},{"id":"SDO-011","locator":"Anabasis V.2; PDF p. 98","actor":"Mysus and Cretans","deed":"Mysus runs the road; Cretans plunge through woods and gullies.","outcome":"Cretans escape; Mysus is wounded.","uncertainty":"Other injuries absent."},{"id":"SDO-012","locator":"Anabasis V.2; PDF p. 98","actor":"rescue party, Mysus, Cretan archers","deed":"A party retrieves Mysus and retreats facing the enemy under covering arrows.","outcome":"All reach camp safely.","uncertainty":"Numbers and losses absent."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Provision radius fails and force divides","Drilaean burning and vanguard overextension","Trapped-force message","Council, sacrifice, and reinforcement","Coordinated assault","Outer capture, looting, and inner reversal","Plunder proclamation and renewed entry","Citadel judged impregnable and retreat prepared","Unknown fire, deliberate burning, and escape","False ambush, wounded decoy, rescue"],"repetitions":["Scarcity drives attack.","Local guides direct violence through local loyalties.","Competition and acquisition accelerate movement.","Xenophon turns reversals into new orders.","Fire is used by both sides."],"omissions":["No Drilaean voices or casualty count.","Guides, messenger, seers, fire-setter, and most wounded are unnamed.","No accounting of loot or destruction.","No explicit order precedes the vanguard rush.","No aftermath for the burned city."],"tensions":["Allied guidance follows private grievance.","Sacrifice and casualty calculation jointly authorize escalation.","Hoplite restraint is followed by a general plunder summons.","The place is taken only provisionally.","Unexplained fire becomes deliberate city destruction.","The saving decoy requires rescue."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"PROVISION_RADIUS_FAILURE_OBSERVATION","observation":"It is no longer possible to capture provisions and return within one day.","uncertainty":"Cause unquantified."},{"id":"OBS-002","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"DIVIDED_FORCE_OBSERVATION","observation":"Xenophon leads half the army and leaves half at camp.","uncertainty":"Totals absent."},{"id":"OBS-003","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"DISPLACED_COLCHIAN_SURVEILLANCE_OBSERVATION","observation":"Displaced Colchians gather on heights and watch camp.","uncertainty":"Intent unstated."},{"id":"OBS-004","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"GUIDE_PARTIALITY_OBSERVATION","observation":"Trapezuntines refuse to guide against friends but eagerly guide against Drilae who harmed them.","uncertainty":"Narratorial motive attribution."},{"id":"OBS-005","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"REPORTED_WARLIKE_SUPERLATIVE_OBSERVATION","observation":"Drilae are called the most warlike people in Pontus.","uncertainty":"Not independently authenticated."},{"id":"OBS-006","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"DEFENSIVE_SCORCHED_EARTH_OBSERVATION","observation":"Drilae burn fastnesses they deem easily captured.","uncertainty":"Evacuation unstated."},{"id":"OBS-007","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"FORTIFIED_METROPOLIS_OBSERVATION","observation":"Population streams gather in a ravine-protected metropolis.","uncertainty":"Metropolis requires Greek review."},{"id":"OBS-008","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"UNAUTHORIZED_VANGUARD_RUSH_OBSERVATION","observation":"Light troops and foragers run far ahead and attack without a recorded order.","uncertainty":"Customary authority unknown."},{"id":"OBS-009","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"APPROXIMATE_STORMING_FORCE_OBSERVATION","observation":"More than two thousand Greeks are reported across the ravine.","uncertainty":"Approximate count."},{"id":"OBS-010","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"SINGLE_FILE_RETREAT_TRAP_OBSERVATION","observation":"The descent permits single-file retreat while defenders strike from behind.","uncertainty":"Terrain unsurveyed."},{"id":"OBS-011","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"TRAPPED_FORCE_MESSAGE_OBSERVATION","observation":"A messenger reports abundant stores, failed capture, sallies, and difficult return.","uncertainty":"Crisis testimony."},{"id":"OBS-012","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"WITHDRAW_OR_REINFORCE_COUNCIL_OBSERVATION","observation":"Command explicitly weighs withdrawal against reinforcement.","uncertainty":"No vote recorded."},{"id":"OBS-013","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"SACRIFICIAL_FORECAST_OBSERVATION","observation":"Seers announce battle and a good outcome from victims.","uncertainty":"Deity and signs absent."},{"id":"OBS-014","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"CAPTAIN_CONFIGURATION_DISCRETION_OBSERVATION","observation":"Each captain forms his company as he judges most effective.","uncertainty":"Limits unstated."},{"id":"OBS-015","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"COMPETITIVE_MANLY_VIRTUE_OBSERVATION","observation":"Captains compete for an award of manly virtue.","uncertainty":"Greek evaluation unsettled."},{"id":"OBS-016","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"MISSILE_READINESS_OBSERVATION","observation":"Javelins, bows, and slingstone wallets are prepared for coordinated use.","uncertainty":"Technical terms require review."},{"id":"OBS-017","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"CRESCENT_TERRAIN_FORMATION_OBSERVATION","observation":"The ground invites a crescent-like disposition.","uncertainty":"No diagram."},{"id":"OBS-018","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"RITUALIZED_ASSAULT_SIGNAL_OBSERVATION","observation":"Hymn, clarion, and cry to the warrior-god precede the charge.","uncertainty":"God unnamed."},{"id":"OBS-019","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"FIREBRAND_ASSAULT_OBSERVATION","observation":"Some attackers carry firebrands alongside missiles.","uncertainty":"Targets unstated."},{"id":"OBS-020","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"ARMOR_SHEDDING_SCALING_OBSERVATION","observation":"Agasias and Philoxenus shed armor and scale in tunics.","uncertainty":"Sequence mediated."},{"id":"OBS-021","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"PREMATURE_CAPTURE_ASSESSMENT_OBSERVATION","observation":"The place is taken only as the Greeks initially think.","uncertainty":"Corrected perception."},{"id":"OBS-022","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"LOOTING_SURGE_OBSERVATION","observation":"Light troops snatch whatever each can.","uncertainty":"Distribution absent."},{"id":"OBS-023","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"GATE_RESERVE_OBSERVATION","observation":"Xenophon holds hoplites at the gates against visible external enemies.","uncertainty":"Reserve size absent."},{"id":"OBS-024","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"PLUNDER_PROCLAMATION_AS_REINFORCEMENT_OBSERVATION","observation":"Tolmides invites all who wish to capture anything, reversing the gate flow.","uncertainty":"Motives inseparable."},{"id":"OBS-025","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"INNER_CITADEL_IMPREGNABILITY_OBSERVATION","observation":"Command judges the inner citadel impregnable.","uncertainty":"Assessment details absent."},{"id":"OBS-026","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"SELECTIVE_RETREAT_ECHELON_OBSERVATION","observation":"Burdened men depart with most hoplites while trusted men cover retreat.","uncertainty":"Useless requires Greek control."},{"id":"OBS-027","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"DIVINE_ESCAPE_REPORT_OBSERVATION","observation":"The narrator says some god gives a means of safety through sudden fire.","uncertainty":"God and fire-setter unknown."},{"id":"OBS-028","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"FORTUNE_LESSON_OBSERVATION","observation":"Xenophon treats the fire as a lesson of fortune and expands it tactically.","uncertainty":"Greek relation of god and fortune unsettled."},{"id":"OBS-029","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"CITY_BURNING_OBSERVATION","observation":"The Greeks burn the city except the citadel to escape.","uncertainty":"Civilian losses omitted."},{"id":"OBS-030","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"FALSE_AMBUSH_OBSERVATION","observation":"Mysus and ten Cretans stage a false ambush with shield glints.","uncertainty":"Enemy belief inferred."},{"id":"OBS-031","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"DECOY_ROUTE_DIVERGENCE_OBSERVATION","observation":"Mysus uses the road while Cretans escape through woods and gullies.","uncertainty":"Route choice briefly explained."},{"id":"OBS-032","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"WOUNDED_DECOY_RESCUE_OBSERVATION","observation":"Mysus is recovered wounded under covering fire and all reach camp.","uncertainty":"Other wounds absent."},{"id":"OBS-033","locator":"Anabasis V.2; PDF pp. 96-98","evidence_type":"EDITORIAL_PARATEXT_OBSERVATION","observation":"A note explains Mysus as both a Mysian by birth and Mysus by name.","uncertainty":"Witness paratext."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"Provision range determines force size and target choice.","basis":"One-day failure, divided force, guides.","uncertainty":"Limited to V.2."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"Local allies shape Greek violence through their own loyalties.","basis":"Guide refusal and enthusiasm.","uncertainty":"Limited to V.2."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"Premature initiative requires later command consolidation.","basis":"Vanguard rush and heavy reinforcement.","uncertainty":"Limited to V.2."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"Sacrifice and casualty calculation jointly authorize escalation.","basis":"Victims and expected retreat losses.","uncertainty":"Limited to V.2."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"Competitive honor is a tactical resource with irregular risks.","basis":"Captains, Agasias, Philoxenus.","uncertainty":"Limited to V.2."},{"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"Looting can serve as motivation and reinforcement while threatening order.","basis":"Gate proclamation.","uncertainty":"Limited to V.2."},{"id":"FIND-007","evidence_type":"PROVISIONAL_INFERENCE","finding":"Xenophon learns through corrected perceptions and accidents.","basis":"Inner reversal and first fire.","uncertainty":"Limited to V.2."},{"id":"FIND-008","evidence_type":"PROVISIONAL_INFERENCE","finding":"Divine help is converted into systematic human action.","basis":"Some god, fortune, expanded fires.","uncertainty":"Causation unresolved."},{"id":"FIND-009","evidence_type":"PROVISIONAL_INFERENCE","finding":"Fire is reciprocal but asymmetrical in purpose and scale.","basis":"Drilaean denial and Greek city burning.","uncertainty":"Limited to V.2."},{"id":"FIND-010","evidence_type":"PROVISIONAL_INFERENCE","finding":"Successful deception still requires rescue and disciplined retreat.","basis":"False ambush and Mysus rescue.","uncertainty":"Limited to V.2."}],"standing_unresolved_questions":[{"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"What Greek terms govern capture provisions and foraging radius?"},{"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"How does the narrator know guide loyalties and grievances?"},{"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"What does metropolis mean here?"},{"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"Was the vanguard rush authorized?"},{"id":"Q-005","evidence_type":"UNRESOLVED_QUESTION","question":"What victims, deity, and signs supported the prediction?"},{"id":"Q-006","evidence_type":"UNRESOLVED_QUESTION","question":"How should manly virtue be translated?"},{"id":"Q-007","evidence_type":"UNRESOLVED_QUESTION","question":"Which warrior-god is invoked?"},{"id":"Q-008","evidence_type":"UNRESOLVED_QUESTION","question":"What are the precise formation and missile terms?"},{"id":"Q-009","evidence_type":"UNRESOLVED_QUESTION","question":"How should the provisional capture judgment be read?"},{"id":"Q-010","evidence_type":"UNRESOLVED_QUESTION","question":"Does the proclamation summon help, authorize plunder, or both?"},{"id":"Q-011","evidence_type":"UNRESOLVED_QUESTION","question":"What category is rendered useless?"},{"id":"Q-012","evidence_type":"UNRESOLVED_QUESTION","question":"What Greek supports the divine-aid report?"},{"id":"Q-013","evidence_type":"UNRESOLVED_QUESTION","question":"How are god, fortune, and tactical learning related?"},{"id":"Q-014","evidence_type":"UNRESOLVED_QUESTION","question":"Who ignited the first house?"},{"id":"Q-015","evidence_type":"UNRESOLVED_QUESTION","question":"What losses followed the city burning?"},{"id":"Q-016","evidence_type":"UNRESOLVED_QUESTION","question":"What command and signal governed the false ambush?"},{"id":"Q-017","evidence_type":"UNRESOLVED_QUESTION","question":"What is Mysus's status, and is the name note editorial?"},{"id":"Q-018","evidence_type":"UNRESOLVED_QUESTION","question":"How many rescuers, wounded, and provisions returned?"}],"downstream_textual_checks":[{"id":"CHECK-001","check":"Check provisions, capture, metropolis, and fortification terms."},{"id":"CHECK-002","check":"Check guide motive and warlike-superlative wording."},{"id":"CHECK-003","check":"Verify force, ravine, trench, stockade, and bastion terms."},{"id":"CHECK-004","check":"Examine sacrificial victims and forecast language."},{"id":"CHECK-005","check":"Check company discretion, virtue, formation, clarion, and god terms."},{"id":"CHECK-006","check":"Compare armor shedding and provisional capture wording."},{"id":"CHECK-007","check":"Examine looting, proclamation, gate flow, and citadel language."},{"id":"CHECK-008","check":"Check useless and retreat-echelon vocabulary."},{"id":"CHECK-009","check":"Compare divine aid, fortune, ignition, and burning language."},{"id":"CHECK-010","check":"Verify destruction scope and citadel exception."},{"id":"CHECK-011","check":"Check false ambush, signal, route, rescue, and facing-foe terms."},{"id":"CHECK-012","check":"Assess Mysus name note as text or paratext."}],"secondary_comparison_status":"DEFERRED","comparison_note":"Strauss remains confined to the owner-adopted secondary reconstruction."}