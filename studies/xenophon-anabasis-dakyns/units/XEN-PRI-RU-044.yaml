scope:
  work_locator: Anabasis VII.1
  pdf_pages_one_based: 137-141
  opening_anchor: 'BOOK VII, I: At this point Pharnabazus, who was afraid that the army might undertake a campaign against
    his satrapy, sent to Anaxibius.'
  closing_anchor: As to being general, he would have nothing more to say to it.
jurisdiction: Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek
  evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek
  philology, certification, minister derivation, and Sanctum registration remain unauthorized.
bibliographic_and_witness_control:
  translation: H. G. Dakyns
  digital_witness: Project Gutenberg 1170 searchable 168-page PDF
  chapter_boundary_control: BOOK VII and heading I begin VII.1 on PDF page 137; heading II begins on page 141. This unit covers
    pages 137-141 and stops before heading II. The earlier provisional plan range 137-143 is corrected forward by this record.
    Next unit covers pages 141-145.
  source_boundary: Pharnabazus and Anaxibius arrange the crossing; promised pay is withheld; the army is expelled and forcibly
    reenters Byzantium; Xenophon prevents pillage and rejects seizure; Coeratadas briefly assumes and loses command.
narrative_person_and_authorial_attribution:
  narrative_mode: Third-person narration with attributed speeches, reported fear and intention, institutional resolutions,
    tactical action, and narrated outcomes.
  xenophon_as_character_present: true
  direct_authorial_self_identification_present: false
  first_person_narrator_present: false
  interior_deliberation_report_present: true
  observation: First-person forms occur in attributed speeches; Xenophon remains a third-person character whose alarm and
    intention are narrated.
  uncertainty: Motives of Pharnabazus, Anaxibius, Seuthes, Cleander, the soldiers, and Coeratadas; legitimacy of Spartan authority;
    sacrificial meaning; and the counterfactual consequences of seizure remain unresolved.
speakers_audiences_and_occasions:
- id: SAO-001
  speaker: Anaxibius
  audience: generals and officers
  occasion: invitation to cross to Byzantium
  content: Promises that soldiers crossing the strait will not lack pay.
- id: SAO-002
  speaker: Xenophon
  audience: Anaxibius and Medosades separately
  occasion: planned departure and Seuthes's request
  content: Agrees to cross before leaving but refuses to make the already planned crossing a personal service to Seuthes.
- id: SAO-003
  speaker: Anaxibius
  audience: army and commanders
  occasion: after crossing
  content: Orders the army outside, directs provisioning in Thrace, and points toward service under Cyniscus.
- id: SAO-004
  speaker: soldiers
  audience: Xenophon
  occasion: forced reentry into Byzantium
  content: Offer him a city, triremes, money, men, and greatness.
- id: SAO-005
  speaker: Xenophon
  audience: soldiers at the Thracian square
  occasion: after restoring formation
  content: Acknowledges their grievance but argues against war on Sparta, pillage of Byzantium, and enmity with all Hellas.
- id: SAO-006
  speaker: Xenophon
  audience: soldiers
  occasion: same assembly
  content: Proposes disciplined withdrawal and a delegation seeking justice from Anaxibius.
- id: SAO-007
  speaker: Coeratadas
  audience: army
  occasion: after Xenophon's proposal
  content: Offers to lead wherever the army wishes and to provide abundant supplies.
- id: SAO-008
  speaker: Anaxibius
  audience: army's delegation
  occasion: response from the acropolis
  content: Praises discipline, promises to report it, and says he will consider what he can do.
- id: SAO-009
  speaker: Anaxibius
  audience: Byzantium
  occasion: after the army withdraws
  content: Proclaims that any soldier found inside will be sold.
- id: SAO-010
  speaker: Timasion, Neon, and Cleanor
  audience: Coeratadas
  occasion: second sacrificial day
  content: End his generalship unless he supplies the army with provisions.
speeches_deeds_and_outcomes:
- id: SDO-001
  deed: Pharnabazus recruits Spartan naval authority to remove the army from Asia; Anaxibius promises pay.
  outcome: The army crosses on a promise shaped by another ruler's interest.
- id: SDO-002
  deed: Xenophon delays his intended departure and refuses Seuthes's attempt to convert the crossing into personal obligation.
  outcome: He crosses with the army without accepting a private debt to Seuthes.
- id: SDO-003
  deed: Anaxibius withholds pay and expels the army while directing it toward Thracian provisioning and Cyniscus.
  outcome: The promised settlement becomes exposure without provisions.
- id: SDO-004
  deed: The soldiers force the gates by battering, sea-wall entry, and cutting bars.
  outcome: Byzantium is penetrated and appears taken, but pillage has not yet begun.
- id: SDO-005
  deed: The soldiers offer Xenophon city, fleet, money, men, and greatness; he appears to assent and restores formation.
  outcome: A possible seizure is converted into an ordered assembly.
- id: SDO-006
  deed: Xenophon distinguishes Spartan wrongdoing from innocent Byzantium and warns against war with all Hellas.
  outcome: The army votes for disciplined negotiation instead of occupation.
- id: SDO-007
  deed: The army sends delegates and accepts Coeratadas's offer of command and supplies.
  outcome: The soldiers withdraw outside the walls under a new material promise.
- id: SDO-008
  deed: Anaxibius praises their discipline, closes the gates, and threatens sale of any soldier inside.
  outcome: Recognition of discipline coexists with coercive exclusion.
- id: SDO-009
  deed: Coeratadas brings sacrificial equipment and limited food but receives no favorable signs on the first day.
  outcome: Neither command nor distribution begins.
- id: SDO-010
  deed: The former generals demand provisions; Coeratadas discovers less than one day's supply and withdraws.
  outcome: His generalship collapses through material incapacity as well as failed sacrifice.
sequence_repetition_omission_and_contradiction:
  sequence:
  - Pharnabazus fears attack
  - Anaxibius promises pay
  - Xenophon delays departure
  - Seuthes seeks influence
  - army crosses
  - pay is withheld
  - army is expelled
  - gates are closed
  - forced reentry
  - Byzantine panic
  - offer to Xenophon
  - formation and assembly
  - Xenophon's restraint speech
  - delegation and withdrawal
  - Coeratadas accepted
  - sale proclamation
  - unfavorable sacrifice
  - provision shortfall
  - Coeratadas abandons command
  repetitions:
  - Promises of pay or supply precede dependence.
  - Military order can be restored without formal sole command.
  - Greek-city status restrains acquisitive force.
  - Spartan authority is obeyed despite disputed conduct.
  - Sacrifice and material provision jointly condition leadership.
  omissions:
  - Pharnabazus's exact promise to Anaxibius is unstated.
  - Anaxibius's reason for withholding pay is unstated.
  - No named soldier originates the offer to Xenophon.
  - No Byzantine speech is reported.
  - No independent account verifies how close pillage came.
  - No divine explanation of Coeratadas's signs is supplied.
  tensions:
  - Promised pay versus no pay.
  - Valid grievance versus violent reentry.
  - City offered versus city refused.
  - Apparent assent versus restraining intention.
  - Spartan leadership of Hellas versus Spartan deception.
  - Generalship claim versus provisioning capacity.
  - Favorable political reception versus coercive sale proclamation.
  - Sacred procedure versus logistical insufficiency.
documentary_observations:
- id: OBS-001
  evidence_type: BOOK_SEVEN_VII1_BOUNDARY_CORRECTION_OBSERVATION
  observation: BOOK VII and heading I begin VII.1 on PDF page 137; heading II begins on page 141, correcting the earlier provisional
    137-143 range to 137-141.
- id: OBS-002
  evidence_type: PHARNABAZUS_ANAXIBIUS_REMOVAL_OBSERVATION
  observation: Pharnabazus fears a campaign against his satrapy and asks Anaxibius to convey the army out of Asia.
- id: OBS-003
  evidence_type: PAY_PROMISE_CROSSING_OBSERVATION
  observation: Anaxibius promises that soldiers who cross the strait should not lack pay for service.
- id: OBS-004
  evidence_type: XENOPHON_INTENDED_DEPARTURE_OBSERVATION
  observation: Xenophon says he intends to quit the army and sail away, but agrees to cross first.
- id: OBS-005
  evidence_type: SEUTHES_MEDOSADES_REQUEST_OBSERVATION
  observation: Seuthes sends Medosades asking Xenophon to influence the crossing and promising benefit.
- id: OBS-006
  evidence_type: NO_PERSONAL_OBLIGATION_CROSSING_OBSERVATION
  observation: Xenophon refuses to treat the crossing as a service to Seuthes because the army already intends to cross.
- id: OBS-007
  evidence_type: BYZANTIUM_CROSSING_OBSERVATION
  observation: The generals and the army cross from Asia to Byzantium.
- id: OBS-008
  evidence_type: PAY_WITHHELD_EXPULSION_OBSERVATION
  observation: Anaxibius does not provide the promised pay and orders the army outside with arms and baggage.
- id: OBS-009
  evidence_type: PROVISIONLESS_RELUCTANCE_OBSERVATION
  observation: The soldiers are reluctant to leave because they lack provisions.
- id: OBS-010
  evidence_type: CLEANDER_XENOPHON_DEPARTURE_COUNSEL_OBSERVATION
  observation: Cleander advises Xenophon to leave with the army so he will not be blamed for disorder.
- id: OBS-011
  evidence_type: ETEONICUS_GATE_CLOSURE_OBSERVATION
  observation: Eteonicus closes the gates and thrusts in the bolt pin after the clean sweep outside.
- id: OBS-012
  evidence_type: THRACIAN_PROVISION_CYNISCUS_ORDER_OBSERVATION
  observation: Anaxibius directs the troops to take provisions from Thracian villages and proceed to Cyniscus in the Chersonese.
- id: OBS-013
  evidence_type: SOLDIER_GATE_RUSH_OBSERVATION
  observation: After learning the plan, soldiers seize their arms and rush the gates.
- id: OBS-014
  evidence_type: FORCED_REENTRY_THREE_ROUTES_OBSERVATION
  observation: The army reenters by battering the gates, passing along the breakwater over the wall, and cutting the bars
    from within.
- id: OBS-015
  evidence_type: JAWS_OF_ENEMIES_COMPLAINT_OBSERVATION
  observation: The soldiers call it iniquitous to thrust them into the jaws of their enemies.
- id: OBS-016
  evidence_type: XENOPHON_ALARM_PILLAGE_OBSERVATION
  observation: Xenophon is alarmed that pillage may cause incurable harm to the city, himself, and the soldiers.
- id: OBS-017
  evidence_type: BYZANTINE_PANIC_ANAXIBIUS_FLIGHT_OBSERVATION
  observation: The Byzantines flee and Anaxibius escapes by a fisherman's boat toward the acropolis.
- id: OBS-018
  evidence_type: CITY_TRIREMES_MONEY_MEN_OFFER_OBSERVATION
  observation: The soldiers tell Xenophon that he now has a city, triremes, money, and men and can become great.
- id: OBS-019
  evidence_type: TACTICAL_ASSENT_FORMATION_OBSERVATION
  observation: Xenophon outwardly tells them to form up while intending to calm them rather than seize the city.
- id: OBS-020
  evidence_type: EIGHT_DEEP_SELF_MARSHALLING_OBSERVATION
  observation: The heavy infantry forms eight deep with light troops on both wings without waiting for formal marshalling.
- id: OBS-021
  evidence_type: THRACIAN_SQUARE_ASSEMBLY_OBSERVATION
  observation: Xenophon leads the ordered army to the Thracian square and convenes an assembly.
- id: OBS-022
  evidence_type: ATHENIAN_DEFEAT_ARGUMENT_OBSERVATION
  observation: Xenophon recalls that Athens possessed three hundred line-of-battle ships, abundant wealth, and empire yet
    was defeated by Sparta.
- id: OBS-023
  evidence_type: ALL_GREECE_WAR_WARNING_OBSERVATION
  observation: He warns that seizing Byzantium would bring war with Sparta, its allies, Asian enemies, and the king.
- id: OBS-024
  evidence_type: INNOCENT_CITY_DISTINCTION_OBSERVATION
  observation: He distinguishes wrongdoing by particular Spartans from the innocent city and its inhabitants.
- id: OBS-025
  evidence_type: BARBARIAN_GREEK_CITY_CONTRAST_OBSERVATION
  observation: He says it would be shameful to refuse many barbarian cities and then seize the first Hellenic city reached.
- id: OBS-026
  evidence_type: TEN_THOUSAND_FATHOMS_PRAYER_OBSERVATION
  observation: He prays to be buried ten thousand fathoms underground rather than witness such injury to Hellas.
- id: OBS-027
  evidence_type: HELLENIC_OBEDIENCE_JUST_RIGHTS_OBSERVATION
  observation: He proposes obedience to those who stand at the head of Hellas while seeking their just rights.
- id: OBS-028
  evidence_type: DISCIPLINED_WITHDRAWAL_COERATADAS_OBSERVATION
  observation: The army votes for delegation, accepts Coeratadas's offer, and withdraws outside the walls.
- id: OBS-029
  evidence_type: ANAXIBIUS_SALE_PROCLAMATION_OBSERVATION
  observation: After praising discipline, Anaxibius closes the gates and orders any soldier inside knocked down to the hammer
    and sold.
- id: OBS-030
  evidence_type: COERATADAS_SACRIFICE_PROVISION_FAILURE_OBSERVATION
  observation: Coeratadas brings victims, a soothsayer, twenty barleymeal bearers and other supplies, fails to get favorable
    signs, discovers less than one day's provisions, and abandons generalship.
provisional_findings:
- id: PF-001
  finding: VII.1 begins Book VII by converting arrival near Hellas into renewed dependence on promises and external authority.
- id: PF-002
  finding: Pharnabazus influences the army through Spartan naval power rather than direct command.
- id: PF-003
  finding: Xenophon refuses to transform an already chosen collective action into private obligation to Seuthes.
- id: PF-004
  finding: The army's forced entry establishes capacity to seize Byzantium but not legitimate title to it.
- id: PF-005
  finding: Xenophon's temporary apparent assent functions as a means of restoring order; it is not a completed acceptance
    of tyranny.
- id: PF-006
  finding: The distinction between particular Spartan wrongdoers and innocent Byzantium limits retaliation.
- id: PF-007
  finding: The Athenian example is a prudential warning about power and isolation, not proof that Spartan conduct is just.
- id: PF-008
  finding: The refusal of a Greek city is stronger evidence of Hellenic restraint than a prior verbal denial of ambition,
    but it does not certify complete justice.
- id: PF-009
  finding: Anaxibius's praise and sale threat show recognition of discipline without reciprocal trust.
- id: PF-010
  finding: Coeratadas's failure joins sacrificial adversity to inadequate provisioning and denies that nominal command alone
    can govern.
standing_unresolved_questions:
- id: UQ-001
  question: Did Pharnabazus promise Anaxibius money, political support, or something else?
- id: UQ-002
  question: Did Anaxibius ever intend to pay the soldiers?
- id: UQ-003
  question: Why does Xenophon initially intend to leave at this moment?
- id: UQ-004
  question: How much responsibility does Xenophon bear for persuading the army to cross?
- id: UQ-005
  question: Who first tells the soldiers that no pay will be given?
- id: UQ-006
  question: Could the army have survived outside Byzantium without forcing entry?
- id: UQ-007
  question: How imminent was actual pillage?
- id: UQ-008
  question: Who originated the offer of city, triremes, money, and men?
- id: UQ-009
  question: Did any soldiers understand Xenophon's apparent assent as genuine acceptance?
- id: UQ-010
  question: Does spontaneous eight-deep formation show constitutional order or only military habit?
- id: UQ-011
  question: How accurately does Xenophon's summary of Athenian defeat serve the present decision?
- id: UQ-012
  question: Does obedience to Spartan leaders preserve Hellenic order or enable injustice?
- id: UQ-013
  question: Would seizure of Byzantium necessarily have made the army enemy of all Hellas?
- id: UQ-014
  question: What does Xenophon's wish for burial ten thousand fathoms down disclose beyond rhetoric?
- id: UQ-015
  question: Why does Anaxibius praise discipline and immediately threaten enslavement?
- id: UQ-016
  question: Was Coeratadas defeated by divine prohibition, inadequate logistics, rival generals, or all three?
