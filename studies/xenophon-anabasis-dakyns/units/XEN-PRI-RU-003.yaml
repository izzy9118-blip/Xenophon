schema_version: 1.0
unit_id: XEN-PRI-RU-003
study_id: XEN-STUDY-PRI-001
source_id: XEN-SRC-PRI-001
witness_id: XEN-WIT-PRI-001
status: DRAFTED_PENDING_OWNER_REVIEW
scope:
  work_locator: Anabasis I.3
  pdf_pages_one_based: 11-13
  opening_anchor: >-
    At Tarsus Cyrus and his army halted for twenty days; the soldiers refusing to advance further
  closing_anchor: >-
    Not even at this moment was any one apprised of the fact, at any rate in any open and public manner.
jurisdiction: >-
  Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no isolated observation licenses a deed corpus, speech register, guard, or ministerial capacity.
bibliographic_and_witness_control:
  translation: H. G. Dakyns
  digital_witness: Project Gutenberg ebook 1170 captured as a 168-page searchable PDF
  locator_rule: Anabasis I.3 plus one-based PDF page
  source_boundary: >-
    The narrative, direct speeches, translator notes, and Project Gutenberg apparatus are distinguished where the witness marks them.
narrative_person_and_authorial_attribution:
  narrative_mode: third-person historical narration enclosing extended direct speeches
  xenophon_as_character_present: false
  direct_authorial_self_identification_present: false
  observation: >-
    Xenophon does not appear as a named actor in the chapter; the narrative foregrounds Clearchus, the soldiers, Cyrus, and unnamed speakers.
  uncertainty: >-
    The English witness does not by itself establish the Greek verbal distinctions among narration, reported thought, and direct speech.
speakers_audiences_and_occasions:
  - id: SAO-001
    locator: Anabasis I.3; PDF p. 11
    speech_form: direct_speech
    speaker: Clearchus
    audience: his own soldiers in assembly
    occasion: refusal to continue the march and failure of coercion
    content: >-
      Clearchus declares his debt to Cyrus, presents the choice between Cyrus and the soldiers, and chooses to share the soldiers' fate while calling them his country, friends, and allies.
    uncertainty: >-
      The relation between sincere loyalty, calculated persuasion, and prior coordination with Cyrus remains unresolved.
  - id: SAO-002
    locator: Anabasis I.3; PDF p. 12
    speech_form: direct_speech
    speaker: Clearchus
    audience: his enlarged following and any others willing to attend
    occasion: after more than two thousand men leave Xenias and Pasion for Clearchus
    content: >-
      Clearchus argues that mutual obligations with Cyrus have ended, states shame at deceiving Cyrus and fear of punishment, and calls for deliberation about secure residence or retreat and the procurement of supplies.
    uncertainty: >-
      The speech conceals Clearchus' private message to Cyrus that matters will be arranged.
  - id: SAO-003
    locator: Anabasis I.3; PDF pp. 12-13
    speech_form: direct_speech
    speaker: unnamed speaker aligned with Clearchus' strategy
    audience: assembled soldiers
    occasion: deliberation over immediate return
    content: >-
      The speaker theatrically urges election of new generals, purchase of supplies, requests for ships or a guide, and seizure of the pass if Cyrus refuses assistance.
    uncertainty: >-
      The narrative states that some speakers were inspired by Clearchus; it does not identify this speaker or separate planted argument from personal conviction.
  - id: SAO-004
    locator: Anabasis I.3; PDF p. 13
    speech_form: direct_speech
    speaker: Clearchus
    audience: assembled soldiers
    occasion: proposal that he lead a return
    content: >-
      Clearchus refuses personal command of the retreat while promising full obedience to whomever the soldiers choose.
    uncertainty: >-
      The refusal may reinforce the impossibility of retreat and preserve his influence without accepting formal responsibility.
  - id: SAO-005
    locator: Anabasis I.3; PDF p. 13
    speech_form: direct_speech
    speaker: unnamed speaker
    audience: assembled soldiers
    occasion: criticism of the proposed requests for ships and a guide
    content: >-
      The speaker argues that Cyrus cannot safely be trusted to supply ships or a guide and proposes instead that a deputation ask the intended use of the Greeks and demand either persuasive reasons to continue or safe release.
    uncertainty: >-
      The speaker's identity and relation to Clearchus are not given.
  - id: SAO-006
    locator: Anabasis I.3; PDF p. 13
    speech_form: indirect_reply
    speaker: Cyrus
    audience: deputation led by Clearchus
    occasion: inquiry into the expedition's object
    content: >-
      Cyrus says that Abrocomas is twelve stages away on the Euphrates and that the army will punish him if present or deliberate further if he has fled.
    uncertainty: >-
      The reply neither confirms nor dispels the soldiers' suspicion that the true objective is the king.
speeches_deeds_and_outcomes:
  - id: SDO-001
    locator: Anabasis I.3; PDF p. 11
    actor: soldiers
    deed: Refused to advance after concluding that the expedition was directed against Artaxerxes.
    outcome: The army halted at Tarsus for twenty days and compelled a political crisis over purpose and consent.
    uncertainty: >-
      The chapter does not state exactly how the suspicion spread or what each contingent knew.
  - id: SDO-002
    locator: Anabasis I.3; PDF p. 11
    actor: Clearchus
    deed: Attempted to force his men to march.
    outcome: The soldiers pelted him and his baggage; he narrowly escaped stoning and abandoned coercion.
    uncertainty: >-
      The scale and duration of the coercive attempt are not specified.
  - id: SDO-003
    locator: Anabasis I.3; PDF pp. 11-12
    actor: Clearchus
    deed: Wept before the assembly and declared that he would choose the soldiers over Cyrus.
    outcome: His troops approved, and more than two thousand men left Xenias and Pasion to join him.
    uncertainty: >-
      The narrative shows the persuasive effect but does not decide whether the tears were spontaneous, strategic, or both.
  - id: SDO-004
    locator: Anabasis I.3; PDF p. 12
    actor: Clearchus and Cyrus
    deed: Clearchus publicly refused Cyrus' summons while privately telling him to persist and promising that matters would be arranged.
    outcome: Public opposition and private coordination proceeded simultaneously.
    uncertainty: >-
      The full content of the private understanding and Cyrus' response are not reported.
  - id: SDO-005
    locator: Anabasis I.3; PDF pp. 12-13
    actor: Clearchus and aligned speakers
    deed: Directed deliberation toward the practical impossibility of secure withdrawal without Cyrus.
    outcome: The assembly adopted a proposal for a deputation rather than immediate retreat.
    uncertainty: >-
      The exact degree of Clearchus' orchestration of each speech is not disclosed.
  - id: SDO-006
    locator: Anabasis I.3; PDF p. 13
    actor: Cyrus
    deed: Supplied a limited explanation involving Abrocomas and later promised increased pay.
    outcome: The soldiers continued the march despite undispelled suspicion.
    uncertainty: >-
      The chapter does not state that the explanation was believed.
  - id: SDO-007
    locator: Anabasis I.3; PDF p. 13
    actor: soldiers and Cyrus
    deed: The soldiers demanded a fifty-percent pay increase as the condition of continuing.
    outcome: Cyrus promised a daric and a half per month instead of one daric, and the army followed.
    uncertainty: >-
      Compensation secures movement but does not constitute informed consent to war against the king.
sequence_repetition_omission_and_contradiction:
  sequence:
    - Soldiers refuse the suspected royal campaign
    - Clearchus fails through force
    - Clearchus succeeds through assembly speech and identification with the soldiers
    - Public refusal is paired with private coordination with Cyrus
    - Deliberation tests the feasibility of retreat
    - A deputation receives an incomplete explanation
    - Suspicion remains, but increased pay secures continued movement
  repetitions:
    - The distinction between public appearance and concealed intention continues from the recruitment chapters into army deliberation.
    - Friendship and obligation are repeatedly redescribed according to changing circumstances.
    - Material dependence, especially provisions and pay, repeatedly limits political choice.
  omissions:
    - The narrative does not identify several assembly speakers.
    - Cyrus' real object remains publicly undisclosed.
    - The soldiers are not told that the king is the target.
    - No direct evaluation settles whether Clearchus' manipulation is prudent, deceptive, or both.
    - Xenophon remains absent as a character.
  tensions:
    - Clearchus tells Cyrus to keep sending for him while publicly refusing to come.
    - Clearchus says he chooses the soldiers, yet structures their deliberation toward Cyrus' desired advance.
    - The soldiers resist deception but accept continuation without the suspicion being dispelled.
    - Formal choice is exercised under dependence on Cyrus for pay, supplies, guides, and safe movement.
documentary_observations:
  - id: OBS-001
    locator: Anabasis I.3; PDF p. 11
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: The army halts at Tarsus for twenty days because the soldiers refuse to advance.
    uncertainty: The chapter does not divide the refusal by contingent or estimate unanimity.
  - id: OBS-002
    locator: Anabasis I.3; PDF p. 11
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: The soldiers' refusal rests on the belief that the expedition is directed against the king and exceeds their original agreement.
    uncertainty: The original terms of enlistment may have differed among contingents.
  - id: OBS-003
    locator: Anabasis I.3; PDF p. 11
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Clearchus first attempts physical compulsion and is nearly stoned to death.
    uncertainty: The Greek wording for force and the precise sequence of the assault require original-language review.
  - id: OBS-004
    locator: Anabasis I.3; PDF p. 11
    evidence_type: STRUCTURAL_OBSERVATION
    observation: The failure of coercion is immediately followed by an assembly and an extended speech.
    uncertainty: The sequence suggests a change in mode of rule but does not by itself establish a general doctrine.
  - id: OBS-005
    locator: Anabasis I.3; PDF p. 11
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Clearchus stands weeping before speaking, while the soldiers watch in silence.
    uncertainty: The narrative supplies no explicit judgment of the tears.
  - id: OBS-006
    locator: Anabasis I.3; PDF p. 11
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Clearchus recounts Cyrus' gift of ten thousand darics and his use of it for the soldiers and the Chersonese campaign.
    uncertainty: The speech is Clearchus' self-presentation and is not independently audited within the chapter.
  - id: OBS-007
    locator: Anabasis I.3; PDF p. 11
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Clearchus explicitly frames his choice as Cyrus or the soldiers and chooses to share the soldiers' fate.
    uncertainty: His simultaneous private coordination with Cyrus complicates the plain meaning of the declaration.
  - id: OBS-008
    locator: Anabasis I.3; PDF p. 11
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Clearchus calls the soldiers his country, friends, and allies after identifying himself as an exile indebted to Cyrus.
    uncertainty: The terms may be rhetorical, substantive, or both; their Greek distinctions remain unchecked.
  - id: OBS-009
    locator: Anabasis I.3; PDF p. 12
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: More than two thousand soldiers leave Xenias and Pasion and join Clearchus after hearing his position.
    uncertainty: The motives of the defectors are not individually reported.
  - id: OBS-010
    locator: Anabasis I.3; PDF p. 12
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Clearchus' public refusal to answer Cyrus' summons is coordinated with a private assurance that Cyrus should persist.
    uncertainty: The chapter withholds whether any soldiers knew of this communication.
  - id: OBS-011
    locator: Anabasis I.3; PDF p. 12
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Clearchus tells the soldiers that they are no longer Cyrus' soldiers and Cyrus is no longer their paymaster.
    uncertainty: The statement is part of a strategy that ultimately restores the relation on increased pay.
  - id: OBS-012
    locator: Anabasis I.3; PDF p. 12
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Clearchus names both shame at deceiving Cyrus and fear of punishment as reasons not to meet him openly.
    uncertainty: The relative weight and sincerity of the two motives are not settled.
  - id: OBS-013
    locator: Anabasis I.3; PDF pp. 12-13
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Deliberation over retreat is conducted through proposals whose practical dependence on Cyrus makes retreat appear increasingly unsafe.
    uncertainty: The text identifies some speakers as inspired by Clearchus but does not map the orchestration completely.
  - id: OBS-014
    locator: Anabasis I.3; PDF p. 13
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Clearchus refuses to serve as general of a return while offering exemplary obedience under another commander.
    uncertainty: The refusal may be literal, tactical, or both.
  - id: OBS-015
    locator: Anabasis I.3; PDF p. 13
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: An unnamed speaker rejects trust in Cyrus-supplied ships or a guide and proposes a deputation to clarify the expedition.
    uncertainty: The identity and independence of the speaker remain unknown.
  - id: OBS-016
    locator: Anabasis I.3; PDF p. 13
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus identifies Abrocomas on the Euphrates as the immediate object and reserves later deliberation if he has fled.
    uncertainty: The statement leaves the ultimate destination and target open.
  - id: OBS-017
    locator: Anabasis I.3; PDF p. 13
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: The soldiers' suspicion that Cyrus is leading them against Artaxerxes is explicitly said not to have been dispelled.
    uncertainty: The chapter does not state whether any minority accepted Cyrus' explanation.
  - id: OBS-018
    locator: Anabasis I.3; PDF p. 13
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: The soldiers nevertheless decide to follow and demand increased pay.
    uncertainty: Pay may compensate for added danger without resolving the issue of informed consent.
  - id: OBS-019
    locator: Anabasis I.3; PDF p. 13
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus promises one and a half darics per month in place of one daric.
    uncertainty: The timing and fulfillment of the promise remain to be tracked.
  - id: OBS-020
    locator: Anabasis I.3; PDF p. 13
    evidence_type: STRUCTURAL_OBSERVATION
    observation: The chapter closes by stressing that the attack on the king still has not been disclosed openly and publicly.
    uncertainty: The distinction between private knowledge, suspicion, and public avowal requires continued tracking.
provisional_findings:
  - id: INF-001
    locator: Anabasis I.3; PDF pp. 11-13
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Clearchus' effective command begins where coercion fails: he regains movement by shaping deliberation, identification, and the perceived field of practical alternatives.
    confidence: high_for_translated_chapter_structure
  - id: INF-002
    locator: Anabasis I.3; PDF pp. 11-13
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      The army's collective choice is real but constrained by dependence on Cyrus for pay, supplies, transport, guides, and security.
    confidence: provisional_pending_book_one_sequence
  - id: INF-003
    locator: Anabasis I.3; PDF pp. 11-13
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Clearchus preserves two audiences at once: he appears loyal to the soldiers while privately remaining useful to Cyrus.
    confidence: high_for_chapter_sequence
  - id: INF-004
    locator: Anabasis I.3; PDF p. 13
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Increased pay resolves the immediate operational crisis without resolving the prior deception or producing informed agreement to fight the king.
    confidence: high_for_translated_chapter_structure
  - id: INF-005
    locator: Anabasis I.3; PDF pp. 11-13
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      The chapter distinguishes suspicion from public knowledge: men may act on what they strongly suspect while the governing intention remains formally unavowed.
    confidence: provisional_pending_later_disclosure
  - id: INF-006
    locator: Anabasis I.3; PDF pp. 11-13
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Political belonging is presented as transferable under exile and shared danger when Clearchus names the army as country, friends, and allies.
    confidence: low_to_moderate_pending_character_sequence
standing_unresolved_questions:
  - id: Q-001
    locator: Anabasis I.3; PDF p. 11
    evidence_type: UNRESOLVED_QUESTION
    question: What were the original contractual terms for each contingent, and did any soldiers knowingly enlist for war against Artaxerxes?
  - id: Q-002
    locator: Anabasis I.3; PDF p. 11
    evidence_type: UNRESOLVED_QUESTION
    question: What does Clearchus' failed coercion reveal about the limits of generalship over mercenaries?
  - id: Q-003
    locator: Anabasis I.3; PDF p. 11
    evidence_type: UNRESOLVED_QUESTION
    question: Are Clearchus' tears sincere, calculated, or inseparably both?
  - id: Q-004
    locator: Anabasis I.3; PDF p. 11
    evidence_type: UNRESOLVED_QUESTION
    question: In what sense can soldiers become the country of an exiled commander?
  - id: Q-005
    locator: Anabasis I.3; PDF pp. 11-12
    evidence_type: UNRESOLVED_QUESTION
    question: Does Clearchus deceive the soldiers when he presents himself as choosing them over Cyrus while coordinating privately with Cyrus?
  - id: Q-006
    locator: Anabasis I.3; PDF p. 12
    evidence_type: UNRESOLVED_QUESTION
    question: Why do more than two thousand soldiers leave Xenias and Pasion for Clearchus, and what does the transfer disclose about personal versus formal command?
  - id: Q-007
    locator: Anabasis I.3; PDF p. 12
    evidence_type: UNRESOLVED_QUESTION
    question: How are shame before Cyrus and fear of Cyrus related in Clearchus' reasoning?
  - id: Q-008
    locator: Anabasis I.3; PDF pp. 12-13
    evidence_type: UNRESOLVED_QUESTION
    question: Which assembly speeches are spontaneous and which are planted or encouraged by Clearchus?
  - id: Q-009
    locator: Anabasis I.3; PDF p. 13
    evidence_type: UNRESOLVED_QUESTION
    question: Why does Clearchus refuse formal command of retreat while offering absolute obedience to another general?
  - id: Q-010
    locator: Anabasis I.3; PDF p. 13
    evidence_type: UNRESOLVED_QUESTION
    question: What did Cyrus intend the Greeks to infer from the claim concerning Abrocomas?
  - id: Q-011
    locator: Anabasis I.3; PDF p. 13
    evidence_type: UNRESOLVED_QUESTION
    question: Does the soldiers' acceptance of higher pay constitute consent to greater danger, or merely postponement of the dispute over purpose?
  - id: Q-012
    locator: Anabasis I.3; PDF p. 13
    evidence_type: UNRESOLVED_QUESTION
    question: Why does the narrator emphasize that the true target was still not disclosed openly and publicly?
  - id: Q-013
    locator: Anabasis I.3; PDF pp. 11-13
    evidence_type: UNRESOLVED_QUESTION
    question: How does the transition from no direct speech in I.1-I.2 to extended assembly speeches in I.3 alter the work's presentation of rule?
  - id: Q-014
    locator: Anabasis I.3; PDF pp. 11-13
    evidence_type: UNRESOLVED_QUESTION
    question: What Greek terms underlie Dakyns' country, friends, allies, shame, deceive, and obey, and how do they structure Clearchus' appeal?
downstream_textual_checks:
  - Consult a reviewed Greek text of Anabasis I.3 for the vocabulary of contract, compulsion, shame, deception, country, friendship, alliance, and obedience.
  - Compare at least one modern English translation of Clearchus' first and second speeches.
  - Track the fulfillment of Cyrus' increased-pay promise through the remainder of Book I.
  - Track Xenias and Pasion after the loss of more than two thousand men.
  - Identify later passages that clarify Clearchus' relation to Cyrus and his soldiers.
  - Compare Clearchus' stated refusal of command with his later exercise of authority.
  - Track when the campaign against Artaxerxes becomes public knowledge rather than suspicion.
  - Preserve the distinction among private coordination, public speech, and narrative disclosure.
  - Defer comparison with Strauss's reconstruction until the relevant Book I primary sequence is complete.
secondary_comparison_status: DEFERRED
