downstream_textual_checks:
  - id: CHECK-001
    task: Consult an original-language Greek witness for III.1 before making philological claims.
  - id: CHECK-002
    task: Compare multiple translations for the fatherland statement, the first-person shift, the dream, and the election language.
  - id: CHECK-003
    task: Determine the textual status of the Book III synopsis and Dakyns's Grote note.
  - id: CHECK-004
    task: Identify the omitted Delphic gods and distinguish prayer from sacrifice in the Greek text.
  - id: CHECK-005
    task: Trace the later narrative events explicitly or implicitly connected with the dream.
  - id: CHECK-006
    task: Check the direct and indirect speech boundaries in Xenophon's waking reflections and two officer speeches.
  - id: CHECK-007
    task: Verify the wording and manuscript history of the phrase translated as "my friendship with Cyrus."
  - id: CHECK-008
    task: Investigate Apollonides's dialect, pierced ears, identity claim, and banishment without treating the chapter's polemic as settled ethnography.
  - id: CHECK-009
    task: Reconstruct the contingent and constitutional basis of the five replacement elections from later and parallel evidence.
  - id: CHECK-010
    task: Track whether Xenophon's service-centered account of leadership is confirmed or contradicted by later deeds.
  - id: CHECK-011
    task: Preserve the distinction between divine-sign report, human interpretation, persuasive theology, and narrated outcome.
  - id: CHECK-012
    task: Keep all comparison with Strauss deferred until the relevant primary sequence has been independently completed.
