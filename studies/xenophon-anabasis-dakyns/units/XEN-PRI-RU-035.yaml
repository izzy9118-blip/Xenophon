{"schema_version":1.0,"unit_id":"XEN-PRI-RU-035","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis V.6","pdf_pages_one_based":"107-111","opening_anchor":"Such was the conclusion of that day.","closing_anchor":"Thus they went away and proceeded to execute their plans."},"jurisdiction":"Translator wording is not unmediated Greek evidence; no deed corpus, speech register, guard, adapter, capacity, Sanctum registration, or AI certification is authorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","chapter_boundary_control":"V.6 begins beneath VI on PDF p.107 and ends before VII on p.111. V.7 is pp.111-114. Editorial notes remain paratext."},"narrative_person_and_authorial_attribution":{"xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"uncertainty":"Private-thought source and narrator-author identity unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Hecatonymus","audience":"army","occasion":"route counsel","content":"Recommends sea after describing Paphlagonian barriers."},{"id":"SAO-002","speaker":"Xenophon","audience":"army","occasion":"sea vote","content":"Requires all-or-none embarkation."},{"id":"SAO-003","speaker":"Timasion, Thorax, Philesius, Lycon","audience":"traders or army","occasion":"settlement dispute","content":"Apply financial pressure, promise pay, and accuse Xenophon."},{"id":"SAO-004","speaker":"Xenophon, Silanus, associated generals","audience":"army or officers","occasion":"defense and Phasis proposal","content":"Renunciation, anti-desertion vote, dissent, and private canvassing."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","actor":"assembly","deed":"Approves sea travel and sends embassy.","outcome":"Shipping is sought for all."},{"id":"SDO-002","actor":"Xenophon and Silanus","deed":"Colony thought, sacrifice, and rumor.","outcome":"Army divides but majority rejects settlement."},{"id":"SDO-003","actor":"Timasion and Thorax","deed":"Use merchants, gratuity, and pay promises.","outcome":"Departure coalition forms."},{"id":"SDO-004","actor":"army and generals","deed":"Vote against desertion; pay fails; Phasis seizure proposed.","outcome":"Private officer canvassing begins."}],"sequence_repetition_omission_and_contradiction":{"sequence":["counsel","sea vote","colony thought","rumor","inducement","accusation","unity vote","failed pay","Phasis proposal"],"tensions":["public vote/private payment","collective safety/individual exit","return rhetoric/conquest proposal"],"omissions":["Paphlagonian and Phasian voices, ship total, gratuity amount, sacrificial deity"]},"documentary_observations":[{"id":"OBS-001","locator":"V.6 pp.107-111","evidence_type":"ROUTE_COUNSEL","observation":"Assembly seeks Sinopean advice; Hecatonymus invokes Hellenic ties, apologizes, reports pass, cavalry, 120,000 infantry, and four rivers, then calls the land route impossible."},{"id":"OBS-002","locator":"V.6 pp.107-111","evidence_type":"MOTIVE_SUSPICION","observation":"Hearers suspect Corylas friendship, payment, or protection of Sinopean land; none is resolved."},{"id":"OBS-003","locator":"V.6 pp.107-111","evidence_type":"SEA_VOTE","observation":"Army votes for sea; Xenophon requires ships for everyone, links unity to avoiding slavery, and sends Callimachus, Ariston, and Samolas."},{"id":"OBS-004","locator":"V.6 pp.107-111","evidence_type":"COLONY_THOUGHT","observation":"Narrator reports Xenophon's private thought of a large Pontic colony and his sacrificial consultation with Silanus before informing the army."},{"id":"OBS-005","locator":"V.6 pp.107-111","evidence_type":"RUMOR_AND_RECEPTION","observation":"Silanus reports a fame-and-power scheme; narrator mentions his 3,000 darics; a few favor staying, most oppose."},{"id":"OBS-006","locator":"V.6 pp.107-111","evidence_type":"PRIVATE_INDUCEMENT","observation":"Timasion and Thorax use traders to threaten settlement; Sinopeans and Heracleots offer Timasion a gratuity for departure."},{"id":"OBS-007","locator":"V.6 pp.107-111","evidence_type":"PAY_PROMISES","observation":"Timasion promises one cyzicene monthly and guidance through the Troad, Aeolid, and Phrygia; rival Thorax promises pay and the Chersonese."},{"id":"OBS-008","locator":"V.6 pp.107-111","evidence_type":"PUBLIC_ACCUSATION","observation":"Philesius and Lycon accuse Xenophon of secret persuasion and sacrifice."},{"id":"OBS-009","locator":"V.6 pp.107-111","evidence_type":"DEFENSE","observation":"Xenophon says sacrifice tested whether to broach the plan, reports favorable victims and guile, accuses Silanus, and renounces the colony dream."},{"id":"OBS-010","locator":"V.6 pp.107-111","evidence_type":"FORCE_MAXIM","observation":"Xenophon says might exercises a right over what belongs to the weaker and urges unity for provisions and safety."},{"id":"OBS-011","locator":"V.6 pp.107-111","evidence_type":"ANTI_DESERTION","observation":"Assembly votes to punish departure before collective safety; Silanus's objection is rejected under threat."},{"id":"OBS-012","locator":"V.6 pp.107-111","evidence_type":"FAILED_PAYMENT","observation":"Heracleots send ships but withhold pay, frightening Timasion and Thorax."},{"id":"OBS-013","locator":"V.6 pp.107-111","evidence_type":"PHASIS_PROPOSAL","observation":"Most informed generals, excluding Neon, propose seizing Phasian territory; Xenophon refuses advocacy and Timasion urges officer canvassing."},{"id":"OBS-014","locator":"V.6 pp.107-111","evidence_type":"PARATEXT","observation":"Notes on Theages, cyzicene, Dercylidas, masteuein, and Aeetes remain editorial paratext."},{"id":"OBS-015","locator":"V.6 pp.107-111","evidence_type":"BOUNDARY","observation":"V.6 is PDF pp.107-111; V.7 begins on p.111 and ends on p.114 before V.8 on p.115."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"Locally interested counsel shapes the sea decision."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"Unity protects the army while restricting exit."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"Secret sacrifice becomes a legitimacy crisis through rumor."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"Private money influences public strategy."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"Failed pay turns return planning toward proposed conquest."}],"standing_unresolved_questions":[{"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"Accuracy of Paphlagonian report?"},{"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"Hecatonymus's authority and motive?"},{"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"Enough ships on what terms?"},{"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"Source of Xenophon's private thought?"},{"id":"Q-005","evidence_type":"UNRESOLVED_QUESTION","question":"Sacrificial deity and signs?"},{"id":"Q-006","evidence_type":"UNRESOLVED_QUESTION","question":"Gratuity and pay funding?"},{"id":"Q-007","evidence_type":"UNRESOLVED_QUESTION","question":"Authority for anti-desertion penalty?"},{"id":"Q-008","evidence_type":"UNRESOLVED_QUESTION","question":"Scope and membership of Phasis proposal?"}],"downstream_textual_checks":[{"id":"CHK-001","check":"Greek route and sacred-counsel terms"},{"id":"CHK-002","check":"force numbers and river widths"},{"id":"CHK-003","check":"all-or-none and slavery language"},{"id":"CHK-004","check":"colony-thought grammar and sacrifice"},{"id":"CHK-005","check":"might-over-weaker maxim"},{"id":"CHK-006","check":"anti-desertion and Phasis wording"}],"secondary_comparison_status":"DEFERRED"}