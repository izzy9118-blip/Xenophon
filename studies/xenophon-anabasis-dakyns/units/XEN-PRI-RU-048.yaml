{"schema_version":1.0,"unit_id":"XEN-PRI-RU-048","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VII.5","pdf_pages_one_based":"153-155","opening_anchor":"BOOK VII, V: Crossing over in the direction of the Thracians above Byzantium, they reached the Delta, as it is called.","closing_anchor":"If Xenophon ever wished to come face to face with him, want of leisure or some other difficulty always seemed to present itself."},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170 searchable 168-page PDF","chapter_boundary_control":"Heading V begins VII.5 on PDF page 153; heading VI begins VII.6 on page 155. This unit covers pages 153-155 and stops before heading VI. Direct boundary review places heading VII on page 159, so the next unit covers pages 155-159.","source_boundary":"Delta and Teres; proceeds of spoil; deficient monthly pay; Heracleides's calumny; disappearing coastal promises; failed attempt to replace Xenophon; joint continuation; Salmydessus wrecking economy; enlarged Thracian force; unpaid hostility and blocked access."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with attributed speeches, reported motives, deliberation, contractual claims, political maneuver, ethnographic-economic description, and narrated outcomes.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms belong to attributed speech. Xenophon remains a third-person character whose generosity, anger, deliberation, and demand for collective presence are narrated.","uncertainty":"The full spoil account, Heracleides's actual receipts, the legal force of Seuthes's promises, motives behind calumny, the status of Salmydessian wreck rights, and responsibility for nonpayment remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Seuthes","audience":"Xenophon","occasion":"distribution of spoil proceeds and teams","content":"Offers three pairs of mules to Xenophon and directs him to divide the remaining teams among generals and officers."},{"id":"SAO-002","speaker":"Xenophon","audience":"Seuthes and officers","occasion":"personal gift allocation","content":"Defers his own share and asks that the mules be given to Timasion, Cleanor, and Phryniscus."},{"id":"SAO-003","speaker":"Heracleides","audience":"Seuthes, Xenophon, and officers","occasion":"deficient pay remittance","content":"Insists that twenty days' equivalent is all he obtained through trafficking."},{"id":"SAO-004","speaker":"Xenophon","audience":"Heracleides","occasion":"rebuke over incomplete pay","content":"Says Heracleides should have obtained the full amount even by borrowing or selling the coat off his own back."},{"id":"SAO-005","speaker":"soldiers","audience":"Xenophon and one another","occasion":"nonpayment","content":"Blame Xenophon and demand to know where their pay is."},{"id":"SAO-006","speaker":"Heracleides","audience":"Timasion, Phryniscus, Cleanor, and Seuthes","occasion":"attempt to continue without Xenophon","content":"Claims the other generals can lead equally well and promises full pay for two months within days."},{"id":"SAO-007","speaker":"Timasion, Phryniscus, and Cleanor","audience":"Heracleides and Seuthes","occasion":"replacement proposal","content":"Refuse to continue any campaign without Xenophon, even for five months' pay."},{"id":"SAO-008","speaker":"Seuthes","audience":"Heracleides","occasion":"exclusion of Xenophon","content":"Rebukes him for not inviting Xenophon with the others."},{"id":"SAO-009","speaker":"Xenophon","audience":"messenger, all generals, and officers","occasion":"later invitation","content":"Declines private attendance and brings the entire command group so that no private calumny can operate unseen."},{"id":"SAO-010","speaker":"narrator through reported conditions","audience":"reader","occasion":"approach to Selybria","content":"Reports that no further pay is forthcoming, soldiers are deeply hostile, Seuthes is less friendly, and access to him is repeatedly obstructed."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","deed":"Heracleides returns with proceeds of spoil; Seuthes separates three mule teams from ox teams.","outcome":"Captured property becomes distributable goods and a partial pay fund without a transparent account."},{"id":"SDO-002","deed":"Xenophon defers his personal share and redirects mules to three generals.","outcome":"Immediate self-enrichment is refused, while officers receive visible gifts."},{"id":"SDO-003","deed":"Seuthes pays only twenty days for a month; Heracleides claims the proceeds permit no more.","outcome":"A quantified deficiency becomes open dispute."},{"id":"SDO-004","deed":"Xenophon publicly rebukes Heracleides for failing to secure full pay.","outcome":"Heracleides fears displacement and begins calumniating Xenophon."},{"id":"SDO-005","deed":"Soldiers blame Xenophon and Seuthes resents his persistent demands.","outcome":"The intermediary becomes the target of anger from both debtor and creditors."},{"id":"SDO-006","deed":"Heracleides warns against giving fortified towns to a man backed by troops.","outcome":"Seuthes ceases mentioning Bisanthe, Ganos, and Neontichos."},{"id":"SDO-007","deed":"Heracleides courts the other generals with promised pay and continued command.","outcome":"Timasion, Phryniscus, and Cleanor refuse to campaign without Xenophon."},{"id":"SDO-008","deed":"Xenophon attends Seuthes with all generals and officers rather than alone.","outcome":"Continuation follows joint consent and reduced scope for private slander."},{"id":"SDO-009","deed":"The combined force subdues Salmydessus and takes wreck-derived goods.","outcome":"Seuthes's army expands beyond the Hellenic contingent through accessions."},{"id":"SDO-010","deed":"No further pay appears above Selybria and Seuthes becomes inaccessible.","outcome":"Soldier hostility toward Xenophon deepens while the alliance deteriorates."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Delta reached","spoil proceeds returned","mules and ox teams distributed","twenty days paid for month","Xenophon rebukes Heracleides","calumny begins","soldiers blame Xenophon","coastal promises disappear","replacement attempted","generals refuse","Seuthes rebukes Heracleides","collective attendance","joint continuation","Salmydessus reduced","wreck goods taken","Thracian army expands","no further pay","soldier hostility","Seuthes inaccessible"],"repetitions":["Payment promises remain mediated through captured property.","Visible intermediaries absorb anger generated by absent principals.","Private access and private speech repeatedly threaten common deliberation.","Xenophon seeks witnesses or collective attendance when slander is possible.","Seuthes's growing power coincides with diminishing responsiveness to the Greeks."],"omissions":["No complete inventory or sale account of the spoil is provided.","No proof of Heracleides's actual total receipts appears.","No formal revocation of the coastal-town promises is recorded.","No precise terms of the jointly approved continued campaign are supplied.","No independent account from Salmydessian inhabitants or wreckers is given."],"tensions":["Gift distribution versus unpaid wages.","Xenophon's refusal of a gift versus accusations of self-interest.","Heracleides's claim of insufficient proceeds versus promises of two months' full pay.","Seuthes's expansion versus failure to pay allies.","Collective command loyalty versus soldiers' hostility to Xenophon.","Territorial wrecking custom versus violence among claimants."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"BOOK_SEVEN_VII5_BOUNDARY_OBSERVATION","observation":"Heading V begins VII.5 on PDF page 153; heading VI begins VII.6 on page 155."},{"id":"OBS-002","evidence_type":"DELTA_TERES_TERRITORY_OBSERVATION","observation":"The army crosses toward the Thracians above Byzantium, reaches the Delta, and enters the country of Teres the Odrysian rather than Maesades territory."},{"id":"OBS-003","evidence_type":"HERACLEIDES_SPOIL_PROCEEDS_RETURN_OBSERVATION","observation":"Heracleides meets the force with the proceeds of the spoil."},{"id":"OBS-004","evidence_type":"THREE_MULE_PAIRS_OX_TEAMS_OBSERVATION","observation":"Seuthes selects the only three pairs of mules; the other teams are oxen."},{"id":"OBS-005","evidence_type":"XENOPHON_DEFERRED_SHARE_OBSERVATION","observation":"Xenophon says he is content to receive his own share another time."},{"id":"OBS-006","evidence_type":"MULES_TO_THREE_GENERALS_OBSERVATION","observation":"Xenophon directs one mule pair each to Timasion, Cleanor, and Phryniscus."},{"id":"OBS-007","evidence_type":"OX_TEAMS_OFFICER_DISTRIBUTION_OBSERVATION","observation":"The teams of oxen are divided among the officers."},{"id":"OBS-008","evidence_type":"MONTH_DUE_TWENTY_DAYS_PAID_OBSERVATION","observation":"For the month already passed, Seuthes remits only the equivalent of twenty days' pay."},{"id":"OBS-009","evidence_type":"HERACLEIDES_TRAFFICKING_LIMIT_CLAIM_OBSERVATION","observation":"Heracleides insists that the partial amount is all he obtained by trafficking."},{"id":"OBS-010","evidence_type":"XENOPHON_FULL_PAY_REBUKE_OBSERVATION","observation":"Xenophon says Heracleides should have taken pains to bring back the full amount of pay."},{"id":"OBS-011","evidence_type":"LOAN_OR_COAT_SALE_OBSERVATION","observation":"The rebuke says full pay should have been secured even by raising a loan or selling the coat off Heracleides's own back."},{"id":"OBS-012","evidence_type":"HERACLEIDES_FRIENDSHIP_DISPLACEMENT_FEAR_OBSERVATION","observation":"Heracleides is annoyed and fears being ousted from the friendship of Seuthes."},{"id":"OBS-013","evidence_type":"HERACLEIDES_CALUMNY_OBSERVATION","observation":"From that day Heracleides does his best to calumniate Xenophon before Seuthes."},{"id":"OBS-014","evidence_type":"SOLDIER_PAY_BLAME_XENOPHON_OBSERVATION","observation":"The soldiers blame Xenophon and ask where their pay is."},{"id":"OBS-015","evidence_type":"SEUTHES_VEXED_PAY_DEMAND_OBSERVATION","observation":"Seuthes is vexed with Xenophon for persistently demanding the soldiers' pay."},{"id":"OBS-016","evidence_type":"BISANTHE_GANOS_NEONTICHOS_PROMISE_OBSERVATION","observation":"Before the dispute, Seuthes frequently speaks of handing Xenophon Bisanthe, Ganos, and Neontichos on reaching the seaboard."},{"id":"OBS-017","evidence_type":"FORTIFIED_TOWNS_FORCE_WARNING_OBSERVATION","observation":"Heracleides warns that it is unsafe to hand fortified towns to a man with a force at his back."},{"id":"OBS-018","evidence_type":"COASTAL_PROMISE_SILENCE_OBSERVATION","observation":"After the warning, Seuthes never mentions one of the promised places again."},{"id":"OBS-019","evidence_type":"XENOPHON_CONTINUATION_DELIBERATION_OBSERVATION","observation":"Xenophon considers what he ought to do regarding any further march inland."},{"id":"OBS-020","evidence_type":"OTHER_GENERALS_REPLACEMENT_ATTEMPT_OBSERVATION","observation":"Heracleides introduces the other generals to Seuthes and urges them to say they can lead the army as well as Xenophon."},{"id":"OBS-021","evidence_type":"TWO_MONTHS_FULL_PAY_PROMISE_OBSERVATION","observation":"Heracleides promises that within a day or two the generals will have full pay for two months if they continue."},{"id":"OBS-022","evidence_type":"FIVE_MONTHS_WITHOUT_XENOPHON_REFUSAL_OBSERVATION","observation":"Timasion refuses to campaign without Xenophon even for five months' pay; Phryniscus and Cleanor agree."},{"id":"OBS-023","evidence_type":"SEUTHES_HERACLEIDES_EXCLUSION_REBUKE_OBSERVATION","observation":"Seuthes upbraids Heracleides for failing to invite Xenophon with the others."},{"id":"OBS-024","evidence_type":"ALL_GENERALS_OFFICERS_COLLECTIVE_ATTENDANCE_OBSERVATION","observation":"On the later invitation Xenophon brings all generals and officers, seeking to prevent private calumny."},{"id":"OBS-025","evidence_type":"JOINT_CONSENT_CONTINUATION_OBSERVATION","observation":"The campaign continues after consent is reached among Seuthes, Xenophon, the generals, and officers."},{"id":"OBS-026","evidence_type":"MILLET_THRACIANS_SALMYDESSUS_OBSERVATION","observation":"The force marches through the millet-eating Thracians to Salmydessus and reduces the inhabitants."},{"id":"OBS-027","evidence_type":"WRECKING_PILLAR_BOUNDARIES_OBSERVATION","observation":"Along Salmydessus the sea casts ships ashore; territorial wrecking rights are marked by pillars, and before those boundaries wreckers killed one another."},{"id":"OBS-028","evidence_type":"BEDS_BOXES_WRITTEN_BOOKS_MARINER_GOODS_OBSERVATION","observation":"The army finds beds, boxes, many written books, and other goods carried in mariners' chests."},{"id":"OBS-029","evidence_type":"THRACIAN_ARMY_EXCEEDS_HELLENES_OBSERVATION","observation":"Odrysians and previously subdued tribes join until Seuthes's army becomes larger than the Hellenic army."},{"id":"OBS-030","evidence_type":"SELYBRIA_NO_PAY_HOSTILITY_BLOCKED_ACCESS_OBSERVATION","observation":"Above Selybria not a penny more is forthcoming; soldiers are deeply hostile to Xenophon, Seuthes is less friendly, and want of leisure or another difficulty repeatedly prevents face-to-face access."}],"provisional_findings":[{"id":"PF-001","finding":"The proceeds of spoil become politically decisive without being accompanied by a transparent inventory, sale record, or account."},{"id":"PF-002","finding":"Twenty days' pay for a completed month is a quantified breach or deficiency regardless of which intermediary bears responsibility."},{"id":"PF-003","finding":"Xenophon's deferral of his own share is evidence against immediate self-enrichment but does not certify every motive."},{"id":"PF-004","finding":"Heracleides's political position depends on controlling access, proceeds, and Seuthes's confidence."},{"id":"PF-005","finding":"The visible advocate for payment becomes a target of both soldiers and ruler when payment fails."},{"id":"PF-006","finding":"Seuthes's coastal-town promises disappear through silence rather than explicit public revocation."},{"id":"PF-007","finding":"The other generals' refusal prevents Heracleides from isolating and replacing Xenophon through private patronage."},{"id":"PF-008","finding":"Collective attendance is used as a procedural defense against calumny and private manipulation."},{"id":"PF-009","finding":"Salmydessian wrecking practice combines territorial convention, economic extraction, and remembered violence without establishing justice."},{"id":"PF-010","finding":"Seuthes's expanding military strength coincides with diminishing dependence on, payment to, and accessibility for the Hellenes."}],"standing_unresolved_questions":[{"id":"UQ-001","question":"What was the total value of the spoil delivered to Heracleides?"},{"id":"UQ-002","question":"What expenses or losses occurred between capture, sale, and remittance?"},{"id":"UQ-003","question":"Does Heracleides truthfully report all proceeds?"},{"id":"UQ-004","question":"Why does Seuthes distribute teams before satisfying the full wage debt?"},{"id":"UQ-005","question":"How do the soldiers interpret Xenophon's refusal of his personal mule share?"},{"id":"UQ-006","question":"Who bears contractual responsibility for the missing ten days' pay?"},{"id":"UQ-007","question":"Does Heracleides promise two months' pay from resources already available or merely anticipated?"},{"id":"UQ-008","question":"What evidence does Heracleides use in calumniating Xenophon?"},{"id":"UQ-009","question":"Were Bisanthe, Ganos, and Neontichos firm promises, conditional intentions, or courtly speech?"},{"id":"UQ-010","question":"Why does Seuthes initially tolerate Heracleides's attempt to exclude Xenophon?"},{"id":"UQ-011","question":"What precise terms are approved when the campaign continues jointly?"},{"id":"UQ-012","question":"What political or legal status governs the Salmydessian pillar divisions?"},{"id":"UQ-013","question":"Whose written books are captured and what becomes of them?"},{"id":"UQ-014","question":"How much larger than the Hellenes does Seuthes's force become?"},{"id":"UQ-015","question":"Does Seuthes deliberately avoid Xenophon above Selybria?"},{"id":"UQ-016","question":"How will Xenophon answer soldiers who hold him responsible for another ruler's unpaid debt?"}],"downstream_textual_checks":[{"id":"TC-001","check":"Track the missing ten days and later total debt."},{"id":"TC-002","check":"Compare Heracleides's proceeds claim with later accusations of theft."},{"id":"TC-003","check":"Track whether Xenophon ever receives his deferred spoil share."},{"id":"TC-004","check":"Compare vanished coastal promises with later renewed offers."},{"id":"TC-005","check":"Track the other generals' loyalty during the army's accusations."},{"id":"TC-006","check":"Compare private calumny with Xenophon's later public defense."},{"id":"TC-007","check":"Track Seuthes's enlarged force and reduced reliance on Hellenes."},{"id":"TC-008","check":"Preserve written books as captured objects without inferring their contents."},{"id":"TC-009","check":"Compare Salmydessian wrecking divisions with later property disputes."},{"id":"TC-010","check":"Track Seuthes's accessibility and reported excuses."},{"id":"TC-011","check":"Compare soldier hostility here with the assembly accusations in VII.6."},{"id":"TC-012","check":"Verify VII.6 at pages 155-159 and the heading VII boundary on page 159."}],"secondary_comparison_status":"DEFERRED"}