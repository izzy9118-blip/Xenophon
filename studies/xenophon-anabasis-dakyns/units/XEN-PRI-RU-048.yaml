{"schema_version":1.0,"unit_id":"XEN-PRI-RU-048","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VII.5","pdf_pages_one_based":"153-155","opening_anchor":"BOOK VII, V: Crossing over in the direction of the Thracians above Byzantium, they reached the Delta, as it is called.","closing_anchor":"If Xenophon ever wished to come face to face with him, want of leisure or some other difficulty always seemed to present itself."},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170 searchable 168-page PDF","chapter_boundary_control":"Heading V begins VII.5 on PDF page 153; heading VI begins VII.6 on page 155. This unit covers pages 153-155 and stops before heading VI. Heading VII begins on page 159, so the next unit covers pages 155-159.","source_boundary":"Delta arrival; proceeds of spoil; partial pay; Heracleides's hostility and calumny; lost coastal promises; attempted displacement of Xenophon; collective refusal by other generals; continued campaign; Salmydessus wrecking economy; Seuthes's enlarged army and continuing nonpayment."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with attributed speech, motive reports, material distributions, promises, calumny, collective decisions, geographical description, and narrated outcomes.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms belong to attributed speech. Xenophon remains a third-person character whose refusal of a present, anger over deficient pay, deliberation, and precautions against private calumny are narrated.","uncertainty":"The true proceeds of the spoil, Heracleides's accounting, Seuthes's capacity and intent to pay, the exact causes of changed friendship, and the legal status of Salmydessian wrecking remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Seuthes","audience":"Xenophon","occasion":"distribution of animals from the spoil","content":"Offers Xenophon three pairs of mules and directs him to distribute the remainder among generals and officers."},{"id":"SAO-002","speaker":"Xenophon","audience":"Seuthes and the commanders","occasion":"animal distribution","content":"Defers his own share and asks that the mules be given to the generals and officers who served with him."},{"id":"SAO-003","speaker":"Heracleides","audience":"Seuthes, Xenophon, and the army","occasion":"deficient remittance","content":"Insists that the equivalent of twenty days' pay is all the spoil sale produced."},{"id":"SAO-004","speaker":"Xenophon","audience":"Heracleides","occasion":"twenty-day payment for a month due","content":"Charges that Heracleides has neglected Seuthes's interest and should have raised a loan or sold his own coat to bring the full pay."},{"id":"SAO-005","speaker":"soldiers","audience":"one another and Xenophon","occasion":"partial and later absent pay","content":"Ask where their pay is and blame the visible intermediary."},{"id":"SAO-006","speaker":"Heracleides","audience":"Seuthes","occasion":"campaign after the pay dispute","content":"Calumniates Xenophon and argues that fortified coastal towns should not be entrusted to a man with troops behind him."},{"id":"SAO-007","speaker":"Heracleides","audience":"Timasion, Phryniscus, and Cleanor","occasion":"attempt to displace Xenophon","content":"Promises full pay for two months within days if the generals continue the campaign without Xenophon."},{"id":"SAO-008","speaker":"Timasion","audience":"Heracleides and Seuthes","occasion":"offer to continue without Xenophon","content":"Refuses to campaign without Xenophon even for five months' pay."},{"id":"SAO-009","speaker":"Phryniscus and Cleanor","audience":"Heracleides and Seuthes","occasion":"same offer","content":"Repeat Timasion's refusal and align themselves with him."},{"id":"SAO-010","speaker":"Seuthes","audience":"Heracleides and the assembled commanders","occasion":"discovery of the exclusion attempt","content":"Rebukes Heracleides for not inviting Xenophon, after which Xenophon appears with all generals and officers."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","deed":"Heracleides meets the army at the Delta with proceeds of the spoil.","outcome":"The sale produces distributions and only partial wages."},{"id":"SDO-002","deed":"Seuthes selects three mule teams for Xenophon; Xenophon gives them to fellow commanders.","outcome":"Timasion, Cleanor, and Phryniscus each receive a pair while officers receive ox teams."},{"id":"SDO-003","deed":"Seuthes remits only twenty days' pay for a month; Xenophon rebukes Heracleides.","outcome":"The accounting becomes a personal and political conflict."},{"id":"SDO-004","deed":"Heracleides fears loss of Seuthes's friendship and calumniates Xenophon.","outcome":"Soldier anger and Seuthes's vexation converge upon Xenophon."},{"id":"SDO-005","deed":"Seuthes ceases mentioning Bisanthe, Ganos, and Neontichos after warnings about entrusting fortified towns.","outcome":"Previously repeated coastal promises disappear without formal revocation."},{"id":"SDO-006","deed":"Heracleides approaches other generals with two months' promised pay and asks them to continue without Xenophon.","outcome":"Timasion, Phryniscus, and Cleanor refuse even under a five-month counterfactual."},{"id":"SDO-007","deed":"Seuthes rebukes Heracleides; Xenophon attends with all generals and officers rather than alone.","outcome":"Joint consent, not a private interview, authorizes continuation."},{"id":"SDO-008","deed":"The combined force campaigns through the millet-eating Thracians to Salmydessus.","outcome":"A district organized around wreck salvage is reduced and its accumulated goods are taken."},{"id":"SDO-009","deed":"Odrysians and submitting tribes join Seuthes's army.","outcome":"His force becomes considerably larger than the Hellenic army."},{"id":"SDO-010","deed":"The army quarters above Selybria while full pay remains absent and Seuthes avoids Xenophon.","outcome":"Military success and Seuthes's increased power coincide with deteriorating relations and unresolved debt."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Delta arrival","spoil proceeds","animal distribution","twenty-day remittance","Xenophon rebukes Heracleides","calumny begins","soldiers blame Xenophon","coastal promises disappear","other generals solicited","generals refuse","Seuthes rebukes Heracleides","joint continuation","Salmydessus campaign","wreck goods seized","Seuthes's army enlarges","Selybria quarters","pay absent","access to Seuthes obstructed"],"repetitions":["Promised payment repeatedly fails to become complete payment.","Xenophon yields personal advantage while demanding collective compensation.","Intermediaries convert institutional disputes into personal suspicion.","Public or collective presence is used against private manipulation.","Seuthes gains territory and men while his debt to the Greeks remains unresolved."],"omissions":["No complete sale account is supplied.","No inventory or valuation of the spoil is given.","No formal revocation of Bisanthe, Ganos, and Neontichos is narrated.","No independent speech from Seuthes explains the missing pay.","No terms governing wreck salvage or reduction of Salmydessus are stated."],"tensions":["Xenophon's refusal of mules versus accusations of private gain.","Twenty days' pay versus a full month due.","Heracleides's promise of two months' pay versus his claim that only twenty days could be raised.","Seuthes's rebuke of Heracleides versus continued cooling toward Xenophon.","Expanded Thracian power versus declining dependence on the Hellenes.","Campaign continuation versus unresolved contractual breach."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"BOOK_SEVEN_VII5_BOUNDARY_OBSERVATION","observation":"Heading V begins VII.5 on PDF page 153; heading VI begins VII.6 on page 155."},{"id":"OBS-002","evidence_type":"DELTA_TERES_TERRITORY_OBSERVATION","observation":"The army crosses toward the Thracians above Byzantium, reaches the Delta, leaves Maesades territory, and enters the country of Teres the Odrysian."},{"id":"OBS-003","evidence_type":"HERACLEIDES_SPOIL_PROCEEDS_RETURN_OBSERVATION","observation":"Heracleides meets the force with the proceeds of the spoil."},{"id":"OBS-004","evidence_type":"THREE_MULE_TEAMS_OX_TEAMS_OBSERVATION","observation":"Seuthes selects the only three pairs of mules while the other teams are oxen."},{"id":"OBS-005","evidence_type":"XENOPHON_DEFERS_PERSONAL_SHARE_OBSERVATION","observation":"Xenophon says he is content to receive his own share another time."},{"id":"OBS-006","evidence_type":"COMMANDER_OFFICER_GIFT_REDISTRIBUTION_OBSERVATION","observation":"Xenophon asks that the animals be given to his fellow generals and officers."},{"id":"OBS-007","evidence_type":"TIMASION_CLEANOR_PHRYNISCUS_MULES_OBSERVATION","observation":"Timasion, Cleanor, and Phryniscus each receive one pair of mules."},{"id":"OBS-008","evidence_type":"OFFICER_OX_TEAM_DISTRIBUTION_OBSERVATION","observation":"The teams of oxen are divided among the officers."},{"id":"OBS-009","evidence_type":"MONTH_DUE_TWENTY_DAYS_PAYMENT_OBSERVATION","observation":"For the month already passed Seuthes remits only the equivalent of twenty days' pay."},{"id":"OBS-010","evidence_type":"HERACLEIDES_TRAFFICKING_ACCOUNT_OBSERVATION","observation":"Heracleides insists that twenty days' pay is all he obtained by trafficking in the spoil."},{"id":"OBS-011","evidence_type":"XENOPHON_FULL_PAY_LOAN_COAT_REBUKE_OBSERVATION","observation":"Xenophon says Heracleides should have raised a loan or sold the coat off his own back to produce the full amount."},{"id":"OBS-012","evidence_type":"HERACLEIDES_FRIENDSHIP_FEAR_OBSERVATION","observation":"The narrator reports that Heracleides fears being ousted from Seuthes's friendship."},{"id":"OBS-013","evidence_type":"HERACLEIDES_CALUMNY_OBSERVATION","observation":"From that day Heracleides does his best to calumniate Xenophon before Seuthes."},{"id":"OBS-014","evidence_type":"SOLDIERS_PAY_BLAME_XENOPHON_OBSERVATION","observation":"The soldiers blame Xenophon and ask where their pay is."},{"id":"OBS-015","evidence_type":"SEUTHES_VEXED_PAY_ADVOCACY_OBSERVATION","observation":"Seuthes becomes vexed with Xenophon for persistently demanding the soldiers' pay."},{"id":"OBS-016","evidence_type":"BISANTHE_GANOS_NEONTICHOS_PROMISE_OBSERVATION","observation":"Before the dispute Seuthes repeatedly spoke of giving Xenophon Bisanthe, Ganos, and Neontichos on returning to the seaboard."},{"id":"OBS-017","evidence_type":"FORTIFIED_TOWNS_PROMISE_SILENCE_OBSERVATION","observation":"After Heracleides warns against giving fortified towns to a man with a force at his back, Seuthes never mentions the promised places again."},{"id":"OBS-018","evidence_type":"XENOPHON_FURTHER_MARCH_DELIBERATION_OBSERVATION","observation":"Xenophon considers what he should do about marching farther into the country."},{"id":"OBS-019","evidence_type":"OTHER_GENERALS_SUBSTITUTION_ATTEMPT_OBSERVATION","observation":"Heracleides introduces the other generals as equally able to lead the army."},{"id":"OBS-020","evidence_type":"TWO_MONTHS_PAY_PROMISE_OBSERVATION","observation":"Heracleides promises the other generals full pay for two months within a day or two if they continue with Seuthes."},{"id":"OBS-021","evidence_type":"TIMASION_FIVE_MONTHS_REFUSAL_OBSERVATION","observation":"Timasion refuses to campaign without Xenophon even if offered five months' pay."},{"id":"OBS-022","evidence_type":"PHRYNISCUS_CLEANOR_CONCURRENCE_OBSERVATION","observation":"Phryniscus and Cleanor repeat Timasion's position."},{"id":"OBS-023","evidence_type":"SEUTHES_HERACLEIDES_REBUKE_OBSERVATION","observation":"Seuthes upbraids Heracleides for failing to invite Xenophon with the others."},{"id":"OBS-024","evidence_type":"XENOPHON_ALL_COMMANDERS_PRESENT_OBSERVATION","observation":"Invited alone, Xenophon brings all generals and officers to prevent private calumny."},{"id":"OBS-025","evidence_type":"JOINT_CONSENT_CONTINUED_CAMPAIGN_OBSERVATION","observation":"After joint consent is secured, the campaign continues."},{"id":"OBS-026","evidence_type":"MILLET_EATING_THRACIANS_SALMYDESSUS_OBSERVATION","observation":"Keeping the Pontus on the right, the force crosses the country of the millet-eating Thracians and reaches Salmydessus."},{"id":"OBS-027","evidence_type":"SALMYDESSUS_WRECKING_BOUNDARIES_OBSERVATION","observation":"Marshy ledges wreck trading vessels, and pillars divide the right to pillage flotsam and jetsam among local groups."},{"id":"OBS-028","evidence_type":"WRECKER_FEUD_BOOKS_TREASURE_OBSERVATION","observation":"Boundary marks replace earlier lethal disputes among wreckers; the district contains beds, boxes, many written books, and mariners' chest goods."},{"id":"OBS-029","evidence_type":"SEUTHES_ARMY_OUTGROWS_HELLENES_OBSERVATION","observation":"Odrysians and adhering tribes enlarge Seuthes's army until it is considerably larger than the Hellenic army."},{"id":"OBS-030","evidence_type":"SELYBRIA_NONPAYMENT_AVOIDED_ACCESS_OBSERVATION","observation":"Above Selybria not a penny more is forthcoming; soldiers are cruelly disaffected, Seuthes is less friendly, and Xenophon repeatedly finds access obstructed by want of leisure or another difficulty."}],"provisional_findings":[{"id":"PF-001","finding":"Xenophon's deferral of his animal share is a narrated deed against the immediate appearance of self-enrichment, not proof of complete disinterest."},{"id":"PF-002","finding":"The spoil economy lacks transparent accounting between capture, sale, remittance, and distribution."},{"id":"PF-003","finding":"Partial payment shifts anger toward the visible mediator even though he demands full payment."},{"id":"PF-004","finding":"Heracleides converts a financial criticism into a struggle over access to Seuthes and the interpretation of Xenophon's power."},{"id":"PF-005","finding":"Repeated coastal promises disappear through silence rather than explicit revocation."},{"id":"PF-006","finding":"The other generals' refusal prevents Heracleides from separating command competence from established trust."},{"id":"PF-007","finding":"Xenophon answers a private invitation with collective presence, using publicity as protection against calumny."},{"id":"PF-008","finding":"Continued campaigning after deficient pay rests on joint consent but does not erase the prior breach."},{"id":"PF-009","finding":"Salmydessus institutionalizes wreck pillage through territorial boundaries without the chapter establishing its justice."},{"id":"PF-010","finding":"Seuthes's growing army reduces dependence on the Hellenes at the same time that his debt and avoidance increase."}],"standing_unresolved_questions":[{"id":"UQ-001","question":"What was the total value of the spoil delivered to Heracleides?"},{"id":"UQ-002","question":"Was twenty days' pay the true full proceeds or a deficient account?"},{"id":"UQ-003","question":"Why does Xenophon defer his own share, and does he later receive it?"},{"id":"UQ-004","question":"What authority governed distribution of animals among commanders and officers?"},{"id":"UQ-005","question":"Could Heracleides actually have borrowed enough to complete the monthly pay?"},{"id":"UQ-006","question":"How much of the soldiers' anger rests on evidence rather than proximity to Xenophon?"},{"id":"UQ-007","question":"Does Seuthes believe the calumny, exploit it, or merely act from reduced need?"},{"id":"UQ-008","question":"Were Bisanthe, Ganos, and Neontichos contractual promises or informal inducements?"},{"id":"UQ-009","question":"Why does Seuthes cease mentioning the coastal places without openly withdrawing them?"},{"id":"UQ-010","question":"What exactly does Xenophon contemplate when considering whether to march farther?"},{"id":"UQ-011","question":"How could Heracleides promise two months' full pay after claiming only twenty days could be raised?"},{"id":"UQ-012","question":"Would the other generals' refusal persist if Xenophon himself withdrew?"},{"id":"UQ-013","question":"What were the terms of the joint consent to continue the campaign?"},{"id":"UQ-014","question":"What legal or customary principle governed Salmydessian wreck salvage?"},{"id":"UQ-015","question":"How were the written books and other wreck goods valued or distributed?"},{"id":"UQ-016","question":"Does Seuthes's enlarged army explain the later nonpayment and avoidance, or only accompany them?"}],"downstream_textual_checks":[{"id":"TC-001","check":"Track whether Xenophon ever receives the deferred animal share."},{"id":"TC-002","check":"Compare the twenty-day remittance with later settlement of the debt."},{"id":"TC-003","check":"Track Heracleides's later claims about the spoil proceeds."},{"id":"TC-004","check":"Compare soldier accusations with Xenophon's public defense in VII.6."},{"id":"TC-005","check":"Track whether Bisanthe, Ganos, or Neontichos is offered again."},{"id":"TC-006","check":"Compare the generals' refusal here with their conduct during the Spartan transfer."},{"id":"TC-007","check":"Track the use of collective witnesses against private meetings."},{"id":"TC-008","check":"Compare Seuthes's enlarged army with his treatment of the Hellenic force."},{"id":"TC-009","check":"Track the goods obtained at Salmydessus and any relation to pay."},{"id":"TC-010","check":"Preserve the wrecking economy as reported practice rather than certified law or justice."},{"id":"TC-011","check":"Compare Seuthes's avoidance at Selybria with his statements in VII.6."},{"id":"TC-012","check":"Verify VII.6 at pages 155-159 and stop before heading VII."}],"secondary_comparison_status":"DEFERRED"}