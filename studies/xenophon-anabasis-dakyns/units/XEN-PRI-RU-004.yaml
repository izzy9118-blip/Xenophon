status: DRAFTED_PENDING_OWNER_REVIEW
scope:
  work_locator: Anabasis I.4
  pdf_pages_one_based: 14-16
  opening_anchor: "From this point he marched two stages—ten parasangs—to the river Psarus"
  closing_anchor: "Here were several villages full of corn and wine; in which they halted three days, and provisioned the army."
jurisdiction: >-
  Independent primary reconstruction from the admitted Dakyns English translation.
  Translator wording is not unmediated Greek evidence; no isolated observation licenses
  a deed corpus, speech register, guard, adapter, or ministerial capacity.
bibliographic_and_witness_control:
  translation: H. G. Dakyns
  digital_witness: Project Gutenberg ebook 1170 captured as a 168-page searchable PDF
  locator_rule: Anabasis I.4 plus one-based PDF page
  source_boundary: >-
    Narrative text is distinguished from Dakyns or preparer notes. Reported quantities,
    motives, popular explanations, rumors, and miraculous interpretation remain marked
    as reports rather than silently converted into established fact.
narrative_person_and_authorial_attribution:
  narrative_mode: third-person historical narration in the English translation
  xenophon_as_character_present: false
  direct_authorial_self_identification_present: false
  observation: >-
    The narrator continues to organize the march through measured stages, geographical
    constraints, reports, speeches, and collective reactions; Xenophon does not enter as
    a character in this chapter.
  uncertainty: >-
    This witness does not settle the Greek wording of report formulas or the relation
    between narrator, author, and later editorial interventions.
speakers_audiences_and_occasions:
  - id: SAO-001
    locator: Anabasis I.4; PDF p. 15
    speech_form: direct_speech
    speaker: Cyrus
    audience: the Greek generals
    occasion: response to the departure of Xenias and Pasion
    content: >-
      Cyrus declares that he knows where the two men have gone and could capture them,
      but will not pursue, mistreat, or strip them; he will also return their wives and
      children in recognition of their former goodness to him.
    uncertainty: >-
      The Greek terms underlying goodness, nobleness, use, and return require original-language review.
  - id: SAO-002
    locator: Anabasis I.4; PDF p. 15
    speech_form: indirect_instruction
    speaker: Cyrus
    audience: the Greek generals
    occasion: disclosure at Thapsacus of the march against Artaxerxes
    content: >-
      Cyrus states that the advance is now toward Babylon against the great king and
      orders the generals to tell and persuade the soldiers.
    uncertainty: >-
      The account does not state whether all generals possessed the same prior knowledge.
  - id: SAO-003
    locator: Anabasis I.4; PDF p. 15
    speech_form: collective_demand_reported
    speaker: the Greek soldiers
    audience: their generals and Cyrus through them
    occasion: response to formal disclosure of the campaign
    content: >-
      The soldiers accuse the generals of long concealment and refuse to proceed without
      a payment comparable to that given to earlier Greeks who accompanied Cyrus to his father.
    uncertainty: >-
      The chapter says the majority were persuaded after the promise; dissenting numbers and terms are not given.
  - id: SAO-004
    locator: Anabasis I.4; PDF pp. 15-16
    speech_form: direct_speech
    speaker: Menon
    audience: Menon's own troops
    occasion: before the army's collective decision about crossing the Euphrates
    content: >-
      Menon urges an immediate crossing so that his troops may obtain Cyrus's special
      favor without risk or toil, whether the rest later follow or refuse.
    uncertainty: >-
      Menon's calculation is presented through a direct speech in translation; its exact Greek vocabulary and rhetorical structure require checking.
  - id: SAO-005
    locator: Anabasis I.4; PDF p. 16
    speech_form: reported_message
    speaker: Cyrus through Glus
    audience: Menon's troops
    occasion: reward for crossing first
    content: >-
      Cyrus thanks them now and promises that they will later have reason to thank him.
    uncertainty: >-
      The promise is indefinite, and its later fulfillment must be tracked.
speeches_deeds_and_outcomes:
  - id: SDO-001
    locator: Anabasis I.4; PDF p. 14
    actor: Cyrus
    deed: >-
      Joined his land force at Issi with Peloponnesian and Cyran ships, Cheirisophus's
      seven hundred hoplites, and four hundred deserters from Abrocomas.
    outcome: >-
      The expedition gained maritime support, additional Greek infantry, and forces formerly serving the opposing commander.
    uncertainty: >-
      The chapter does not quantify the fleet's crews or state how the deserters were integrated.
  - id: SDO-002
    locator: Anabasis I.4; PDF p. 14
    actor: Abrocomas
    deed: >-
      Abandoned the Syrian gate and withdrew from Phoenicia toward the king after learning that Cyrus was in Cilicia.
    outcome: >-
      Cyrus passed a position the narrative describes as impossible to force if defended.
    uncertainty: >-
      The size of Abrocomas's army is introduced as report, and his full reasoning is not narrated.
  - id: SDO-003
    locator: Anabasis I.4; PDF pp. 14-15
    actor: Xenias and Pasion
    deed: Departed by merchant ship with their most valuable possessions.
    outcome: >-
      Their departure produced explanations of jealousy, rumors of pursuit, and divided reactions among the soldiers.
    uncertainty: >-
      The narrator gives a common explanation rather than a direct statement of their motive.
  - id: SDO-004
    locator: Anabasis I.4; PDF p. 15
    actor: Cyrus
    deed: Renounced pursuit of Xenias and Pasion and promised restoration of their families.
    outcome: >-
      Even discouraged Greeks judged the act noble and became happier and more eager to follow.
    uncertainty: >-
      The relationship between moral admiration, strategic persuasion, and retained power over their families remains open.
  - id: SDO-005
    locator: Anabasis I.4; PDF p. 15
    actor: Cyrus
    deed: Cut down Belesys's park and burned his palace.
    outcome: The army continued toward the Euphrates after an act of destruction against the Syrian ruler's estate.
    uncertainty: The text gives no explicit cause or justification for the destruction.
  - id: SDO-006
    locator: Anabasis I.4; PDF p. 15
    actor: Cyrus, the generals, and the Greek soldiers
    deed: >-
      Cyrus formally disclosed the war against Artaxerxes; the soldiers objected and demanded money; Cyrus promised five silver minae at Babylon and continued pay through safe return.
    outcome: The majority consented to continue.
    uncertainty: >-
      Consent is linked to payment, but the chapter does not reduce all motives to money or state the position of the minority.
  - id: SDO-007
    locator: Anabasis I.4; PDF pp. 15-16
    actor: Menon and his troops
    deed: Crossed the Euphrates before the rest had decided, seeking precedence in Cyrus's favor.
    outcome: >-
      Cyrus praised them, reportedly rewarded Menon, and the entire army then crossed a river interpreted by observers as yielding miraculously to Cyrus.
    uncertainty: >-
      Menon's gifts are reported, and the natural conditions of the ford are not independently explained.
sequence_repetition_omission_and_contradiction:
  sequence:
    - Naval reinforcement and desertion from Abrocomas at Issi
    - Passage of the undefended Cilician-Syrian gates
    - Departure of Xenias and Pasion at Myriandus
    - Cyrus's public renunciation of retaliation and recovery of Greek confidence
    - Destruction of Belesys's estate
    - Formal disclosure of the campaign at Thapsacus
    - Negotiation of continued service through promised payment
    - Menon's preemptive crossing and Cyrus's favorable response
    - General crossing of the Euphrates and miraculous interpretation
  repetitions:
    - Report formulas qualify army numbers, motives, gifts, and popular interpretation.
    - Money, friendship, and honor again operate as instruments of command and allegiance.
    - Physical passages become political tests: gates, departure by sea, and the Euphrates crossing.
  omissions:
    - No explanation is given for burning Belesys's palace and park.
    - The chapter does not state why Cyrus retains the families of Xenias and Pasion at Tralles.
    - The minority response after Cyrus's payment promise is not described.
    - No natural explanation of the low Euphrates crossing is supplied.
    - Xenophon remains absent as a named participant.
  tensions:
    - Cyrus possesses the power to capture deserters and holds their families, yet gains loyalty by declining to use that power.
    - The Greeks condemn concealment but agree to continue after a financial promise.
    - Menon presents opportunistic precedence as costless loyalty.
    - The river crossing is both a practical ford and a sign interpreted as royal recognition.
documentary_observations:
  - id: OBS-001
    locator: Anabasis I.4; PDF p. 14
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus receives thirty-five Peloponnesian ships and twenty-five ships belonging to himself at Issi.
    uncertainty: The witness does not provide crew totals or a complete naval order of battle.
  - id: OBS-002
    locator: Anabasis I.4; PDF p. 14
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cheirisophus arrives with seven hundred hoplites to serve as their general under Cyrus.
    uncertainty: The circumstances of his recruitment and Spartan authorization are not explained here.
  - id: OBS-003
    locator: Anabasis I.4; PDF p. 14
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Four hundred Greek mercenaries desert Abrocomas and join Cyrus's campaign against the king.
    uncertainty: Their motives and terms of service are omitted.
  - id: OBS-004
    locator: Anabasis I.4; PDF p. 14
    evidence_type: STRUCTURAL_OBSERVATION
    observation: The Cilician-Syrian gates are described as impossible to force if properly defended.
    uncertainty: The military judgment is narrative and not tested by an attempted assault.
  - id: OBS-005
    locator: Anabasis I.4; PDF p. 14
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Abrocomas withdraws rather than hold the gate after learning that Cyrus is in Cilicia.
    uncertainty: His reported force of three hundred thousand and his reasons require corroboration.
  - id: OBS-006
    locator: Anabasis I.4; PDF p. 14
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Xenias and Pasion depart from Myriandus by merchant vessel with valuable property.
    uncertainty: The narrative supplies a common explanation of jealousy, not their own testimony.
  - id: OBS-007
    locator: Anabasis I.4; PDF p. 14
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Their departure produces both hostile and sympathetic reactions among the remaining Greeks.
    uncertainty: The distribution and political significance of these reactions are not quantified.
  - id: OBS-008
    locator: Anabasis I.4; PDF p. 15
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus states that he can capture Xenias and Pasion but refuses to pursue or dispossess them.
    uncertainty: The speech is available only through the translation witness.
  - id: OBS-009
    locator: Anabasis I.4; PDF p. 15
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus holds their wives and children at Tralles and promises to return them.
    uncertainty: The legal and coercive status of these family members is not explained.
  - id: OBS-010
    locator: Anabasis I.4; PDF p. 15
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Cyrus's restraint changes the morale of Greeks previously discouraged by the inland march.
    uncertainty: The narrative calls the conduct noble, but the Greek evaluative term requires checking.
  - id: OBS-011
    locator: Anabasis I.4; PDF p. 15
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Syrians regard the tame fish of the Chalus and local pigeons as gods and do not permit injury to them.
    uncertainty: The account does not explain the cult, source of knowledge, or Greek terminology.
  - id: OBS-012
    locator: Anabasis I.4; PDF p. 15
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus cuts down Belesys's park and burns his palace.
    uncertainty: No motive or prior offense is stated.
  - id: OBS-013
    locator: Anabasis I.4; PDF p. 15
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Full disclosure of the destination occurs at the Euphrates, after the army has crossed several prior barriers.
    uncertainty: Whether the river is deliberately chosen as the disclosure point is not stated.
  - id: OBS-014
    locator: Anabasis I.4; PDF p. 15
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: The soldiers accuse the generals of concealing a purpose they had long known.
    uncertainty: The narrative does not distinguish knowledge among individual generals.
  - id: OBS-015
    locator: Anabasis I.4; PDF p. 15
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus promises five silver minae at Babylon and full pay until safe return to Ionia.
    uncertainty: The promise's feasibility and later performance remain to be tested.
  - id: OBS-016
    locator: Anabasis I.4; PDF p. 15
    evidence_type: STRUCTURAL_OBSERVATION
    observation: The narrative specifies that the majority, not necessarily all, were persuaded.
    uncertainty: No number or subsequent disposition of dissenters is given.
  - id: OBS-017
    locator: Anabasis I.4; PDF pp. 15-16
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Menon advises crossing before the common decision to gain special favor without risk or toil.
    uncertainty: The claim of no risk depends on his forecast that either outcome will benefit his troops.
  - id: OBS-018
    locator: Anabasis I.4; PDF p. 16
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Menon's plan seeks to convert temporal precedence into a claim of superior fidelity.
    uncertainty: This is a reconstruction of the translated speech's logic, not a final judgment of character.
  - id: OBS-019
    locator: Anabasis I.4; PDF p. 16
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: Cyrus responds to Menon's troops with thanks and an indefinite promise of future reciprocation.
    uncertainty: The promised reward is not specified.
  - id: OBS-020
    locator: Anabasis I.4; PDF p. 16
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: The narrative reports that Cyrus sent Menon gifts with lordly liberality.
    uncertainty: The report formula and absence of an itemized gift list limit certainty.
  - id: OBS-021
    locator: Anabasis I.4; PDF p. 16
    evidence_type: DIRECT_TEXTUAL_OBSERVATION
    observation: The entire army crosses the Euphrates on foot, with no one wetted above the chest.
    uncertainty: The water level, season, crossing width, and exact route are not supplied.
  - id: OBS-022
    locator: Anabasis I.4; PDF p. 16
    evidence_type: STRUCTURAL_OBSERVATION
    observation: Local testimony and the narrator's courtier image frame the crossing as miraculous recognition of Cyrus's future kingship.
    uncertainty: The text reports an interpretation; it does not establish divine causation.
provisional_findings:
  - id: INF-001
    locator: Anabasis I.4; PDF pp. 14-16
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      The chapter converts successive geographical passages into tests of political attachment:
      an undefended gate, an available sea exit, and the Euphrates crossing each disclose who departs, who follows, and on what grounds.
    confidence: provisional_pending_book_one_sequence
  - id: INF-002
    locator: Anabasis I.4; PDF pp. 14-15
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Cyrus strengthens allegiance not merely by possessing coercive power but by publicly declining to exercise it against departing associates.
    confidence: moderate_for_translated_chapter
  - id: INF-003
    locator: Anabasis I.4; PDF p. 15
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Formal disclosure does not produce consent by truth alone; continued service is renegotiated through money, promised return, and confidence in Cyrus.
    confidence: high_for_translated_sequence
  - id: INF-004
    locator: Anabasis I.4; PDF pp. 15-16
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Menon's speech presents loyalty as a competitive investment in favor rather than as obedience to a common decision.
    confidence: moderate_pending_comparison_with_later_portrait
  - id: INF-005
    locator: Anabasis I.4; PDF p. 16
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      The chapter permits a natural event to become politically meaningful through collective report and royal imagery without settling its divine cause.
    confidence: provisional
  - id: INF-006
    locator: Anabasis I.4; PDF pp. 14-16
    evidence_type: PROVISIONAL_INFERENCE
    finding: >-
      Reported speech and report formulas regulate the reader's confidence precisely where motives, numbers, gifts, and divine significance are most consequential.
    confidence: provisional_pending_greek_review
standing_unresolved_questions:
  - id: Q-001
    locator: Anabasis I.4; PDF p. 14
    evidence_type: UNRESOLVED_QUESTION
    question: Why does Abrocomas abandon a pass described as impossible to force, and what role did Cyrus's fleet play in that decision?
  - id: Q-002
    locator: Anabasis I.4; PDF p. 14
    evidence_type: UNRESOLVED_QUESTION
    question: What moved the four hundred Greek mercenaries to desert Abrocomas for Cyrus?
  - id: Q-003
    locator: Anabasis I.4; PDF pp. 14-15
    evidence_type: UNRESOLVED_QUESTION
    question: Did Xenias and Pasion leave chiefly from jealousy, fear, disagreement over the campaign, or another cause?
  - id: Q-004
    locator: Anabasis I.4; PDF p. 15
    evidence_type: UNRESOLVED_QUESTION
    question: What is the status of the wives and children held at Tralles, and how does their custody qualify Cyrus's restraint?
  - id: Q-005
    locator: Anabasis I.4; PDF p. 15
    evidence_type: UNRESOLVED_QUESTION
    question: Which Greek word does Dakyns render as the nobleness of Cyrus, and what does it imply about the narrator's judgment?
  - id: Q-006
    locator: Anabasis I.4; PDF p. 15
    evidence_type: UNRESOLVED_QUESTION
    question: Why does Cyrus destroy Belesys's park and palace after sparing the departing generals?
  - id: Q-007
    locator: Anabasis I.4; PDF p. 15
    evidence_type: UNRESOLVED_QUESTION
    question: What did each Greek general know before the formal disclosure at Thapsacus?
  - id: Q-008
    locator: Anabasis I.4; PDF p. 15
    evidence_type: UNRESOLVED_QUESTION
    question: Why are the soldiers persuaded by money after condemning concealment, and what other motives remain active?
  - id: Q-009
    locator: Anabasis I.4; PDF p. 15
    evidence_type: UNRESOLVED_QUESTION
    question: Who remained outside the majority that agreed to proceed, and what became of them?
  - id: Q-010
    locator: Anabasis I.4; PDF pp. 15-16
    evidence_type: UNRESOLVED_QUESTION
    question: Does Menon's proposal reveal loyalty, opportunism, accurate political foresight, or some combination?
  - id: Q-011
    locator: Anabasis I.4; PDF p. 16
    evidence_type: UNRESOLVED_QUESTION
    question: What gifts did Menon receive, and were Cyrus's promises to Menon's troops fulfilled?
  - id: Q-012
    locator: Anabasis I.4; PDF p. 16
    evidence_type: UNRESOLVED_QUESTION
    question: What natural circumstances made the Euphrates fordable when boats had previously been required?
  - id: Q-013
    locator: Anabasis I.4; PDF p. 16
    evidence_type: UNRESOLVED_QUESTION
    question: Who interprets the crossing as miraculous, and how does the Greek text distinguish local testimony, army opinion, and narrator statement?
  - id: Q-014
    locator: Anabasis I.4; PDF pp. 14-16
    evidence_type: UNRESOLVED_QUESTION
    question: How does this chapter's contrast between voluntary departure, purchased consent, competitive loyalty, and miraculous kingship govern the emerging account of rule?
downstream_textual_checks:
  - Consult a reviewed Greek text of Anabasis I.4 for report formulas, the term rendered nobleness, and the vocabulary of restraint, goodness, favor, fidelity, and miracle.
  - Compare at least one modern English translation of Cyrus's speech concerning Xenias and Pasion.
  - Verify the Greek syntax distinguishing narrator statement from popular explanation of Xenias and Pasion's departure.
  - Track whether Cyrus restores the wives and children at Tralles.
  - Track the fulfillment of the five-mina promise, continued pay, and Menon's rewards.
  - Compare later accounts of Menon with the logic of his Euphrates speech without importing those later judgments prematurely.
  - Investigate geographical and hydrological evidence only in a separately identified historical-context record.
  - Track each use of report language for army size, motives, gifts, and divine signs through Book I.
  - Defer comparison with Strauss's reconstruction until the relevant Book I primary sequence is complete.
