{"schema_version":1.0,"unit_id":"XEN-PRI-RU-033","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis V.4","pdf_pages_one_based":"101-103","opening_anchor":"From Cerasus they continued the march...","closing_anchor":"...as if their sole business were to show off to the rest of the world."},"jurisdiction":"Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no deed corpus, register, guard, adapter, or ministerial capacity is authorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170, searchable 168-page PDF","locator_rule":"Anabasis V.4 plus one-based PDF page","chapter_boundary_control":"Editorial note (5) from V.3 continues at the top of PDF page 101 and remains witness paratext. V.4 begins beneath heading IV on page 101, continues through page 103, and ends immediately before heading V on page 104. V.5 begins on page 104 and ends on page 106 before heading VI on page 107.","source_boundary":"Separate transport, diplomacy, alliance, unauthorized plunder, defeat, discipline, assault, burning, pillage, transfer, ethnography, and notes."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration; Xenophon and Timesitheus are named actors.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"observation":"Xenophon negotiates and speaks in third person; first-person forms occur only inside attributed speeches.","uncertainty":"Greek terms and narrator-author identity remain open."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"V.4 p.101","speaker":"Timesitheus for Greeks","audience":"near-side Mossynoecians","content":"Asks for passage as friends or foes."},{"id":"SAO-002","locator":"V.4 p.101","speaker":"near-side faction","audience":"Greeks","content":"Refuses passage, trusting strongholds."},{"id":"SAO-003","locator":"V.4 p.101","speaker":"Xenophon via Timesitheus","audience":"far-side chiefs","content":"Offers alliance, vengeance, future subjection, and Greek force."},{"id":"SAO-004","locator":"V.4 p.101","speaker":"allied chief","audience":"Greek generals","content":"Welcomes the alliance."},{"id":"SAO-005","locator":"V.4 p.101","speaker":"Xenophon","audience":"allied chiefs","content":"Asks intended use and reciprocal aid."},{"id":"SAO-006","locator":"V.4 p.101","speaker":"allied chiefs","audience":"Greek command","content":"Promise reverse incursion, ships, men, fighting aid, and guidance."},{"id":"SAO-007","locator":"V.4 p.102","speaker":"Xenophon","audience":"Greek assembly","content":"Recasts defeat as proof of alliance and punishment for disorder."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","locator":"V.4 p.101","actor":"Timesitheus and rival factions","deed":"Mediates refusal and rival alliance.","outcome":"Blocked transit becomes factional intervention."},{"id":"SDO-002","locator":"V.4 p.101","actor":"Xenophon, interpreter, chiefs","deed":"Exchange alliance terms.","outcome":"Alliance accepted."},{"id":"SDO-003","locator":"V.4 p.101","actor":"allied Mossynoecians","deed":"Exchange pledges; bring 300 canoes; land two men per canoe.","outcome":"About 600 fighters join."},{"id":"SDO-004","locator":"V.4 pp.101-102","actor":"allies and unauthorized Greeks","deed":"Attack fortress; Greeks follow for plunder.","outcome":"Sortie routs them and kills some."},{"id":"SDO-005","locator":"V.4 p.102","actor":"enemy fighters","deed":"Decapitate dead, display heads, dance, and sing.","outcome":"Public triumph and intimidation."},{"id":"SDO-006","locator":"V.4 p.102","actor":"Xenophon and assembly","deed":"Reframes defeat as intelligence and discipline lesson.","outcome":"Army prepares coordinated attack."},{"id":"SDO-007","locator":"V.4 p.102","actor":"Greeks and allies","deed":"After sacrifice, advance in columns with missile support.","outcome":"Defenders fall back to capital."},{"id":"SDO-008","locator":"V.4 p.102","actor":"Greeks and defenders","deed":"Greeks mass; defenders abandon fortress; king remains in tower.","outcome":"King, occupants, and towers burn."},{"id":"SDO-009","locator":"V.4 pp.102-103","actor":"Greeks and allies","deed":"Pillage, eat, transfer stronghold, continue march.","outcome":"Allies gain control; army gains supplies."},{"id":"SDO-010","locator":"V.4 p.103","actor":"narrator/Greek evaluators","deed":"Describe bodies, children, tattoos, sex customs, and conduct.","outcome":"Hellenocentric ethnographic judgment."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Continued divided sea-and-land movement","Transit refusal","Alliance through rival local faction","Interpreted commitments and pledges","Canoe-borne allied reinforcement","Unauthorized plunder expedition and defeat","Decapitation display","Xenophon’s disciplinary reframing","Sacrifice and ordered second assault","Capital capture, burning, and pillage","Transfer of fortress to allies","Ethnographic closing judgment"],"repetitions":["Local intermediaries convert blocked passage into alliance.","Factional hostilities shape Greek targets.","Unauthorized plunder exposes soldiers to defeat.","Sacrifice precedes coordinated attack."],"omissions":["Most dead, burned, displaced, women, children, and inhabitants remain unnamed and unheard.","The refusing faction gives no direct explanation beyond confidence in strongholds.","The king’s office and surrender possibilities are not explained."],"tensions":["Safe passage is joined to vengeance and subjection.","Alliance discipline contrasts with private plunder.","A common-property claim accompanies burning, pillage, and transfer.","Diplomacy ends in a Hellenocentric ethnographic judgment."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis V.4; PDF p. 101","evidence_type":"BOOK_BOUNDARY_PARATEXT_OBSERVATION","observation":"Editorial note (5) from V.3 continues above heading IV and is excluded from V.4 narration."},{"id":"OBS-002","locator":"Anabasis V.4; PDF p. 101","evidence_type":"CONTINUED_DUAL_TRANSPORT_OBSERVATION","observation":"The selected group continues by sea; the rest march by land."},{"id":"OBS-003","locator":"Anabasis V.4; PDF p. 101","evidence_type":"PROXENOS_MEDIATION_OBSERVATION","observation":"Timesitheus the Trapezuntine, proxenos of the Mossynoecians, mediates contact."},{"id":"OBS-004","locator":"Anabasis V.4; PDF p. 101","evidence_type":"FORTRESS_BASED_PASSAGE_REFUSAL_OBSERVATION","observation":"The near-side faction refuses passage, trusting its strongholds."},{"id":"OBS-005","locator":"Anabasis V.4; PDF p. 101","evidence_type":"INTERNAL_FACTIONAL_HOSTILITY_OBSERVATION","observation":"Timesitheus reports a hostile faction on the farther side."},{"id":"OBS-006","locator":"Anabasis V.4; PDF p. 101","evidence_type":"INTERPRETER_MEDIATED_ALLIANCE_OBSERVATION","observation":"Timesitheus interprets Xenophon’s alliance speech."},{"id":"OBS-007","locator":"Anabasis V.4; PDF p. 101","evidence_type":"VENGEANCE_AND_SUBJECTION_PROPOSAL_OBSERVATION","observation":"Xenophon offers vengeance and future subjection of local enemies."},{"id":"OBS-008","locator":"Anabasis V.4; PDF p. 101","evidence_type":"RECIPROCAL_OPERATIONAL_AID_OBSERVATION","observation":"Allied chiefs promise a reverse incursion, ships, men, battle aid, and guidance."},{"id":"OBS-009","locator":"Anabasis V.4; PDF p. 101","evidence_type":"RECIPROCAL_PLEDGE_OBSERVATION","observation":"The parties exchange pledges."},{"id":"OBS-010","locator":"Anabasis V.4; PDF p. 101","evidence_type":"THREE_HUNDRED_CANOE_OBSERVATION","observation":"The allies return with three hundred single-trunk canoes."},{"id":"OBS-011","locator":"Anabasis V.4; PDF p. 101","evidence_type":"ALLIED_FORCE_DISEMBARKATION_OBSERVATION","observation":"Two men per canoe disembark; one returns with it."},{"id":"OBS-012","locator":"Anabasis V.4; PDF p. 101","evidence_type":"CHORAL_FORMATION_AND_SONG_OBSERVATION","observation":"Allied fighters form facing rows, sing, mark time, and advance."},{"id":"OBS-013","locator":"Anabasis V.4; PDF p. 101","evidence_type":"LOCAL_ARMAMENT_AND_DRESS_OBSERVATION","observation":"The witness describes ivy-leaf shields, long javelins, short frocks, leather helmets, and battle-axes."},{"id":"OBS-014","locator":"Anabasis V.4; PDF p. 101","evidence_type":"CITADEL_SUPREMACY_CLAIM_OBSERVATION","observation":"The high citadel is reported to confer mastery over other Mossynoecians."},{"id":"OBS-015","locator":"Anabasis V.4; PDF p. 101","evidence_type":"COMMON_PROPERTY_USURPATION_REPORT_OBSERVATION","observation":"The current holders are said to have seized common property.","uncertainty":"The claim is attributed local explanation, not independently adjudicated title."},{"id":"OBS-016","locator":"Anabasis V.4; PDF p. 102","evidence_type":"UNAUTHORIZED_PLUNDER_FOLLOWING_OBSERVATION","observation":"Some Greeks follow without orders for plunder."},{"id":"OBS-017","locator":"Anabasis V.4; PDF p. 102","evidence_type":"ROUT_AND_FIRST_REPORTED_FLIGHT_OBSERVATION","observation":"The attackers are routed; Greek flight is called unprecedented in the expedition."},{"id":"OBS-018","locator":"Anabasis V.4; PDF p. 102","evidence_type":"DECAPITATION_DISPLAY_OBSERVATION","observation":"Enemy fighters decapitate the dead, display heads, dance, and sing."},{"id":"OBS-019","locator":"Anabasis V.4; PDF p. 102","evidence_type":"DISCIPLINE_REFRAMING_OBSERVATION","observation":"Xenophon treats defeat as proof of alliance and punishment for disorder."},{"id":"OBS-020","locator":"Anabasis V.4; PDF p. 102","evidence_type":"FAVORABLE_SACRIFICE_OBSERVATION","observation":"The next attack follows reportedly favorable sacrifice."},{"id":"OBS-021","locator":"Anabasis V.4; PDF p. 102","evidence_type":"COLUMN_AND_MISSILE_SUPPORT_OBSERVATION","observation":"Companies advance in columns; archers and peltasts check stone throwers."},{"id":"OBS-022","locator":"Anabasis V.4; PDF p. 102","evidence_type":"ORDERED_ADVANCE_CONTRAST_OBSERVATION","observation":"Heavy infantry follows in unbroken order."},{"id":"OBS-023","locator":"Anabasis V.4; PDF p. 102","evidence_type":"KING_MAINTAINED_IN_TOWER_OBSERVATION","observation":"A king sits in a guarded wooden tower maintained at common cost."},{"id":"OBS-024","locator":"Anabasis V.4; PDF p. 102","evidence_type":"BURNING_DEATH_OBSERVATION","observation":"The king and others remaining in towers are burned.","uncertainty":"No casualty count, surrender exchange, or civilian inventory is given."},{"id":"OBS-025","locator":"Anabasis V.4; PDF p. 102","evidence_type":"PILLAGED_ANCESTRAL_STORES_OBSERVATION","observation":"Greeks find ancestral loaves, spelt, dolphin, blubber, chestnuts, and wine."},{"id":"OBS-026","locator":"Anabasis V.4; PDF p. 103","evidence_type":"FORTRESS_TRANSFER_AND_ADHESION_OBSERVATION","observation":"The stronghold goes to the allies; other settlements empty or join."},{"id":"OBS-027","locator":"Anabasis V.4; PDF p. 103","evidence_type":"ELEVATED_SETTLEMENT_NETWORK_OBSERVATION","observation":"Elevated settlements lie about ten miles apart; voices carry across clefts."},{"id":"OBS-028","locator":"Anabasis V.4; PDF p. 103","evidence_type":"ELITE_CHILD_FATTENING_REPORT_OBSERVATION","observation":"Hosts display wealthy children fattened on boiled chestnuts."},{"id":"OBS-029","locator":"Anabasis V.4; PDF p. 103","evidence_type":"TATTOO_AND_SEXUAL_CUSTOM_REPORT_OBSERVATION","observation":"The witness reports floral tattoos and public sexual approaches toward Greek women.","uncertainty":"Desire is reported; actual consent or intercourse is not established."},{"id":"OBS-030","locator":"Anabasis V.4; PDF p. 103","evidence_type":"HELLENOCENTRIC_ETHNOGRAPHIC_JUDGMENT_OBSERVATION","observation":"They are judged the most barbaric and outlandish people encountered.","uncertainty":"This is an evaluative Greek report, not neutral classification."},{"id":"OBS-031","locator":"Anabasis V.4; PDF p. 101-103","evidence_type":"EDITORIAL_PARATEXT_OBSERVATION","observation":"Notes gloss Mossynoecians, proxenos, and chestnuts.","uncertainty":"These notes are later witness apparatus, not chapter narration."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"Blocked passage is converted into factional intervention through an existing intermediary."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"The alliance links Greek transit to local vengeance and a proposed redistribution of rule."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"Private plunder undermines allied military action and becomes the object of public discipline."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"The second assault is narrated as the disciplined correction of the first."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"Victory produces both route access and a transfer of local political control."},{"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"Provisioning remains inseparable from pillage and destruction."},{"id":"FIND-007","evidence_type":"PROVISIONAL_INFERENCE","finding":"The chapter’s political account depends heavily on allied local claims that are not independently tested."},{"id":"FIND-008","evidence_type":"PROVISIONAL_INFERENCE","finding":"The closing ethnography exposes the narrator’s or army’s Hellenocentric evaluative framework."}],"standing_unresolved_questions":[{"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"Timesitheus’s proxenos authority?"},{"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"Composition and rule of each faction?"},{"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"Grounds of vengeance?"},{"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"Greek force of “