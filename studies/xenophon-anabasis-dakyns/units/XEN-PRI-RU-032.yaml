{"schema_version":1.0,"unit_id":"XEN-PRI-RU-032","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis V.3","pdf_pages_one_based":"99-100","opening_anchor":"Now when Cheirisophus did not arrive, and the supply of ships was insufficient, and to get provisions longer was impossible, they resolved to depart.","closing_anchor":"IF ANY MAN FAIL IN AUGHT OF THIS THE GODDESS HERSELF WILL LOOK TO IT THAT THE MATTER SHALL NOT SLEEP."},"jurisdiction":"Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no isolated observation licenses a deed corpus, speech register, guard, adapter, or ministerial capacity.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg ebook 1170 captured as a 168-page searchable PDF","locator_rule":"Anabasis V.3 plus one-based PDF page","chapter_boundary_control":"V.3 begins beneath heading III on PDF page 99. Its chapter prose ends on page 100 with the Artemis inscription; editorial note (5) continues at the top of page 101 before heading IV and remains witness paratext. V.4 begins beneath heading IV on page 101 and ends on page 103 before heading V on page 104.","source_boundary":"Departure, census, captive-sale proceeds, sacred tithe, Delphi offering, Megabyzus deposit, Scillus estate, annual cult, temple, inscription, and editorial notes remain distinct."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration shifts from the march to an extended account of Xenophon's later dedications, exile, Scillus estate, household, cult, and inscription.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"autobiographical_excursus_present":true,"observation":"The narrator reports intimate later-life facts and an inscription bearing Xenophon's name without saying I.","uncertainty":"Narrator-author identity, composition, and the status of the excursus remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"Anabasis V.3; PDF p. 99","speech_form":"collective_departure_resolution","speaker":"Greek command or army","audience":"army","occasion":"ships and provisions insufficient","content":"They resolve on divided sea-and-land departure.","uncertainty":"No vote formula survives."},{"id":"SAO-002","locator":"Anabasis V.3; PDF p. 99","speech_form":"embarkation_assignment","speaker":"Greek command","audience":"sea and land parties","occasion":"departure organization","content":"Vulnerable persons and selected baggage sail under the two eldest generals; the rest march.","uncertainty":"Selection and consent are unstated."},{"id":"SAO-003","locator":"Anabasis V.3; PDF p. 99","speech_form":"sacred_fund_allocation","speaker":"Greek command","audience":"generals","occasion":"division of captive-sale proceeds","content":"A tithe for Apollo and Artemis is assigned for safekeeping.","uncertainty":"No accounting survives."},{"id":"SAO-004","locator":"Anabasis V.3; PDF p. 99","speech_form":"conditional_deposit_instruction","speaker":"Xenophon","audience":"Megabyzus","occasion":"departure with Agesilaus","content":"Restore the deposit if Xenophon lives; dedicate a fitting object if he dies.","uncertainty":"Exact wording is absent."},{"id":"SAO-005","locator":"Anabasis V.3; PDF p. 100","speech_form":"oracular_site_indication","speaker":"oracle","audience":"Xenophon","occasion":"land purchase","content":"The sacred plot is chosen at a point indicated by the oracle.","uncertainty":"Oracle and response are unidentified."},{"id":"SAO-006","locator":"Anabasis V.3; PDF p. 100","speech_form":"inscribed_cult_rule","speaker":"temple inscription","audience":"estate holder","occasion":"governance of sacred property","content":"Sacrifice a yearly tithe, repair the shrine from the residue, and face divine enforcement for failure.","uncertainty":"Greek text and legal force require review."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","locator":"Anabasis V.3; PDF p. 99","actor":"Greek army, Philesius, Sophaenetus","deed":"Sick persons, those over forty, boys, women, and dispensable baggage sail; the rest march.","outcome":"The army departs by two modes.","uncertainty":"Numbers and consent are absent."},{"id":"SDO-002","locator":"Anabasis V.3; PDF p. 99","actor":"Greek army","deed":"It reaches Cerasus, halts ten days, and counts the armed troops.","outcome":"Eight thousand six hundred survive under arms.","uncertainty":"Census boundaries are unclear."},{"id":"SDO-003","locator":"Anabasis V.3; PDF p. 99","actor":"army and generals","deed":"They divide money from captives sold and reserve a divine tithe.","outcome":"War proceeds fund distribution and cult.","uncertainty":"Captives and sums are unrecorded."},{"id":"SDO-004","locator":"Anabasis V.3; PDF p. 99","actor":"Xenophon","deed":"He commissions an Apollo offering at Delphi inscribed with his name and Proxenus's.","outcome":"The offering memorializes both men.","uncertainty":"Object and inscription are absent."},{"id":"SDO-005","locator":"Anabasis V.3; PDF pp. 99-100","actor":"Xenophon and Megabyzus","deed":"Xenophon deposits the Artemis share conditionally; Megabyzus later restores it at Scillus.","outcome":"The sacred money survives a later campaign.","uncertainty":"Chronology needs external review."},{"id":"SDO-006","locator":"Anabasis V.3; PDF p. 100","actor":"Xenophon","deed":"He buys oracle-indicated land whose river is also called Selinus.","outcome":"Portable money becomes a sacred estate.","uncertainty":"Oracle, seller, and title are absent."},{"id":"SDO-007","locator":"Anabasis V.3; PDF p. 100","actor":"Xenophon and local participants","deed":"He builds altar and temple, tithes produce, sacrifices, and holds an annual festival.","outcome":"A recurring communal cult is established.","uncertainty":"Labor and distribution are unstated."},{"id":"SDO-008","locator":"Anabasis V.3; PDF p. 100","actor":"Xenophon and builders","deed":"The temple and image imitate Ephesus at smaller scale and in cypress wood.","outcome":"Ephesian features are reproduced at Scillus.","uncertainty":"Architecture is not verified."},{"id":"SDO-009","locator":"Anabasis V.3; PDF p. 100","actor":"future estate holder","deed":"The inscription requires annual tithe sacrifice and shrine repair.","outcome":"The estate is framed as an enduring sacred trust.","uncertainty":"Succession and enforcement are unknown."},{"id":"SDO-010","locator":"Anabasis V.3; PDF pp. 99-101","actor":"witness editors","deed":"Notes discuss Asine, Delphi, Agesilaus, Scillus, and Pholoe.","outcome":"Later apparatus surrounds the narrative.","uncertainty":"The notes are not primary narrative evidence."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Departure decision","Divided movement to Cerasus","Census and attrition","Captive-sale distribution and tithe","Delphi offering","Artemis deposit","Scillus estate","Annual cult and inscription"],"repetitions":["Captured resources support survival and sacred duties.","Sacrifice continues beyond the march into permanent institutions.","Proxenus remains linked to Xenophon's memory."],"omissions":["Captives, census method, accounts, oracle, labor, and succession are absent.","No explanation is given for the later-life excursus."],"tensions":["Captive-sale revenue funds sacred gifts.","Collective hardship shifts into a prosperous landed cult.","Divine provision rests on estate production and hunting."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis V.3; PDF p. 99","evidence_type":"FAILED_NAVAL_MISSION_OBSERVATION","observation":"Cheirisophus has not returned when departure is decided.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-002","locator":"Anabasis V.3; PDF p. 99","evidence_type":"TRANSPORT_AND_PROVISION_EXHAUSTION_OBSERVATION","observation":"Insufficient ships and exhausted provisioning force departure.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-003","locator":"Anabasis V.3; PDF p. 99","evidence_type":"VULNERABILITY_BASED_EMBARKATION_OBSERVATION","observation":"Persons over forty, the sick, boys, women, and dispensable baggage are embarked.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-004","locator":"Anabasis V.3; PDF p. 99","evidence_type":"ELDEST_GENERAL_COMMAND_OBSERVATION","observation":"Philesius and Sophaenetus, the two eldest generals, command the sea party.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-005","locator":"Anabasis V.3; PDF p. 99","evidence_type":"ROAD_COMPLETION_OBSERVATION","observation":"The overland force uses the now-completed road.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-006","locator":"Anabasis V.3; PDF p. 99","evidence_type":"CERASUS_HALT_OBSERVATION","observation":"The army reaches Cerasus on the third day and halts ten days.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-007","locator":"Anabasis V.3; PDF p. 99","evidence_type":"ARMED_TROOP_CENSUS_OBSERVATION","observation":"A review counts eight thousand six hundred troops under arms.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-008","locator":"Anabasis V.3; PDF p. 99","evidence_type":"CUMULATIVE_ATTRITION_OBSERVATION","observation":"The missing are attributed to enemies, snow, or disease.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-009","locator":"Anabasis V.3; PDF p. 99","evidence_type":"CAPTIVE_SALE_REVENUE_OBSERVATION","observation":"Money accrues from captives sold.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-010","locator":"Anabasis V.3; PDF p. 99","evidence_type":"SACRED_TITHE_FROM_CAPTIVITY_OBSERVATION","observation":"A tithe for Apollo and Artemis is taken from captive-sale revenue.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-011","locator":"Anabasis V.3; PDF p. 99","evidence_type":"DISTRIBUTED_SACRED_CUSTODY_OBSERVATION","observation":"The generals hold shares for the gods; Neon holds Cheirisophus's share.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-012","locator":"Anabasis V.3; PDF p. 99","evidence_type":"DELPHI_DEDICATION_OBSERVATION","observation":"Xenophon dedicates an Apollo offering among the Athenian treasuries at Delphi.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-013","locator":"Anabasis V.3; PDF p. 99","evidence_type":"NAMED_MEMORIAL_INSCRIPTION_OBSERVATION","observation":"The offering bears Xenophon's own name and that of Proxenus.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-014","locator":"Anabasis V.3; PDF p. 99","evidence_type":"CONDITIONAL_SACRED_DEPOSIT_OBSERVATION","observation":"The Artemis money is deposited with Megabyzus under survival-dependent instructions.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-015","locator":"Anabasis V.3; PDF p. 99","evidence_type":"LATER_BIOGRAPHICAL_EXCURSUS_OBSERVATION","observation":"The chapter shifts to Xenophon's later campaign, banishment, and settlement at Scillus.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-016","locator":"Anabasis V.3; PDF p. 100","evidence_type":"ORACLE_INDICATED_LAND_PURCHASE_OBSERVATION","observation":"Xenophon buys land at a location indicated by an oracle.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-017","locator":"Anabasis V.3; PDF p. 100","evidence_type":"EPHESIAN_ANALOGY_OBSERVATION","observation":"The Scillus estate has a river named Selinus and imitates Ephesian cult features.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-018","locator":"Anabasis V.3; PDF p. 100","evidence_type":"ANNUAL_TITHE_AND_SACRIFICE_OBSERVATION","observation":"Xenophon annually tithes produce and sacrifices to Artemis.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-019","locator":"Anabasis V.3; PDF p. 100","evidence_type":"COMMUNAL_FESTIVAL_OBSERVATION","observation":"Citizens and neighboring men and women share the festival.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-020","locator":"Anabasis V.3; PDF p. 100","evidence_type":"DIVINE_PROVISION_ATTRIBUTION_OBSERVATION","observation":"The goddess is said to provide the banquet through the estate and hunt.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-021","locator":"Anabasis V.3; PDF p. 100","evidence_type":"HOUSEHOLD_AND_CIVIC_HUNT_OBSERVATION","observation":"Xenophon's sons and other citizens' sons hunt before the festival.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-022","locator":"Anabasis V.3; PDF p. 100","evidence_type":"SACRED_ESTATE_ECONOMY_OBSERVATION","observation":"Pasture, livestock, grove, fruit, fish, mussels, and hunting form the sacred estate's economy.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-023","locator":"Anabasis V.3; PDF p. 100","evidence_type":"TEMPLE_REPLICATION_OBSERVATION","observation":"The temple is a small-scale copy of Ephesus and the image is cypress rather than gold.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-024","locator":"Anabasis V.3; PDF p. 100","evidence_type":"SACRED_PROPERTY_INSCRIPTION_OBSERVATION","observation":"The inscription requires yearly tithe sacrifice and shrine repair.","uncertainty":"Greek wording and omitted details remain unresolved."},{"id":"OBS-025","locator":"Anabasis V.3; PDF pp. 99-101","evidence_type":"EDITORIAL_PARATEXT_OBSERVATION","observation":"Historical-geographical notes include note (5) continued onto page 101 before V.4.","uncertainty":"Greek wording and omitted details remain unresolved."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"The coastal strategy becomes selective sea transport plus continued land movement.","basis":"Embarkation categories and road march.","uncertainty":"No broader conclusion is certified."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"The Cerasus census institutionalizes a count of surviving armed strength.","basis":"Review, number, and attrition summary.","uncertainty":"No broader conclusion is certified."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"Sacred obligation is financed by the captive-sale economy.","basis":"Sale proceeds and tithe.","uncertainty":"No broader conclusion is certified."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"The Delphi offering links Xenophon's memorial to Proxenus.","basis":"Both names appear on the offering.","uncertainty":"No broader conclusion is certified."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"The Artemis fund becomes a permanent landed institution.","basis":"Deposit, restoration, land, temple, inscription.","uncertainty":"No broader conclusion is certified."},{"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"The march is connected to Xenophon's later exile, household, and cult.","basis":"The autobiographical temporal shift.","uncertainty":"No broader conclusion is certified."},{"id":"FIND-007","evidence_type":"PROVISIONAL_INFERENCE","finding":"Divine provision is joined to agriculture, pastoralism, and hunting.","basis":"Festival and estate economy.","uncertainty":"No broader conclusion is certified."},{"id":"FIND-008","evidence_type":"PROVISIONAL_INFERENCE","finding":"The inscription attempts to preserve sacred stewardship beyond the founder.","basis":"Duties bind whoever holds the land.","uncertainty":"No broader conclusion is certified."}],"standing_unresolved_questions":[{"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"How were embarkation categories selected and did people consent?"},{"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"Who was counted among the 8,600 under arms?"},{"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"Who were the captives sold and under what authority?"},{"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"What were the sums, tithe, shares, and custody controls?"},{"id":"Q-005","evidence_type":"UNRESOLVED_QUESTION","question":"What was the Delphi offering and inscription?"},{"id":"Q-006","evidence_type":"UNRESOLVED_QUESTION","question":"How should the joint naming of Xenophon and Proxenus be read?"},{"id":"Q-007","evidence_type":"UNRESOLVED_QUESTION","question":"What is the chronology of deposit, campaign, restoration, and purchase?"},{"id":"Q-008","evidence_type":"UNRESOLVED_QUESTION","question":"Which oracle indicated the site?"},{"id":"Q-009","evidence_type":"UNRESOLVED_QUESTION","question":"How does the Greek present the Selinus parallel?"},{"id":"Q-010","evidence_type":"UNRESOLVED_QUESTION","question":"Who owned, worked, and inherited the estate?"},{"id":"Q-011","evidence_type":"UNRESOLVED_QUESTION","question":"What were the statuses of household and festival participants?"},{"id":"Q-012","evidence_type":"UNRESOLVED_QUESTION","question":"What is the Greek text and force of the property inscription?"},{"id":"Q-013","evidence_type":"UNRESOLVED_QUESTION","question":"When and why was the excursus composed or inserted?"},{"id":"Q-014","evidence_type":"UNRESOLVED_QUESTION","question":"Does the intimate third-person account identify the narrator with Xenophon?"}],"downstream_textual_checks":[{"id":"CHECK-001","check":"Check embarkation and senior-command vocabulary in Greek."},{"id":"CHECK-002","check":"Verify the census numeral and attrition wording."},{"id":"CHECK-003","check":"Check captive-sale, tithe, and custody terms."},{"id":"CHECK-004","check":"Compare the Delphi offering with literary and archaeological evidence."},{"id":"CHECK-005","check":"Verify Megabyzus's title and deposit instructions."},{"id":"CHECK-006","check":"Check Agesilaus, exile, and Scillus chronology."},{"id":"CHECK-007","check":"Examine oracle and Selinus language."},{"id":"CHECK-008","check":"Check festival, household, hunt, and divine-provision terms."},{"id":"CHECK-009","check":"Compare temple and image descriptions with Ephesus."},{"id":"CHECK-010","check":"Establish the Greek text and cultic-legal form of the inscription."}],"secondary_comparison_status":"DEFERRED","comparison_note":"Strauss remains confined to the owner-adopted secondary reconstruction."}