{"schema_version":1.0,"unit_id":"XEN-PRI-RU-028","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis IV.7","pdf_pages_one_based":"87-90","opening_anchor":"After this they marched into the country of the Taochians five stages—thirty parasangs—and provisions failed;","closing_anchor":"So, after pointing out to them a village where they would find quarters, and the road by which they would proceed towards the land of the Macrones, as evening fell, he turned his back upon them in the night and was gone."},"jurisdiction":"Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no isolated observation licenses a deed corpus, speech register, guard, adapter, or ministerial capacity.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg ebook 1170 captured as a 168-page searchable PDF","locator_rule":"Anabasis IV.7 plus one-based PDF page","chapter_boundary_control":"IV.7 begins beneath heading VII on PDF page 87 and ends on PDF page 90 immediately before heading VIII. The previously anticipated range 87-89 was corrected after visual inspection showed the cairn, guide payment, and dismissal on page 90. IV.8 begins on page 90 and ends on page 93 before Book V.","source_boundary":"Narratorial geography, tactical dialogue, collective assault, competitive initiative, mass death, reported ethnography, route and distance reports, guide speech, inferred motive, rearguard inference, collective acclamation, memorial action, payment, and departure remain distinct. Notes identifying the Chalybes, explaining the spear point, proposing modern locations for Gymnias and Theches, and preserving the 'sacred mountain' manuscript variant remain witness paratext."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person historical narration presenting Xenophon as a commander who analyzes the Taochian position, helps design the assault, misreads the first sea-shout from the rear, and then rides forward to investigate.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"observation":"Xenophon appears in attributed dialogue and named action. The narrator reports his conjecture, revised judgment, and movement to the summit without an unframed first-person self-identification.","uncertainty":"The witness does not settle the Greek force of provisions failed, strong place, valour, strife of honour, terrible spectacle, bravest, hostile district, sea-cry, cairn, dedication, common store, or the relation between narrator and historical author."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"Anabasis IV.7; PDF p. 87","speech_form":"necessity_statement","speaker":"Cheirisophus","audience":"Xenophon","occasion":"arrival of the rearguard before the Taochian fortress","content":"The place must be taken because the troops have no provisions unless they capture it.","uncertainty":"The scale of remaining provisions is not quantified."},{"id":"SAO-002","locator":"Anabasis IV.7; PDF p. 87","speech_form":"tactical_inquiry","speaker":"Xenophon","audience":"Cheirisophus","occasion":"inspection of the only approach","content":"He asks what prevents the Greeks from simply walking into the stronghold.","uncertainty":"The question initiates reconnaissance rather than expressing ignorance of all danger."},{"id":"SAO-003","locator":"Anabasis IV.7; PDF p. 87","speech_form":"terrain_and_casualty_report","speaker":"Cheirisophus","audience":"Xenophon","occasion":"same inspection","content":"He identifies the single narrow approach, stones rolled from the overhanging crag, and men with crushed legs or ribs as evidence of the obstacle.","uncertainty":"The casualty total and prior attack sequence are not given."},{"id":"SAO-004","locator":"Anabasis IV.7; PDF pp. 87-88","speech_form":"ammunition_exhaustion_plan","speaker":"Xenophon","audience":"Cheirisophus and nearby officers","occasion":"planning a renewed approach","content":"He proposes using the trees as cover, provoking the defenders to expend stones, and crossing the final exposed space during a lull from a position that permits retreat.","uncertainty":"The translated distances and implied estimate of enemy ammunition require textual review."},{"id":"SAO-005","locator":"Anabasis IV.7; PDF p. 89","speech_form":"guide_guarantee","speaker":"guide sent from Gymnias","audience":"Greek command and army","occasion":"appointment to lead through territory hostile to his governor","content":"Within five days he will show them the sea; if he fails, they may take his life.","uncertainty":"The legal or ritual form of the pledge is not supplied."},{"id":"SAO-006","locator":"Anabasis IV.7; PDF p. 89","speech_form":"destructive_exhortation","speaker":"Gymnias guide","audience":"Greek army","occasion":"entry into the district hostile to his own community","content":"He repeatedly urges the Greeks to burn and harry the land.","uncertainty":"The exact words and limits of the exhortation are not quoted."},{"id":"SAO-007","locator":"Anabasis IV.7; PDF p. 89","speech_form":"collective_acclamation","speaker":"soldiers at and approaching Theches","audience":"one another and the advancing army","occasion":"first sight of the sea","content":"They pass on the joyful cry, 'The sea! the sea!'","uncertainty":"The Greek form, sequence of transmission, and first speaker are not identified."},{"id":"SAO-008","locator":"Anabasis IV.7; PDF p. 90","speech_form":"anonymous_memorial_order","speaker":"unnamed person","audience":"soldiers on the summit","occasion":"collective arrival and recognition of the sea","content":"An order is passed to bring stones and erect a great cairn.","uncertainty":"The originator and authority of the order are unknown."},{"id":"SAO-009","locator":"Anabasis IV.7; PDF p. 90","speech_form":"guide_imitation_invitation","speaker":"Gymnias guide","audience":"soldiers at the cairn","occasion":"dedication of captured wicker shields","content":"He hacks shields to pieces with his own hand and invites others to imitate him.","uncertainty":"The act's ritual meaning and relation to the earlier hostile district are unstated."},{"id":"SAO-010","locator":"Anabasis IV.7; PDF p. 90","speech_form":"route_and_quarters_instruction","speaker":"Gymnias guide","audience":"Greek command","occasion":"dismissal after the sea sighting","content":"He points out a village for quarters and the road toward the Macrones.","uncertainty":"No reason is given for his nocturnal departure after dismissal."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","locator":"Anabasis IV.7; PDF p. 87","actor":"Greek army and Taochian defenders","deed":"After provisions fail, Cheirisophus sends successive regiments against a river-encircled stronghold whose only approach is exposed to stones from above.","outcome":"The assaults tire and produce crushing injuries without initially taking the place.","uncertainty":"Numbers of attackers, defenders, wounded, and dead are absent."},{"id":"SDO-002","locator":"Anabasis IV.7; PDF pp. 87-88","actor":"Xenophon, Cheirisophus, Callimachus, and about seventy soldiers","deed":"They reconnoiter, move men singly under tree cover, and deliberately provoke the defenders to expend wagon-loads of stones.","outcome":"The remaining exposed run becomes tactically possible.","uncertainty":"The literal quantity of stones and exact geometry are narratorial estimates."},{"id":"SDO-003","locator":"Anabasis IV.7; PDF p. 88","actor":"Agasias, Callimachus, Aristonymus, and Eurylochus","deed":"Competitive desire for distinction breaks the staged plan: Agasias rushes without summoning comrades, Callimachus grabs his shield, and Aristonymus and Eurylochus race past.","outcome":"The three runners enter the fortress and stone-throwing ceases.","uncertainty":"Command authorization and the exact identity of the three credited captors require Greek review."},{"id":"SDO-004","locator":"Anabasis IV.7; PDF p. 88","actor":"Taochian inhabitants and Aeneas","deed":"Women throw infants and themselves from the cliff, men follow, and a finely dressed man drags Aeneas over while Aeneas tries to restrain him.","outcome":"Most inhabitants die; few people are captured, while many animals are taken.","uncertainty":"Motives, total deaths, and survivor identities are not reported."},{"id":"SDO-005","locator":"Anabasis IV.7; PDF pp. 88-89","actor":"Chalybes and Greek army","deed":"The Chalybes repeatedly fight at close quarters, shadow the march from fortified settlements, and deny the Greeks access to local stores.","outcome":"The Greeks subsist on livestock taken from the Taochians while passing through Chalybian territory.","uncertainty":"The ethnographic superlative and weapon descriptions are not independently verified."},{"id":"SDO-006","locator":"Anabasis IV.7; PDF p. 89","actor":"Greek army","deed":"The army crosses the Harpasus, passes through Scythenian country, halts three days in villages, and reaches prosperous Gymnias.","outcome":"The army replenishes supplies and receives a new guide.","uncertainty":"Ancient geography and distance measures remain unverified."},{"id":"SDO-007","locator":"Anabasis IV.7; PDF p. 89","actor":"Gymnias governor, guide, and Greek army","deed":"The governor supplies a guide through an enemy district; the guide stakes his life on showing the sea within five days and urges burning and devastation after entering the hostile land.","outcome":"The army follows while the guide's local political purpose becomes visible to the narrator.","uncertainty":"The governor's instructions and the narrator's access to the guide's motive are unstated."},{"id":"SDO-008","locator":"Anabasis IV.7; PDF p. 89","actor":"front ranks, Xenophon, rearguard, Lycius, and cavalry","deed":"The front sees the sea and shouts; Xenophon initially infers an attack because the rear is fighting inhabitants in a burning landscape, then rides forward as the cry grows.","outcome":"He hears the transmitted acclamation and recognizes an extraordinary event rather than a new attack.","uncertainty":"The timing and number of local casualties and captives are absent."},{"id":"SDO-009","locator":"Anabasis IV.7; PDF pp. 89-90","actor":"Greek army","deed":"Rear guard, baggage animals, and horses rush to the summit; soldiers, officers, and generals embrace and weep.","outcome":"Sight of the sea produces collective emotional reunion across ranks and functions.","uncertainty":"No individual first speaker or formal assembly is identified."},{"id":"SDO-010","locator":"Anabasis IV.7; PDF p. 90","actor":"Greek soldiers and Gymnias guide","deed":"They build a cairn, dedicate skins, staves, and captured shields, pay the guide from the common store, supplement the payment with private rings, receive final route directions, and dismiss him.","outcome":"The guide leaves at night after completing the promised sea-leading service.","uncertainty":"The ownership and ritual status of dedicated objects and the accounting of gifts are not supplied."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Provision failure and repeated assault on Taochian stronghold","Tree-cover and ammunition-exhaustion plan","Competitive rush and capture","Mass death and livestock seizure","Passage through Chalybian and Scythenian territories","Arrival at Gymnias and appointment of guide","Burning and harrying hostile territory","First sight and transmission of the sea-cry","Collective embrace, tears, cairn, dedication, and guide payment"],"repetitions":["Scarcity repeatedly drives coercive seizure and tactical risk.","High places, narrow approaches, and rear-front separation govern perception and action.","Guides remain bound to Greek movement through threat, payment, local enmity, or all three.","Competitive honor can accelerate success while bypassing command sequence."],"omissions":["Taochian voices, motives, casualty totals, and survivor identities are absent.","No formal command response to Agasias's unauthorized rush is recorded.","The Chalybian report lacks an identified informant.","The guide's name, governor's name, and exact instructions are absent.","The first person to see the sea and the person who orders the cairn remain unnamed."],"tensions":["A necessity of provisions precedes an assault ending in mass civilian death.","Xenophon's controlled ammunition plan is completed through uncontrolled rivalry.","The guide promises service under threat of death and is later honored with public and private gifts.","The sea-cry of homeward hope arises while the hostile countryside is burning behind the army.","Collective tears and dedication coexist with recent killing, capture, and devastation."]},"documentary_observations":[{"id":"OBS-001","locator":"Anabasis IV.7; PDF p. 87","evidence_type":"PROVISION_FAILURE_OBSERVATION","observation":"Provisions fail in Taochian country because stores have been carried into strong places.","uncertainty":"The quantity and prior means of acquisition are unstated."},{"id":"OBS-002","locator":"Anabasis IV.7; PDF p. 87","evidence_type":"FORTRESS_POPULATION_OBSERVATION","observation":"The attacked stronghold contains a mixed crowd of men and women together with numerous flocks and herds, but no city or houses are reported.","uncertainty":"The inhabitants' legal or political status is not supplied."},{"id":"OBS-003","locator":"Anabasis IV.7; PDF p. 87","evidence_type":"CRUSHING_CASUALTY_OBSERVATION","observation":"Stones rolled from the crag crush legs and ribs among previous attackers.","uncertainty":"Numbers and outcomes are absent."},{"id":"OBS-004","locator":"Anabasis IV.7; PDF pp. 87-88","evidence_type":"AMMUNITION_EXHAUSTION_TACTIC_OBSERVATION","observation":"Xenophon proposes using tree cover and repeated exposure to exhaust the defenders' stone supply.","uncertainty":"The defender stockpile is inferred rather than counted."},{"id":"OBS-005","locator":"Anabasis IV.7; PDF p. 88","evidence_type":"SPECTATOR_ARMY_OBSERVATION","observation":"The whole army watches Callimachus's repeated feints as spectators.","uncertainty":"The spatial arrangement and command function of the spectators are not explained."},{"id":"OBS-006","locator":"Anabasis IV.7; PDF p. 88","evidence_type":"HONOR_RIVALRY_OBSERVATION","observation":"Agasias, Aristonymus, and Eurylochus compete to be first through the stone fire, and the narrative calls this a strife of honour.","uncertainty":"The Greek vocabulary and evaluation require original-language review."},{"id":"OBS-007","locator":"Anabasis IV.7; PDF p. 88","evidence_type":"UNAUTHORIZED_INITIATIVE_OBSERVATION","observation":"Agasias advances without summoning neighboring comrades or receiving a recorded order.","uncertainty":"No disciplinary response is reported."},{"id":"OBS-008","locator":"Anabasis IV.7; PDF p. 88","evidence_type":"MASS_SELF_DESTRUCTION_OBSERVATION","observation":"Women throw infants and themselves from the cliff, and men likewise jump after the fortress is entered.","uncertainty":"The narrative supplies no direct explanation from the inhabitants."},{"id":"OBS-009","locator":"Anabasis IV.7; PDF p. 88","evidence_type":"FAILED_RESCUE_OBSERVATION","observation":"Aeneas tries to prevent a finely dressed man from jumping, but the man embraces him and both fall to their deaths.","uncertainty":"Intentionality and exact physical action are mediated by translation."},{"id":"OBS-010","locator":"Anabasis IV.7; PDF p. 88","evidence_type":"CAPTURE_DISTRIBUTION_OBSERVATION","observation":"Very few human prisoners but abundant cattle, asses, and sheep are taken from the stronghold.","uncertainty":"Numbers, ownership, and distribution are absent."},{"id":"OBS-011","locator":"Anabasis IV.7; PDF pp. 88-89","evidence_type":"REPORTED_ETHNOGRAPHIC_SUPERLATIVE_OBSERVATION","observation":"The Chalybes are called the bravest people encountered on the march and are described as close-quarter fighters with distinctive armor and weapons.","uncertainty":"The superlative and descriptions are not independently authenticated."},{"id":"OBS-012","locator":"Anabasis IV.7; PDF p. 89","evidence_type":"TROPHY_HEAD_DISPLAY_OBSERVATION","observation":"Chalybian fighters are said to cut throats, sever heads, and carry them while singing and dancing within enemy view.","uncertainty":"Frequency and source of the report are not given."},{"id":"OBS-013","locator":"Anabasis IV.7; PDF p. 89","evidence_type":"GUIDE_LIFE_PLEDGE_OBSERVATION","observation":"The Gymnias guide authorizes the Greeks to take his life if he fails to show them the sea within five days.","uncertainty":"The enforceability and ritual form are unstated."},{"id":"OBS-014","locator":"Anabasis IV.7; PDF p. 89","evidence_type":"GUIDE_LOCAL_ENMITY_OBSERVATION","observation":"The guide urges burning and harrying in territory hostile to his own community, and the narrator infers that this motive explains his service.","uncertainty":"The motive is narratorial inference."},{"id":"OBS-015","locator":"Anabasis IV.7; PDF p. 89","evidence_type":"SEA_SIGHT_ACCLAMATION_OBSERVATION","observation":"The soldiers transmit the cry 'The sea! the sea!' as more men reach Theches.","uncertainty":"The first shouter and Greek wording are unrecorded in this translation unit."},{"id":"OBS-016","locator":"Anabasis IV.7; PDF p. 89","evidence_type":"REARGUARD_MISINTERPRETATION_OBSERVATION","observation":"Xenophon initially interprets the shout as evidence of a new attack because the rear is already opposed by inhabitants in a burning district.","uncertainty":"The inferential sequence is narrated retrospectively."},{"id":"OBS-017","locator":"Anabasis IV.7; PDF pp. 89-90","evidence_type":"COLLECTIVE_EMOTION_OBSERVATION","observation":"Generals, officers, and soldiers embrace and weep after reaching the summit.","uncertainty":"The narrative generalizes collective emotion."},{"id":"OBS-018","locator":"Anabasis IV.7; PDF p. 90","evidence_type":"CAIRN_DEDICATION_OBSERVATION","observation":"An anonymous order produces a cairn bearing untanned skins, staves, and captured wicker shields.","uncertainty":"The rite, deity, and permanence of the dedication are unstated."},{"id":"OBS-019","locator":"Anabasis IV.7; PDF p. 90","evidence_type":"COMMON_AND_PRIVATE_REWARD_OBSERVATION","observation":"The guide receives a horse, silver bowl, Persian dress, and ten darics from the common store, plus rings from individual soldiers.","uncertainty":"Valuation, ownership history, and distribution procedure are absent."},{"id":"OBS-020","locator":"Anabasis IV.7; PDF pp. 88-90","evidence_type":"EDITORIAL_PARATEXT_OBSERVATION","observation":"Notes distinguish two Chalybian groups, explain the single-point spear, propose modern sites for Gymnias and Theches, and preserve a 'sacred mountain' manuscript reading.","uncertainty":"These are witness paratext rather than silently primary narration."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"IV.7 joins the most celebrated moment of homeward hope to a sequence of assault, mass death, capture, and deliberate devastation.","basis":"Taochian fortress, guide's hostile-land exhortation, sea sight, cairn.","uncertainty":"The chapter does not state an explicit moral synthesis."},{"id":"FIND-002","evidence_type":"PROVISIONAL_INFERENCE","finding":"Tactical intelligence and competitive honor are complementary but unstable sources of success.","basis":"Ammunition plan, Callimachus's feints, unauthorized race into the fortress.","uncertainty":"The narrative does not decide whether rivalry should be praised or disciplined."},{"id":"FIND-003","evidence_type":"PROVISIONAL_INFERENCE","finding":"Provision scarcity repeatedly converts local populations and property into military resources.","basis":"Reason for assault, livestock seizure, Chalybian subsistence, Scythenian resupply.","uncertainty":"No general doctrine of necessity is supplied."},{"id":"FIND-004","evidence_type":"PROVISIONAL_INFERENCE","finding":"The army's front and rear inhabit different perceptual worlds: joy at the summit first appears to the rear as another tactical emergency.","basis":"Sea cry and Xenophon's initial attack inference.","uncertainty":"The inference is limited to this narrated episode."},{"id":"FIND-005","evidence_type":"PROVISIONAL_INFERENCE","finding":"The Gymnias guide's relation to the army combines lethal guarantee, local political revenge, useful service, public compensation, and private gift exchange.","basis":"Life pledge, burning exhortations, sea guidance, payment and rings.","uncertainty":"His own account of motive is not preserved."},{"id":"FIND-006","evidence_type":"PROVISIONAL_INFERENCE","finding":"The sea sight temporarily collapses distinctions of rank through common running, embracing, tears, and memorial labor.","basis":"Rear guard, animals, generals, officers, soldiers, cairn.","uncertainty":"Command hierarchy is not abolished."},{"id":"FIND-007","evidence_type":"PROVISIONAL_INFERENCE","finding":"The cairn transforms captured materials and route achievement into a collective monument without an identified founder or stated deity.","basis":"Anonymous order and dedicated objects.","uncertainty":"The rite's conventional meaning requires comparison."},{"id":"FIND-008","evidence_type":"PROVISIONAL_INFERENCE","finding":"Narratorial superlatives and motive attributions are especially prominent in the Chalybian and guide passages and require strict separation from directly observed deeds.","basis":"Bravest-men claim and guide-purpose inference.","uncertainty":"Greek and comparative witness review remain outstanding."}],"standing_unresolved_questions":[{"id":"Q-001","evidence_type":"UNRESOLVED_QUESTION","question":"What Greek terms describe the Taochian stronghold, mixed population, and failure of provisions?"},{"id":"Q-002","evidence_type":"UNRESOLVED_QUESTION","question":"How many casualties resulted from the repeated stone attacks and final capture?"},{"id":"Q-003","evidence_type":"UNRESOLVED_QUESTION","question":"Which men are grammatically credited with taking the fortress, and how is the strife of honour evaluated?"},{"id":"Q-004","evidence_type":"UNRESOLVED_QUESTION","question":"What explanation, if any, does the Greek wording imply for the Taochian mass deaths?"},{"id":"Q-005","evidence_type":"UNRESOLVED_QUESTION","question":"What is the source and force of the claim that the Chalybes were the bravest encountered?"},{"id":"Q-006","evidence_type":"UNRESOLVED_QUESTION","question":"How should the Chalybian armor, sword, head display, dance, and spear terminology be rendered?"},{"id":"Q-007","evidence_type":"UNRESOLVED_QUESTION","question":"What political relation joined the Gymnias governor, the guide, and the hostile district?"},{"id":"Q-008","evidence_type":"UNRESOLVED_QUESTION","question":"What form did the guide's life guarantee take, and could the Greeks lawfully enforce it?"},{"id":"Q-009","evidence_type":"UNRESOLVED_QUESTION","question":"How strongly does the narrator assert the guide's motive for encouraging devastation?"},{"id":"Q-010","evidence_type":"UNRESOLVED_QUESTION","question":"What is the Greek wording and narrative distribution of the cry commonly rendered 'The sea! the sea!'?"},{"id":"Q-011","evidence_type":"UNRESOLVED_QUESTION","question":"Who orders the cairn, to whom or what are the objects dedicated, and what precedent governs the act?"},{"id":"Q-012","evidence_type":"UNRESOLVED_QUESTION","question":"How were the common-store payment and soldiers' private rings authorized and valued?"},{"id":"Q-013","evidence_type":"UNRESOLVED_QUESTION","question":"Which ancient sites correspond to Gymnias and Theches?"},{"id":"Q-014","evidence_type":"UNRESOLVED_QUESTION","question":"What becomes of the human captives taken by ambush in the burning district and at the Taochian stronghold?"}],"downstream_textual_checks":[{"id":"CHECK-001","check":"Verify the IV.7 boundary through page 90 against a Greek edition and another translation."},{"id":"CHECK-002","check":"Check tactical vocabulary, distances, tree cover, and the quantity phrase for expended stones."},{"id":"CHECK-003","check":"Resolve the syntax naming Agasias, Aristonymus, Eurylochus, and Callimachus in the fortress capture."},{"id":"CHECK-004","check":"Compare the mass-death scene and Aeneas episode across critical editions."},{"id":"CHECK-005","check":"Check Chalybian ethnographic, armor, weapon, song, dance, and head-display terms."},{"id":"CHECK-006","check":"Verify Harpasus, Gymnias, Theches, and the 'sacred mountain' variant."},{"id":"CHECK-007","check":"Compare the guide's pledge, hostile-land exhortations, inferred motive, and dismissal terms."},{"id":"CHECK-008","check":"Check the Greek wording, repetitions, and speaker anonymity of the sea acclamation."},{"id":"CHECK-009","check":"Compare cairn, dedication, captured-object destruction, and common-store terminology."},{"id":"CHECK-010","check":"Track Taochian livestock, captives, guide gifts, and rings in later narrative or parallel witnesses."}],"secondary_comparison_status":"DEFERRED","comparison_note":"Strauss remains confined to the owner-adopted secondary reconstruction."}