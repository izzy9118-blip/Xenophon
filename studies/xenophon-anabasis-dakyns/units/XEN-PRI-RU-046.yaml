{"schema_version":1.0,"unit_id":"XEN-PRI-RU-046","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VII.3","pdf_pages_one_based":"145-150","opening_anchor":"BOOK VII, III: After listening to these proposals, they gave and accepted pledges of good faith; and so the deputation rode off.","closing_anchor":"The captives numbered one thousand, the cattle two thousand, and the smaller animals ten thousand."},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170 searchable 168-page PDF","chapter_boundary_control":"Heading III begins VII.3 on PDF page 145; heading IV begins VII.4 on page 150. This unit covers pages 145-150 and stops before heading IV. Direct boundary review also establishes that heading V begins on page 153, so the next unit covers pages 150-153; an earlier tentative 150-155 range was not adopted.","source_boundary":"Public comparison of Aristarchus and Seuthes; move to provisions; army vote; banquet and gifts; surprise night march; first Thracian capture."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with attributed speeches, public motions, reported motives, comic banquet action, tactical prescriptions, and narrated outcomes.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"First-person forms occur in attributed speeches. Xenophon remains a third-person character whose provisioning judgment, wish for public witnesses, and tactical intention are narrated.","uncertainty":"The justice and reliability of each proposal, the status of banquet customs, motives behind gifts, divine causation, historical kinship, and the justice of enslavement remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Xenophon","audience":"army assembly","occasion":"after refusing Aristarchus’s second summons","content":"Discloses Aristarchus’s and Seuthes’s alternatives and proposes moving first to villages where necessities can be taken."},{"id":"SAO-002","speaker":"assembled soldiers","audience":"Xenophon and one another","occasion":"provision-first motion","content":"Raise their hands unanimously and prepare to follow."},{"id":"SAO-003","speaker":"Xenophon","audience":"Seuthes and many witnesses","occasion":"Seuthes meets the marching army","content":"Asks Seuthes to lead them where provisions are abundant before the final choice is made."},{"id":"SAO-004","speaker":"Seuthes","audience":"army assembly in the villages","occasion":"formal employment proposal","content":"Offers a Cyzicene per soldier, customary higher rates, honors, provisioning, redistributed captures, and a short inland campaign."},{"id":"SAO-005","speaker":"supporting soldiers","audience":"army assembly","occasion":"debate on Seuthes’s proposal","content":"Argue that winter, poverty, and the cost of remaining among friends make Thracian service preferable."},{"id":"SAO-006","speaker":"Heracleides","audience":"Parians, Timasion, and Xenophon separately","occasion":"before Seuthes’s banquet","content":"Solicits gifts by promising proximity, restoration, wealth, forts, territory, and favor."},{"id":"SAO-007","speaker":"Gnesippus","audience":"banquet company","occasion":"gift exchange","content":"Jokes that the king should give to those who possess nothing."},{"id":"SAO-008","speaker":"Xenophon","audience":"Seuthes and banquet company","occasion":"his turn to present a gift","content":"Offers himself and his comrades as willing trusty friends and promises acquisitions, God willing."},{"id":"SAO-009","speaker":"Seuthes","audience":"Xenophon and banquet company","occasion":"acceptance of Xenophon’s gift","content":"Drinks to him and sprinkles the last drops in token of fraternity."},{"id":"SAO-010","speaker":"Xenophon and Seuthes","audience":"one another and the officers","occasion":"night operation","content":"Agree that the slowest arm should lead, choose Athenaia as watchword, and order the midnight formation."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","deed":"Delegates report before dawn; leaders refuse another visit to Aristarchus and call the army together.","outcome":"The rival proposals enter public jurisdiction."},{"id":"SDO-002","deed":"Xenophon discloses both alternatives and moves that provisions precede final decision.","outcome":"All hands support immediate movement."},{"id":"SDO-003","deed":"The army ignores Neon and Aristarchus’s agents; Xenophon requests Seuthes’s guidance publicly.","outcome":"Seuthes leads them to close-packed provision-rich villages."},{"id":"SDO-004","deed":"Seuthes states pay, provisioning, capture, honor, and distance terms; soldiers debate.","outcome":"The proposal is accepted without opposition."},{"id":"SDO-005","deed":"Heracleides solicits gifts; banquet guests exchange animals, persons, clothing, silver, and textiles.","outcome":"Employment begins amid patronage, display, and comedy."},{"id":"SDO-006","deed":"Nearly penniless Xenophon offers his service and comrades rather than material wealth.","outcome":"Seuthes accepts the personal pledge fraternally."},{"id":"SDO-007","deed":"The Greeks arrange sentinels and restrict Thracian night entry; Seuthes proposes immediate surprise.","outcome":"The army departs at midnight."},{"id":"SDO-008","deed":"Xenophon places the slowest arm first; Seuthes supplies guides; Athenaia becomes the watchword.","outcome":"Heavy infantry, light infantry, and cavalry preserve order through the night."},{"id":"SDO-009","deed":"At dawn Seuthes praises the formation; Xenophon dismounts and leads the younger men while Cleanor follows.","outcome":"The Greeks occupy heights and enclose the villages."},{"id":"SDO-010","deed":"The first operation captures one thousand persons, two thousand cattle, and ten thousand smaller animals.","outcome":"Tactical success and captured wealth precede any verified payment."}],"sequence_repetition_omission_and_contradiction":{"sequence":["delegation reports","Aristarchus summons refused","army assembly","alternatives disclosed","provision-first vote","march begins","Seuthes encountered","abundant villages","employment terms","unopposed vote","gift solicitation","banquet exchange","Xenophon’s personal gift","night precautions","surprise proposal","midnight formation","dawn praise","heights occupied","captures counted"],"repetitions":["Material need drives constitutional choice.","Xenophon places major choices before the army.","Promises and gifts organize mercenary relations.","Public witnesses protect contested agreements.","Military cohesion depends on order of march."],"omissions":["No verbatim speech from an opponent of Seuthes is supplied.","No independent valuation of captured property appears.","No later payment verifies the current promise.","No account from the captured villagers is given.","No transparent explanation of Athenaia’s kinship claim is supplied."],"tensions":["Free choice versus choice under hunger.","Public vote versus dependence on Xenophon’s framing.","Mercenary contract versus language of friendship.","Gift exchange versus solicitation and pressure.","Sacred wording versus unproven causation.","Successful capture versus justice of enslavement."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"BOOK_SEVEN_VII3_BOUNDARY_OBSERVATION","observation":"Heading III begins VII.3 on PDF page 145; heading IV begins VII.4 on page 150."},{"id":"OBS-002","evidence_type":"DEPUTATION_DAWN_REPORT_OBSERVATION","observation":"The deputation returns before dawn and each delegate reports to those who sent him."},{"id":"OBS-003","evidence_type":"ARISTARCHUS_SUMMONS_REFUSED_OBSERVATION","observation":"At dawn Aristarchus summons the generals and officers, but they refuse another visit and summon the army."},{"id":"OBS-004","evidence_type":"NEON_TEN_FURLONG_ABSENCE_OBSERVATION","observation":"The full assembly meets except Neon's men, who remain about ten furlongs away."},{"id":"OBS-005","evidence_type":"PUBLIC_ALTERNATIVES_DISCLOSURE_OBSERVATION","observation":"Xenophon publicly reports Aristarchus with his ships of war, the Sacred mountain route, and Seuthes’s competing offer."},{"id":"OBS-006","evidence_type":"NO_MONEY_NO_LEAVE_PROVISION_OBSERVATION","observation":"The army has neither money to buy provisions nor leave to take without money where it stands."},{"id":"OBS-007","evidence_type":"MIGHT_CONFERRED_PROVISION_RIGHT_OBSERVATION","observation":"Xenophon proposes villages where the right to help ourselves is conferred by might, before deciding between employers."},{"id":"OBS-008","evidence_type":"ALL_HANDS_PROVISION_MOVE_OBSERVATION","observation":"All held them up when Xenophon called for hands supporting the provision-first movement."},{"id":"OBS-009","evidence_type":"NEON_ARISTARCHUS_AGENT_FAILURE_OBSERVATION","observation":"Neon and other agents of Aristarchus fail to turn the army from its course."},{"id":"OBS-010","evidence_type":"SEUTHES_PUBLIC_WITNESS_REQUEST_OBSERVATION","observation":"After a little more than three miles Xenophon asks Seuthes, in the presence of as many witnesses as possible, to guide them to provisions."},{"id":"OBS-011","evidence_type":"CLOSE_PACKED_PROVISION_VILLAGES_OBSERVATION","observation":"Seuthes leads the army to close-packed villages containing abundant provisions."},{"id":"OBS-012","evidence_type":"CYZICENE_PAY_CUSTOMARY_RATES_OBSERVATION","observation":"Seuthes offers each soldier a cyzicene, with the customary rate for officers and generals and honors for merit."},{"id":"OBS-013","evidence_type":"CAPTURED_PROPERTY_RULER_PAY_OBSERVATION","observation":"Troops may provision from the country, while captured property is to be delivered to Seuthes and redistributed as pay."},{"id":"OBS-014","evidence_type":"SEVEN_DAY_DISTANCE_LIMIT_OBSERVATION","observation":"Seuthes says he will not lead them more than seven days’ journey inland and often less."},{"id":"OBS-015","evidence_type":"WINTER_FRIENDLY_COUNTRY_ARGUMENT_OBSERVATION","observation":"Supporting soldiers argue that winter prevents sailing and that remaining among friends requires purchases they cannot afford."},{"id":"OBS-016","evidence_type":"UNOPPOSED_ARMY_VOTE_OBSERVATION","observation":"No one opposed the proposal, and the army adopts service with Seuthes."},{"id":"OBS-017","evidence_type":"HERACLEIDES_GIFT_SOLICITATION_OBSERVATION","observation":"Heracleides solicits gifts from the Parians, Timasion, and Xenophon by invoking future favor and reward."},{"id":"OBS-018","evidence_type":"XENOPHON_NEAR_POVERTY_OBSERVATION","observation":"Xenophon possesses little beyond one boy and traveling expenses."},{"id":"OBS-019","evidence_type":"BANQUET_DISTRIBUTION_CUSTOM_OBSERVATION","observation":"At the banquet Seuthes distributes fragments of meat and bread, and the guests imitate the distribution custom."},{"id":"OBS-020","evidence_type":"ARYSTAS_COMIC_EATING_OBSERVATION","observation":"Arystas refuses to distribute his portion and eats heavily, producing laughter."},{"id":"OBS-021","evidence_type":"THRACIAN_GIFTS_OBSERVATION","observation":"Banquet gifts include a white horse, a boy, clothing for Seuthes’s wife, a silver bowl, and a carpet."},{"id":"OBS-022","evidence_type":"XENOPHON_SELF_COMPANIONS_GIFT_OBSERVATION","observation":"Xenophon offers myself and these my dear comrades as willing and trusty friends rather than a material gift."},{"id":"OBS-023","evidence_type":"GOD_WILLING_ACQUISITION_PROMISE_OBSERVATION","observation":"Xenophon promises conquest and acquisition for Seuthes, God willing."},{"id":"OBS-024","evidence_type":"FRATERNAL_WINE_SPRINKLING_OBSERVATION","observation":"Seuthes drinks to Xenophon and sprinkled the last drops in token of fraternity."},{"id":"OBS-025","evidence_type":"MUSICIANS_WAR_DANCE_JESTERS_OBSERVATION","observation":"The banquet includes musicians, a war song, a war dance, clowns, and jesters."},{"id":"OBS-026","evidence_type":"NIGHT_SENTINEL_THRACIAN_ENTRY_OBSERVATION","observation":"The Greeks appoint night sentinels and ask that Thracians be kept outside their camp to avoid confusion."},{"id":"OBS-027","evidence_type":"SLOWEST_ARM_NIGHT_MARCH_OBSERVATION","observation":"Xenophon advises that the slowest arm lead the night march; Seuthes accepts and provides elderly local guides."},{"id":"OBS-028","evidence_type":"ATHENAIA_WATCHWORD_OBSERVATION","observation":"The watchword Athenaia is selected on a claimed ground of kinship."},{"id":"OBS-029","evidence_type":"MIDNIGHT_ORDER_DAWN_COHESION_OBSERVATION","observation":"At midnight heavy infantry leads, light infantry occupies the center, cavalry follows, and deep snow reveals no enemy tracks at dawn."},{"id":"OBS-030","evidence_type":"THOUSAND_CAPTIVES_TWO_THOUSAND_CATTLE_TEN_THOUSAND_SMALL_OBSERVATION","observation":"Xenophon dismounts and advances with men under thirty; the operation captures one thousand persons, two thousand cattle, and ten thousand smaller animals."}],"provisional_findings":[{"id":"PF-001","finding":"Public disclosure distinguishes the army’s decision from a private compact, though hunger constrains the choice."},{"id":"PF-002","finding":"Movement to provisions is procedurally prior to the final employment decision."},{"id":"PF-003","finding":"Xenophon seeks witnesses where future disputes are foreseeable."},{"id":"PF-004","finding":"Seuthes joins fixed pay to captured property without yet demonstrating transparent accounting."},{"id":"PF-005","finding":"Unanimity establishes a decision, not the truth or justice of every promise."},{"id":"PF-006","finding":"Gift solicitation exposes patronage pressures without proving every gift corrupt."},{"id":"PF-007","finding":"Xenophon’s near poverty explains his verbal gift but does not by itself certify incorruptibility."},{"id":"PF-008","finding":"The banquet mixes contract, friendship, comedy, display, and political integration."},{"id":"PF-009","finding":"Night-march order converts differentiated speeds into collective cohesion."},{"id":"PF-010","finding":"Successful capture demonstrates operational capacity but does not settle the justice of enslavement."}],"standing_unresolved_questions":[{"id":"UQ-001","question":"How freely can hungry soldiers choose between the proposals?"},{"id":"UQ-002","question":"Does Aristarchus actually possess authority to promise pay and protection?"},{"id":"UQ-003","question":"Why do Neon's men remain outside the assembly?"},{"id":"UQ-004","question":"Does Xenophon’s framing advantage Seuthes despite presenting both alternatives?"},{"id":"UQ-005","question":"What institutional control governs Seuthes’s redistribution of captured property?"},{"id":"UQ-006","question":"What does the customary rate precisely require?"},{"id":"UQ-007","question":"Why is there no recorded opposition to Seuthes?"},{"id":"UQ-008","question":"Are Heracleides’s solicitations ordinary custom, manipulation, or both?"},{"id":"UQ-009","question":"What is the exact status of persons offered as banquet gifts?"},{"id":"UQ-010","question":"Does Xenophon’s personal pledge bind the army beyond its vote?"},{"id":"UQ-011","question":"What political meaning does Seuthes assign to fraternity?"},{"id":"UQ-012","question":"Why is Athenaia considered an appropriate kinship watchword?"},{"id":"UQ-013","question":"How reliable are the elderly guides?"},{"id":"UQ-014","question":"How many soldiers participate in the initial rush?"},{"id":"UQ-015","question":"How are captives and livestock later valued and distributed?"},{"id":"UQ-016","question":"What later deeds will confirm or contradict Seuthes’s promises?"}],"downstream_textual_checks":[{"id":"TC-001","check":"Compare the public alternatives with later accusations against Xenophon."},{"id":"TC-002","check":"Track Neon’s detached men and their later return or absence."},{"id":"TC-003","check":"Compare Seuthes’s pay promise with actual remittances."},{"id":"TC-004","check":"Track captured property through Heracleides’s accounting."},{"id":"TC-005","check":"Compare public witnesses with later oath and payment disputes."},{"id":"TC-006","check":"Track Xenophon’s poverty against later enrichment accusations."},{"id":"TC-007","check":"Compare banquet gift language with later political friendship."},{"id":"TC-008","check":"Track Athenaia and other Book VII sacred language."},{"id":"TC-009","check":"Compare slowest-arm-first doctrine with later marches."},{"id":"TC-010","check":"Track the fate of the one thousand captives."},{"id":"TC-011","check":"Preserve tactical success apart from justice of conquest."},{"id":"TC-012","check":"Verify VII.4 at PDF pages 150-153 and heading V on page 153."}],"secondary_comparison_status":"DEFERRED"}