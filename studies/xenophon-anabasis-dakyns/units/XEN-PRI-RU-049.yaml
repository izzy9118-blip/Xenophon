{"schema_version":1.0,"unit_id":"XEN-PRI-RU-049","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis VII.6","pdf_pages_one_based":"155-159","opening_anchor":"BOOK VII, VI: At this date, when nearly two months had already passed, an embassy arrived.","closing_anchor":"The answer he received was, 'Depart.'"},"jurisdiction":"Independent reconstruction from the admitted Dakyns translation. Translator wording is not unmediated Greek evidence. Narrator, speaker, report, deed, outcome, paratext, and inference remain distinct. Secondary comparison, Greek philology, certification, minister derivation, and Sanctum registration remain unauthorized.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg 1170 searchable 168-page PDF","chapter_boundary_control":"Heading VI begins VII.6 on PDF page 155; heading VII begins VII.7 on page 159. This unit covers pages 155-159 and stops before heading VII. Heading VIII begins on page 164, so the next unit covers pages 159-164.","source_boundary":"Thibron's emissaries; Spartan recruitment; Seuthes's disposal strategy; Arcadian capital accusation; Xenophon's public defense; external testimony; demand for pay; Heracleides's flight; retention offer; warnings; sacrifice to Zeus the King; decision to depart."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration with extended attributed speeches, accusations, oath, recollection of public decisions and deeds, third-party testimony, reported warnings, sacrifice, and narrated outcome.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"interior_deliberation_report_present":true,"observation":"The long first-person defense is attributed to Xenophon as speaker before the army. The narrator separately reports motives, testimony, warnings, sacrifice, and the answer interpreted from the victims.","uncertainty":"The Arcadian accuser's identity and evidence, Heracleides's accounting, Seuthes's real intentions, the reliability of warnings about Thibron, and divine causation behind the sacrificial answer remain unresolved."},"speakers_audiences_and_occasions":[{"id":"SAO-001","speaker":"Charminus and Polynicus","audience":"Hellenic army","occasion":"mission from Thibron","content":"Offer service against Tissaphernes at one daric monthly for soldiers, double for officers, and quadruple for generals."},{"id":"SAO-002","speaker":"Heracleides","audience":"Seuthes","occasion":"arrival of Spartan recruiters","content":"Advises handing over the troops so Seuthes gains Spartan friendship, escapes further pay demands, and clears the country of the army."},{"id":"SAO-003","speaker":"Seuthes","audience":"Charminus and Polynicus","occasion":"private hospitality and inquiry","content":"Offers the troops, seeks Spartan alliance, and calls Xenophon too much the soldiers' friend."},{"id":"SAO-004","speaker":"unnamed Arcadian","audience":"Lacedaemonians, army, Seuthes","occasion":"public recruitment assembly","content":"Accuses Xenophon of leading the army to Seuthes, taking private wealth, and deserving death by stoning."},{"id":"SAO-005","speaker":"Xenophon","audience":"army, Spartan emissaries, Seuthes","occasion":"public defense","content":"Reconstructs the army's vote, his advocacy, his oath of nonreceipt, the alliance's benefits, his service, and the ingratitude of the proposed execution."},{"id":"SAO-006","speaker":"Charminus","audience":"army","occasion":"after Xenophon's defense","content":"Reports Seuthes's testimony that Xenophon's fault was being too much the soldiers' friend."},{"id":"SAO-007","speaker":"Eurylochus of Lusia","audience":"Charminus and Polynicus","occasion":"pay dispute after defense","content":"Asks the new commanders to exact full pay from Seuthes before removing the army."},{"id":"SAO-008","speaker":"Polycrates the Athenian","audience":"assembly","occasion":"Heracleides visible nearby","content":"Accuses Heracleides of retaining the proceeds of property won by Hellenic toil and urges his seizure."},{"id":"SAO-009","speaker":"Abrozelmes for Seuthes","audience":"Xenophon","occasion":"post-assembly retention attempt","content":"Offers coastal places and other promises if Xenophon remains with one thousand hoplites, while warning that Thibron will kill him."},{"id":"SAO-010","speaker":"sacrificial answer as reported","audience":"Xenophon","occasion":"two victims offered to Zeus the King","content":"Answers that it is better and happier to depart with the army."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","deed":"Thibron sends Charminus and Polynicus with quantified pay terms.","outcome":"The army gains an external employer and route away from Seuthes."},{"id":"SDO-002","deed":"Heracleides urges Seuthes to hand over the troops and escape the pay burden.","outcome":"Seuthes welcomes the Spartan emissaries while excluding Xenophon and the other generals."},{"id":"SDO-003","deed":"The emissaries publicly offer war against Tissaphernes and new wages.","outcome":"The soldiers listen willingly and an Arcadian immediately attacks Xenophon."},{"id":"SDO-004","deed":"The Arcadian alleges private enrichment and calls for stoning.","outcome":"Other speakers join the accusation and Xenophon must answer under threat of death."},{"id":"SDO-005","deed":"Xenophon reconstructs the public vote for Seuthes and swears he received none of the private promises.","outcome":"The defense shifts the issue from hidden profit to witnessed procedure, service, and unresolved debt."},{"id":"SDO-006","deed":"Xenophon recounts Perinthus, winter danger, tactical benefit, provisions, no combat deaths, and double glory.","outcome":"The alliance is presented as materially beneficial despite deficient wages."},{"id":"SDO-007","deed":"Charminus repeats Seuthes's favorable testimony about Xenophon.","outcome":"A Spartan witness confirms that advocacy for the soldiers caused Xenophon's difficulty."},{"id":"SDO-008","deed":"Eurylochus demands full pay and Polycrates accuses Heracleides of theft.","outcome":"Heracleides and Seuthes flee the assembly for their camp."},{"id":"SDO-009","deed":"Seuthes offers Xenophon coastal places and one-thousand-man employment while warning of Thibron.","outcome":"Competing promises and threats attempt to detach Xenophon from the army."},{"id":"SDO-010","deed":"Xenophon sacrifices two victims to Zeus the King on whether to stay or depart.","outcome":"The reported answer favors departure with the army."}],"sequence_repetition_omission_and_contradiction":{"sequence":["Spartan embassy arrives","Heracleides advises disposal","Seuthes entertains emissaries","Xenophon excluded","public recruitment","Arcadian accusation","other accusations","Xenophon defends procedure","oath of nonreceipt","alliance benefits recalled","personal losses recalled","Charminus testifies","Eurylochus demands pay","Polycrates accuses Heracleides","Heracleides and Seuthes flee","retention offer","death warnings","sacrifice to Zeus the King","departure answer"],"repetitions":["Pay promises structure each change of allegiance.","Private access and exclusion create opportunities for calumny.","Xenophon appeals to public votes and witnessed deeds.","Advocacy for the soldiers damages Xenophon's relations with powerful employers.","Oaths and sacrifice appear where trust is weakest."],"omissions":["The Arcadian accuser is unnamed.","No evidence of private enrichment is produced.","No complete spoil account is supplied.","The precise content and sources of the additional warning letters are unstated.","The method by which the sacrificial victims yield the answer is not described."],"tensions":["Spartan recruitment versus Seuthes's unpaid debt.","Popular accusation versus public procedural memory.","Private promises versus sworn nonreceipt.","Material benefits of alliance versus breach of wage agreement.","Seuthes's favorable testimony versus his attempt to avoid Xenophon.","Human deliberation versus sacrificial decision."]},"documentary_observations":[{"id":"OBS-001","evidence_type":"BOOK_SEVEN_VII6_BOUNDARY_OBSERVATION","observation":"Heading VI begins VII.6 on PDF page 155; heading VII begins VII.7 on page 159."},{"id":"OBS-002","evidence_type":"NEARLY_TWO_MONTHS_SPARTAN_EMBASSY_OBSERVATION","observation":"When nearly two months have passed, Charminus and Polynicus arrive as agents of Thibron."},{"id":"OBS-003","evidence_type":"TISSAPHERNES_WAR_RECRUITMENT_OBSERVATION","observation":"The Lacedaemonians have resolved on war against Tissaphernes and seek the existing Hellenic army."},{"id":"OBS-004","evidence_type":"DARIC_DOUBLE_QUADRUPLE_PAY_OBSERVATION","observation":"Thibron offers each soldier one daric per month, officers double, and generals quadruple."},{"id":"OBS-005","evidence_type":"HERACLEIDES_DISPOSAL_PAY_ESCAPE_OBSERVATION","observation":"Heracleides tells Seuthes that handing over the troops will end pay demands and rid the country of them."},{"id":"OBS-006","evidence_type":"SEUTHES_SPARTAN_FRIEND_ALLY_OBSERVATION","observation":"Seuthes willingly offers the troops and says his desire is to become friend and ally of Lacedaemon."},{"id":"OBS-007","evidence_type":"MAGNIFICENT_HOSPITALITY_COMMAND_EXCLUSION_OBSERVATION","observation":"Seuthes magnificently entertains the emissaries but invites neither Xenophon nor any other general."},{"id":"OBS-008","evidence_type":"TOO_MUCH_SOLDIERS_FRIEND_OBSERVATION","observation":"Seuthes says Xenophon is not bad in most respects but is too much the soldiers' friend."},{"id":"OBS-009","evidence_type":"POPULAR_LEADER_ASSEMBLY_STRATEGY_OBSERVATION","observation":"Heracleides calls Xenophon a popular leader and advises defeating his influence through an assembly and a pay promise."},{"id":"OBS-010","evidence_type":"PUBLIC_SPARTAN_PAY_OFFER_OBSERVATION","observation":"The Laconian agents repeat the Tissaphernes war and quantified pay offer before the collected troops."},{"id":"OBS-011","evidence_type":"ARCADIAN_PRIVATE_ENRICHMENT_ACCUSATION_OBSERVATION","observation":"An unnamed Arcadian says Xenophon brought them to Seuthes and privately reaped the fruit of their winter toil."},{"id":"OBS-012","evidence_type":"STONING_CAPITAL_DEMAND_OBSERVATION","observation":"The Arcadian says seeing Xenophon stoned to death would count as full payment for his suffering."},{"id":"OBS-013","evidence_type":"XENOPHON_RETURN_FROM_HOMEWARD_ROUTE_OBSERVATION","observation":"Xenophon says he had been traveling home but returned because the army was in sore straits."},{"id":"OBS-014","evidence_type":"SEUTHES_MESSAGES_PROMISES_INITIAL_REFUSAL_OBSERVATION","observation":"He recalls repeated messages and promises from Seuthes and says he initially led the army toward the quickest crossing to Asia instead."},{"id":"OBS-015","evidence_type":"ARISTARCHUS_SEUTHES_PUBLIC_VOTE_OBSERVATION","observation":"After Aristarchus blocked passage, Xenophon convened deliberation, presented both alternatives, and the soldiers voted for Seuthes."},{"id":"OBS-016","evidence_type":"SEUTHES_LIES_PAY_VARIANCE_OBSERVATION","observation":"Xenophon says he became more opposed to Seuthes than anyone once lies and cheating about pay began."},{"id":"OBS-017","evidence_type":"ALL_GODS_GODDESSES_NONRECEIPT_OATH_OBSERVATION","observation":"Xenophon swears by all the gods and goddesses that he received none of Seuthes's private promises."},{"id":"OBS-018","evidence_type":"LESS_THAN_OTHER_GENERALS_OFFICERS_OBSERVATION","observation":"He additionally says he received neither what the other generals nor even some officers received."},{"id":"OBS-019","evidence_type":"POVERTY_FRIEND_POWER_MISCALCULATION_OBSERVATION","observation":"Xenophon says he bore Seuthes's poverty hoping for friendship in his prosperity but then learned his character."},{"id":"OBS-020","evidence_type":"FRIEND_CHEATS_FRIEND_STAIN_OBSERVATION","observation":"He argues that deceit by a friend stains the deceiver more deeply than the deceived."},{"id":"OBS-021","evidence_type":"PERINTHUS_MIDWINTER_BLOCKADE_RECOLLECTION_OBSERVATION","observation":"The defense recalls shut gates at Perinthus, outdoor winter camp, a poor market, and warships preventing passage."},{"id":"OBS-022","evidence_type":"SEUTHES_CAVALRY_LIGHT_INFANTRY_SECURITY_OBSERVATION","observation":"Xenophon says Seuthes supplied cavalry and light infantry the Greeks lacked, enabling provisions, captures, and security."},{"id":"OBS-023","evidence_type":"NO_COMRADE_DEATH_DOUBLE_GLORY_OBSERVATION","observation":"He says the army wintered plentifully, lost no comrade, preserved Asian deeds, and added victory over European Thracians."},{"id":"OBS-024","evidence_type":"REFUGE_CHILDREN_FUTURE_OBSERVATION","observation":"Xenophon says he hoped Seuthes would become a refuge for himself and any future children."},{"id":"OBS-025","evidence_type":"FATHER_BENEFACTOR_MEMORY_REBUKE_OBSERVATION","observation":"He recalls that in hardship the soldiers called him father and benefactor but now contemplate killing him."},{"id":"OBS-026","evidence_type":"CHARMINUS_SEUTHES_FAVORABLE_TESTIMONY_OBSERVATION","observation":"Charminus reports Seuthes's own statement that Xenophon's fault was excessive friendship toward the soldiers."},{"id":"OBS-027","evidence_type":"EURYLOCHUS_FULL_PAY_PRECONDITION_OBSERVATION","observation":"Eurylochus asks the Spartans to exact full pay from Seuthes before taking the army away."},{"id":"OBS-028","evidence_type":"POLYCRATES_HERACLEIDES_THEFT_ACCUSATION_OBSERVATION","observation":"Polycrates accuses Heracleides of taking and selling captured property while retaining the proceeds."},{"id":"OBS-029","evidence_type":"SEUTHES_HERACLEIDES_FLIGHT_RETENTION_OFFER_OBSERVATION","observation":"Heracleides and Seuthes gallop away; Seuthes later offers coastal places if Xenophon remains with one thousand hoplites."},{"id":"OBS-030","evidence_type":"THIBRON_DEATH_WARNING_ZEUS_KING_DEPARTURE_OBSERVATION","observation":"Warnings say Thibron will kill Xenophon; after two victims are sacrificed to Zeus the King, the reported answer is to depart with the army."}],"provisional_findings":[{"id":"PF-001","finding":"Spartan employment supplies Seuthes with a political means to dismiss the army while leaving its wage claim unresolved."},{"id":"PF-002","finding":"The capital accusation presents no documentary evidence of private enrichment beyond suspicion and nonpayment."},{"id":"PF-003","finding":"Xenophon's defense relies on public votes, witnessed deeds, known hardships, and an explicit oath rather than private intention alone."},{"id":"PF-004","finding":"The oath supports nonreceipt within the translated narrative but does not independently prove its truth or divine enforcement."},{"id":"PF-005","finding":"The Seuthes alliance can be materially beneficial and contractually unjust at the same time."},{"id":"PF-006","finding":"Xenophon's advocacy makes him vulnerable both to the soldiers whose pay is missing and to employers pressured to pay."},{"id":"PF-007","finding":"Charminus's testimony is politically strong because it reproduces Seuthes's adverse yet favorable characterization."},{"id":"PF-008","finding":"The assembly redirects suspicion from Xenophon toward Heracleides without yet producing an audited account."},{"id":"PF-009","finding":"Seuthes combines renewed rewards with a reported death threat to separate Xenophon from army and Spartans."},{"id":"PF-010","finding":"The sacrificial answer resolves Xenophon's immediate choice within the narrative while leaving divine causation inaccessible."}],"standing_unresolved_questions":[{"id":"UQ-001","question":"Who is the unnamed Arcadian accuser?"},{"id":"UQ-002","question":"What evidence, if any, supports the charge of private enrichment?"},{"id":"UQ-003","question":"Why do multiple soldiers repeat the accusation before hearing Xenophon?"},{"id":"UQ-004","question":"What exactly did Seuthes privately promise Xenophon?"},{"id":"UQ-005","question":"What did the other generals and officers receive?"},{"id":"UQ-006","question":"How much contractual pay remains unpaid at this point?"},{"id":"UQ-007","question":"How accurately does Xenophon's defense describe unanimous earlier voting?"},{"id":"UQ-008","question":"Can the absence of Greek combat deaths in Thrace be fully verified from the chapter sequence?"},{"id":"UQ-009","question":"What is the legal or customary status of the captured persons and cattle invoked as benefits?"},{"id":"UQ-010","question":"Why does Seuthes publicly tolerate the accusation while standing within earshot?"},{"id":"UQ-011","question":"Does Charminus's testimony change the army's judgment or only the immediate discussion?"},{"id":"UQ-012","question":"Did Heracleides keep the proceeds, underreport them, or act under Seuthes's orders?"},{"id":"UQ-013","question":"Are the restored coastal promises credible after their earlier disappearance?"},{"id":"UQ-014","question":"Who sent the additional warning letters and on what evidence?"},{"id":"UQ-015","question":"Did Polynicus actually say Thibron would kill Xenophon?"},{"id":"UQ-016","question":"How is the sacrificial answer read from the two victims?"}],"downstream_textual_checks":[{"id":"TC-001","check":"Track whether the Spartans actually enforce full payment before departure."},{"id":"TC-002","check":"Compare Xenophon's oath of nonreceipt with later property transfers."},{"id":"TC-003","check":"Track the fate of the accusation that Xenophon enriched himself."},{"id":"TC-004","check":"Compare Seuthes's favorable testimony with his later deeds."},{"id":"TC-005","check":"Check whether Heracleides's proceeds are ever audited or recovered."},{"id":"TC-006","check":"Track Bisanthe, Ganos, Neontichos, and other coastal promises."},{"id":"TC-007","check":"Compare the one-thousand-hoplite retention request with subsequent army numbers."},{"id":"TC-008","check":"Track relations between Xenophon and the Lacedaemonians after departure."},{"id":"TC-009","check":"Compare Zeus the King sacrifice with later sacrifices in Book VII."},{"id":"TC-010","check":"Track whether army praise replaces or merely suspends hostility."},{"id":"TC-011","check":"Compare the public defense with later reference to exile from Athens."},{"id":"TC-012","check":"Preserve the distinction between a narrated sacrificial answer and verified divine causation."}],"secondary_comparison_status":"DEFERRED","owner_review_required":true,"artificial_intelligence_self_certification_prohibited":true}