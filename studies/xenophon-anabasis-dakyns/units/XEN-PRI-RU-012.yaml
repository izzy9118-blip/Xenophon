  - {id: Q-002, locator: "Anabasis II.2; PDF p. 34", evidence_type: UNRESOLVED_QUESTION, question: "Why did Menon remain with Ariaeus, and what did he do there?"}
  - {id: Q-003, locator: "Anabasis II.2; PDF p. 34", evidence_type: UNRESOLVED_QUESTION, question: "What signs made the sacrifice unfavorable against the king and favorable toward Ariaeus?"}
  - {id: Q-004, locator: "Anabasis II.2; PDF p. 34", evidence_type: UNRESOLVED_QUESTION, question: "How and when did Clearchus learn that the Tigris blocked an advance?"}
  - {id: Q-005, locator: "Anabasis II.2; PDF p. 34", evidence_type: UNRESOLVED_QUESTION, question: "What is the formal status of Clearchus's unelected leadership?"}
  - {id: Q-006, locator: "Anabasis II.2; PDF p. 34", evidence_type: UNRESOLVED_QUESTION, question: "Is the manuscript route-distance note original, interpolated, or marginal commentary?"}
  - {id: Q-007, locator: "Anabasis II.2; PDF p. 35", evidence_type: UNRESOLVED_QUESTION, question: "Why did Miltocythes desert, and what became of his force?"}
  - {id: Q-008, locator: "Anabasis II.2; PDF p. 35", evidence_type: UNRESOLVED_QUESTION, question: "What divine witnesses, formulas, and enforcement were attached to the alliance oath?"}
  - {id: Q-009, locator: "Anabasis II.2; PDF p. 35", evidence_type: UNRESOLVED_QUESTION, question: "Does the sacrificial list include a wolf, and what difference would that reading make?"}
  - {id: Q-010, locator: "Anabasis II.2; PDF p. 35", evidence_type: UNRESOLVED_QUESTION, question: "How reliable was Ariaeus's alternate route and prediction about royal pursuit?"}
  - {id: Q-011, locator: "Anabasis II.2; PDF p. 35", evidence_type: UNRESOLVED_QUESTION, question: "What Greek wording underlies the claim that fortune was a better general?"}
  - {id: Q-012, locator: "Anabasis II.2; PDF pp. 35-36", evidence_type: UNRESOLVED_QUESTION, question: "Was Clearchus right to prioritize the appearance of not fleeing over rest or concealment?"}
  - {id: Q-013, locator: "Anabasis II.2; PDF p. 36", evidence_type: UNRESOLVED_QUESTION, question: "What caused the nighttime panic among the Greeks?"}
  - {id: Q-014, locator: "Anabasis II.2; PDF p. 36", evidence_type: UNRESOLVED_QUESTION, question: "Why did the ass proclamation restore confidence, and was it improvised by Clearchus or Tolmides?"}
downstream_textual_checks:
  - Consult a reviewed Greek text for leadership, prudence, experience, alliance, betrayal, oath, fortune, flight, and panic.
  - Check a critical apparatus for the route-distance passage and the possible omission of "wolf."
  - Compare modern translations of Clearchus's reported sacrificial findings and Ariaeus's route speech.
  - Map the Tigris, Euphrates, villages, and claimed alternative route without forcing uncertain identifications.
  - Track Clearchus's unelected leadership and later obedience by generals and soldiers.
  - Track Menon's relation with Ariaeus through the remainder of Book II.
  - Track all oaths, handshakes, and later betrayals involving Greeks, Ariaeus, and Persian leaders.
  - Track Miltocythes and any later account of his desertion.
  - Compare the false cavalry alarm, royal retreat, and Greek panic as episodes of perception under uncertainty.
  - Defer comparison with Strauss until the relevant primary sequence is complete.
