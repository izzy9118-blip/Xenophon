tainty":"Relationship terms remain unresolved."},{"id":"OBS-006","locator":"Anabasis IV.6; PDF p. 85","evidence_type":"ENEMY_COALITION_OBSERVATION","observation":"Chalybes, Taochians, and Phasianians hold the pass.","uncertainty":"Numbers and source absent."},{"id":"OBS-007","locator":"Anabasis IV.6; PDF pp. 85-86","evidence_type":"CASUALTY_MINIMIZATION_ARGUMENT_OBSERVATION","observation":"Xenophon seeks the fewest wounds and least loss of good men.","uncertainty":"Translated terms require Greek review."},{"id":"OBS-008","locator":"Anabasis IV.6; PDF pp. 85-86","evidence_type":"NIGHT_FEINT_PLAN_OBSERVATION","observation":"He proposes night seizure of high ground and a frontal feint.","uncertainty":"Route details absent."},{"id":"OBS-009","locator":"Anabasis IV.6; PDF p. 86","evidence_type":"CIVIC_STEREOTYPE_OBSERVATION","observation":"The speakers exchange Spartan-theft and Athenian-public-money jokes.","uncertainty":"Attributed humor, not verified history."},{"id":"OBS-010","locator":"Anabasis IV.6; PDF p. 86","evidence_type":"COERCED_ROUTE_INTELLIGENCE_OBSERVATION","observation":"Captured rear-followers provide route intelligence.","uncertainty":"Conditions and reliability are unstated."},{"id":"OBS-011","locator":"Anabasis IV.6; PDF p. 86","evidence_type":"SIGNAL_AND_DECEPTION_OBSERVATION","observation":"Volunteers use watchfires after taking the heights while the main army advances as a feint.","uncertainty":"Exact signals and numbers absent."},{"id":"OBS-012","locator":"Anabasis IV.6; PDF pp. 86-87","evidence_type":"VICTORY_RITUAL_AND_PROVISION_OBSERVATION","observation":"After parallel attack the enemy flees; Greeks destroy wicker shields, sacrifice, raise a trophy, and reach provisions.","uncertainty":"Casualties and ritual form absent."}],"provisional_findings":[{"id":"FIND-001","evidence_type":"PROVISIONAL_INFERENCE","finding":"The chapter's explicit command disagreement concerns treatment of a dependent guide rather than the battle plan.","basis":"Narrator