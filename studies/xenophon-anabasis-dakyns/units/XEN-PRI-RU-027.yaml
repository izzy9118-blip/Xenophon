{"schema_version":1.0,"unit_id":"XEN-PRI-RU-027","study_id":"XEN-STUDY-PRI-001","source_id":"XEN-SRC-PRI-001","witness_id":"XEN-WIT-PRI-001","status":"DRAFTED_PENDING_OWNER_REVIEW","scope":{"work_locator":"Anabasis IV.6","pdf_pages_one_based":"84-87","opening_anchor":"When a week had passed, on the eighth day Xenophon delivered over the guide (that is to say, the village headman) to Cheirisophus.","closing_anchor":"So when they had reached the summit of the pass, they sacrificed and set up a trophy, and descending into the plain, reached villages abounding in good things of every kind."},"jurisdiction":"Independent primary reconstruction from the admitted Dakyns English translation. Translator wording is not unmediated Greek evidence; no isolated observation licenses a deed corpus, speech register, guard, adapter, or ministerial capacity.","bibliographic_and_witness_control":{"translation":"H. G. Dakyns","digital_witness":"Project Gutenberg ebook 1170 captured as a 168-page searchable PDF","locator_rule":"Anabasis IV.6 plus one-based PDF page","chapter_boundary_control":"IV.6 begins beneath heading VI on PDF page 84 and ends on PDF page 87 immediately before heading VII. IV.7 begins on page 87 and continues through page 89.","source_boundary":"Guide custody, violence, escape, narrator judgment, reported attachment, council speeches, civic jokes, captured intelligence, deception, sacrifice, combat, trophy, and the Phasis and missile editorial notes remain distinct."},"narrative_person_and_authorial_attribution":{"narrative_mode":"Third-person narration presenting Xenophon and Cheirisophus as commanders.","xenophon_as_character_present":true,"direct_authorial_self_identification_present":false,"first_person_narrator_present":false,"observation":"Xenophon transfers the guide, disputes the guide episode, proposes the night maneuver, jokes with Cheirisophus, and participates in the operation.","uncertainty":"The witness does not settle Greek terms for guide, son, passion, peers, theft, good men, or trophy."},"speakers_audiences_and_occasions":[{"id":"SAO-001","locator":"Anabasis IV.6; PDF p. 85","speech_form":"guide_explanation","speaker":"headman","audience":"Cheirisophus","occasion":"no villages reached","content":"There are no villages in this part.","uncertainty":"Unverified under command pressure."},{"id":"SAO-002","locator":"Anabasis IV.6; PDF p. 85","speech_form":"council_proposal","speaker":"Cheirisophus","audience":"generals and officers","occasion":"enemy holds pass","content":"Eat while deciding whether to cross today or tomorrow.","uncertainty":"No vote is recorded."},{"id":"SAO-003","locator":"Anabasis IV.6; PDF p. 85","speech_form":"attack_proposal","speaker":"Cleanor","audience":"council","occasion":"same council","content":"Attack after breakfast before the enemy gains courage or reinforcements.","uncertainty":"Prediction, not observed fact."},{"id":"SAO-004","locator":"Anabasis IV.6; PDF pp. 85-86","speech_form":"stealth_proposal","speaker":"Xenophon","audience":"council","occasion":"same council","content":"Seek the fewest wounds and least loss of good men by taking unguarded high ground at night while feinting at the road.","uncertainty":"Terrain and risk claims are judgments."},{"id":"SAO-005","locator":"Anabasis IV.6; PDF p. 86","speech_form":"civic_jokes","speaker":"Xenophon and Cheirisophus","audience":"each other and council","occasion":"stealth debate","content":"Xenophon jokes about Spartan theft training; Cheirisophus replies with alleged Athenian theft of public money.","uncertainty":"Attributed stereotypes, not certified facts."},{"id":"SAO-006","locator":"Anabasis IV.6; PDF p. 86","speech_form":"deployment_decision","speaker":"Xenophon and Cheirisophus","audience":"volunteers and army","occasion":"night operation","content":"Xenophon offers to lead; Cheirisophus keeps him at the rear, volunteers take the heights, and watchfires signal success.","uncertainty":"Numbers and formal procedure are absent."}],"speeches_deeds_and_outcomes":[{"id":"SDO-001","locator":"Anabasis IV.6; PDF pp. 84-85","actor":"Xenophon, Cheirisophus, headman, son, Episthenes","deed":"The unfettered headman is transferred as guide; his household stays, while his young son remains with Episthenes conditional on good guidance.","outcome":"Protection and conditional custody coexist.","uncertainty":"Consent and legal status are absent."},{"id":"SDO-002","locator":"Anabasis IV.6; PDF p. 85","actor":"Cheirisophus and headman","deed":"Cheirisophus strikes the guide but fails to bind him; the guide escapes and leaves his son.","outcome":"The guide is lost; the narrator calls ill-treatment and neglect the sole dispute between Cheirisophus and Xenophon.","uncertainty":"Xenophon's words are not given."},{"id":"SDO-003","locator":"Anabasis IV.6; PDF p. 85","actor":"Episthenes and youth","deed":"Episthenes is reported to conceive a passion for the youth, take him home, and find him a faithful friend.","outcome":"The youth remains with Episthenes.","uncertainty":"Greek terminology, consent, and chronology remain open."},{"id":"SDO-004","locator":"Anabasis IV.6; PDF pp. 85-86","actor":"Greek command","deed":"At a pass held by Chalybes, Taochians, and Phasianians, the command debates delay, frontal attack, and night seizure with a feint.","outcome":"The indirect plan is adopted.","uncertainty":"No explicit vote formula survives."},{"id":"SDO-005","locator":"Anabasis IV.6; PDF p. 86","actor":"captured informants, volunteers, main army","deed":"Captured rear-followers report passable heights; Aristonymus and Nicomachus lead volunteers while the main army advances as diversion.","outcome":"The heights are occupied at night and the enemy keeps watchfires burning.","uncertainty":"Interrogation and force totals are unstated."},{"id":"SDO-006","locator":"Anabasis IV.6; PDF pp. 86-87","actor":"Greek and enemy forces","deed":"After dawn sacrifice, road and high-ground forces advance together; the high-ground enemy is 