title: Primary-only cumulative reconstruction of Xenophon's Anabasis
jurisdiction: Derived only from the fifty-one owner-adopted chapter reconstructions of the admitted H. G. Dakyns
  Project Gutenberg English translation witness. This record preserves translated sequence, speakers, deeds, outcomes,
  repetitions, tensions, and unresolved questions. It does not authenticate the Greek text, adjudicate translations,
  certify narrated events independently, or import any secondary interpretation.
