  coverage_rule: Every numbered chapter from Anabasis I.1 through VII.8 is represented exactly once in the source
    unit sequence.
  unit_status_rule: The fifty-one chapter files remain immutable production records with their original DRAFTED_PENDING_OWNER_REVIEW
    statuses; collective adoption is supplied by the owner-review record.
methodological_controls:
- Observation and provisional inference remain distinct.
- A work-level finding requires a pattern distributed across more than one chapter.
- Speech is read with audience, occasion, deed, and outcome.
- Practical success is not equated with justice, wisdom, piety, or legitimate authority.
- Narrated sacrifice, omen, dream, or oracle is not treated as independently verified divine causation.
- Narrator, Xenophon as character, quoted speaker, reported opinion, and translator wording remain distinct.
- Contradictions and rival explanations are preserved where the admitted witness does not decide.
- No deed corpus, speech register, teaching, guard, adapter, ministerial capacity, or Sanctum registration is derived
  here.
book_level_movements:
- book: I
  units:
  - XEN-PRI-RU-001
  - XEN-PRI-RU-002
  - XEN-PRI-RU-003
  - XEN-PRI-RU-004
  - XEN-PRI-RU-005
  - XEN-PRI-RU-006
  - XEN-PRI-RU-007
  - XEN-PRI-RU-008
  - XEN-PRI-RU-009
  - XEN-PRI-RU-010
  movement: A dynastic project originating in the Persian royal household is converted into a concealed, distributed
    military expedition through money, friendship, local causes, and unequal knowledge. Greek consent becomes unstable
    before the true destination is fully disclosed. At Cunaxa the Greek force succeeds tactically while Cyrus dies,
    separating battlefield success from the political end that made the expedition intelligible.
  governing_tension: Successful preparation and tactical excellence do not secure a viable end when the patron and
    claimant to rule is lost.
- book: II
  units:
  - XEN-PRI-RU-011
  - XEN-PRI-RU-012
  - XEN-PRI-RU-013
  - XEN-PRI-RU-014
  - XEN-PRI-RU-015
  - XEN-PRI-RU-016
  movement: The Greeks become an army without the prince, purpose, paymaster, or protected route that gathered them.
    They rely on negotiation, reciprocal oaths, and an uneasy alliance with Ariaeus while remaining dependent on Persian
    guides and provisions. The seizure and killing of the generals destroys the inherited command structure and closes
    the first phase with retrospective portraits of the dead commanders.
  governing_tension: Formal assurances and personal reputation are politically indispensable yet unable by themselves
    to prevent betrayal.
- book: III
  units:
  - XEN-PRI-RU-017
  - XEN-PRI-RU-018
  - XEN-PRI-RU-019
  - XEN-PRI-RU-020
  - XEN-PRI-RU-021
  movement: Leaderlessness becomes the occasion for renewed deliberation, election, discipline, and tactical invention.
    Xenophon enters decisively as character and speaker, but authority is distributed among generals, captains, assemblies,
    and specialized troops. The march is reconstituted as a collective project of survival and return.
  governing_tension: Freedom from Persian command requires stronger internal obedience, organization, and adaptation
    rather than the absence of rule.
- book: IV
  units:
  - XEN-PRI-RU-022
  - XEN-PRI-RU-023
  - XEN-PRI-RU-024
  - XEN-PRI-RU-025
  - XEN-PRI-RU-026
  - XEN-PRI-RU-027
  - XEN-PRI-RU-028
  - XEN-PRI-RU-029
  movement: The army's political reconstitution is tested by mountains, rivers, snow, hunger, hostile populations,
    and unfamiliar forms of warfare. Success depends on local intelligence, changing formations, rear and advance
    guards, negotiation, deception, sacrifice, endurance, and coordinated rescue. The sight of the sea marks a real
    achievement but not the completion of return.
  governing_tension: The common goal becomes visible only after survival has required repeated departures from fixed
    tactical habit.
- book: V
  units:
  - XEN-PRI-RU-030
  - XEN-PRI-RU-031
  - XEN-PRI-RU-032
  - XEN-PRI-RU-033
  - XEN-PRI-RU-034
  - XEN-PRI-RU-035
  - XEN-PRI-RU-036
  - XEN-PRI-RU-037
  movement: Arrival among coastal Greek settlements does not dissolve the army's political problems. Provisioning,
    raids, alliances, distribution, relations with Greek cities, a possible colonial settlement, and accusations against
    Xenophon reopen questions of common purpose, law, and command. Xenophon must defend both proposals and disciplinary
    acts.
  governing_tension: Nearness to home increases rather than removes disagreement over whether the army is a temporary
    return force, a potential city, or an available instrument.
- book: VI
  units:
  - XEN-PRI-RU-038
  - XEN-PRI-RU-039
  - XEN-PRI-RU-040
  - XEN-PRI-RU-041
  - XEN-PRI-RU-042
  - XEN-PRI-RU-043
  movement: The army experiments with unified command, fragments into separate contingents, suffers the consequences
    of division, and is reunited under pressure. Relations with Paphlagonians, Bithynians, Persian forces, Heraclea,
    Calpe, and Spartan authority show that military competence, provisioning, legal accountability, and recognized
    command do not coincide automatically.
  governing_tension: The desire to escape dependence repeatedly produces new dependence on commanders, cities, markets,
    allies, and external authorities.
- book: VII
  units:
  - XEN-PRI-RU-044
  - XEN-PRI-RU-045
  - XEN-PRI-RU-046
  - XEN-PRI-RU-047
  - XEN-PRI-RU-048
  - XEN-PRI-RU-049
  - XEN-PRI-RU-050
  - XEN-PRI-RU-051
  movement: At Byzantium and in Thrace, Spartan officers, Seuthes, local envoys, unpaid soldiers, and shifting commanders
    compete to use, dismiss, restrain, or transfer the army. Xenophon alternates between practical leadership, denial
    of formal command, public accusation, self-defense, negotiation, and private poverty. The work ends with the troops
    incorporated by Thibron, while Xenophon's personal homecoming remains outside the narrated completion.
  governing_tension: Institutional transfer can end the army's independent march without resolving every debt, reputation,
    private aim, or question of justice.
