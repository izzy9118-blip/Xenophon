  - XEN-PRI-RU-034
  - XEN-PRI-RU-046
  - XEN-PRI-RU-049
  - XEN-PRI-RU-050
  pattern: Command repeatedly depends on the ability to secure food, markets, wages, transport, booty, or compensation;
    political promises lose force when material support fails.
  uncertainty: Material provision is necessary for authority in these episodes but is not shown to be sufficient for
    legitimate or wise rule.
- id: PAT-003
  name: Friendship as political infrastructure and vulnerability
