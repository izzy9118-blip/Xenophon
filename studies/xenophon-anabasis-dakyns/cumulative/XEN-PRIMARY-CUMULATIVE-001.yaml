recurring_problem_patterns:
- id: PAT-001
  name: Concealment, disclosure, and consent
  evidence_units:
  - XEN-PRI-RU-001
  - XEN-PRI-RU-002
  - XEN-PRI-RU-003
  - XEN-PRI-RU-046
  - XEN-PRI-RU-049
  pattern: Major undertakings repeatedly begin with unequal knowledge, promises, or incomplete disclosure; consent
    must later be repaired, renewed, or defended.
  uncertainty: The record does not permit a single judgment that every concealment is equivalent in motive, legality,
    or effect.
- id: PAT-002
  name: Pay, provisions, and the material basis of command
  evidence_units:
