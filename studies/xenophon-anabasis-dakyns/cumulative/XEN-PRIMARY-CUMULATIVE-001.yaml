narrative_person_development:
- phase: Opening concealment and dynastic preparation
  units:
  - XEN-PRI-RU-001
  - XEN-PRI-RU-002
  observation: The work opens in third-person narration centered on Cyrus and the Persian household; Xenophon is not
    introduced as narrator or actor.
  uncertainty: The witness does not settle authorship, narrator identity, or the Greek force of the opening.
- phase: Cyrus and inherited commanders
  units:
  - XEN-PRI-RU-003
  - XEN-PRI-RU-016
  observation: The first two books organize judgment around Cyrus, named commanders, collective Greek action, and retrospective
    portraits of the slain generals.
  uncertainty: The relation between narrated character judgments and the narrator's own standards remains provisional.
- phase: Xenophon's decisive entry
  units:
  - XEN-PRI-RU-017
  - XEN-PRI-RU-018
  observation: Xenophon becomes a central character through dream, private deliberation, initiative, speech, election,
    and coordinated action.
  uncertainty: Reported interior deliberation and direct speech remain literary-narrative evidence rather than independently
    verified transcript.
- phase: Contested leader and public defendant
  units:
  - XEN-PRI-RU-035
  - XEN-PRI-RU-036
  - XEN-PRI-RU-037
  - XEN-PRI-RU-043
  - XEN-PRI-RU-044
  - XEN-PRI-RU-049
  observation: Xenophon's proposals, disciplinary acts, relations with external authorities, and private motives become
    subjects of accusation, defense, witness testimony, and changing popular judgment.
  uncertainty: The narrative gives Xenophon extensive defensive speech but does not thereby eliminate every rival account.
- phase: Withdrawal, poverty, reward, and transfer
  units:
  - XEN-PRI-RU-050
  - XEN-PRI-RU-051
  observation: Xenophon denies formal command while still influencing settlement, prepares to go home, is presented
    as poor, receives first choice from captured property, and hands the military body into Thibron's war.
  uncertainty: The narrative does not close with Xenophon's arrival home or a complete account of his subsequent wealth
    and motives.
speech_deed_outcome_findings:
- id: SDO-CUM-001
  claim: Concealed or partial speech can assemble power rapidly but creates later crises of consent.
  evidence_units:
  - XEN-PRI-RU-001
  - XEN-PRI-RU-003
  - XEN-PRI-RU-007
  qualification: The reality of local grievances prevents reducing every announced cause to pure fabrication.
- id: SDO-CUM-002
  claim: A speech becomes politically effective only when hearers can connect it to a feasible deed, supply, route,
    or institutional arrangement.
  evidence_units:
  - XEN-PRI-RU-003
  - XEN-PRI-RU-018
  - XEN-PRI-RU-044
  - XEN-PRI-RU-050
  qualification: Effectiveness does not prove justice or truth.
- id: SDO-CUM-003
  claim: Public deliberation can reconstitute command after catastrophe, but the resulting order remains dependent on
    repeated renewal.
  evidence_units:
  - XEN-PRI-RU-017
  - XEN-PRI-RU-018
  - XEN-PRI-RU-039
  - XEN-PRI-RU-045
  qualification: Votes and acclamations vary in form and are not a single stable constitution.
- id: SDO-CUM-004
  claim: Promises without material performance weaken both personal reputation and the political usefulness of future
    speech.
  evidence_units:
  - XEN-PRI-RU-013
  - XEN-PRI-RU-046
  - XEN-PRI-RU-049
  - XEN-PRI-RU-050
  qualification: The record does not provide a complete legal adjudication of every promise.
- id: SDO-CUM-005
  claim: Accusation and defense repeatedly convert private suspicions into public tests of leadership.
  evidence_units:
  - XEN-PRI-RU-006
  - XEN-PRI-RU-036
