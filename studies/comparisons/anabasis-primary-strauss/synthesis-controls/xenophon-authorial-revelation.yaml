{"schema_version":"1.0","control_id":"XEN-SYNTHESIS-CONTROL-001","status":"ACTIVE_OWNER_ADOPTED_CONTROL","governing_correction":"governance/corrections/2026-07-31-xenophon-authorial-revelation-direction.yaml","governing_principle":"The synthesis must reconstruct what Xenophon reveals through the composition, narration, contrasts, ambiguities, silences, and differentiated figures of his works. It must not make Xenophon the passive recipient of standards supplied by Cyrus, Socrates, or Strauss.","required_sequence":[{"id":"AUTHORIAL_SOURCE","rule":"Begin from Xenophon as the revealing author whose manner of disclosure is partly hidden."},{"id":"FIGURAL_PRESENTATIONS","rule":"Examine the younger Cyrus, older Cyrus, Socrates, and Xenophon's narrated persona as differentiated Xenophontic presentations."},{"id":"STRAUSSIAN_RECOVERY","rule":"Use Strauss to recover the concealed argumentative relations among those presentations."},{"id":"CONTROLLED_INFERENCE","rule":"Distinguish what Xenophon shows, what Strauss explicitly argues, and what the synthesis infers."}],"required_formulation":"Xenophon reveals the political-philosophic problem through the figures and narrative forms he presents; Strauss uncovers the hidden order of those revelations.","older_cyrus_control":"Write that Xenophon's presentation of the older Cyrus reveals a form of political rule, never that the older Cyrus supplies Xenophon with a standard.","anti_absorption_rules":["Do not collapse Xenophon into his narrated persona.","Do not collapse either Cyrus into a doctrine.","Do not collapse Strauss's interpretation into Xenophon's explicit statement.","Do not eliminate deliberate concealment or ambiguity by paraphrasing it as a settled teaching."],"applies_to":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001 and every later derivative."}