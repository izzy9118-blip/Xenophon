{"schema_version":"1.0","comparison_id":"XEN-CONTROLLED-COMPARISON-001","revision_id":"XEN-CONTROLLED-COMPARISON-001-R2","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","entry_count":15,"entries":[{"entry_id":"CMP-017","topic":"Greek freedom, obedience, and Spartan hegemony","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"QUALIFIED_AGREEMENT","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-007","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"Greek freedom is achieved through disciplined obedience, but Spartan hegemony makes obedience politically and morally problematic. Xenophon must know when to resist, yield, and prevent faction.","preserved_limit":"Greek vocabulary and the justice of hegemony remain unadjudicated."},{"entry_id":"CMP-018","topic":"Founding, settlement, honor, and fatherland","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-006","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"Founding is a peak or overreaching peak of ascent that joins honor, power, benefit to Greece, sacrificial consultation, ambition, and the accusation of preferring a project to fatherland.","preserved_limit":"Xenophon's motive and the city's feasibility remain open."},{"entry_id":"CMP-019","topic":"Manly and Socratic justice","r1_classification":"GOVERNING_EXAMINATION","r2_classification":"GOVERNING_EXAMINATION","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-006","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/governing-examination.yaml","integrated_finding":"Justice is the heart of the examination. Concrete disputes lead to the ambiguity between manly justice and Socratic non-harm, the need for legitimacy, degrees of cruelty, and Strauss's claim that each virtue points toward the other while their plenitudes cannot coexist.","preserved_limit":"The cited Socratic and Cyropaedia standards remain secondary until reconstructed."},{"entry_id":"CMP-020","topic":"Greeks, Persians, and non-Greek communities","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"QUALIFIED_AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-005","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"Greek and non-Greek relations resist a simple opposition. Dependence, hospitality, alliance, law, and cruelty vary across Persians, Karduchians, Armenians, Mossynoikians, Thracians, and Greeks.","preserved_limit":"Ethnographic judgments remain translation-mediated."},{"entry_id":"CMP-021","topic":"External powers and the instrumentalization of the army","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-007","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"Cyrus, Persian satraps, Spartan officers, Seuthes, and Greek cities repeatedly seek the army's force while limiting obligations. Instrumentalization links command to pay, transfer, and responsibility.","preserved_limit":"Each relation has distinct legal and political terms."},{"entry_id":"CMP-022","topic":"Pay, provisions, markets, and material authority","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-003","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"Pay, provisions, markets, transport, booty, and compensation are the descriptive material conditions of authority. R2 distinguishes this evidentiary finding from CMP-023's placement within the Cyrus-side architecture.","preserved_limit":"No complete economic ledger exists."},{"entry_id":"CMP-023","topic":"Material governance as independent Cyrus-side elaboration","r1_classification":"CYRUS_SIDE_ELABORATION","r2_classification":"CYRUS_SIDE_ELABORATION","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-003","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/cyrus-side-elaboration.yaml","integrated_finding":"The seven-book pattern of material governance was independently disclosed by the primary reconstruction. Strauss's economic-art and Socrates-Cyrus framework gives it interpretive placement without erasing that independent discovery.","preserved_limit":"Cyrus and Xenophon are not identified without remainder."},{"entry_id":"CMP-024","topic":"Friendship, Proxenos, and political dependence","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"QUALIFIED_AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-002","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"Friendship recruits and finances the expedition, mediates Xenophon through Proxenos, creates obligations to rulers and soldiers, and exposes betrayal. Proxenos is restored as the central bridge from Cyrus-side aspiration to Socratic differentiation.","preserved_limit":"Greek friendship terms remain unverified."},{"entry_id":"CMP-025","topic":"Accusation, trial, apology, acquittal, and public judgment","r1_classification":"AGREEMENT","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-006","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"Xenophon's defenses are governing examinations because trial and apology display the difference from Socrates. His acquittal and effective appeals to public deeds matter, but success before an audience cannot itself prove justice.","preserved_limit":"The narrative's self-presentation and audience judgment remain objects of inquiry."},{"entry_id":"CMP-026","topic":"Ambition, honor, poverty, wealth, and reward","r1_classification":"UNRESOLVED_RELATION","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-006","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/unresolved-relation.yaml","integrated_finding":"Ambition, honor, name, power, wealth, poverty, and reward are successive tests of Xenophon's ascent. They must be judged by whether practical excellence benefits the army and can be ordered by justice.","preserved_limit":"Intention and a full financial account remain inaccessible."},{"entry_id":"CMP-027","topic":"Homecoming and the political complication of Greek cities","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-007","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"The sea and Greek cities do not complete return. They intensify disputes over transport, supply, violence against Greeks, employment, authority, settlement, and separation.","preserved_limit":"Home and return remain politically multivalent."},{"entry_id":"CMP-028","topic":"Greece, Athens, Sparta, Cyrus, and fatherland","r1_classification":"UNRESOLVED_RELATION","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-006","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/unresolved-relation.yaml","integrated_finding":"Greece, Athens, Sparta, Cyrus, and fatherland form a governing examination. Xenophon finally shows preference for Greece over barbarians, but the work does not show that Athens outranks Cyrus or Sparta, leaving Socrates' apprehension open.","preserved_limit":"Exile and later political position remain unresolved."},{"entry_id":"CMP-029","topic":"The ending as Socrates' final question","r1_classification":"GOVERNING_EXAMINATION","r2_classification":"GOVERNING_EXAMINATION","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-008","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/governing-examination.yaml","integrated_finding":"The ending is the final Socrates-Cyrus examination: Seuthes, unpaid wages, accusation, effective apology, Zeus the King, reconciliation, Greece, Athens, booty, Thibron, gods, and oaths converge without producing a closed verdict.","preserved_limit":"Strauss ends with a question, not a doctrine."},{"entry_id":"CMP-030","topic":"Thibron and the terminal institutional form of the Cyrus side","r1_classification":"CYRUS_SIDE_ELABORATION","r2_classification":"CYRUS_SIDE_ELABORATION","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-008","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/cyrus-side-elaboration.yaml","integrated_finding":"The primary reconstruction independently identifies Thibron's incorporation as the end of the army's autonomous institutional existence. Within Strauss's architecture it is the terminal Cyrus-side deed: renewed command, war, acquisition, and service.","preserved_limit":"Transfer does not settle whether Socrates is vindicated."},{"entry_id":"CMP-031","topic":"Law, nature, and the most remote barbarians","r1_classification":"UNRESOLVED_RELATION","r2_classification":"UNRESOLVED_RELATION","review_application":"RETAINED","principal_movement":"R2-MOV-005","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/unresolved-relation.yaml","integrated_finding":"The Mossynoikians show that even the most alien communities live under law, while their strange likenesses to Socrates complicate nature-law and Greek-barbarian distinctions.","preserved_limit":"The general anthropological claim requires Greek and cross-work review."}]}