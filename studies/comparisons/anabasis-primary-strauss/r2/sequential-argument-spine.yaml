{"schema_version":"1.0","comparison_id":"XEN-CONTROLLED-COMPARISON-001","revision_id":"XEN-CONTROLLED-COMPARISON-001-R2","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","method":"Sequential reconstruction of Strauss's argument; each movement states Strauss's argumentative progression, the function of primary evidence, and the transition to the next movement.","movements":[{"id":"R2-MOV-001","title":"Misleading surfaces: title, opening, authorship, praise, and report","strauss_scope":"printed pp. 105-109","secondary_units":["XEN-RU-001","XEN-RU-002"],"principal_entries":["CMP-001","CMP-002","CMP-003","CMP-004"],"argument":["The modern judgment that the Anabasis is Xenophon's most beautiful work must be suspended until the work's place and function within the Corpus Xenophonteum are understood.","The authentic title 'Cyrus' Ascent' and the Persian-dynastic opening point toward objects that the work exceeds; Strauss therefore raises the possibility that the work is Xenophon's ascent.","The Themistogenes attribution, third-person self-presentation, and possible becoming-anonymity make authorship and narrative person part of the work's self-presentation.","Variations of praise, omission, and legetai establish Strauss's initial method: defects and epistemic distance may be disclosed indirectly rather than through explicit blame.","Cyrus is introduced as the first political pole: friendship, generosity, secrecy, kingship, coercive ambition, and the possible absence of piety belong together and require judgment."],"primary_evidence_function":"The primary reconstruction confirms the dynastic opening, Cyrus's concealed kingship project, Xenophon's absence, indirect orders, and the translated narrative-person problem. It cannot certify the title tradition, Themistogenes, Greek lexical devices, or omission as a stable authorial mechanism.","transition":"The indirect devices converge at the end of Book Two, where Menon, Proxenos, and the murdered generals prepare the question of Xenophon's true foil."},{"id":"R2-MOV-002","title":"Menon, Proxenos, and the preparation of the Socrates-Xenophon contrast","strauss_scope":"printed pp. 108-111","secondary_units":["XEN-RU-001","XEN-RU-002"],"principal_entries":["CMP-003","CMP-004","CMP-005","CMP-006","CMP-024","CMP-026","CMP-028"],"argument":["Menon's punishment, framed through legetai, human retaliation, and silence about age, joins impiety, perjury, naked truth, and narrative adornment without making Menon the final standard.","Proxenos occupies repeated central positions because he is the indispensable mediator who brings Xenophon to Cyrus.","Proxenos seeks great name, great power, and much wealth through just and noble means, but his gentleness leaves him unable to rule ordinary soldiers through awe and fear.","Proxenos's willingness to regard Cyrus as better than fatherland exposes uprootedness and begins the fatherland problem before Xenophon's ascent.","Xenophon differs from Proxenos through toughness, wit, and wiliness; Strauss cautiously connects this difference to familiarity with Socrates.","Menon and Proxenos therefore prepare but do not govern the interpretation. The governing question becomes whether Xenophon must be understood in the light of Socrates."],"primary_evidence_function":"The primary sequence supports Proxenos's causal and political importance, Cyrus's use of friendship and money, shame after disclosure, and Xenophon's practical difference from gentler leaders. Strauss supplies the cross-work and pedagogic relation to Socrates.","transition":"Proxenos's invitation carries Xenophon from the Cyrus-side pursuit of action, honor, power, and wealth to Socrates, Delphi, and the question of who decides whether the journey should be made."},{"id":"R2-MOV-003","title":"Delphi, political self-direction, and the economic art","strauss_scope":"printed pp. 111-113","secondary_units":["XEN-RU-002","XEN-RU-003"],"principal_entries":["CMP-006","CMP-007","CMP-022","CMP-023","CMP-024","CMP-026","CMP-028"],"argument":["Socrates suspects civic danger in Xenophon's friendship with Cyrus but does not claim knowledge and sends Xenophon to Delphi.","Xenophon asks the secondary question—how to make the already contemplated journey nobly and successfully—rather than whether to go.","The disagreement reveals Xenophon's reservation of the primary political decision to his own powers, while divine consultation governs conditions, execution, and fortune.","Xenophon is distinguished from Socrates as a man of political action who seeks nobly acquired moderate wealth and practices the economic art.","Ischomachus and Kritoboulos clarify the contrast: the economic art can be taught or discussed by Socrates without being exercised by Socrates.","Material governance across the work is therefore not an external economic theme. It is independently disclosed primary evidence that fills out the active, acquisitive, commanding, and economic Cyrus side under Strauss's governing architecture."],"primary_evidence_function":"The primary record preserves the Delphic sequence, sacrifices, later pay and property disputes, Xenophon's poverty and reward, and the recurrent dependence of authority on material performance. It does not independently establish the Socratic standard or the cross-work economic-art framework.","transition":"Having decided to go, Xenophon must be judged through the ascent that begins after Persian treachery: dream, speech, election, discipline, correction, wealth, and command."},{"id":"R2-MOV-004","title":"Xenophon's ascent through speech, office, correction, and command","strauss_scope":"printed pp. 113-117","secondary_units":["XEN-RU-003"],"principal_entries":["CMP-005","CMP-008","CMP-009","CMP-010","CMP-011","CMP-014","CMP-015","CMP-017","CMP-021","CMP-022"],"argument":["Cyrus's concealment and the Greeks' shame-bound continuation establish the compromised political beginning of Xenophon's own action.","The ambiguous dream awakens Xenophon, but the plan, speeches, elections, institutions, and tactical corrections are his.","Three speeches are differentiated by audience and office: captains receive danger, opportunity, and leadership; officers receive exemplary conduct and discipline; the whole army receives sacred confidence, ancestral memory, settlement, punishment, command, and wealth.","The sneeze becomes politically effective through interpretation, vote, vow, and common enactment rather than through demonstrable divine causation.","Xenophon becomes general and spiritus rector, but his ascent includes failed devices, accepted blame, correction, and visible sharing of burdens.","The military art becomes a means of the economic art, while strengthened punitive power and acquisition open the justice problem.","The army becomes the political field in which Xenophon's attempted mediation between Socrates and Cyrus is enacted."],"primary_evidence_function":"The fifty-one-unit reconstruction supplies the full sequence of speeches, institutions, tactics, discipline, supply, accusation, and outcome. It supports the ascent structurally while leaving its justice and ultimate purpose open.","transition":"The ascent reaches the doubly central Book Four, where piety, toughness, wiliness, barbarian poles, command, and the two forms of justice come into view."},{"id":"R2-MOV-005","title":"Book Four as compositional center: piety, wiliness, and preparation for justice","strauss_scope":"printed pp. 117-123","secondary_units":["XEN-RU-004","XEN-RU-005"],"principal_entries":["CMP-011","CMP-012","CMP-013","CMP-014","CMP-019","CMP-020","CMP-031"],"argument":["Book Four is doubly central through its position and uniquely extensive introduction, but the numerical observations remain claims to be independently checked.","Karduchia and Armenia first appear as opposed poles of toughness and gaiety; Armenia then becomes a barbarian analogue to Athens through the Cyropaedia's Socratic figure.","Xenophon's piety cannot be separated from toughness, wit, accessibility to information, interpretive initiative, and wiliness; it differs radically from passive or excessively pious dependence.","The Armenian analogue introduces the contrast between gentlemanly or manly virtue—benefiting friends and harming enemies—and Socratic justice—harming no one.","Xenophon's supreme command and the burning city lead to deus sive casus: chance or divine aid becomes politically effective only when Xenophon grasps and extends it.","The conjunction of piety and wiliness raises Strauss's hardest theological questions concerning omniscience, law about the gods, and whether human flattering itself shapes divine predicates.","The Mossynoikians extend the inquiry from Greek-barbarian difference to nature and law while preserving the need for cross-work verification."],"primary_evidence_function":"The primary record supplies the Book Four sequence, sacrifices, dreams, prisoners, coercion, hospitality, weather, tactical command, and customs. It cannot certify Strauss's numerical arithmetic, Greek oath counts, or cross-work Socratic analogies.","transition":"The central book prepares the later explicit crisis: whether Xenophon's ascent can culminate in founding while remaining just toward the army, Greece, fatherland, friends, and enemies."},{"id":"R2-MOV-006","title":"Founding, trial, acquittal, fatherland, and the two forms of justice","strauss_scope":"printed pp. 123-128","secondary_units":["XEN-RU-005","XEN-RU-006"],"principal_entries":["CMP-014","CMP-015","CMP-018","CMP-019","CMP-024","CMP-025","CMP-026","CMP-028","CMP-031"],"argument":["The proposed Pontic city appears as a possible peak or overreaching peak of Xenophon's ascent, promising honor, power, benefit to Greece, and founder's immortality.","Timasion's appeal to Greece answers Proxenos's earlier claim that Cyrus may be better than fatherland and turns founding into a justice problem.","Xenophon's sacrificial procedure repeats the Delphic structure: he first permits himself to think the project and asks only whether to speak and act.","His defense defeats the charge of secret founding, then turns into a prosecution of indiscipline and finally into a trial of the generals, including Xenophon.","Xenophon's acquittal and effective apology must be read against Socrates' condemnation and apology; public success is relevant but not self-certifying.","The completed justice examination asks whether Xenophon vindicated more than piety: whether Greece, fatherland, knowledge of rule, inherited legitimacy, cruelty, benefaction, and harm can be justly ordered.","Strauss's decisive formulation is not a compromise for its own sake: manly virtue points toward Socratic virtue, Socratic virtue requires manly virtue as foundation, and their plenitudes cannot coexist in one human being.","Xenophon presents himself as perhaps the closest approximation known to him to their coexistence, thereby making justice—not topical disagreement—the heart of the work."],"primary_evidence_function":"The primary reconstruction preserves colony controversy, sacrifice, accusation, discipline, beatings, testimony, acquittal, friendship, pay, booty, and distribution. Strauss supplies the cross-work standards and the claim about Xenophon's intermediate position.","transition":"After acquittal, the army offers Xenophon monarchy. Founding, monarchy, Spartan hegemony, faction, and practical supremacy become successive tests of ascent and legitimacy."},{"id":"R2-MOV-007","title":"Monarchy, Spartan hegemony, faction, and practical supremacy","strauss_scope":"printed pp. 128-134","secondary_units":["XEN-RU-007","XEN-RU-008"],"principal_entries":["CMP-016","CMP-017","CMP-018","CMP-021","CMP-022","CMP-023","CMP-027","CMP-028"],"argument":["The offer of sole command may rival founding as the peak of ascent, but Xenophon privately consults Zeus the King and publicly reasons as a political man.","He rejects election because divine indications are adverse, the future is uncertain, and Spartan hegemony makes Athenian command politically dangerous to army and leader.","The choice between Xenophon and Cheirisophos exposes the surviving Spartan-Athenian struggle and prevents simple identification of justice with Greece.","Cheirisophos's brief monarchy collapses; faction divides the army; Xenophon rescues the Arcadians, reunites the force, and becomes practical monarch without formal election.","Repeated unfavorable sacrifices at Kalpe, Spartan coercion, and submission to Kleandros show that freedom requires organized obedience and prudential recognition of hegemonic power.","External rulers repeatedly seek to use the army while avoiding pay and responsibility; material governance is the Cyrus-side infrastructure of this struggle.","The approach to Greek cities does not complete return. It intensifies questions of violence against Greeks, employment, authority, separation, and fatherland."],"primary_evidence_function":"The primary reconstruction independently discloses the army's assemblies, faction, command transfers, supply crises, pay promises, Spartan leverage, and practical supremacy. These distributed patterns belong within Strauss's Cyrus-side examination without being reduced to claims Strauss explicitly enumerates.","transition":"The final movement tests whether Xenophon's return to Greek and Spartan authority corrects, fulfills, or merely transforms his original movement toward Cyrus."},{"id":"R2-MOV-008","title":"Seuthes, apology, reconciliation, booty, Thibron, and Socrates' final question","strauss_scope":"printed pp. 133-136","secondary_units":["XEN-RU-008"],"principal_entries":["CMP-011","CMP-012","CMP-019","CMP-021","CMP-022","CMP-023","CMP-024","CMP-025","CMP-026","CMP-027","CMP-028","CMP-029","CMP-030"],"argument":["At Byzantion Xenophon prevents revenge against an innocent Greek city and urges obedience to those who rule the Greeks, restoring Greece to its rightful place without resolving Athens or Sparta.","Service under Seuthes repeats Cyrus-side dependence on a foreign ruler, promises, gifts, winter campaigning, acquisition, and unpaid wages.","The accusation before Thibron's emissaries marks Xenophon's lowest descent; his apology is easier and more effective than Socrates' because it appeals to deeds and speeches known to innumerable witnesses.","Zeus the King dispels the final suspicion, but divine indication remains intertwined with political calculation, testimony, oath, and material settlement.","Reconciliation occurs with Seuthes, the army, and the Spartans; Xenophon demonstrates preference for Greece over barbarians but not preference for Athens over Cyrus or Sparta.","Homecoming remains unnarrated. Xenophon immediately resumes Persian war for booty, and the army's independent institutional existence ends through incorporation under Thibron.","Thibron's transfer is an independently disclosed institutional endpoint on the Cyrus side: command, war, acquisition, and service continue under another authority.","The greater density of gods and oaths in Book Seven does not close the inquiry. Strauss ends by asking whether the Anabasis as a whole vindicates Socrates' original apprehension."],"primary_evidence_function":"The final primary units preserve accusation, oath, Seuthes's debt, partial payment, Zeus the King, poverty, booty, reward, and transfer to Thibron. They make the Cyrus-side ending concrete but cannot independently establish Strauss's Socratic verdict.","transition":"No final doctrinal verdict is issued. The work closes with renewed action under the question first posed by Socrates."}]}