{"schema_version":"1.0","comparison_id":"XEN-CONTROLLED-COMPARISON-001","revision_id":"XEN-CONTROLLED-COMPARISON-001-R2","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","entry_count":16,"entries":[{"entry_id":"CMP-001","topic":"Title, opening, and Xenophon's ascent","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-001","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"The title and opening do not merely agree with a later theme. They initiate the governing movement from Cyrus's failed ascent toward Xenophon's ascent and the question of how that ascent is judged.","preserved_limit":"The primary sequence supports the displacement after Book One but cannot certify title tradition or authorial intention."},{"entry_id":"CMP-002","topic":"Themistogenes, authorship, and third-person self-presentation","r1_classification":"PRIMARY_SILENCE","r2_classification":"PRIMARY_SILENCE","review_application":"RETAINED","principal_movement":"R2-MOV-001","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/primary-silence.yaml","integrated_finding":"The primary witness makes narrative person problematic; Strauss's Themistogenes hypothesis and becoming-anonymity remain guiding secondary claims requiring Hellenica and Greek verification.","preserved_limit":"No pseudonym or first-person narrator identity is adopted."},{"entry_id":"CMP-003","topic":"Praise by omission and legetai","r1_classification":"PRIMARY_SILENCE","r2_classification":"PRIMARY_SILENCE","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-001","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/primary-silence.yaml","integrated_finding":"R2 separates two devices: omission as indirect praise or blame, and legetai as reported or distanced assertion. Each has a different evidentiary burden and Greek-text check.","preserved_limit":"Neither device is certified as a stable mechanism from the translation alone."},{"entry_id":"CMP-004","topic":"Cyrus's virtues, secrecy, kingship, piety, and cruelty","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"QUALIFIED_AGREEMENT","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-001","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"Cyrus defines the first pole through generosity, friendship, secrecy, kingship, ambition, benefit to friends, harm to enemies, possible impiety, and degrees of cruelty. Economic acquisition is one part, not the whole.","preserved_limit":"The absence of piety from the eulogy and the scale of cruelty remain Strauss-guided claims."},{"entry_id":"CMP-005","topic":"Concealment, disclosure, shame, and continued consent","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-002","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"The expedition begins through concealed purpose and continues through shame, loyalty, necessity, ambition, and pay. This is the political mode from which Xenophon must ascend without ever wholly escaping it.","preserved_limit":"The relative causal weight of motives remains unresolved."},{"entry_id":"CMP-006","topic":"Socrates-Xenophon as governing architecture","r1_classification":"PRIMARY_SILENCE","r2_classification":"GOVERNING_ARCHITECTURE","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-002","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/primary-silence.yaml","integrated_finding":"The contrast with Socrates is the governing architecture, not a proposition that the primary translation can independently verify. It orders the examination of action, wealth, piety, justice, fatherland, apology, and the ending.","preserved_limit":"The Socratic standard still requires independent reconstruction of the cited works."},{"entry_id":"CMP-007","topic":"Delphi and the jurisdiction of political decision","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-003","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"The Delphic episode reveals Xenophon's political self-direction: he decides the primary question and consults the god about execution and fortune. This difference from Socrates governs later sacrifices before founding, monarchy, and departure.","preserved_limit":"A universal Xenophontic rule for divination is not certified."},{"entry_id":"CMP-008","topic":"Xenophon's ascent","r1_classification":"AGREEMENT","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-004","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"Xenophon's ascent is the work's governing movement after Cyrus: nobody, general, spiritus rector, practical monarch, accused leader, defendant, reconciled commander, and rewarded actor. Every rise remains subject to justice and Socrates.","preserved_limit":"No single episode is declared the final peak."},{"entry_id":"CMP-009","topic":"Audience-differentiated speech","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-004","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"Speech is differentiated by audience, office, occasion, and capacity. The captains, officers, army, rulers, accusers, and Greek cities receive distinct arguments that reshape institutions and action.","preserved_limit":"Reported speeches are literary and translated evidence."},{"entry_id":"CMP-010","topic":"Speech tested by deed, failure, and correction","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-004","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"Xenophon's authority includes fallibility, admission of blame, correction, and visible deed. Speech is tested by tactical result and material performance rather than insulated by office.","preserved_limit":"Corrigibility does not certify every larger end."},{"entry_id":"CMP-011","topic":"Piety joined to toughness, wit, wiliness, and judgment","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-005","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"Piety is not generic religious accompaniment. Strauss joins it to toughness, wit, wiliness, information, interpretation, and command; R2 keeps divine law, omniscience, and the danger of human ruse active.","preserved_limit":"Divine causation and a final definition of piety remain open."},{"entry_id":"CMP-012","topic":"Signs, chance, deus sive casus, and causal restraint","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"QUALIFIED_AGREEMENT","review_application":"RETAINED","principal_movement":"R2-MOV-005","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"Dreams, sacrifices, omens, and chance do not interpret themselves. Deus sive casus names the surplus beyond prudence, while Xenophon's recognition and extension of opportunity remain indispensable.","preserved_limit":"Theological claims exceed the admitted witness."},{"entry_id":"CMP-013","topic":"Book Four centrality and numerical composition","r1_classification":"PRIMARY_SILENCE","r2_classification":"PRIMARY_SILENCE","review_application":"RETAINED","principal_movement":"R2-MOV-005","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/primary-silence.yaml","integrated_finding":"Book Four's double centrality and numerical patterns are retained as Strauss's compositional claims, but R2 gives them argumentative function: they prepare the transition from piety and barbarian poles to justice.","preserved_limit":"Counts and Greek oath patterns require independent verification."},{"entry_id":"CMP-014","topic":"Effectiveness, coercion, and the threshold of justice","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-006","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"The distinction between effectiveness and justice is a threshold within, not outside, the governing justice inquiry. Coercion, punishment, seizure, and deception supply the cases from which manly and Socratic justice emerge.","preserved_limit":"No episode is automatically justified by necessity or success."},{"entry_id":"CMP-015","topic":"The army as the political field of mediation","r1_classification":"AGREEMENT","r2_classification":"AGREEMENT","review_application":"REVISED_IN_PLACE","principal_movement":"R2-MOV-006","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/agreement.yaml","integrated_finding":"The army is a mobile political community and the concrete field in which Xenophon's mediation is enacted through assemblies, offices, punishment, distribution, faction, rescue, and judgment.","preserved_limit":"The city analogy remains incomplete."},{"entry_id":"CMP-016","topic":"Monarchy and the possible peak of ascent","r1_classification":"QUALIFIED_AGREEMENT","r2_classification":"GOVERNING_EXAMINATION","review_application":"RECLASSIFIED","principal_movement":"R2-MOV-007","inherited_evidence_record":"studies/comparisons/anabasis-primary-strauss/entries/qualified-agreement.yaml","integrated_finding":"Monarchy is a possible peak of ascent and a test of honor, prudence, divine restraint, Spartan hegemony, and legitimacy. Xenophon rejects formal monarchy and later acquires practical supremacy.","preserved_limit":"The relative grandeur of monarchy and founding remains unresolved."}]}