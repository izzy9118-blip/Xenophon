{"schema_version":"1.0","comparison_id":"XEN-CONTROLLED-COMPARISON-001","revision_id":"XEN-CONTROLLED-COMPARISON-001-R2","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","examination_count":7,"examinations":[{"id":"R2-DEEP-001","title":"Proxenos as indispensable mediator","entries":["CMP-004","CMP-005","CMP-006","CMP-024","CMP-026","CMP-028"],"finding":"Proxenos is structurally central because he joins Cyrus's world of friendship, honor, power, and wealth to Xenophon's movement toward Socrates. His noble but ineffective rule exposes both the attraction and insufficiency of gentlemanly political virtue. His claim that Cyrus may be better than fatherland introduces the loyalty problem before Xenophon's own ascent.","primary_contribution":"The primary reconstruction confirms Proxenos's invitation, friendship network, gentleness, and place in Xenophon's entry into the expedition; Strauss supplies the cross-work significance and the transition to Socrates.","unresolved":"The exact Greek terms of friendship and the full political meaning of uprootedness remain open."},{"id":"R2-DEEP-002","title":"Economic art and material governance","entries":["CMP-007","CMP-022","CMP-023","CMP-024","CMP-026","CMP-030"],"finding":"The economic art is not a detached theme. It distinguishes Xenophon from Socrates and connects moderate wealth, command, pay, booty, gifts, poverty, and institutional transfer to the Cyrus side. The primary seven-book pattern is an independent documentary discovery whose significance is clarified, not annulled, by Strauss.","primary_contribution":"Across all seven books, authority depends on provisions, markets, transport, wages, booty, compensation, and credible performance.","unresolved":"A complete economic ledger and the justice of acquisition remain unavailable."},{"id":"R2-DEEP-003","title":"Piety, wiliness, and divine-human jurisdiction","entries":["CMP-007","CMP-011","CMP-012","CMP-013","CMP-016","CMP-029"],"finding":"Xenophon's piety is active and interpretive. Dreams, sacrifices, omens, and chance enter political decisions through Xenophon's questions, readings, votes, and deeds. Strauss refuses both simple providence and simple rationalism by preserving deus sive casus, the problem of omniscience, and the possibility that human formulations concerning the gods are themselves politically shaped.","primary_contribution":"The primary sequence preserves the events, decisions, sacrifices, and outcomes without certifying divine causation.","unresolved":"What is a god, what law concerning the gods means, and whether divine omniscience is adopted remain beyond the present witness."},{"id":"R2-DEEP-004","title":"Justice from coercive cases to the two virtues","entries":["CMP-014","CMP-015","CMP-019","CMP-025","CMP-028","CMP-029"],"finding":"Justice develops from concrete questions of punishment, seizure, oath, pay, protection, testimony, and distribution into Strauss's distinction between manly justice and Socratic non-harm. Political rule requires toughness and the possible emancipation of cruelty, yet manly virtue points beyond itself; Socratic virtue requires a manly foundation but cannot coexist with it in plenitude.","primary_contribution":"The chapter reconstruction supplies the complete field of cases and shows that practical success never settles justice.","unresolved":"The cross-work standards and Strauss's claim about Xenophon's self-presentation remain to be tested in the cited Xenophontic works."},{"id":"R2-DEEP-005","title":"Founding, monarchy, and peaks of ascent","entries":["CMP-008","CMP-016","CMP-018","CMP-026"],"finding":"Founding and monarchy are rival peaks of Xenophon's ascent. Founding promises sacred honor and benefit to Greece but raises fatherland and ambition; monarchy promises secrecy, dispatch, honor, and practical benefit but collides with divine warning, uncertainty, and Spartan hegemony. Xenophon attains neither formal peak, yet acquires practical supremacy.","primary_contribution":"The primary reconstruction preserves the proposals, votes, accusations, sacrifices, faction, and practical outcomes.","unresolved":"The relative rank of founding, monarchy, command, and acquittal remains intentionally open."},{"id":"R2-DEEP-006","title":"Trial, apology, and the difference from Socrates","entries":["CMP-025","CMP-026","CMP-019","CMP-029"],"finding":"Xenophon's trials and apologies are not incidental defenses. His capacity to appeal to witnessed deeds, redirect accusation, secure acquittal, and restore discipline contrasts with Socrates' condemnation and later with Xenophon's easier, more effective apology before the soldiers. Political effectiveness matters to the comparison without becoming proof of justice.","primary_contribution":"The primary record supplies accusations, witnesses, oaths, defenses, acquittals, restored trust, and continuing doubt.","unresolved":"Narrated acquittal cannot independently settle motive, truth, or philosophic superiority."},{"id":"R2-DEEP-007","title":"The ending under Socrates' original apprehension","entries":["CMP-021","CMP-022","CMP-023","CMP-025","CMP-026","CMP-027","CMP-028","CMP-029","CMP-030"],"finding":"The ending gathers the whole inquiry rather than resolving it into two closures. Xenophon returns to Greek and Spartan authority, vindicates himself before the army, accepts material reward, resumes war for booty, and sees the army incorporated under Thibron. Greece outranks barbarians, but Athens does not demonstrably outrank Cyrus or Sparta. The last interpretive act is Strauss's question whether Socrates' apprehension is vindicated.","primary_contribution":"The final chapters independently disclose unpaid wages, accusation, oath, partial settlement, poverty, booty, reward, and institutional transfer.","unresolved":"The work does not narrate private homecoming or provide a closed verdict on Socrates and Cyrus."}]}