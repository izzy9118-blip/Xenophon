review_jurisdiction: Substantive review of the corrected controlled comparison. The review tests documentary fidelity
  to the fifty-one owner-adopted primary chapter reconstructions, fidelity to the eight-unit reconstruction and
  complete printed-page sequence of Strauss's essay, and fidelity to Strauss's Socrates-Cyrus architecture. It is
  not a mechanical schema check and does not certify Greek wording or a final teaching.
