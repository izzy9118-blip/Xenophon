{"schema_version":"1.0","synthesis_id":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001-R1","predecessor_synthesis":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","title":"Xenophon presents the problem of justice: targeted R1 Strauss-guided controlled synthesis","jurisdiction":"Additive targeted R1 of the reviewed but unadopted synthesis. The Anabasis is the primary center; Strauss's essay introduces cross-work comparison with Xenophon's Education of Cyrus and Socratic presentations. No Greek, historical, authorial-intention, cross-work-completeness, or final-teaching certification is made.","governing_records":{"primary":"studies/xenophon-anabasis-dakyns/cumulative/XEN-PRIMARY-CUMULATIVE-001.yaml","secondary":"studies/strauss-xenophons-anabasis/reading-plan.yaml","comparison":"studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R3.yaml","predecessor_synthesis":"studies/comparisons/anabasis-primary-strauss/syntheses/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-001.yaml","predecessor_review":"studies/comparisons/anabasis-primary-strauss/reviews/XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-IN-DEPTH-REVIEW-001.yaml","owner_review":"governance/owner-reviews/2026-08-01-strauss-guided-controlled-synthesis-in-depth-review.yaml"},"revision_scope":{"mode":"ADDITIVE_TARGETED_R1","required_corrections":[{"id":"SYN-R1-REQ-001","applied":"The Anabasis is explicitly retained as the center; the older Cyrus is identified as Xenophon's presentation in the Education of Cyrus, brought into the Anabasis inquiry by Strauss's cross-work comparison."},{"id":"SYN-R1-REQ-002","applied":"Strauss's iron-alloy, prescription, legitimacy, political-viability, and non-tyrannical-government formulations remain questions rather than settled propositions."},{"id":"SYN-R1-REQ-003","applied":"Xenophon, by the position in which he presents his narrated self between the older Cyrus and Socrates, presents the reader with the problem of justice."}],"preserved_without_reopening":["eight-movement sequence","four evidence layers","younger and older Cyrus distinction","intended Cyrus ambiguity","material governance as independent primary finding","Byzantium as deed test with mixed motives","Thibron as primary institutional endpoint","exact final coda","all nineteen unresolved questions"]},"governing_principle":"The Anabasis is the primary center of inquiry. Xenophon reveals through its title, sequence, speeches, deeds, silences, and narrated self-presentation. Strauss illuminates this inquiry by relating the Anabasis to Xenophon's own presentation of the older Cyrus in the Education of Cyrus and to Xenophon's Socratic presentations. These cross-work figures do not supply external standards to Xenophon; Xenophon presents them, and through their relation he presents the problem of justice.","evidence_layers":{"PRIMARY_SHOWING":"Anabasis witness and adopted primary reconstruction.","STRAUSS_EXPLICIT_ARGUMENT":"Strauss's explicit claims, comparisons, and questions.","CONTROLLED_SYNTHETIC_INFERENCE":"Source-separated inference that preserves cross-work scope and interrogative form.","UNRESOLVED_QUESTION":"Question not authorized for final resolution."},"central_thesis":{"statement":"The Anabasis presents Xenophon's ascent as a concealed examination of political action and justice through the younger Cyrus and Xenophon's narrated self. Strauss illuminates that Anabasis-centered examination by bringing it into relation with Xenophon's cross-work presentation of the older Cyrus in the Education of Cyrus and with Xenophon's Socratic presentations.","justice_direction":"The relation does not make the older Cyrus a model supplied to Xenophon. By presenting his narrated self between the older Cyrus and Socrates, Xenophon presents to the reader the problem of justice: manly virtue and Socratic virtue point toward and require one another, yet cannot coexist in plenitude in one human being. The older Cyrus is not a completed model of political rule.","legitimacy_direction":"Strauss does not settle how knowledge becomes legitimate or politically viable. He asks whether knowledge of rule requires an iron alloy, whether prescription is indispensable to non-tyrannical government, and what these questions disclose about Xenophon's political possibility.","authorial_direction":"Xenophon is the revealing author. The Anabasis self-presentation, the Education of Cyrus presentation of the older Cyrus, and the Socratic presentations are differentiated Xenophontic disclosures whose relation Strauss recovers."},"sequential_synthesis":[{"movement_id":"SYN-MOV-001","title":"Younger Cyrus and misleading beginning","primary_showing":"The expedition joins dynastic ambition, money, friendship, unequal knowledge, and pretexts; Cyrus dies after Greek tactical success.","strauss_explicit_argument":"Strauss begins from the authentic title and redirects failed Cyrus ascent toward Xenophon's ascent.","controlled_synthetic_inference":"Within the Anabasis, Xenophon reveals the attraction and instability of political action organized by allegiance, wealth, secrecy, and ambition.","unresolved_limit":"The later older-Cyrus comparison may correct, elevate, or expose this attraction."},{"movement_id":"SYN-MOV-002","title":"Proxenos, fatherland, and Socratic counsel","primary_showing":"Xenophon enters through Proxenos and consults Socrates and Delphi.","strauss_explicit_argument":"Strauss makes Proxenos the friend who presents Cyrus as possibly better than fatherland and brings Socratic counsel into view.","controlled_synthetic_inference":"Xenophon reveals political attraction mediated by friendship while already directing himself toward action.","unresolved_limit":"Friendship, ambition, fatherland, and philosophic counsel remain unsettled."},{"movement_id":"SYN-MOV-003","title":"Economic art and material rule","primary_showing":"Survival requires food, markets, pay, transport, booty, offices, assemblies, discipline, and tactical adaptation.","strauss_explicit_argument":"Strauss distinguishes Xenophon from Socrates through self-direction and economic art.","controlled_synthetic_inference":"Political knowledge includes organization of bodies, goods, offices, routes, punishments, and rewards.","unresolved_limit":"Material competence is necessary but not sufficient for justice or legitimacy."},{"movement_id":"SYN-MOV-004","title":"Xenophon's narrated ascent","primary_showing":"The narrated Xenophon becomes speaker, general, tactician, disciplinarian, negotiator, defendant, and contested leader.","strauss_explicit_argument":"Strauss follows Xenophon's ascent through speech, correction, office, command, trial, and success.","controlled_synthetic_inference":"The self-presentation joins persuasion, force, provision, punishment, defense, and restraint without self-certification.","unresolved_limit":"Author, narrator, remembered speaker, and historical actor remain distinct."},{"movement_id":"SYN-MOV-005","title":"Piety, wiliness, and necessity","primary_showing":"Dreams, sacrifices, omens, oaths, deception, endurance, rescue, and necessity recur.","strauss_explicit_argument":"Strauss joins piety and wiliness and prepares the ambiguity of justice.","controlled_synthetic_inference":"Xenophon presents political efficacy, concealment, force, and piety together as a problem.","unresolved_limit":"Their hierarchy or harmony remains unresolved."},{"movement_id":"SYN-MOV-006","title":"Cross-work comparison and the problem of justice","primary_showing":"The Anabasis presents Xenophon commanding without hereditary kingship, using punishment, and seeking consent and recognized authority.","strauss_explicit_argument":"Strauss turns to the older Cyrus in the Education of Cyrus; asks whether knowledge needs an iron alloy, whether prescription is indispensable, calls justice ambiguous, and says Xenophon between older Cyrus and Socrates presents the problem of justice.","controlled_synthetic_inference":"The cross-work comparison raises—not settles—whether knowledge can become legitimate and non-tyrannical without hereditary prescription, and how manly harm relates to Socratic non-harm.","unresolved_limit":"The iron-alloy, prescription, legitimacy, and closest-approximation questions remain open."},{"movement_id":"SYN-MOV-007","title":"Founding, monarchy, and Byzantium","primary_showing":"At Byzantium Xenophon confronts city, fleet, money, soldiers, Spartan power, and possible violence against an innocent Greek city; he restrains the army.","strauss_explicit_argument":"Strauss treats foundation, monarchy, fatherland, Greece, Spartan hegemony, resistance, and yielding as tests.","controlled_synthetic_inference":"The deed bears on legitimacy and tyranny without resolving them.","unresolved_limit":"Justice, prudence, Sparta, Greece, fatherland, and self-preservation remain mixed."},{"movement_id":"SYN-MOV-008","title":"Thibron and the final coda","primary_showing":"The army's autonomous existence ends under Thibron; personal debts and homecoming remain unresolved.","strauss_explicit_argument":"Strauss ends with Socrates' apprehension question, renewed war for booty, and gods and formal oaths.","controlled_synthetic_inference":"Institutional transfer, acquisition, piety, and Socratic apprehension remain joined.","unresolved_limit":"Thibron and Strauss's coda are distinct levels, not equal closures."}],"figural_revelations":{"YOUNGER_CYRUS":{"work_scope":"Anabasis","reveals":"Political attraction through friendship, generosity, secrecy, ambition, wealth, foreign service, and fatherland.","control":"Do not attribute the older Cyrus's inheritance to him."},"OLDER_CYRUS":{"work_scope":"Education of Cyrus, introduced by Strauss's cross-work comparison","reveals":"Materials for Strauss's questions about knowledge, inheritance, prescription, legitimacy, non-tyrannical government, cruelty, and manly justice.","control":"Not in the Anabasis; not an external standard; not a completed model; preserve the questions."},"SOCRATES":{"work_scope":"Xenophon's Socratic presentations as used by Strauss","reveals":"Counsel, non-harm, and the apprehension governing the ending.","control":"Do not impose Socrates from outside Xenophon's presentations."},"XENOPHON_NARRATED_SELF":{"work_scope":"Anabasis","reveals":"The position through which Xenophon presents the problem of justice.","control":"Do not collapse narrated persona into revealing author or call the intermediate position indecision."}},"governing_examinations":{"JUSTICE":"Xenophon's position between older Cyrus and Socrates presents the problem of justice: manly virtue permits benefit, harm, command, punishment, and possible cruelty; Socratic virtue refuses harm. Each requires or points to the other, but they cannot coexist in plenitude.","LEGITIMACY":"Strauss asks whether knowledge needs an iron alloy to become legitimate or politically viable, whether prescription is indispensable, and how non-tyrannical government is possible. The Anabasis tests but does not settle these questions.","FATHERLAND":"Friendship, Cyrus, Athens, Greece, Sparta, exile, kin, and Byzantium keep fatherland under examination.","MATERIAL_GOVERNANCE":"Pay, provisions, markets, transport, booty, offices, discipline, and transfer remain independent primary findings.","PIETY_AND_WILINESS":"Sacrifice, omen, oath, concealment, deception, and tactical intelligence remain joined without doctrinal resolution.","ENDING":"Socratic apprehension, booty, gods, and oaths remain in exact order; Thibron is the primary institutional endpoint."},"synthetic_conclusion":{"statement":"The Anabasis remains the center: through the younger Cyrus and the narrated Xenophon, Xenophon presents political attraction, ascent, command, material rule, founding, restraint, piety, acquisition, and institutional transfer. Strauss illuminates that presentation by bringing it into relation with Xenophon's older Cyrus in the Education of Cyrus and with Xenophon's Socrates. The result is not a model handed to Xenophon but Xenophon's own presentation of the problem of justice.","non_finality":"The synthesis does not answer whether knowledge can become legitimate without prescription, whether Xenophon achieved the coexistence of manly and Socratic virtue, or whether his self-presentation is achievement, aspiration, or unresolved claim. It preserves Strauss's cautious possibility that Xenophon may have regarded himself as the closest approximation best known to himself."},"unresolved_questions":[{"id":"R3-UQ-001","question":"Why does Strauss begin with the younger Cyrus but later formulate Xenophon's justice through comparison with the older Cyrus?"},{"id":"R3-UQ-002","question":"Does the older Cyrus clarify the younger Cyrus's political attraction, correct it, elevate it, or expose its latent standard?"},{"id":"R3-UQ-003","question":"How far can the Cyrus-side ambiguity be extended before the distinct deeds and characters of the two Cyruses must control the interpretation?"},{"id":"R3-UQ-004","question":"Does the younger Cyrus's relation to friendship, secrecy, ambition, and fatherland already contain the justice problem later articulated through the older Cyrus?"},{"id":"R3-UQ-005","question":"Why does Strauss say that Xenophon's place is not near the older Cyrus even while locating him between the older Cyrus and Socrates?"},{"id":"R3-UQ-006","question":"How does the ambiguity of justice organize the relation among legitimacy, knowledge of rule, cruelty, benefit, harm, and non-harm?"},{"id":"R3-UQ-007","question":"Does Byzantium constitute the decisive peak of Xenophon's ascent because foundation and monarchy become immediately available together?"},{"id":"R3-UQ-008","question":"Is Xenophon's refusal at Byzantium governed primarily by justice, prudence, fear of Sparta, love of Greece, fatherland, or an inseparable mixture?"},{"id":"R3-UQ-009","question":"Why does Strauss emphasize that the threatened city is wholly innocent and the first Greek city occupied by the army?"},{"id":"R3-UQ-010","question":"Does obedience to those who rule the Greeks vindicate Greek political order or reveal the necessity of submission under imperfect hegemony?"},{"id":"R3-UQ-011","question":"How does the Byzantium deed alter the earlier accusations of secret founding and monarchical ambition?"},{"id":"R3-UQ-012","question":"What weight should Thibron's institutional incorporation bear relative to Strauss's final rhetorical coda?"},{"id":"R3-UQ-013","question":"Why does Strauss place renewed war for booty immediately after asking whether Socrates' apprehension is vindicated?"},{"id":"R3-UQ-014","question":"Does the final density of gods and oaths qualify, counterbalance, deepen, or render more ambiguous the preceding return to war and acquisition?"},{"id":"R3-UQ-015","question":"Does Book VII's piety indicate correction of the movement toward Cyrus, a political instrument within that movement, or a genuine conjunction that resists separation?"},{"id":"R3-UQ-016","question":"Can the ending preserve both Thibron as primary institutional endpoint and the gods-and-oaths statement as Strauss's final textual emphasis without creating two equal closures?"},{"id":"R3-UQ-017","question":"Does Xenophon's position between older Cyrus and Socrates illuminate the younger Cyrus retrospectively?"},{"id":"R3-UQ-018","question":"Is the closest approximation of manly and Socratic virtue presented as Xenophon's achievement, self-presentation, aspiration, or unresolved claim?"},{"id":"R3-UQ-019","question":"What Greek, cross-work, and compositional checks are still required before the controlled ambiguity can be judged more decisively?"}],"preservation_rules":["Anabasis primary center; older Cyrus in Education of Cyrus through Strauss's cross-work comparison.","Xenophon revealing author distinct from narrated persona.","Two Cyruses distinct; intended ambiguity preserved.","Iron-alloy, prescription, legitimacy, and non-tyrannical-government formulations remain questions.","Xenophon presents the problem of justice.","All nineteen unresolved questions, material governance, Byzantium, Thibron, and final coda preserved.","No final teaching, Greek certification, minister adapter, Sanctum registration, Assembly dispatch, or AI self-certification."],"review_gate":{"owner_review_status":"PENDING_IN_DEPTH_REVIEW","owner_adopted":false,"next_required_action":"XEN-STRAUSS-GUIDED-CONTROLLED-SYNTHESIS-R1-IN_DEPTH-OWNER-REVIEW-001"}}