      existence through incorporation into another Greek war.
    cumulative_anchors:
    - WF-012
    - SDO-CUM-010
    - CP-012
    source_units:
    - XEN-PRI-RU-050
    - XEN-PRI-RU-051
  secondary_stream:
    position: Strauss notes the renewed Persian war but does not formulate Thibron's incorporation as the work's
      governing institutional endpoint.
    secondary_units:
    - XEN-RU-008
    printed_pages: '136'
  controlled_relation: The difference is an omission of emphasis rather than a contradiction.
