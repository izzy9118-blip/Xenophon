    - XEN-PRI-RU-030
    - XEN-PRI-RU-034
    - XEN-PRI-RU-046
    - XEN-PRI-RU-050
  secondary_stream:
    position: Strauss discusses many individual material episodes but does not formulate their full seven-book distribution
      as a separate cumulative structure.
    secondary_units:
    - XEN-RU-003
    - XEN-RU-005
    - XEN-RU-006
    - XEN-RU-008
    printed_pages: 113-136
  controlled_relation: This is a difference of cumulative emphasis rather than contradiction.
  preserved_uncertainty: Strauss may subsume material questions under ascent, economic art, justice, and fatherland
    rather than treat them independently.
  comparison_effect: Retain the primary economic pattern as an addition disclosed by sequential reconstruction.
- id: CMP-030
  topic: Thibron's incorporation as the end of the army's independent polity
  classification: SECONDARY_SILENCE
