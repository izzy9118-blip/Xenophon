  topic: Material governance as a work-wide cumulative pattern
  classification: SECONDARY_SILENCE
  primary_stream:
    position: The primary cumulative reconstruction treats provisioning, pay, markets, booty, transport, and compensation
      as one recurrent work-level pattern across all seven books.
    cumulative_anchors:
    - PAT-002
    - TR-007
    - WF-003
    source_units:
