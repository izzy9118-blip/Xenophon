classification_vocabulary:
  AGREEMENT: The primary evidence confirms a textual or structural pattern identified by Strauss.
  QUALIFIED_AGREEMENT: The primary evidence supports Strauss's direction while preserving limits of scope, terminology, or proof.
  PRIMARY_SILENCE: Strauss advances a claim that the admitted translation reconstruction cannot presently verify.
  UNRESOLVED_RELATION: Both streams address the same problem, but the available record does not establish the precise relation.
  CYRUS_SIDE_ELABORATION: The sequential primary reconstruction supplies distributed evidence belonging to the active, acquisitive, commanding, economic, institutional, or warlike Cyrus side of Strauss's governing opposition.
  GOVERNING_EXAMINATION: Strauss's Socrates-Cyrus architecture supplies the central question under which the primary deeds and claims must be judged; the relation is not reducible to agreement or divergence.
methodological_controls:
  - Strauss is the guiding interpretive architecture, not a substitute for Xenophon's evidence.
  - The Socrates-Cyrus opposition governs the examination of Xenophon's ascent, justice, piety, fatherland, rule, wealth, and ending.
  - Material governance and institutional transfer are assigned to the Cyrus side rather than treated as secondary silence.
  - Concrete justice disputes are the evidentiary heart of Strauss's distinction between manly and Socratic justice.
  - The ending is one Strauss-guided examination, not two equal closures.
  - Agreement does not certify Greek wording or authorial intention.
  - Primary silence does not refute Strauss.
  - No original-language, manuscript, numerical, or authorship claim is certified from the Dakyns witness.
  - No final teaching, operational capacity, minister adapter, Sanctum registration, or Assembly authority is derived.
