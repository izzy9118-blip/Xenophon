comparison_limits:
  - The primary stream remains an English translation reconstruction and not unmediated Greek evidence.
  - Strauss guides the examination but is not substituted for Xenophon's textual evidence.
  - The correction restores the proper question architecture; it does not claim to have resolved the Socrates-Cyrus problem.
  - Themistogenes, title history, Greek lexical devices, numerical patterns, and cross-work claims remain unverified.
  - No final teaching, operational capacity, minister adapter, Sanctum registration, or Assembly dispatch is authorized.
  - Artificial-intelligence self-certification remains prohibited.
