cross_cutting_findings:
  - id: CCF-R1-001
    finding: Strauss's Socrates-Cyrus opposition is the governing architecture of the examination, with Xenophon presented between philosophic and manly-political virtue.
    entry_ids: [CMP-006, CMP-019, CMP-029]
    status: GOVERNING_INTERPRETIVE_ARCHITECTURE
  - id: CCF-R1-002
    finding: Xenophon's ascent from private man to practical ruler belongs to the Cyrus side while remaining subject to the Socratic standard.
    entry_ids: [CMP-001, CMP-008, CMP-016]
    status: PROVISIONAL_COMPARATIVE_FINDING
  - id: CCF-R1-003
    finding: Material governance across all seven books is the economic and institutional substance of the Cyrus side rather than an interpretation external to Strauss.
    entry_ids: [CMP-023]
    status: CYRUS_SIDE_FINDING
  - id: CCF-R1-004
    finding: Thibron's incorporation of the army is the terminal institutional form of the Cyrus side: command, war, acquisition, and service under a renewed Greek campaign.
    entry_ids: [CMP-030]
    status: CYRUS_SIDE_FINDING
  - id: CCF-R1-005
    finding: Justice is the heart of the examination because the primary disputes furnish the cases through which manly and Socratic justice must be distinguished and related.
    entry_ids: [CMP-014, CMP-019, CMP-025]
    status: GOVERNING_EXAMINATION_FINDING
  - id: CCF-R1-006
    finding: Practical success remains distinct from justice, but that distinction is a step inside Strauss's examination rather than a competing primary doctrine.
    entry_ids: [CMP-014, CMP-019, CMP-025]
    status: PROVISIONAL_COMPARATIVE_FINDING
  - id: CCF-R1-007
    finding: Piety is examined as Xenophon's active use of divine signs within political judgment, not as a withdrawal from the Cyrus side into Socratic life.
    entry_ids: [CMP-007, CMP-011, CMP-012]
    status: PROVISIONAL_COMPARATIVE_FINDING
  - id: CCF-R1-008
    finding: Founding, monarchy, wealth, honor, and fatherland are linked tests of whether Xenophon's practical excellence can be justly ordered.
    entry_ids: [CMP-016, CMP-018, CMP-026, CMP-028]
    status: PROVISIONAL_COMPARATIVE_FINDING
  - id: CCF-R1-009
    finding: The army's assemblies, offices, discipline, and material needs disclose the political field in which Xenophon's mediation between Socrates and Cyrus is enacted.
    entry_ids: [CMP-015, CMP-017, CMP-023]
    status: PROVISIONAL_COMPARATIVE_FINDING
  - id: CCF-R1-010
    finding: Audience-shaped speech, correction after failure, and visible sharing of hardship are principal modes by which Xenophon's practical authority is displayed and judged.
    entry_ids: [CMP-009, CMP-010, CMP-025]
    status: PROVISIONAL_COMPARATIVE_FINDING
  - id: CCF-R1-011
    finding: The ending must be read as Strauss's final Socrates-Cyrus examination: reconciliation with Greece, renewed war and booty, Thibron's command, piety, and Socrates' apprehension belong to one question.
    entry_ids: [CMP-029, CMP-030]
    status: GOVERNING_EXAMINATION_FINDING
  - id: CCF-R1-012
    finding: Strauss's guidance sharpens the examination without certifying Themistogenes, Greek lexical devices, divine causation, numerical patterns, or a final doctrinal verdict.
    entry_ids: [CMP-002, CMP-003, CMP-013, CMP-031]
    status: GOVERNING_LIMIT
