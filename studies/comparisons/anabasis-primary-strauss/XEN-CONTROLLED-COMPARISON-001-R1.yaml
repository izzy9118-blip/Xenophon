jurisdiction: >-
  The primary reconstruction supplies the evidentiary sequence of speeches, deeds, institutions, material conditions, and outcomes. Strauss's reconstruction of Xenophon's Anabasis supplies the guiding interpretive architecture, centered on Xenophon between Socrates and Cyrus. The primary evidence is not erased or retroactively rewritten, but the examination must not create a false symmetry in which Strauss's argument is treated as merely one optional closure beside an autonomous primary interpretation.
governing_architecture:
  opposition: SOCRATES_VS_CYRUS
  mediating_figure: XENOPHON
  guide: LEO_STRAUSS_XENOPHONS_ANABASIS
  rule: >-
    Cyrus names the active, acquisitive, economic, commanding, warlike, founding, and manly-political pole. Socrates supplies the philosophic standard and the justice that harms no one. Xenophon's speeches and deeds are examined as an attempted or problematic mediation between these poles.
