{"schema_version":"1.0","comparison_id":"XEN-CONTROLLED-COMPARISON-001","revision_id":"XEN-CONTROLLED-COMPARISON-001-R3","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","title":"Targeted sequential Strauss-guided examination with controlled Cyrus ambiguity","predecessor_revision":"XEN-CONTROLLED-COMPARISON-001-R2","predecessor_record":"studies/comparisons/anabasis-primary-strauss/XEN-CONTROLLED-COMPARISON-001-R2.yaml","r2_review_record":"studies/comparisons/anabasis-primary-strauss/reviews/XEN-CONTROLLED-COMPARISON-R2-IN-DEPTH-REVIEW-001.yaml","r2_owner_review_record":"governance/owner-reviews/2026-07-31-controlled-comparison-r2-in-depth-review.yaml","owner_clarification_record":"governance/corrections/2026-07-31-r2-cyrus-ambiguity-clarification.yaml","jurisdiction":"R3 is an additive targeted revision of R2. It preserves R2's successful eight-movement sequential architecture, all thirty-one comparison entry IDs, all current classifications, the primary reconstruction's independent contribution, and Strauss's governing role. It corrects the interpretation of the two Cyruses by preserving their intended ambiguity, elevates Byzantium as the concrete convergence and refusal of foundation and monarchy, and restores Strauss's exact post-question closing sequence.","governing_architecture":{"opposition":"SOCRATES_VS_CYRUS","mediating_figure":"XENOPHON","interpretive_guide":"LEO_STRAUSS_XENOPHONS_ANABASIS","cyrus_control":"CONTROLLED_INTENDED_AMBIGUITY","controlled_terms":{"YOUNGER_CYRUS_ROLE":"The younger Cyrus of the authentic title and expedition: Xenophon's practical attraction, Proxenos-mediated friendship, concealed kingship, ambition, wealth, foreign service, and the fatherland problem.","OLDER_CYRUS_ROLE":"The older Cyrus of the Education of Cyrus: Strauss's explicit comparative standard for inherited legitimacy, knowledge of rule, cruelty, manly virtue, and the political viability of justice.","CYRUS_SIDE_AMBIGUITY":"The intended interpretive passage between the younger and older Cyrus by which the practical attraction of political action is sharpened into the problem of manly justice. It preserves identity difference and argumentative continuity without treating either Cyrus as interchangeable with the other."},"governing_question":"How does Xenophon present his ascent and justice between Socrates and the deliberately ambiguous Cyrus side, moving from attraction to the younger Cyrus toward comparison with the older Cyrus without eliminating the distinction between them?","ending_order":["SOCRATIC_APPREHENSION_QUESTION","POST_QUESTION_CODA_BOOTY","POST_QUESTION_CODA_GODS_AND_OATHS"]},"inputs":{"primary":{"record_id":"XEN-PRIMARY-CUMULATIVE-001","record":"studies/xenophon-anabasis-dakyns/cumulative/XEN-PRIMARY-CUMULATIVE-001.yaml","source_units":51,"coverage":"Anabasis I.1 through VII.8","jurisdiction":"Admitted H. G. Dakyns English translation witness; no Greek certification."},"secondary":{"study_id":"XEN-STUDY-SEC-001","units":8,"printed_pages":"105-136","jurisdiction":"Owner-adopted reconstruction checked against the complete printed essay during R2 review."}},"production_records":{"targeted_argument_spine":"studies/comparisons/anabasis-primary-strauss/r3/targeted-argument-spine.yaml","controlled_cyrus_ambiguity":"studies/comparisons/anabasis-primary-strauss/r3/controlled-cyrus-ambiguity.yaml","byzantium_examination":"studies/comparisons/anabasis-primary-strauss/r3/byzantium-examination.yaml","final_coda_sequence":"studies/comparisons/anabasis-primary-strauss/r3/final-coda-sequence.yaml","entry_corrections":"studies/comparisons/anabasis-primary-strauss/r3/entry-corrections.yaml","deep_examinations":"studies/comparisons/anabasis-primary-strauss/r3/deep-examinations.yaml"},"classification_counts":{"GOVERNING_ARCHITECTURE":1,"GOVERNING_EXAMINATION":10,"CYRUS_SIDE_ELABORATION":2,"AGREEMENT":9,"QUALIFIED_AGREEMENT":5,"PRIMARY_SILENCE":3,"UNRESOLVED_RELATION":1},"preserved_counts":{"sequential_movements":8,"comparison_entries":31},"targeted_revision_counts":{"pass_through_entries":21,"targeted_revision_entries":8,"resequence_entries":2,"affected_entries":10,"deep_examinations":8},"integrated_findings":[{"id":"R3-F-001","finding":"The distinction between the younger and older Cyrus is textually necessary, but Strauss's movement between them is deliberately interpretive rather than accidental equivocation."},{"id":"R3-F-002","finding":"The younger Cyrus supplies the concrete political attraction that draws Xenophon away from Athens through Proxenos, friendship, honor, wealth, action, and foreign service."},{"id":"R3-F-003","finding":"The older Cyrus supplies the explicit comparative standard through which legitimacy, inheritance, knowledge of rule, cruelty, manly virtue, and justice are judged."},{"id":"R3-F-004","finding":"The Cyrus-side ambiguity converts the practical attraction of the younger Cyrus into the articulated justice problem sharpened by the older Cyrus."},{"id":"R3-F-005","finding":"Justice's explicit ambiguity governs the Cyrus ambiguity: Xenophon stands between manly justice and Socratic non-harm rather than simply between two biographical persons."},{"id":"R3-F-006","finding":"R2's successful sequence from title through Proxenos, Delphi, ascent, Book Four, justice, founding, monarchy, and the ending remains controlling."},{"id":"R3-F-007","finding":"Byzantium is the concrete convergence of the earlier possibilities of foundation and monarchy because city, fleet, money, and army are simultaneously offered to Xenophon."},{"id":"R3-F-008","finding":"Xenophon's refusal at Byzantium is a deed of voluntary restraint stronger than a verbal denial, yet it does not by itself prove complete justice or Socratic virtue."},{"id":"R3-F-009","finding":"The innocent Greek city and the threat of exile make Byzantium a test of Greece, fatherland, legitimacy, and the limits of revenge."},{"id":"R3-F-010","finding":"The primary narrative endpoint remains the army's incorporation under Thibron, ending its autonomous institutional existence."},{"id":"R3-F-011","finding":"Strauss's rhetorical-textual ending is distinct from that primary endpoint and must be read in exact order."},{"id":"R3-F-012","finding":"Socrates' apprehension question is followed, not preceded, by Xenophon's renewed Persian war for booty."},{"id":"R3-F-013","finding":"The final observation concerning Book VII's density of gods and formal oaths follows the booty statement and prevents a simple reduction of the ending to acquisition alone."},{"id":"R3-F-014","finding":"The post-question coda holds war, acquisition, piety, and oath together under the unresolved Socrates-Cyrus examination."},{"id":"R3-F-015","finding":"Material governance and Thibron remain independent primary discoveries located within the Cyrus side without replacing Strauss's final order."},{"id":"R3-F-016","finding":"The intended ambiguity must be preserved wherever the essay shifts from the younger Cyrus as attraction to the older Cyrus as comparative standard."},{"id":"R3-F-017","finding":"R3 corrects local source order and emphasis without reopening the settled R2 architecture or claiming a final teaching."}],"unresolved_questions":[{"id":"R3-UQ-001","question":"Why does Strauss begin with the younger Cyrus but later formulate Xenophon's justice through comparison with the older Cyrus?"},{"id":"R3-UQ-002","question":"Does the older Cyrus clarify the younger Cyrus's political attraction, correct it, elevate it, or expose its latent standard?"},{"id":"R3-UQ-003","question":"How far can the Cyrus-side ambiguity be extended before the distinct deeds and characters of the two Cyruses must control the interpretation?"},{"id":"R3-UQ-004","question":"Does the younger Cyrus's relation to friendship, secrecy, ambition, and fatherland already contain the justice problem later articulated through the older Cyrus?"},{"id":"R3-UQ-005","question":"Why does Strauss say that Xenophon's place is not near the older Cyrus even while locating him between the older Cyrus and Socrates?"},{"id":"R3-UQ-006","question":"How does the ambiguity of justice organize the relation among legitimacy, knowledge of rule, cruelty, benefit, harm, and non-harm?"},{"id":"R3-UQ-007","question":"Does Byzantium constitute the decisive peak of Xenophon's ascent because foundation and monarchy become immediately available together?"},{"id":"R3-UQ-008","question":"Is Xenophon's refusal at Byzantium governed primarily by justice, prudence, fear of Sparta, love of Greece, fatherland, or an inseparable mixture?"},{"id":"R3-UQ-009","question":"Why does Strauss emphasize that the threatened city is wholly innocent and the first Greek city occupied by the army?"},{"id":"R3-UQ-010","question":"Does obedience to those who rule the Greeks vindicate Greek political order or reveal the necessity of submission under imperfect hegemony?"},{"id":"R3-UQ-011","question":"How does the Byzantium deed alter the earlier accusations of secret founding and monarchical ambition?"},{"id":"R3-UQ-012","question":"What weight should Thibron's institutional incorporation bear relative to Strauss's final rhetorical coda?"},{"id":"R3-UQ-013","question":"Why does Strauss place renewed war for booty immediately after asking whether Socrates' apprehension is vindicated?"},{"id":"R3-UQ-014","question":"Does the final density of gods and oaths qualify, counterbalance, deepen, or render more ambiguous the preceding return to war and acquisition?"},{"id":"R3-UQ-015","question":"Does Book VII's piety indicate correction of the movement toward Cyrus, a political instrument within that movement, or a genuine conjunction that resists separation?"},{"id":"R3-UQ-016","question":"Can the ending preserve both Thibron as primary institutional endpoint and the gods-and-oaths statement as Strauss's final textual emphasis without creating two equal closures?"},{"id":"R3-UQ-017","question":"Does Xenophon's position between older Cyrus and Socrates illuminate the younger Cyrus retrospectively?"},{"id":"R3-UQ-018","question":"Is the closest approximation of manly and Socratic virtue presented as Xenophon's achievement, self-presentation, aspiration, or unresolved claim?"},{"id":"R3-UQ-019","question":"What Greek, cross-work, and compositional checks are still required before the controlled ambiguity can be judged more decisively?"}],"methodological_controls":["Distinguish the younger and older Cyrus wherever textual identity matters.","Preserve the intended ambiguity wherever Strauss's argument deliberately passes from one Cyrus-function to the other.","Do not convert distinction into compartmentalization or ambiguity into identity.","Treat CYRUS_SIDE_AMBIGUITY as an interpretive relation, not a third historical person.","Keep justice's explicit ambiguity governing the relation between manly virtue and Socratic virtue.","Preserve Byzantium as a deed test, not an automatic certification of justice.","Preserve Thibron as the primary institutional endpoint without displacing Strauss's exact final textual order.","Read the final sequence as question, booty, gods and oaths.","Preserve R2 and all predecessors as immutable historical records.","No final teaching, Greek certification, minister adapter, Sanctum registration, or Assembly dispatch is authorized.","Artificial-intelligence self-certification remains prohibited."],"next_required_action":{"id":"XEN-CONTROLLED-COMPARISON-R3-IN_DEPTH-OWNER-REVIEW-001","description":"Conduct an in-depth owner review of R3's controlled Cyrus ambiguity, Byzantium examination, exact post-question coda, all affected entries, and preserved R2 architecture before adoption."}}