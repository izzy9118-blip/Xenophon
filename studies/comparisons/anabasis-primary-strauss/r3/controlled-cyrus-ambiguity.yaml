{"schema_version":"1.0","revision_id":"XEN-CONTROLLED-COMPARISON-001-R3","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","control_id":"XEN-R3-CYRUS-AMBIGUITY-001","title":"The intended ambiguity of the younger Cyrus, the older Cyrus, and the Cyrus side","source_sequence":[{"stage":"TITLE_AND_EXPEDITION","printed_pages":"105-106","active_term":"YOUNGER_CYRUS_ROLE","finding":"The authentic title names the ascent of the younger Cyrus. His failed dynastic ascent supplies the surface from which the inquiry turns toward Xenophon's ascent."},{"stage":"PROXENOS_AND_FATHERLAND","printed_pages":"108-111, 124-125","active_term":"YOUNGER_CYRUS_ROLE","finding":"Proxenos draws Xenophon toward the younger Cyrus through friendship, honor, power, wealth, and the possibility that Cyrus may be better for oneself than fatherland."},{"stage":"POLITICAL_ASCENT_AND_ECONOMIC_ART","printed_pages":"111-127","active_term":"CYRUS_SIDE_AMBIGUITY","finding":"The younger Cyrus's world of action, acquisition, command, generosity, secrecy, friendship, and kingship becomes the practical field in which Xenophon's own excellence is tested."},{"stage":"EXPLICIT_JUSTICE_COMPARISON","printed_pages":"127-128","active_term":"OLDER_CYRUS_ROLE","finding":"Strauss explicitly asks for the difference in justice between Xenophon and the older Cyrus. Inherited kingship, legitimacy, knowledge of rule, and degrees of cruelty sharpen the standard."},{"stage":"INTERMEDIATE_POSITION","printed_pages":"128","active_term":"CYRUS_SIDE_AMBIGUITY","finding":"Strauss says justice is ambiguous and places Xenophon between the older Cyrus and Socrates. The earlier attraction to the younger Cyrus is thereby reread through the older Cyrus without being replaced by him."},{"stage":"FATHERLAND_AND_ENDING","printed_pages":"133-136","active_term":"YOUNGER_CYRUS_ROLE_AND_CYRUS_SIDE_AMBIGUITY","finding":"The preference for Cyrus over fatherland concerns the younger Cyrus, while renewed war, booty, command, and piety reactivate the broader Cyrus side under Socrates' unresolved apprehension."}],"controlled_relations":{"DISTINCTION":"The younger and older Cyrus are different persons, works, deeds, and textual functions.","CONTINUITY":"Strauss's argument deliberately moves from the younger Cyrus's political attraction to the older Cyrus's explicit standard of manly-political justice.","AMBIGUITY":"The name Cyrus carries the reader across this movement, making the earlier attraction disclose a deeper problem of rule and justice.","LIMIT":"No claim about one Cyrus may be directly attributed to the other without an explicit interpretive bridge.","NON_SEPARATION":"The two roles may not be isolated into unrelated compartments because the movement between them is part of Strauss's examination."},"justice_structure":{"explicit_statement":"Justice is an ambiguous term.","manly_pole":"Surpassing friends in benefiting them and enemies in harming them; requiring strength, rule, and the possible emancipation of cruelty.","socratic_pole":"Not harming anyone even in a little thing.","xenophon_position":"Somewhere between the older Cyrus and Socrates, while the practical route to that position begins through the younger Cyrus.","interpretive_effect":"The Cyrus ambiguity is subordinate to and illuminated by the ambiguity of justice."},"prohibited_readings":["Treating every unqualified reference to Cyrus as biographically interchangeable.","Treating the younger Cyrus as irrelevant once the older Cyrus appears.","Treating the older Cyrus comparison as an accidental digression.","Treating CYRUS_SIDE_AMBIGUITY as a third person or a mere category label.","Resolving the ambiguity into a final doctrinal identity."],"required_entry_links":["CMP-001","CMP-004","CMP-006","CMP-019","CMP-024","CMP-028","CMP-029"],"unresolved_questions":["Whether the older Cyrus retroactively reveals the standard implicit in the younger Cyrus's attraction.","Whether Xenophon's difference from the younger Cyrus is best understood only after the older Cyrus comparison.","How far the shared name Cyrus carries authorial significance beyond Strauss's explicit transitions.","Whether the intended ambiguity can be confirmed more fully only through the Anabasis, Cyropaedia, Memorabilia, and Greek text together."]}