{"schema_version":"1.0","revision_id":"XEN-CONTROLLED-COMPARISON-001-R3","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","examination_id":"XEN-R3-BYZANTIUM-001","title":"Byzantium as the concrete convergence and refusal of foundation and monarchy","strauss_scope":"printed pp. 133-134","principal_entries":["CMP-016","CMP-018","CMP-027","CMP-028","CMP-029"],"sequence":[{"stage":"PROMISED_EMPLOYMENT_AND_WITHHELD_PAY","finding":"Anaxibios induces the army to cross to Europe with a promise of employment, then withholds the promised pay and seeks to use the mercenaries for another purpose."},{"stage":"FORCED_REENTRY","finding":"The soldiers discover the deception and re-enter Byzantium by force, creating the possibility of revenge, plunder, and political seizure."},{"stage":"CONCRETE_OFFER","finding":"The soldiers tell Xenophon that he now has a city, triremes, money, and many soldiers. The previously separate possibilities of founding and monarchy are present together as an immediately available deed."},{"stage":"VOLUNTARY_RESTRAINT","finding":"Xenophon's refusal is an act of voluntary restraint: he does not seize the offer, quiets the soldiers, and argues against plundering a wholly innocent Greek city and making all Greeks their enemies."},{"stage":"JUSTICE_AND_FATHERLAND","finding":"He distinguishes the deception of a few Spartans from Sparta and Greece as wholes, warns that the mercenaries would become exiles and enemies of their fatherlands and kin, and urges Greeks to obey those who rule the Greeks while seeking their rights."},{"stage":"POLITICAL_MEASURE","finding":"Strauss concludes that Xenophon knew when to resist and when to give in. The deed shows prudential restraint, concern for Greece, and refusal of unauthorized tyranny without proving that every motive or act is Socratically just."}],"governing_finding":"Byzantium is the strongest concrete test of the earlier accusations of founding and monarchical ambition. Xenophon is offered the material instruments of both projects at once and refuses to use them against an innocent Greek city. This voluntary restraint in deed is stronger evidence than a merely verbal denial, but its motives remain mixed with prudence, Spartan power, self-preservation, Greece, fatherland, and justice.","relation_to_cyrus_ambiguity":{"younger_cyrus":"The army remains the mercenary force originally gathered through the younger Cyrus, still exposed to pay, employment, acquisition, and foreign service.","older_cyrus":"The actual availability of city and rule raises the older-Cyrus questions of legitimacy, inherited or authorized rule, cruelty, and the political viability of justice.","controlled_ambiguity":"Byzantium turns the Cyrus side from an attraction and comparative standard into an immediate temptation of deed. Xenophon refuses the available tyrannical route while remaining a political actor rather than becoming Socrates."},"primary_contribution":"The primary reconstruction preserves the withheld pay, forced entry, assembly, threatened violence, speech, obedience, withdrawal, and continuing employment problem. It confirms Byzantium as a deed test while leaving Strauss's cross-work judgment secondary.","preserved_limits":["Refusal does not establish pure motive.","Fear of Spartan and allied power remains part of the argument.","Obedience to rulers of the Greeks does not certify the justice of Spartan hegemony.","The episode does not prove that Xenophon has no founding or monarchical ambition.","The episode does not erase later service, booty, or command."],"unresolved_questions":["Is Byzantium the actual peak of Xenophon's ascent because the instruments of foundation and monarchy are simultaneously present?","Would Xenophon have refused the city in the absence of overwhelming Spartan power?","Does distinguishing a few deceptive Spartans from Sparta as a whole express justice, prudence, or strategic rhetoric?","Does refusal of an innocent Greek city mark a decisive preference for Greece over the Cyrus side, or only a limit within the Cyrus side?","How does the deed affect Strauss's final question concerning Socrates' apprehension?"]}