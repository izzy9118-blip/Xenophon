{"schema_version":"1.0","revision_id":"XEN-CONTROLLED-COMPARISON-001-R3","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","entry_count":10,"preserve_all_r2_classifications":true,"entries":[{"entry_id":"CMP-001","classification":"GOVERNING_EXAMINATION","r3_action":"TARGETED_REVISION","corrected_finding":"The authentic title names the ascent of the younger Cyrus. Its misleading surface directs the reader from the younger Cyrus's failed dynastic ascent toward Xenophon's ascent, which will later be judged through the intended Cyrus ambiguity and the Socratic standard.","control":"Do not import the older Cyrus into the title itself."},{"entry_id":"CMP-004","classification":"QUALIFIED_AGREEMENT","r3_action":"TARGETED_REVISION","corrected_finding":"The profile of friendship, generosity, secrecy, concealed kingship, ambition, possible impiety, and cruelty concerns the younger Cyrus of the Anabasis. It supplies the practical attraction from which the later older-Cyrus justice comparison becomes intelligible.","control":"No trait of the older Cyrus may be silently attributed to the younger Cyrus."},{"entry_id":"CMP-006","classification":"GOVERNING_ARCHITECTURE","r3_action":"TARGETED_REVISION","corrected_finding":"Socrates versus Cyrus remains the governing architecture, but Cyrus operates through an intended ambiguity: the younger Cyrus draws Xenophon into political action, while the older Cyrus sharpens the comparative standard of manly justice. Xenophon mediates the movement between them and Socrates.","control":"Distinguish the persons while preserving the argumentative passage."},{"entry_id":"CMP-016","classification":"GOVERNING_EXAMINATION","r3_action":"TARGETED_REVISION","corrected_finding":"Monarchy is tested first as offered command and practical supremacy, then concretely at Byzantium when Xenophon has city, triremes, money, and army available together. His refusal of unauthorized seizure is a deed of restraint stronger than a verbal denial, though not final proof of justice.","control":"Byzantium must be included in every full monarchy examination."},{"entry_id":"CMP-018","classification":"GOVERNING_EXAMINATION","r3_action":"TARGETED_REVISION","corrected_finding":"Founding reaches its concrete conjunction with monarchy at Byzantium. The city is not an abstract projected colony but an innocent Greek city immediately available for seizure; Xenophon's refusal bears directly on ambition, Greece, fatherland, legitimacy, and justice.","control":"Do not treat the Pontic proposal as the final founding test."},{"entry_id":"CMP-019","classification":"GOVERNING_EXAMINATION","r3_action":"TARGETED_REVISION","corrected_finding":"Strauss explicitly compares Xenophon with the older Cyrus when clarifying inherited legitimacy, knowledge of rule, cruelty, and manly justice. Justice is itself ambiguous, and Xenophon stands between the older Cyrus and Socrates; yet the practical route into this problem began with the younger Cyrus.","control":"The older-Cyrus comparison must not erase the younger-Cyrus attraction or collapse the two."},{"entry_id":"CMP-027","classification":"AGREEMENT","r3_action":"TARGETED_REVISION","corrected_finding":"Greek cities complicate homecoming most decisively at Byzantium. The threatened plunder of a wholly innocent Greek city, the danger of exile from fatherlands and kin, and submission to those who rule the Greeks turn return into a test of justice, Greece, and political restraint.","control":"Homecoming cannot be reduced to reaching the sea or entering Europe."},{"entry_id":"CMP-028","classification":"GOVERNING_EXAMINATION","r3_action":"TARGETED_REVISION","corrected_finding":"Proxenos's claim that Cyrus may be better than fatherland refers to the younger Cyrus. Byzantium and later reconciliation show Greece restored to its rightful place, but Athens still does not demonstrably outrank the younger Cyrus or Sparta. The fatherland problem therefore remains open within the intended Cyrus ambiguity.","control":"Keep the fatherland comparison tied to the younger Cyrus."},{"entry_id":"CMP-029","classification":"GOVERNING_EXAMINATION","r3_action":"RESEQUENCE_REQUIRED","corrected_finding":"The ending culminates in a sequence rather than a question alone: Socrates' apprehension is posed; Xenophon then resumes Persian war for booty; Strauss finally emphasizes Book VII's exceptional density of gods and formal oaths. The post-question coda preserves acquisition and piety together under the unresolved examination.","control":"Never call the Socratic question Strauss's final sentence."},{"entry_id":"CMP-030","classification":"CYRUS_SIDE_ELABORATION","r3_action":"RESEQUENCE_REQUIRED","corrected_finding":"Thibron's incorporation remains the primary narrative endpoint and ends the army's autonomous institutional existence through renewed command, war, acquisition, and service. It concretizes the return to Persian war but remains distinct from Strauss's final rhetorical order of question, booty, gods, and oaths.","control":"Preserve primary endpoint and textual coda without creating equal rival closures."}],"counts":{"TARGETED_REVISION":8,"RESEQUENCE_REQUIRED":2},"unchanged_entries":"CMP-002, CMP-003, CMP-005, CMP-007 through CMP-015, CMP-017, CMP-020 through CMP-026 except CMP-027, and CMP-031 pass through from R2 without substantive alteration."}