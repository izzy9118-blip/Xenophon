{"schema_version":"1.0","revision_id":"XEN-CONTROLLED-COMPARISON-001-R3","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","sequence_id":"XEN-R3-FINAL-CODA-001","title":"Strauss's exact closing order after the Socratic question","strauss_scope":"printed pp. 135-136","principal_entries":["CMP-023","CMP-028","CMP-029","CMP-030"],"ordered_elements":[{"order":1,"id":"SOCRATIC_APPREHENSION_QUESTION","function":"Strauss asks whether Socrates' apprehension concerning Xenophon's attraction to Cyrus could be vindicated by the Anabasis as a whole.","interpretive_status":"GOVERNING_QUESTION_NOT_FINAL_SENTENCE"},{"order":2,"id":"POST_QUESTION_CODA_BOOTY","function":"After the question, Strauss states that Xenophon, immediately after ending the service under Cyrus begun in order to return to Greece, starts a war against the Persians in order to acquire booty.","interpretive_status":"POST_QUESTION_EVIDENCE_OF_RENEWED_WAR_ACQUISITION_AND_COMMAND"},{"order":3,"id":"POST_QUESTION_CODA_GODS_AND_OATHS","function":"Strauss's final statement emphasizes that Book VII contains by far the greatest number of references to gods and formal oaths, including Xenophon's oaths.","interpretive_status":"FINAL_TEXTUAL_EMPHASIS_ON_PIETY_OATH_AND_FORMAL_BINDING"}],"primary_endpoint_relation":{"THIBRON_INCORPORATION":"The primary narrative's institutional endpoint: the army ceases to exist as an autonomous polity and enters renewed Spartan-led Persian war.","POST_QUESTION_CODA":"Strauss's rhetorical-textual ending: booty followed by gods and oaths after the Socratic question.","relation":"Thibron makes the renewed war institutionally concrete, but the primary endpoint may not replace the order of Strauss's final sentences. The two belong to one examination without becoming equal closures."},"governing_finding":"Strauss does not allow the Socratic question to float free as an abstract conclusion. He places after it the renewed Cyrus-side deed of war for acquisition and then the strongest formal concentration of piety and oath. The final order therefore holds acquisition and piety together under the unresolved question of Xenophon's movement between Cyrus and Socrates.","anti_drift_rules":["Do not say Strauss ends with the Socratic question.","Do not move booty and gods-and-oaths before the question.","Do not treat the gods-and-oaths sentence as a decorative appendix.","Do not let Thibron displace the final textual emphasis.","Do not restore two equal endings.","Do not infer that piety cancels acquisition or that acquisition disproves piety."],"unresolved_questions":["Why does Strauss place renewed acquisition immediately after Socrates' apprehension question?","Why is the density of gods and oaths the final observation rather than booty?","Does the final piety qualify the Cyrus-side deed, belong intrinsically to it, or intensify the ambiguity?","Does Thibron's institutional incorporation connect the two final observations by joining war, booty, authority, and sworn service?","Is the final order a judgment, a warning, an invitation to reread, or all three without final resolution?"]}