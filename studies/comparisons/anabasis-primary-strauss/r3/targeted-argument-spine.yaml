{"schema_version":"1.0","revision_id":"XEN-CONTROLLED-COMPARISON-001-R3","status":"DRAFTED_PENDING_IN_DEPTH_OWNER_REVIEW","method":"Preserve R2's eight movements while applying only the owner-directed and exact-source targeted corrections.","movements":[{"id":"R3-MOV-001","inherits":"R2-MOV-001","title":"Misleading surfaces and the ascent of the younger Cyrus","targeted_revision":"The authentic title is explicitly assigned to the younger Cyrus. The movement from his failed ascent toward Xenophon's ascent is preserved without importing the older Cyrus prematurely.","continuity":"The younger Cyrus's friendship, generosity, secrecy, ambition, kingship, and possible impiety establish the practical-political attraction that begins the examination."},{"id":"R3-MOV-002","inherits":"R2-MOV-002","title":"Menon, Proxenos, and the movement from the younger Cyrus toward Socrates","targeted_revision":"Proxenos's invitation, his pursuit of honor, power, and wealth, and his claim that the younger Cyrus may be better than fatherland are tied explicitly to the younger Cyrus.","continuity":"Proxenos remains the indispensable mediator who brings Xenophon into the field where the Socratic contrast becomes necessary."},{"id":"R3-MOV-003","inherits":"R2-MOV-003","title":"Delphi, self-direction, economic art, and the practical Cyrus side","targeted_revision":"The Cyrus side is defined as an intended ambiguity, not a flattening identity. At this stage it grows primarily from Xenophon's movement toward the younger Cyrus and the economic-political world of the expedition.","continuity":"Delphi and the economic art continue to distinguish Xenophon from Socrates."},{"id":"R3-MOV-004","inherits":"R2-MOV-004","title":"Xenophon's ascent through speech, office, correction, and command","targeted_revision":"No structural change. The ascent remains the field in which Cyrus-like political excellence and Socratic judgment encounter one another.","continuity":"Speech, election, discipline, correction, command, wealth, and material authority remain inseparable."},{"id":"R3-MOV-005","inherits":"R2-MOV-005","title":"Book Four: piety, wiliness, and preparation for ambiguous justice","targeted_revision":"No structural change. The movement prepares the explicit ambiguity of justice by joining manly virtue, Socratic non-harm, piety, wiliness, and the possible necessity of cruelty.","continuity":"Greek and numerical questions remain uncertified."},{"id":"R3-MOV-006","inherits":"R2-MOV-006","title":"Founding, trial, fatherland, and the older Cyrus comparison","targeted_revision":"The fatherland charge continues to concern the younger Cyrus. Strauss's explicit justice comparison is then assigned to the older Cyrus, whose inherited legitimacy and cruelty sharpen the political standard. The passage between the two is preserved as intended ambiguity.","continuity":"Xenophon stands between the older Cyrus and Socrates, but his route into that intermediate position begins through attraction to the younger Cyrus."},{"id":"R3-MOV-007","inherits":"R2-MOV-007","title":"Monarchy, faction, Spartan hegemony, and Byzantium","targeted_revision":"Byzantium becomes the concrete convergence of foundation and monarchy. City, triremes, money, and army are simultaneously available; Xenophon refuses to plunder an innocent Greek city and seize unauthorized rule.","continuity":"The refusal is stronger evidence than verbal denial but is not self-certifying proof of justice."},{"id":"R3-MOV-008","inherits":"R2-MOV-008","title":"Seuthes, Thibron, Socrates' question, booty, gods, and oaths","targeted_revision":"The final order is corrected. Thibron remains the primary institutional endpoint. Strauss's concluding sequence is Socrates' apprehension question, followed by renewed Persian war for booty, followed by Book VII's exceptional density of gods and formal oaths.","continuity":"The post-question coda keeps acquisition and piety together under the unresolved Socrates-Cyrus examination rather than closing with a doctrine."}],"preservation_rules":["All eight R2 movements remain identifiable and in the same order.","No R2 movement is reopened beyond the targeted corrections.","The younger/older Cyrus distinction must preserve intended ambiguity.","Byzantium must be treated as a deed test joining foundation and monarchy.","Thibron and Strauss's final coda must remain distinct without becoming equal rival closures."]}