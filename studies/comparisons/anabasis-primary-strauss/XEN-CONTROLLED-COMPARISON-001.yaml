classification_vocabulary:
  AGREEMENT: The independently reconstructed streams identify substantially the same textual or structural pattern
    within their distinct jurisdictions.
  QUALIFIED_AGREEMENT: The primary evidence supports a substantial part of Strauss's claim but not its full scope,
    hierarchy, terminology, or explanatory conclusion.
  DIVERGENCE: The streams select materially different governing explanations or emphases; neither is silently subordinated.
  PRIMARY_SILENCE: Strauss advances a claim that the admitted primary reconstruction cannot presently confirm or
    deny.
  SECONDARY_SILENCE: The primary cumulative reconstruction identifies a pattern that Strauss's adopted essay reconstruction
    does not make governing or explicit.
  UNRESOLVED_RELATION: The streams address the same evidentiary field but available evidence does not establish
    agreement, contradiction, or hierarchy.
methodological_controls:
- Primary and secondary claims are stored in separate fields.
- Every comparison entry identifies both primary and secondary anchors.
- Agreement does not convert a secondary interpretation into primary evidence.
- Divergence is preserved rather than reconciled by fiat.
- Primary silence and secondary silence are not treated as refutation.
- No Greek lexical, philological, manuscript, or authorship claim is certified from the Dakyns translation.
- No external historical source is used to certify narrated events or speeches.
- No final teaching, deed corpus, speech register, operational capacity, minister adapter, Sanctum registration,
  or Assembly authority is derived.
