comparison_limits:
- The primary stream is an English translation reconstruction and not unmediated Greek evidence.
- The secondary stream is Strauss's interpretation and not a substitute for Xenophon's text.
- The comparison does not independently certify historical events, speeches, numbers, institutions, omens, or divine
  action.
- Themistogenes, title history, Greek lexical devices, numerical patterns, and cross-work analogies remain unverified.
- Agreement raises comparative confidence only within the declared source jurisdictions.
- Divergence and silence remain preserved for owner review.
- No controlled interpretive synthesis beyond this comparison is owner-adopted by this record.
- No minister adapter, operational capacity, Sanctum registration, or Assembly dispatch is authorized.
- Artificial-intelligence self-certification remains prohibited.
