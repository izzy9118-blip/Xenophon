status: DRAFTED_PENDING_OWNER_REVIEW
title: Controlled comparison of the owner-adopted primary Anabasis reconstruction with Strauss's Xenophon's Anabasis
jurisdiction: 'Compares two separately owner-adopted reconstructions without merging their evidence streams: the
  primary-only cumulative reconstruction derived from the admitted H. G. Dakyns English translation witness, and
  the secondary reconstruction of Leo Strauss''s essay. Agreement is not certification; divergence is not error;
  silence is preserved; unresolved questions remain open. No statement by Strauss is attributed to Xenophon without
  primary support, and no primary pattern is retroactively governed by Strauss.'
