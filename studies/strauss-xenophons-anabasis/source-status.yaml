permitted_use:
  - reconstruct Strauss's interpretation of Xenophon's Anabasis
  - generate primary-text verification questions
  - identify passages, formal features, and cross-work comparisons for later checking
  - compare against an independently completed primary reconstruction

prohibited_use:
  - substitute for Xenophon's Anabasis
  - certify Xenophon's wording or intention
  - import Strauss repository doctrine into Xenophon as settled truth
  - resolve Greek textual or translation questions without a primary witness
  - treat the essay's posthumous transcription as an author-corrected final edition

independent_witness_rule: >
  Xenophon's Anabasis must be reconstructed from one or more registered primary
  witnesses before Strauss's interpretation may enter a comparative synthesis.
  The independent reconstruction must remain preserved if later comparison changes
  the repository's questions or conclusions.

evidence_rules:
  - rule_id: XEN-SA-SR-001
    rule: Distinguish Strauss's explicit claims from his questions, conjectures, and structural inferences.
  - rule_id: XEN-SA-SR-002
    rule: Distinguish Strauss's paraphrase of Xenophon from Xenophon's own wording.
  - rule_id: XEN-SA-SR-003
    rule: Preserve the difference among Xenophon the author, Themistogenes, the narrator, and Xenophon as a character.
  - rule_id: XEN-SA-SR-004
    rule: Treat title, centrality, omission, repetition, legetai, and numerical structure as evidence requiring primary verification.
  - rule_id: XEN-SA-SR-005
    rule: Distinguish successful command, lawful command, just command, and wisdom.
  - rule_id: XEN-SA-SR-006
    rule: Distinguish sacrifice, omen, oath, dream, and divine interpretation from demonstrated divine causation.

termination:
  source_state: REVIEWED_FOR_SECONDARY_RECONSTRUCTION
