schema_version: 1.0
id: XEN-HIERON-ON-TYRANNY-CUMULATIVE-001
study_id: XEN-STUDY-HIERON-OT-001
status: COMPLETED_PRE_REPOSITORY_SYNTHESIS_REGISTERED_PENDING_OWNER_REVIEW
title: Controlled cumulative reconstruction of Xenophon's Hiero and the On Tyranny inquiry
jurisdiction: >-
  Completed close reading from the externally held 2013 English composite witness.
  The record preserves source separation and documentary uncertainty. It is not Greek
  philology, owner adoption, a final teaching, or an expansion of the operational adapter.
governing_judgment: >-
  The completed inquiry does not yield a detachable Strauss-Kojeve doctrine. Xenophon
  stages the problem of whether wisdom can counsel tyrannical power toward happiness
  and beneficence; Strauss recovers the permanent tension between philosophy and rule;
  Kojeve presses the demand that wisdom become historically effective; Strauss reopens
  rather than closes the dispute; and the correspondence shows the problem persisting
  through friendship, publication, administration, illness, translation, and material loss.
source_specific_findings:
  primary_Hieron_showing:
    - >-
      Hiero's possession of power, wealth, and luxury does not secure trust, friendship,
      ordinary pleasure, safety, honor, or happiness.
    - >-
      Simonides moves from eliciting the tyrant's account to counsel concerning benefit,
      honor, expenditure, and rule; the dramatic outcome does not certify that the counsel
      can be enacted without transforming the character of tyranny.
    - >-
      The dialogue's speakers and ending remain evidence: neither speaker may be treated
      as an unmediated statement of Xenophon's teaching.
  Strauss_explicit_argument:
    - >-
      Strauss treats Xenophon's dialogue as a deliberately ordered presentation of the
      permanent problem of tyranny and of the dangerous relation between wisdom and power.
    - >-
      Strauss's interpretation depends on literary form, speaker, sequence, omission,
      irony, and comparison rather than on isolated doctrinal quotation.
  Kojeve_explicit_argument:
    - >-
      Kojeve redirects the problem from wisdom's protection against tyranny toward
      wisdom's historical efficacy, recognition, and the philosopher's relation to action.
    - >-
      His challenge depends on historical completion and the universal and homogeneous
      state in a manner Strauss contests rather than accepts as established.
  Strauss_Restatement_explicit_argument:
    - >-
      Strauss calls his response a Restatement because the problem remains open; the
      response does not authorize presentation of the debate as finally resolved.
    - >-
      Strauss tests whether Kojeve has established wisdom, justice, and historical finality
      rather than merely asserted the conditions under which they would coincide.
  correspondence_documentary_showing:
    - >-
      The surviving letters preserve continued inquiry rather than convergence or rupture;
      books, translations, letters, intermediaries, and hoped-for conversations repeatedly
      fail to guarantee reception or resolution.
    - >-
      Kojeve's practice repeatedly seeks judgment from a few competent interlocutors even
      while his political argument gives a central role to historical and public recognition.
    - >-
      Administrative action can extend political reach while reducing leisure for philosophy;
      philosophical friendship persists without eliminating the conflict between the two lives.
  editorial_apparatus_findings:
    - >-
      Uniform printed typography conceals unequal documentary bases: autograph originals,
      photocopies, defective copies, transcriptions, heterogeneous composites, and loss.
    - >-
      Archival silence cannot be interpreted before postal failure, lost sheets, lending,
      damage, editorial selection, and translation have been considered.
    - >-
      A Kojeve-to-Strauss letter of 5 November 1957 is editorially attested but lacks a
      normal body in the printed sequence used for the reading; its contents are not invented.
controlled_synthetic_findings:
  - >-
    The volume's architecture is itself evidentiary: primary dialogue, interpretation,
    challenge, restatement, and correspondence prevent premature resolution.
  - >-
    Political success, universal recognition, administrative reach, and beneficent advice
    do not become self-interpreting proofs of justice or wisdom.
  - >-
    A method of guarded or ironic reading can be transmitted independently of doctrine;
    agreement about method does not certify any particular esoteric interpretation.
  - >-
    The governing question remains how philosophy may advise or enter political power
    without ceasing to be philosophy, and how power may receive wisdom without reducing
    it to policy, legitimation, or historical effectiveness.
standing_unresolved_questions:
  - id: XEN-HIERON-OT-UQ-001
    question: Can Simonides's counsel make Hiero happy while leaving tyranny intact?
  - id: XEN-HIERON-OT-UQ-002
    question: What is disclosed by the dialogue's ending and by Hiero's lack of a narrated response to the final counsel?
  - id: XEN-HIERON-OT-UQ-003
    question: Which claims belong to Hiero, Simonides, Xenophon's dramatic presentation, and Strauss's reconstruction respectively?
  - id: XEN-HIERON-OT-UQ-004
    question: Does Strauss establish a permanent natural standard against tyranny, or chiefly expose the question that such a standard must answer?
  - id: XEN-HIERON-OT-UQ-005
    question: Does Kojeve establish historical completion and wisdom, or presuppose them in defining political efficacy?
  - id: XEN-HIERON-OT-UQ-006
    question: Can universal recognition substitute for the judgment of competent philosophical interlocutors?
  - id: XEN-HIERON-OT-UQ-007
    question: Can philosophy become administratively effective without being transformed into ideology, counsel, or legitimation?
  - id: XEN-HIERON-OT-UQ-008
    question: How can the disagreement between nature and history be adjudicated without assuming either side's conclusion?
  - id: XEN-HIERON-OT-UQ-009
    question: Is wisdom available, or does philosophy remain love and pursuit of wisdom?
  - id: XEN-HIERON-OT-UQ-010
    question: When does attention to irony and guarded writing become self-confirming interpretation?
  - id: XEN-HIERON-OT-UQ-011
    question: What argument and qualification were lost with the missing continuation of Kojeve's 19 September 1950 letter?
  - id: XEN-HIERON-OT-UQ-012
    question: What did Kojeve write in the missing letter of 5 February 1951 to which Strauss responded?
  - id: XEN-HIERON-OT-UQ-013
    question: What became of Kojeve's first long Plato letter after Strauss sent it to Jacob Klein?
  - id: XEN-HIERON-OT-UQ-014
    question: What can be established about the editorially attested Kojeve-to-Strauss letter of 5 November 1957 without inventing its unavailable body?
  - id: XEN-HIERON-OT-UQ-015
    question: Which philosophically significant English formulations require checking against surviving German or French originals?
  - id: XEN-HIERON-OT-UQ-016
    question: What Greek textual and translation checks are required before any Hieron claim can be certified philologically?
  - id: XEN-HIERON-OT-UQ-017
    question: Does the surviving correspondence represent the full exchange, and where do attested but unavailable communications alter its sequence?
  - id: XEN-HIERON-OT-UQ-018
    question: How should the completed predecessor reading be normalized without erasing its corrections, alternatives, and production history?
