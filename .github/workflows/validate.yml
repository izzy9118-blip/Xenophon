name: Validate Xenophon Repository

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML jsonschema pytest
      - run: python scripts/validate_repository.py
      - run: python scripts/validate_hieron_on_tyranny_integration.py
